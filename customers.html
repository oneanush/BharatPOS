<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Bharat CRM - Customer Loyalty</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════
       CRM SPECIFIC LAYOUT & CARDS
    ═══════════════════════════════════════════════════════════ */
    :root {
        --vip-gold: #f59e0b; 
        --risk-red: #ef4444; 
        --reg-blue: #3b82f6;
    }
    
    .crm-header-card {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border-radius: var(--radius-card); padding: 24px; color: white;
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 20px; box-shadow: 0 10px 30px rgba(15,23,42,0.15);
        margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .crm-header-card::after {
        content: '\f0c0'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
        position: absolute; right: -20px; bottom: -40px; font-size: 140px;
        color: rgba(255,255,255,0.03); pointer-events: none; transform: rotate(-15deg);
    }

    /* AI Button */
    .btn-ai-magic {
        background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white;
        border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800;
        font-size: 13px; cursor: pointer; transition: var(--trans);
        display: inline-flex; align-items: center; gap: 8px;
        box-shadow: 0 6px 20px rgba(139,92,246,0.3); white-space: nowrap; font-family: var(--font-body);
    }
    .btn-ai-magic:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }

    /* Filters - Responsive Wrap & Scroll */
    .crm-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; flex: 1; min-width: 280px;}
    .filter-chips::-webkit-scrollbar { display: none; }
    
    .chip {
        padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
        background: var(--white); border: 1.5px solid var(--border);
        color: var(--text-muted); cursor: pointer; transition: var(--trans);
        white-space: nowrap; display: flex; align-items: center; gap: 6px; font-family: var(--font-body);
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
    
    .search-box-crm { position: relative; flex: 1; min-width: 250px; }
    .search-box-crm i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
    .search-box-crm input { width: 100%; padding: 10px 14px 10px 40px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; transition: var(--trans); color: var(--text-main); font-family: var(--font-body); box-sizing: border-box;}
    .search-box-crm input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    /* Customer Grid - Prevents overlap */
    .customer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
    
    .cust-card {
        background: var(--white); border: 1.5px solid var(--border);
        border-radius: var(--radius-card); padding: 16px; transition: var(--trans);
        box-shadow: var(--shadow-sm); cursor: pointer; position: relative; overflow: hidden;
    }
    .cust-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .cust-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .cust-card.status-vip::before { background: var(--vip-gold); }
    .cust-card.status-risk::before { background: var(--risk-red); }
    .cust-card.status-regular::before { background: var(--reg-blue); }

    .cust-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .cust-avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--primary); font-weight: 800; flex-shrink: 0;}
    
    .cust-name { font-size: 15px; font-weight: 800; color: var(--text-main); font-family: var(--font-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;}
    .cust-phone { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
    
    .cust-badge { font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-vip { background: #FEF3C7; color: #D97706; }
    .badge-risk { background: var(--danger-soft); color: var(--danger); }
    .badge-regular { background: var(--blue-50); color: var(--primary); }

    .cust-stats { display: flex; justify-content: space-between; background: var(--bg-input); padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .stat-box { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-val { font-size: 14px; font-weight: 800; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    
    .cust-udhaar { margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--danger); }

    /* Profile Modal specific */
    .profile-header { text-align: center; padding-bottom: 20px; border-bottom: 1.5px dashed var(--border); margin-bottom: 20px; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 20px; background: var(--primary-soft); color: var(--primary); font-size: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-weight: 800; }
    .profile-name { font-size: 20px; font-weight: 800; color: var(--text-main); font-family: var(--font-head); margin-bottom: 4px; }
    .profile-phone { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 5px; }
    .history-item { background: var(--white); border: 1.5px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .history-date { font-size: 12px; font-weight: 800; color: var(--text-main); }
    .history-meta { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
    .history-amt { font-size: 14px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="lang-en">

<div class="container">
    
    <div class="crm-header-card" style="margin-top: 20px;">
        <div style="z-index: 1;">
            <h1 style="margin:0 0 6px 0; font-size:22px; font-weight:800; font-family:var(--font-head);"><i class="fa-solid fa-users" style="color:var(--border-hover);"></i> Bharat CRM & Khata</h1>
            <div style="font-size:13px; color:var(--text-light); font-weight:600;">Manage customer loyalty, identify churn risks, and track Udhaar.</div>
        </div>
        <div style="display:flex; gap:10px; z-index: 1; flex-wrap: wrap;">
            <button id="btnExportCustomers" class="btn btn-outline" style="border-color:rgba(255,255,255,0.3); color:white; background:transparent;"><i class="fa-solid fa-download"></i> Export List</button>
            <button id="btnAiMarketing" class="btn-ai-magic">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Re-Targeting
            </button>
        </div>
    </div>

    <div class="kpi-grid" style="margin-bottom: 20px;">
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--blue-50); color:var(--primary);"><i class="fa-solid fa-users"></i></div>
            <div class="kpi-details">
                <h4>Total Customers</h4>
                <div class="value" id="kpiTotalCust">0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:#FEF3C7; color:#D97706;"><i class="fa-solid fa-crown"></i></div>
            <div class="kpi-details">
                <h4>VIP Customers</h4>
                <div class="value" id="kpiVipCust">0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--danger-soft); color:var(--danger);"><i class="fa-solid fa-user-clock"></i></div>
            <div class="kpi-details">
                <h4>At-Risk (Churn)</h4>
                <div class="value" id="kpiRiskCust">0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--success-soft); color:var(--success);"><i class="fa-solid fa-wallet"></i></div>
            <div class="kpi-details">
                <h4>Total Lifetime Value</h4>
                <div class="value" id="kpiTotalLtv">₹0</div>
            </div>
        </div>
    </div>

    <div class="crm-filters">
        <div class="filter-chips" id="loyaltyFilters">
            <button class="chip active" data-filter="ALL">All Customers</button>
            <button class="chip" data-filter="VIP"><i class="fa-solid fa-crown" style="color:var(--vip-gold);"></i> VIP Loyalty</button>
            <button class="chip" data-filter="REGULAR"><i class="fa-solid fa-star" style="color:var(--reg-blue);"></i> Regulars</button>
            <button class="chip" data-filter="RISK"><i class="fa-solid fa-triangle-exclamation" style="color:var(--risk-red);"></i> At-Risk</button>
            <button class="chip" data-filter="UDHAAR"><i class="fa-solid fa-book-open" style="color:var(--primary);"></i> Has Udhaar</button>
        </div>
        
        <div class="search-box-crm">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search customer name or phone..." autocomplete="off">
        </div>
    </div>

    <div class="customer-grid" id="customerGrid">
        </div>
</div>

<div id="profileModal" class="modal-overlay">
    <div class="modal-box" style="max-width:450px;">
        <div class="modal-header" style="margin-bottom:0;">
            <button id="btnCloseProfile" class="btn-close" style="margin-left:auto;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="profile-header">
            <div class="profile-avatar" id="profAvatar">C</div>
            <div class="profile-name" id="profName">Customer Name</div>
            <div class="profile-phone" id="profPhone">+91 0000000000</div>
            <div style="margin-top:10px;" id="profBadge"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
            <div style="background:var(--bg-input); padding:15px; border-radius:12px; text-align:center; border:1px solid var(--border);">
                <div style="font-size:10px; color:var(--text-muted); font-weight:800; text-transform:uppercase; margin-bottom:4px;">Total Spent</div>
                <div style="font-size:18px; font-weight:800; color:var(--success); font-family:'JetBrains Mono';" id="profLtv">₹0</div>
            </div>
            <div style="background:var(--bg-input); padding:15px; border-radius:12px; text-align:center; border:1px solid var(--border);">
                <div style="font-size:10px; color:var(--text-muted); font-weight:800; text-transform:uppercase; margin-bottom:4px;">Store Visits</div>
                <div style="font-size:18px; font-weight:800; color:var(--text-main); font-family:'JetBrains Mono';" id="profVisits">0</div>
            </div>
        </div>

        <div style="background:var(--danger-soft); border:1.5px solid rgba(220,38,38,0.2); padding:15px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;" id="profUdhaarBox">
            <div>
                <div style="font-size:11px; font-weight:800; color:var(--danger); text-transform:uppercase;">Pending Udhaar</div>
                <div style="font-size:10px; color:var(--text-main); opacity:0.8; font-weight:600; margin-top:2px;">Clear this in Billing/Sales</div>
            </div>
            <div style="font-size:22px; font-weight:800; color:var(--danger); font-family:'JetBrains Mono';" id="profUdhaarVal">₹0</div>
        </div>

        <h4 style="font-size:13px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:12px; font-family:var(--font-body);">Purchase History</h4>
        <div class="history-list" id="profHistory">
            </div>
        
        <button id="btnWhatsappCust" class="btn btn-outline" style="width:100%; margin-top:20px; border-color:#22c55e; color:#22c55e;">
            <i class="fa-brands fa-whatsapp"></i> Send WhatsApp Message
        </button>
    </div>
</div>

<script type="module" src="./js/pages/customers.js"></script>

</body>
</html>
