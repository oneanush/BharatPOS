<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Settings - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="bharatpos.js"></script>

  <style>
    /* --- THEME VARIABLES (Consistent with Dashboard) --- */
    :root {
      --bg-body: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --glass: blur(16px);
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b; /* Gold */
      --success: #10b981; /* Emerald */
      --danger: #ef4444; /* Red */
      --primary: #3b82f6; /* Blue */
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      padding-bottom: 80px;
    }

    /* --- NAVIGATION --- */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 24px; background: rgba(15, 23, 42, 0.95); backdrop-filter: var(--glass);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
    .global-logo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); }
    
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    /* --- LAYOUT --- */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    
    .page-title {
        font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 25px; 
        display: flex; align-items: center; gap: 12px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }

    /* --- CARDS --- */
    .card {
      background: var(--bg-card); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 16px; padding: 24px;
      display: flex; flex-direction: column; gap: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

    /* Gradient Border Top */
    .card::after {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--border-color, var(--primary)), transparent);
        opacity: 0.7;
    }

    .card-header {
        display: flex; align-items: center; gap: 12px;
        font-size: 16px; font-weight: 700; color: #fff;
        padding-bottom: 15px; border-bottom: 1px dashed var(--border);
    }
    .card-icon { 
        width: 32px; height: 32px; background: rgba(255,255,255,0.05); 
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
        color: var(--accent); font-size: 16px;
    }

    /* --- FORM ELEMENTS --- */
    .input-group { position: relative; }
    .form-control {
      width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
      color: #fff; padding: 12px 15px; border-radius: 8px; font-family: 'Inter', sans-serif;
      transition: 0.2s; font-size: 14px;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
    .form-control[readonly] { background: rgba(0,0,0,0.2); color: var(--text-muted); cursor: not-allowed; }
    
    .form-label {
        font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600;
    }

    /* --- BUTTONS --- */
    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: 0.2s; letter-spacing: 0.5px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #2563eb; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #059669; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    
    .btn-copy { background: rgba(255,255,255,0.1); color: var(--text-main); font-size: 12px; padding: 8px; width: auto; }
    .btn-copy:hover { background: rgba(255,255,255,0.2); }

    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* --- FILE UPLOAD ZONE --- */
    .upload-zone {
        border: 2px dashed var(--border); border-radius: 12px; padding: 20px;
        text-align: center; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.02);
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(245, 158, 11, 0.05); }
    .upload-input { display: none; }
    
    .qr-preview-box {
        margin-top: 15px; text-align: center; min-height: 120px;
        display: flex; align-items: center; justify-content: center;
        background: #fff; border-radius: 8px; padding: 10px;
    }
    .qr-img { max-width: 100%; max-height: 150px; }

    /* --- STORAGE METER --- */
    .storage-bar-bg { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .storage-bar-fill { height: 100%; background: var(--success); width: 0%; transition: width 1s; }
    .storage-text { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 5px; }

    /* --- MOBILE --- */
    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <img src="logo.png" class="global-logo">
      Bharat POS
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="sales.html">Sales</a>
      <a href="settings.html" class="active" style="color:var(--accent)">Settings</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-title"><i class="fa-solid fa-sliders"></i> System Control</div>

    <div class="settings-grid">
      
      <div class="card" style="--border-color: var(--primary);">
        <div class="card-header">
            <div class="card-icon" style="color:var(--primary);"><i class="fa-solid fa-globe"></i></div> 
            Network Identity
        </div>
        
        <div class="input-group">
            <label class="form-label">Merchant ID (Share this with Customers)</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="merchantId" class="form-control" readonly value="LOADING..." style="font-family:'JetBrains Mono'; letter-spacing:1px; font-weight:700;">
                <button onclick="copyMerchantID()" class="btn btn-copy"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>

        <div class="input-group">
            <label class="form-label">Shop Location (For Heatmap)</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <div style="flex:1; font-size:12px; color:var(--text-muted);" id="locationStatus">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Checking...
                </div>
                <button onclick="updateLocation()" class="btn btn-primary" style="width:auto; font-size:12px; padding:8px 16px;">
                    <i class="fa-solid fa-location-crosshairs"></i> Calibrate
                </button>
            </div>
        </div>
      </div>

      <div class="card" style="--border-color: var(--accent);">
        <div class="card-header">
            <div class="card-icon"><i class="fa-solid fa-store"></i></div> 
            Store Profile
        </div>
        
        <div class="input-group">
            <label class="form-label">Owner Name (Dashboard Greeting)</label>
            <input type="text" id="ownerName" class="form-control" placeholder="e.g. Rahul Kumar">
        </div>

        <div class="input-group">
            <label class="form-label">Shop Name (Bill Header)</label>
            <input type="text" id="shopName" class="form-control" placeholder="e.g. My Super Store">
        </div>
        
        <div class="input-group">
            <label class="form-label">Contact Number</label>
            <input type="text" id="shopPhone" class="form-control" placeholder="e.g. +91 98765 43210">
        </div>

        <button onclick="saveShopDetails()" class="btn btn-success">
            <i class="fa-solid fa-floppy-disk"></i> Update Profile
        </button>
      </div>

      <div class="card" style="--border-color: #a855f7;">
        <div class="card-header">
            <div class="card-icon" style="color:#a855f7;"><i class="fa-solid fa-receipt"></i></div> 
            Bill Configuration
        </div>

        <div class="input-group">
            <label class="form-label">Default Footer Note</label>
            <input type="text" id="billFooter" class="form-control" placeholder="e.g. Thank you, Visit Again!">
        </div>

        <div class="card-header" style="margin-top:10px; border-bottom:none; padding-bottom:0;">
            <div class="card-icon"><i class="fa-solid fa-qrcode"></i></div> 
            UPI Setup
        </div>
        
        <label class="upload-zone">
            <input type="file" id="qrUpload" accept="image/*" class="upload-input">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:20px; color:var(--text-muted);"></i>
            <div style="font-size:12px; margin-top:5px; color:var(--text-main);">Upload QR Code</div>
        </label>

        <div class="qr-preview-box" id="qrContainer">
            <span style="color:#666; font-size:11px;">Preview Area</span>
        </div>
      </div>

      <div class="card" style="--border-color: var(--success);">
        <div class="card-header">
            <div class="card-icon" style="color:var(--success);"><i class="fa-solid fa-database"></i></div> 
            Data Vault
        </div>
        
        <div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-main); font-weight:600;">
                <span>Local Storage</span>
                <span id="storagePercent">0%</span>
            </div>
            <div class="storage-bar-bg">
                <div class="storage-bar-fill" id="storageFill"></div>
            </div>
            <div class="storage-text">
                <span id="storageBytes">0 KB used</span>
                <span>5 MB Limit</span>
            </div>
        </div>

        <button onclick="exportAll()" class="btn" style="background:rgba(255,255,255,0.1); color:var(--text-main); border:1px solid var(--border);">
            <i class="fa-solid fa-download"></i> Backup Data (JSON)
        </button>

        <div style="border-top:1px dashed var(--border); padding-top:15px; margin-top:5px;">
            <label class="form-label">Restore Backup</label>
            <div style="display:flex; gap:10px;">
                <label class="btn" style="background:rgba(255,255,255,0.05); color:var(--text-muted); flex:1; font-size:12px;">
                    <input type="file" id="importFile" class="upload-input" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                    Select File
                </label>
                <button onclick="doImport()" class="btn btn-primary" style="width:auto;">Load</button>
            </div>
            <div id="fileName" style="font-size:11px; color:var(--accent); margin-top:5px; text-align:center;"></div>
        </div>
      </div>

      <div class="card" style="--border-color: var(--danger);">
        <div class="card-header" style="color:var(--danger); border-color: rgba(239,68,68,0.3);">
            <div class="card-icon" style="color:var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i></div> 
            Danger Zone
        </div>
        
        <p style="font-size:12px; color:var(--text-muted); line-height:1.5;">
            Resetting wipes all sales, inventory, and customer data permanently.
        </p>

        <button onclick="hardReset()" class="btn btn-danger">
            <i class="fa-solid fa-trash-can"></i> Factory Reset System
        </button>
      </div>

    </div>
  </div>

<script>
// --- 1. INITIALIZATION & DATA LOADING ---
document.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    updateStorageMeter();
    
    // Load QR
    const storedQR = localStorage.getItem("upiQR");
    if (storedQR) renderQR(storedQR);
});

function loadSettings() {
    // Load from 'bharatpos_user' (Standard Object)
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    
    document.getElementById('merchantId').value = user.merchantId || "NOT SET";
    document.getElementById('ownerName').value = user.name || "";
    document.getElementById('shopName').value = localStorage.getItem('shopName') || "";
    document.getElementById('shopPhone').value = localStorage.getItem('shopPhone') || "";
    document.getElementById('billFooter').value = localStorage.getItem('bharatpos_bill_footer') || "";

    // Load Location Status
    if (user.lat && user.lng) {
        document.getElementById('locationStatus').innerHTML = `<span style="color:var(--success)">✅ Calibrated: ${user.lat.toFixed(4)}, ${user.lng.toFixed(4)}</span>`;
    } else {
        document.getElementById('locationStatus').innerHTML = `<span style="color:var(--danger)">⚠️ Not Set (Heatmap Inactive)</span>`;
    }
}

// --- 2. SAVE LOGIC ---
function saveShopDetails() {
    // 1. Update Legacy Keys
    localStorage.setItem('shopName', document.getElementById('shopName').value);
    localStorage.setItem('shopPhone', document.getElementById('shopPhone').value);
    localStorage.setItem('bharatpos_bill_footer', document.getElementById('billFooter').value);

    // 2. Update Master User Object
    let user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    user.name = document.getElementById('ownerName').value;
    
    // Ensure Merchant ID exists if empty
    if(!user.merchantId) {
        user.merchantId = "SHOP-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('merchantId').value = user.merchantId;
    }

    localStorage.setItem('bharatpos_user', JSON.stringify(user));
    alert('✅ Profile & Settings Updated Successfully!');
}

// --- 3. LOCATION LOGIC ---
function updateLocation() {
    const status = document.getElementById('locationStatus');
    status.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Triangulating...`;

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                let user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
                user.lat = pos.coords.latitude;
                user.lng = pos.coords.longitude;
                localStorage.setItem('bharatpos_user', JSON.stringify(user));
                
                status.innerHTML = `<span style="color:var(--success)">✅ Updated: ${user.lat.toFixed(4)}, ${user.lng.toFixed(4)}</span>`;
                alert("Location captured! Your shop will now appear accurately on the Heatmap.");
            },
            (err) => {
                status.innerHTML = `<span style="color:var(--danger)">❌ GPS Access Denied</span>`;
                alert("Error: Could not fetch location. Please allow GPS access.");
            }
        );
    } else {
        status.innerHTML = "GPS Not Supported";
    }
}

// --- 4. UTILS ---
function copyMerchantID() {
    const copyText = document.getElementById("merchantId");
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert("Merchant ID Copied: " + copyText.value);
}

// QR Code Logic
const qrUpload = document.getElementById("qrUpload");
const qrContainer = document.getElementById("qrContainer");

qrUpload.addEventListener("change", function() {
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function() {
            localStorage.setItem("upiQR", reader.result); 
            renderQR(reader.result);
            alert("✅ QR Code Saved");
        };
    }
});

function renderQR(src) {
    if(src) qrContainer.innerHTML = `<img src="${src}" class="qr-img">`;
}

// Import/Export Logic
function doImport() {
    const f = document.getElementById('importFile').files[0];
    if (!f) return alert('Please choose a backup file first.');
    
    if (typeof importAllFile === "function") {
        importAllFile(f, function(err, msg) { 
            if (err) alert('❌ Import Failed: ' + err); 
            else { alert('✅ ' + msg); location.reload(); } 
        });
    } else {
        // Fallback Import
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
                alert("✅ System Restored Successfully!");
                location.reload();
            } catch(ex) { alert("Corrupt File"); }
        };
        reader.readAsText(f);
    }
}

function exportAll() {
    if (typeof exportAllData === "function") {
        exportAllData();
    } else {
        // Fallback Export
        const data = JSON.stringify(localStorage);
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bharatpos_backup_${Date.now()}.json`;
        a.click();
    }
}

// Storage Meter
function updateStorageMeter() {
    let total = 0;
    for(let x in localStorage) {
        if(localStorage.hasOwnProperty(x)) total += ((localStorage[x].length + x.length) * 2);
    }
    const kb = (total / 1024).toFixed(2);
    const limit = 5120; 
    const pct = Math.min((total / 1024 / limit) * 100, 100).toFixed(1);
    
    document.getElementById('storageBytes').innerText = `${kb} KB used`;
    document.getElementById('storagePercent').innerText = `${pct}%`;
    document.getElementById('storageFill').style.width = `${pct}%`;
    
    if(pct > 80) document.getElementById('storageFill').style.background = 'var(--danger)';
}

function hardReset() {
    if(confirm('⚠️ CRITICAL WARNING ⚠️\n\nThis will DELETE ALL DATA.\nAre you absolutely sure?')) {
        localStorage.clear();
        alert('System Reset Complete. Reloading...');
        location.reload();
    }
}
</script>

</body>
</html>
