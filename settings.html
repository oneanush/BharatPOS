
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="bharatpos.js" defer></script>
</head>
<body>

  <div class="header">
<div class="global-header">     <img src="logo.png" class="global-logo"> </div>
    <div class="brand">  Bharat POS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="billing.html">Billing</a>
      <a href="sales.html">Sales</a>
      <a href="report.html">Report</a>
      <a href="settings.html">Settings</a>
      <a href="index.html">About</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h3>Settings</h3>
      
      <div class="form-row">
        <button onclick="exportAll()">Export all (JSON)</button>
      </div>

      <div class="form-row">
        <input type="file" id="importFile">
        <button onclick="doImport()">Import file</button>
      </div>

      <div class="form-row">
        <button onclick="if(confirm('Clear ALL data?')){ localStorage.clear(); alert('Cleared'); }" style="background:#dc3545">
          Reset All Data
        </button>
      </div>
<label>Upload UPI QR Code:</label>
<input type="file" id="qrUpload" accept="image/*">

<img id="qrPreview" style="width:120px; margin-top:10px; display:none;">

      <div class="form-row">
        <button onclick="toggleTheme()">Toggle Theme</button>
      </div>
    </div>
  </div>

  <script>
    function doImport() {
      const f = document.getElementById('importFile').files[0];
      if (!f) return alert('Choose file');
      importAllFile(f, function(err, msg) { 
        if (err) alert('Import error'); 
        else { alert(msg); location.reload(); } 
      });
    }

const qrUpload = document.getElementById("qrUpload");
const qrPreview = document.getElementById("qrPreview");

qrUpload.addEventListener("change", function() {
    const file = this.files[0];
    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = function() {
        localStorage.setItem("upiQR", reader.result); 
        qrPreview.src = reader.result;
        qrPreview.style.display = "block";
        alert("QR Code Saved Successfully");
    };
});

// Load saved QR on settings page refresh
window.onload = function() {
    const storedQR = localStorage.getItem("upiQR");
    if (storedQR) {
        qrPreview.src = storedQR;
        qrPreview.style.display = "block";
    }
};

  </script>

</body>
</html>
