<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Billing - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">

  <style>
    table { width:100%; border-collapse: collapse; margin: 6px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    .total { margin-top: 6px; font-weight: bold; }
    .card { padding: 12px; margin-bottom: 12px; background: #f7f7f7; border-radius: 6px; }
    .form-row { margin-top: 8px; display: flex; gap: 6px; }
    .small { font-size: 0.85em; color: #555; }
    button { padding: 4px 8px; cursor: pointer; }
    .hidden { display:none; }
    nav a { margin-right: 12px; }
    .header { display:flex; justify-content: space-between; align-items:center; margin-bottom:12px; }
    .brand { font-weight:bold; font-size:1.2em; }
    .nav a { margin-left:8px; }

    /* Billing layout */
    .billing-container { display: flex; gap: 16px; justify-content:center; align-items:flex-start; flex-wrap: wrap; }
    /* Remove independent scroll from billing container */
    .billing-container {
      max-height: none !important;
      overflow: visible !important;
    }
    .cart-section {
      max-height: none !important;
      overflow: visible !important;
    }
    #stockScrollBox {
      max-height: none !important;
      overflow: visible !important;
    }

    /* Product Grid */
    #productGridWrap {
      width: 90%;
      margin: 6px auto;
      max-width: 1200px;
    }
    #categoryFilters { display:flex; gap:6px; flex-wrap:wrap;margin-bottom:10px; }
    #categoryFilters button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 6px 12px;
      background-color: #0b5ed7;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }
    #categoryFilters button:hover {
      background-color: #0740a0;
    }

    #productList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
      align-items: start;
    }
    .prod-btn {
      aspect-ratio: 1/1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:6px;
      font-size:12px;
      border-radius:8px;
      border:1px solid #ccc;
      background: linear-gradient(180deg,#ffffff,#f0f6ff);
      cursor:pointer;
      overflow:hidden;
      transition: 0.15s;
    }
    .prod-btn:active { transform: scale(0.97); }
    .prod-name { font-size:12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
    .prod-qty { font-size:11px; color:#333; opacity:0.8; margin-top:4px; }

    /* Scroll only on stock/product section */
    .stock-scroll {
      max-height: 50vh;
      overflow-y: auto;
      padding: 6px;
      border-radius: 8px;
      background: #f9f9f9;
    }

    /* Cart section smaller */
    .cart-section { flex: 0.9; max-width:650px; min-width:320px; }

    /* responsive tweak */
    @media (max-width:700px){
      #productGridWrap{ width: 96%; }
      .billing-container{  align-items:center; flex-direction:column; }
      .cart-section{ width:96%; max-width: none; }
    }

    /* Category buttons */
    #categoryFilters button {
      padding:4px 10px;
      border-radius:6px;
      border:none;
      background:#0077ff;
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition: 0.2s;
    }
    #categoryFilters button:hover { background:#005fcc; transform: scale(1.05); }

    /* Scanner UI */
    #scannerContainer { display:flex; align-items:center; justify-content:center; background:#000; color:#fff; }
    #detectedCode { margin-top:6px; font-weight:700; }
    #scannerToast { margin-top:6px; font-size:13px; color:#0b2b4a; }
  </style>
</head>

<body>
  <nav>
    <a href="sales.html">Sales</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
    <a href="index.html">About</a>
  </nav>

  <div class="header">
    <div class="brand">🛰️ Bharat POS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
    </div>
  </div>

  <!-- Scanner UI -->
  <div id="scannerContainer" style="width:70%; max-width:600px; height:200px; border:1px solid #ccc; margin-bottom:6px;"></div>
  <div style="margin-bottom:6px;">
    <button id="openCamera">Start Scanner</button>
    <button id="stopCamera" style="display:none; margin-left:6px;">Stop Scanner</button>
    <span id="detectedCode" class="small"></span>
    <div id="scannerToast" class="small">Scanner idle</div>
  </div>

  <!-- Hidden input (keeps backward compatibility with code that expects a barcodeInput element) -->
  <input id="barcodeInput" class="hidden" autocomplete="off">

  <div class="stock-scroll">
    <div id="productGridWrap">
      <h3 style="text-align:center;margin:6px 0;">Available Products</h3>
      <div id="categoryFilters"></div>
      <div id="productList" role="list"></div>
    </div>
  </div>
  <div class="billing-container">
    <div class="cart-section">
      <div class="card">
        <h3>Billing</h3>
        <div class="form-row">
          <input type="text" id="productSearch" placeholder="Search product...">
          <input id="custName" placeholder="Customer name (optional)">
        </div>
        <div id="searchResults" class="card"></div>
      </div>

      <div class="card">
        <h3>Cart</h3>
        <div id="cartList"></div>
        <div class="form-row">
         <input id="discount" type="number" placeholder="Discount INR (optional)" value="" 
           oninput="if(window.renderCart) renderCart(); if(window.renderBillItems) renderBillItems();">
        </div>
        <div class="total" id="grandTotal">Total: ₹0</div>
        <div class="form-row"><button onclick="completeSale()">Checkout & Print</button></div>
      </div>
    </div>
  </div>

  <!-- Invoice Modal -->
  <div id="invoiceModal" class="card hidden" style="max-width:700px;margin:20px auto">
    <div id="invoiceContent"></div>
    <div style="text-align:right;margin-top:8px">
      <button onclick="window.print()">Print</button>
      <button onclick="closeInvoice()">Close</button>
    </div>
  </div>

  <script src="bharatpos.js"></script>
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

<script>
/* ============================
   Scanner + UPC auto-fill redirect
   - integrates with your existing bharatpos.js functions:
     getProducts(), addToBill(id), etc.
   - if product unknown, it calls UPCItemDB and redirects to products.html
     where the product add form will be auto-filled.
   ============================ */

document.addEventListener("DOMContentLoaded", () => {
  const scannerContainer = document.getElementById("scannerContainer");
  const openBtn = document.getElementById("openCamera");
  const stopBtn = document.getElementById("stopCamera");
  const barcodeInput = document.getElementById("barcodeInput");
  const detectedCodeEl = document.getElementById("detectedCode");
  const toastEl = document.getElementById("scannerToast");

  let scanning = false;
  let lastAccepted = null;
  let scanLocked = false;
  const SCAN_COOLDOWN_MS = 1200;
  const DUPLICATE_TIMEOUT = 1500;
  const REQUIRED_CONFIRMS = 3;    // require 3 consistent reads within window
  const WINDOW_MS = 1200;
  const readCounts = new Map();

  // UPC lookup endpoint
  const UPC_API_TRIAL = "https://api.upcitemdb.com/prod/trial/lookup?upc=";

  function toast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    setTimeout(()=> { if(toastEl) toastEl.textContent=''; }, 2800);
  }

  function registerRead(code) {
    const now = Date.now();
    const rec = readCounts.get(code) || { count: 0, lastSeen: now };
    if (now - rec.lastSeen > WINDOW_MS) rec.count = 0;
    rec.count += 1;
    rec.lastSeen = now;
    readCounts.set(code, rec);
    // cleanup old entries
    for (const [k, v] of Array.from(readCounts.entries())) {
      if (now - v.lastSeen > WINDOW_MS) readCounts.delete(k);
    }
    return rec.count;
  }

  function handleScannedCandidate(code) {
    if (!code || scanLocked) return;
    const count = registerRead(code);
    detectedCodeEl.textContent = `Detected (${count}/${REQUIRED_CONFIRMS}): ${code}`;
    if (count >= REQUIRED_CONFIRMS) {
      acceptCode(code);
      scanLocked = true;
      setTimeout(() => { scanLocked = false; }, SCAN_COOLDOWN_MS);
      readCounts.clear();
    }
  }

  // main acceptance: check local inventory first; if not found fetch UPC API and redirect to add-product
  async function acceptCode(code) {
    const now = Date.now();
    if (lastAccepted && lastAccepted.code === code && now - lastAccepted.time < DUPLICATE_TIMEOUT) return;
    lastAccepted = { code, time: now };
    detectedCodeEl.textContent = "Confirmed: " + code;

    // set the hidden barcode input for compatibility
    if (barcodeInput) {
      barcodeInput.value = code;
      barcodeInput.dispatchEvent(new Event('input', { bubbles: true }));
      barcodeInput.dispatchEvent(new Event('change', { bubbles: true }));
    }

    try {
      // check in local products
      if (typeof getProducts === 'function') {
        const products = getProducts() || [];
        const found = products.find(p => String(p.barcode) === String(code) || String(p.upc) === String(code));
        if (found) {
          // product exists -> add to bill
          toast('Product found locally — adding to cart');
          if (typeof window.addToBill === 'function') {
            window.addToBill(found.id);
            return;
          }
        }
      }

      // not found locally -> fetch from UPCItemDB trial
      toast('Not found locally — fetching details from UPC database...');
      let res = await fetch(UPC_API_TRIAL + encodeURIComponent(code));
      if (!res.ok) {
        // server error / rate limit
        console.warn('UPC API returned status', res.status);
        // still redirect user to products page with barcode so they can add manually
        localStorage.setItem('temp_new_barcode', String(code));
        toast('UPC lookup failed; opening product add screen');
        window.location.href = 'products.html';
        return;
      }
      const data = await res.json();

      // build the newProductData object safely
      const newProductData = { barcode: String(code), name: '', mrp: '', brand: '', rawApi: data };

      if (data && data.code === 'OK' && Array.isArray(data.items) && data.items.length > 0) {
        const item = data.items[0];
        newProductData.name = (item.title || item.description || '').trim();
        // try offers -> price
        if (item.offers && item.offers.length) {
          const p = item.offers.find(o => o.price !== undefined && o.price !== null);
          if (p) newProductData.mrp = p.price;
        }
        newProductData.brand = item.brand || item.manufacturer || '';
      } else {
        // not found in DB
        newProductData.name = '';
      }

      // save to localStorage for products page to pick up
      localStorage.setItem('newProductData', JSON.stringify(newProductData));
      toast('Opening Add Product page (auto-filled)');

      // redirect to products page where add-product UI will auto-fill
      window.location.href = 'products.html';
    } catch (err) {
      console.error('acceptCode error', err);
      localStorage.setItem('temp_new_barcode', String(code));
      toast('Unexpected error — opening product page for manual add');
      window.location.href = 'products.html';
    }
  }

  // Quagga + BarcodeDetector fallback setup (keeps your existing preferences)
  let codeReader = null;
  let quaggaActive = false;

  function startQuagga() {
    if (quaggaActive) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Camera API not supported on this browser.");
      return;
    }
    quaggaActive = true;
    stopBtn.style.display = "inline-block";
    toast('Camera scan started');

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: scannerContainer,
        constraints: {
          width: { ideal: 800 },
          height: { ideal: 300 },
          aspectRatio: { ideal: 2.6 },
          facingMode: "environment"
        }
      },
      locator: { patchSize: "large", halfSample: false },
      numOfWorkers: navigator.hardwareConcurrency ? Math.max(1, Math.min(4, navigator.hardwareConcurrency - 1)) : 2,
      decoder: {
        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]
      },
      locate: true
    }, function(err) {
      if (err) {
        console.error("Quagga init error:", err);
        quaggaActive = false;
        stopBtn.style.display = "none";
        startBarcodeDetectorFallback();
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      try {
        if (!result || !result.codeResult) return;
        const code = result.codeResult.code;
        handleScannedCandidate(code);
      } catch (e) {
        console.error("onDetected error:", e);
      }
    });
  }

  function stopQuagga() {
    if (!quaggaActive) return;
    try { Quagga.offDetected(); } catch (e) {}
    try { Quagga.stop(); } catch (e) {}
    quaggaActive = false;
    stopBtn.style.display = "none";
    scannerContainer.innerHTML = "";
    detectedCodeEl.textContent = "";
    readCounts.clear();
    lastAccepted = null;
    toast('Scanner stopped');
  }

  async function startBarcodeDetectorFallback() {
    if (!('BarcodeDetector' in window)) {
      alert("No barcode scanner available in this browser.");
      return;
    }
    const formats = ['ean_13','ean_8','upc_a','upc_e','code_128'];
    const detector = new BarcodeDetector({ formats });
    const video = document.createElement('video');
    video.style.width = "100%";
    video.style.height = "100%";
    scannerContainer.innerHTML = "";
    scannerContainer.appendChild(video);

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      console.error("Camera fallback error:", err);
      alert("Camera access error: " + err.message);
      return;
    }

    quaggaActive = true;
    stopBtn.style.display = "inline-block";
    toast('Camera scan started (fallback)');

    const tick = async () => {
      if (!quaggaActive) {
        if (stream) stream.getTracks().forEach(t => t.stop());
        return;
      }
      try {
        const barcodes = await detector.detect(video);
        if (barcodes && barcodes.length) {
          const raw = barcodes[0].rawValue || barcodes[0].raw;
          handleScannedCandidate(raw);
        }
      } catch (err) {
        console.warn("Detector error:", err);
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  openBtn.addEventListener('click', async () => {
    if (quaggaActive) return;
    if ('BarcodeDetector' in window) {
      await startBarcodeDetectorFallback();
    } else {
      startQuagga();
    }
  });

  stopBtn.addEventListener('click', () => {
    if ('BarcodeDetector' in window && quaggaActive) {
      // stop manual stream if running
      quaggaActive = false;
      scannerContainer.innerHTML = "";
      stopBtn.style.display = "none";
      toast('Scanner stopped');
    } else {
      stopQuagga();
    }
  });

  // Expose handleScannedCandidate to other modules if needed
  window.handleScannedCandidate = handleScannedCandidate;
});
</script>
<script>
async function onBarcodeDetected(barcode) {
    // Save barcode alone for fallback
    localStorage.setItem("temp_new_barcode", barcode);

    try {
        // Fetch details from OpenFoodFacts API
        const url = `https://world.openfoodfacts.org/api/v2/product/${barcode}.json`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data || !data.product) {
            console.log("No product found for this barcode");
            window.location.href = "products.html";
            return;
        }

        // Extract fields
        const name = data.product.product_name || "";
        const brand = data.product.brands || "";
        const mrp = data.product.price || ""; // many products don’t include price

        // Prepare object
        const obj = {
            barcode,
            name,
            brand,
            mrp
        };

        // Save to localStorage so product page can read it
        localStorage.setItem("newProductData", JSON.stringify(obj));

        // Move to product page
        window.location.href = "products.html";

    } catch (err) {
        console.error("Error fetching product details:", err);
        window.location.href = "products.html";
    }
}
</script>

</body>
</html>
