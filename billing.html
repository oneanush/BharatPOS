<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Billing - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    table { width:100%; border-collapse: collapse; margin: 6px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    .total { margin-top: 6px; font-weight: bold; font-size: 1.1em; color: #0b5ed7; text-align: right; }
    .card { padding: 12px; margin-bottom: 12px; background: #f7f7f7; border-radius: 6px; position: relative; }
    .form-row { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .small { font-size: 0.85em; color: #555; }
    button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; background: #0b5ed7; color: white; }
    button:hover { background: #084298; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bb2d3b; }
    .hidden { display:none; }
    nav a { margin-right: 12px; }
    .header { display:flex; justify-content: space-between; align-items:center; margin-bottom:12px; }
    .brand { font-weight:bold; font-size:1.2em; }
    .nav a { margin-left:8px; }

    /* Billing layout */
    .billing-container { display: flex; gap: 16px; justify-content:center; align-items:flex-start; flex-wrap: wrap; }
    .billing-container, .cart-section, #stockScrollBox {
      max-height: none !important;
      overflow: visible !important;
    }

    /* Product Grid */
    #productGridWrap {
      width: 90%;
      margin: 6px auto;
      max-width: 1200px;
    }
    #categoryFilters { display:flex; gap:6px; flex-wrap:wrap;margin-bottom:10px; }
    #categoryFilters button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 6px 12px;
      background-color: #0b5ed7;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }
    #categoryFilters button:hover {
      background-color: #0740a0;
    }

    #productList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); 
      gap: 8px;
      align-items: start;
    }
    .prod-btn {
      aspect-ratio: 1/1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:6px;
      font-size:12px;
      border-radius:8px;
      border:1px solid #ccc;
      background: linear-gradient(180deg,#ffffff,#f0f6ff);
      cursor:pointer;
      overflow:hidden;
      transition: 0.15s;
    }
    .prod-btn:active { transform: scale(0.97); }
    .prod-name { font-size:12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; font-weight: 600; }
    
    .prod-unit { font-size: 11px; font-weight: 700; color: #0b5ed7; margin: 2px 0; }
    .prod-price { font-size:11px; color:#333; opacity:0.8; }

    /* Scroll only on stock/product section */
    .stock-scroll {
      max-height: 50vh;
      overflow-y: auto;
      padding: 6px;
      border-radius: 8px;
      background: #f9f9f9;
    }

    /* Cart section */
    .cart-section { flex: 0.9; max-width:650px; min-width:320px; }

    /* Payment Mode Radio Style */
    .pay-mode-group { display: flex; gap: 15px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
    .pay-mode-group label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500; font-size: 0.9em; }

    /* Responsive */
    @media (max-width:700px){
      #productGridWrap{ width: 96%; }
      .billing-container{  align-items:center; flex-direction:column; }
      .cart-section{ width:96%; max-width: none; }
    }

    /* Scanner UI */
    #scannerContainer { 
      display: block;           
      position: relative;       
      width: 100%;
      max-width: 500px;         
      height: 250px;            
      background: #000; 
      overflow: hidden; 
      border-radius: 8px; 
      margin: 10px auto; 
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    #scannerContainer video, 
    #scannerContainer canvas {
      width: 100% !important;   
      height: 100% !important;
      object-fit: cover;        
      position: absolute;       
      top: 0;
      left: 0;
    }
    #scannerContainer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: rgba(255, 0, 0, 0.7);
      box-shadow: 0 0 4px red;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <nav>
    <a href="sales.html">Sales</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
    <a href="index.html">About</a>
  </nav>

  <div class="header">
    <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
    <div class="brand"> Bharat POS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
    </div>
  </div>

 <div id="scannerContainer" style="width:100%; max-width:500px; height:250px;"></div>
  <div style="margin-bottom:6px;">
    <button id="openCamera">Start Scanner</button>
    <button id="stopCamera" style="display:none; margin-left:6px;" class="btn-danger">Stop Scanner</button>
    <span id="detectedCode" class="small"></span>
  </div>

  <input id="barcodeInput" class="hidden" autocomplete="off">

  <div class="stock-scroll">
    <div id="productGridWrap">
      <h3 style="text-align:center;margin:6px 0;">Available Products</h3>
      <div id="categoryFilters"></div>
      <div id="productList" role="list"></div>
    </div>
  </div>

  <div class="billing-container">
    <div class="cart-section">
      
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Billing Details</h3>
            <span id="billDateDisplay" class="small" style="font-weight:bold;"></span>
        </div>
        
        <div class="form-row">
          <input type="text" id="productSearch" placeholder="Search product..." style="flex:1; padding:8px;" oninput="handleSearch(this.value)">
          <input id="custName" placeholder="Customer Name" style="flex:1; padding:8px;">
        </div>
        <div id="searchResults" class="card" style="display:none;"></div>
      </div>

      <div class="card">
        <h3>Cart Items</h3>
        <div id="cartList"></div>
        
        <div class="form-row">
          <input id="discount" type="number" placeholder="Discount ₹" value="" style="padding:6px; width:100px;" 
            oninput="if(window.renderCart) renderCart(); if(window.renderBillItems) renderBillItems();">
        </div>

        <hr style="border-top:1px dashed #ccc; margin:10px 0;">

        <div style="margin-bottom: 10px;">
            <label class="small" style="font-weight:bold;">Payment Mode:</label>
            <div class="pay-mode-group">
                <label><input type="radio" name="payMode" value="Cash" checked> 💵 Cash</label>
                <label><input type="radio" name="payMode" value="UPI"> 📱 UPI</label>
            </div>
        </div>

        <div style="margin: 10px 0; padding: 10px; border: 1px solid #25d366; border-radius: 6px; background: #f0fff4;">
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:1.5em;">📱</span>
                <input type="number" id="custPhone" placeholder="Mobile (e.g. 98...)" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
                <button onclick="sendWhatsAppBill()" style="background:#25d366; color:white; font-weight:bold;">WhatsApp Bill</button>
            </div>
        </div>

        <div class="total" id="grandTotal">Total: ₹0</div>
        
        <div class="form-row" style="margin-top:15px; justify-content: space-between;">
            <button onclick="if(confirm('Clear cart?')) { window.cart=[]; window.renderCart(); }" class="btn-danger">Reset Cart</button>
            <button onclick="completeSale()" style="font-size:1.1em; padding: 8px 20px;">✅ Checkout & Print</button>
        </div>
      </div>
    </div>
  </div>

  <div id="invoiceModal" class="card hidden" style="max-width:700px;margin:20px auto; border:2px solid #333;">
    <div id="invoiceContent"></div>
    <div style="text-align:center; margin-top:10px;">
      <h2 class="shop-name">Bharat POS</h2>
      <p class="shop-phone"></p>

      <div id="upiSection" style="display:none; text-align:center;">
        <p><strong>Scan to Pay</strong></p>
        <img id="upiQRImg" style="max-width:180px; border:1px solid #ccc; padding:5px;">
      </div>
    </div>
    <div style="text-align:right;margin-top:8px">
      <button onclick="window.print()">Print</button>
      <button onclick="closeInvoice()" class="btn-danger">Close</button>
    </div>
  </div>

  <div id="receipt-capture-area" style="position:fixed; top:-9999px; left:-9999px; width:350px; background:#fff; padding:20px; color:#000; font-family:'Courier New', monospace; border:1px solid #ccc;">
    <div style="text-align:center; border-bottom:2px dashed #000; padding-bottom:10px; margin-bottom:10px;">
        <h2 style="margin:0; font-size:24px;">BHARAT POS</h2>
        <div id="rec-date" style="font-size:12px; color:#555;"></div>
    </div>
    <div id="rec-items"></div>
    <div style="border-top:2px dashed #000; margin-top:10px; padding-top:10px; text-align:right;">
        <h3 style="margin:0;">TOTAL: <span id="rec-total"></span></h3>
    </div>
    <div style="text-align:center; margin-top:15px; font-size:12px;">
        Thank you for shopping!<br>Generated by BharatPOS
    </div>
  </div>

  <script src="bharatpos.js"></script>
  <script src="quagga.js"></script>

<script>
// ==========================================================
// 1. UI UTILITIES
// ==========================================================
function updateDateTime() {
    const now = new Date();
    document.getElementById('billDateDisplay').innerText = now.toLocaleString('en-IN');
}
setInterval(updateDateTime, 1000);
updateDateTime(); 

// ==========================================================
// 2. CUSTOM BILLING GRID LOGIC
// ==========================================================

function renderBillCategories() {
  const products = (typeof getProducts === 'function') ? getProducts() : [];
  const container = document.getElementById('categoryFilters');
  if (!container) return;

  const cats = ['All', ...new Set(products.map(p => p.category).filter(Boolean))];
    
  container.innerHTML = cats.map(c => 
    `<button onclick="renderBillGrid('${c}')">${c}</button>`
  ).join('');
}

function renderBillGrid(category = 'All') {
  const grid = document.getElementById('productList');
  if (!grid) return;
    
  const products = (typeof getProducts === 'function') ? getProducts() : [];
  grid.innerHTML = ''; 

  const filtered = category === 'All' 
    ? products 
    : products.filter(p => p.category === category);

  if(filtered.length === 0) {
    grid.innerHTML = '<div class="small" style="grid-column: 1/-1; text-align:center;">No products found</div>';
    return;
  }

  filtered.forEach(p => {
    const stockTxt = p.stock > 0 ? `₹${p.price}` : 'Out';
    const unitHtml = p.quantity ? `<div class="prod-unit">${p.quantity}</div>` : '';

    const btn = document.createElement('div');
    btn.className = 'prod-btn';
    btn.title = `Stock: ${p.stock}`;
    
    btn.onclick = () => { if(window.addToBill) window.addToBill(p.id); };

    btn.innerHTML = `
      <div class="prod-name">${p.name}</div>
      ${unitHtml} <div class="prod-price">${stockTxt}</div>
    `;
    grid.appendChild(btn);
  });
}

function handleSearch(query) {
    const products = getProducts();
    const grid = document.getElementById('productList');
    grid.innerHTML = '';
    
    const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || (p.barcode && p.barcode.includes(query)));
    
    filtered.forEach(p => {
        let unitHtml = p.quantity ? `<div class="prod-unit">${p.quantity}</div>` : '';
        const btn = document.createElement('div');
        btn.className = 'prod-btn';
        btn.onclick = () => { if(window.addToBill) window.addToBill(p.id); };
        btn.innerHTML = `<div class="prod-name">${p.name}</div>${unitHtml}<div class="prod-price">₹${p.price}</div>`;
        grid.appendChild(btn);
    });
}

// ==========================================================
// 3. SCANNER LOGIC
// ==========================================================

document.addEventListener("DOMContentLoaded", () => {
   
  renderBillCategories();
  renderBillGrid();

  const scannerContainer = document.getElementById("scannerContainer");
  const openBtn = document.getElementById("openCamera");
  const stopBtn = document.getElementById("stopCamera");
  const barcodeInput = document.getElementById("barcodeInput");
  const detectedCodeEl = document.getElementById("detectedCode");

  let scanning = false;
  let lastAccepted = null;
  let scanLocked = false;
  const SCAN_COOLDOWN_MS = 1500;
  const DUPLICATE_TIMEOUT = 1500;
  const REQUIRED_CONFIRMS = 3;
  const WINDOW_MS = 1200;
  const readCounts = new Map();

  function registerRead(code) {
    const now = Date.now();
    const rec = readCounts.get(code) || { count: 0, lastSeen: now };
    if (now - rec.lastSeen > WINDOW_MS) rec.count = 0;
    rec.count += 1;
    rec.lastSeen = now;
    readCounts.set(code, rec);
    for (const [k, v] of readCounts.entries()) {
      if (now - v.lastSeen > WINDOW_MS) readCounts.delete(k);
    }
    return rec.count;
  }

  function handleScannedCandidate(code) {
    if (!code || scanLocked) return;
    const count = registerRead(code);
    detectedCodeEl.textContent = `Detected (${count}/${REQUIRED_CONFIRMS}): ${code}`;
    if (count >= REQUIRED_CONFIRMS) {
      acceptCode(code);
      scanLocked = true;
      setTimeout(() => { scanLocked = false; }, SCAN_COOLDOWN_MS);
      readCounts.clear();
    }
  }

  function acceptCode(code) {
    const now = Date.now();
    if (lastAccepted && lastAccepted.code === code && now - lastAccepted.time < DUPLICATE_TIMEOUT) return;
    lastAccepted = { code, time: now };
    detectedCodeEl.textContent = "Confirmed: " + code;
    if (barcodeInput) {
      barcodeInput.value = code;
      barcodeInput.dispatchEvent(new Event('input', { bubbles: true }));
      barcodeInput.dispatchEvent(new Event('change', { bubbles: true }));
    }
    try {
      if (typeof getProducts === 'function') {
        const products = getProducts() || [];
        const found = products.find(p => String(p.barcode) === String(code));
        if (found) {
          if (typeof window.addToBill === 'function') {
            window.addToBill(found.id);
            return;
          } else {
            localStorage.setItem('temp_add_product_id', found.id);
            window.location.href = 'billing.html';
            return;
          }
        } else {
          localStorage.setItem('temp_new_barcode', String(code));
          window.location.href = 'products.html';
          return;
        }
      }
    } catch (e) {
      console.warn('Barcode handling lookup failed', e);
    }
  }

  function startQuagga() {
    if (scanning) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Camera API not supported on this browser.");
      return;
    }
    scanning = true;
    stopBtn.style.display = "inline-block";
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: scannerContainer,
        constraints: {
          width: { ideal: 600 },
          height: { ideal: 180 },
           aspectRatio: { ideal: 3.3 },
          facingMode: "environment"
        }
      },
      locator: { patchSize: "large", halfSample: false },
      numOfWorkers: navigator.hardwareConcurrency ? Math.max(1, Math.min(4, navigator.hardwareConcurrency - 1)) : 2,
      decoder: {
        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]
      },
      locate: true
    }, function(err) {
      if (err) {
        console.error("Quagga init error:", err);
        scanning = false;
        stopBtn.style.display = "none";
        startBarcodeDetectorFallback();
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      try {
        if (!result || !result.codeResult) return;
        const code = result.codeResult.code;
        handleScannedCandidate(code);
      } catch (e) {
        console.error("onDetected error:", e);
      }
    });
  }

  function stopScanner() {
    if (!scanning) return;
    try { Quagga.offDetected(); } catch (e) {}
    try { Quagga.stop(); } catch (e) {}
    scanning = false;
    stopBtn.style.display = "none";
    scannerContainer.innerHTML = "";
    detectedCodeEl.textContent = "";
    readCounts.clear();
    lastAccepted = null;
  }

  async function startBarcodeDetectorFallback() {
    if (!('BarcodeDetector' in window)) {
      alert("No barcode scanner available in this browser.");
      return;
    }
    const formats = ['ean_13','ean_8','upc_a','upc_e','code_128'];
    const detector = new BarcodeDetector({ formats });
    const video = document.createElement('video');
    video.style.width = "100%";
    video.style.height = "100%";
    scannerContainer.innerHTML = "";
    scannerContainer.appendChild(video);

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      console.error("Camera fallback error:", err);
      alert("Camera access error: " + err.message);
      return;
    }

    scanning = true;
    stopBtn.style.display = "inline-block";

    const tick = async () => {
      if (!scanning) {
        if (stream) stream.getTracks().forEach(t => t.stop());
        return;
      }
      try {
        const barcodes = await detector.detect(video);
        if (barcodes && barcodes.length) {
          const raw = barcodes[0].rawValue || barcodes[0].raw;
          handleScannedCandidate(raw);
        }
      } catch (err) {
        console.warn("Detector error:", err);
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  openBtn.addEventListener('click', async () => {
    if (scanning) return;
    if ('BarcodeDetector' in window) {
      await startBarcodeDetectorFallback();
    } else {
      startQuagga();
    }
  });

  stopBtn.addEventListener('click', stopScanner);
});

// ==========================================================
// 4. QR LOGIC
// ==========================================================
const invoiceQR = document.getElementById("upiQRImg");
const storedQR = localStorage.getItem("upiQR");

if (storedQR && invoiceQR) {
    invoiceQR.src = storedQR;
}

// ==========================================================
// 5. WHATSAPP BILL LOGIC (IMAGE BASED)
// ==========================================================
function sendWhatsAppBill() {
    // 1. Get Phone & Name
    const phone = document.getElementById('custPhone').value;
    const custName = document.getElementById('custName').value || "Valued Customer"; // Default if empty

    if (!phone || phone.length < 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    // 2. Get Cart Data (Handles global or local storage)
    let cart = window.cart;
    if (!cart || cart.length === 0) {
        try { cart = JSON.parse(localStorage.getItem('bill_items') || '[]'); } catch(e){}
    }

    if (!cart || cart.length === 0) {
        alert("Cart is empty! Add items first.");
        return;
    }

    // 3. Get Total & Date
    const totalTxt = document.getElementById('grandTotal').innerText.replace("Total:", "").trim();
    const dateTxt = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

    // 4. Build Professional Invoice Message
    // %0A = New Line
    // *Bold Text*
    
    let msg = `🧾 *BHARAT POS INVOICE* %0A`;
    msg += `📅 ${dateTxt} %0A`;
    msg += `👤 Customer: *${custName}* %0A`;
    msg += `--------------------------------%0A`;
    
    // Add Items
    cart.forEach((item, index) => {
        const name = item.name || "Item";
        const qty = item.qty || 1;
        const total = (item.price * qty).toFixed(2);
        
        // Format: 1. Milk x 2 = ₹50
        msg += `${index + 1}. ${name} x ${qty} = ₹${total} %0A`;
    });

    msg += `--------------------------------%0A`;
    msg += `💰 *TOTAL AMOUNT: ${totalTxt}* %0A`;
    msg += `--------------------------------%0A`;
    msg += `🙏 Thank you for shopping with us! %0A`;
    msg += `Visit us again.`;

    // 5. Open WhatsApp
    const url = `https://wa.me/91${phone}?text=${msg}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
