<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Billing - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="bharatpos.js"></script>
  <script src="quagga.js"></script>

  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-body: #0f172a;
      --bg-panel: #1e293b;
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --glass: blur(12px);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh; overflow: hidden; /* App-like feel */
      display: flex; flex-direction: column;
    }

    /* --- LAYOUT GRID --- */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 400px; /* Product Area | Cart Area */
      height: calc(100vh - 65px); /* Subtract header */
      overflow: hidden;
    }

    /* --- HEADER --- */
    .header {
      height: 65px; background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 100; backdrop-filter: var(--glass);
      flex-shrink: 0;
    }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
    .global-logo { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); }
    .nav { display: flex; gap: 20px; }
    .nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .nav a:hover, .nav a.active { color: var(--accent); }

    /* --- LEFT PANEL: CATALOG --- */
    .catalog-panel {
      display: flex; flex-direction: column; 
      height: 100%; 
      background: radial-gradient(circle at 0% 0%, rgba(59,130,246,0.05), transparent 50%);
      overflow: hidden; 
    }
    
    .search-area { padding: 20px 20px 10px 20px; flex-shrink: 0; }
    .search-bar-wrap {
      background: var(--bg-panel); padding: 8px 12px; border-radius: 12px;
      box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; border: 1px solid var(--border);
    }
    #productSearch {
      border: none; flex: 1; font-size: 15px; padding: 8px;
      font-family: 'Inter', sans-serif; background: transparent; color: white;
    }
    .btn-scan { background: none; border: none; cursor: pointer; color: var(--text-muted); transition: 0.2s; font-size: 18px; }
    
    .category-area { padding: 0 20px 15px 20px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    #categoryFilters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .cat-btn {
      white-space: nowrap; padding: 8px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text-muted);
    }
    .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .product-scroll-area { flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
    #productList { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    
    .prod-card {
      background: var(--bg-panel); border-radius: 16px; padding: 15px;
      border: 1px solid var(--border); cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between; height: 130px;
      position: relative; overflow: hidden;
    }
    .prod-card:active { transform: scale(0.95); }
    .prod-name { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text-main); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .prod-unit { font-size: 11px; color: var(--text-muted); }
    .prod-price { font-size: 16px; color: var(--accent); font-weight: 700; margin-top: 4px; }
    .out-stock { opacity: 0.5; pointer-events: none; filter: grayscale(1); border: 1px dashed var(--danger); }
    
    /* --- RIGHT PANEL: CART --- */
    .cart-panel {
      background: #111827; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100%;
      box-shadow: -10px 0 30px rgba(0,0,0,0.3); z-index: 20;
    }
    
    .cart-header {
      padding: 20px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .cart-title { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; color: #fff; }
    
    .cart-body { flex: 1; overflow-y: auto; padding: 0; }
    .cart-items-list table { width: 100%; border-collapse: collapse; }
    .cart-items-list th { text-align: left; font-size: 11px; color: var(--text-muted); padding: 10px 15px; border-bottom: 1px solid var(--border); background: #1f2937; position: sticky; top: 0; text-transform: uppercase; letter-spacing: 1px; }
    .cart-items-list td { padding: 12px 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; }
    
    .qty-ctrl { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border-radius: 6px; padding: 2px; width: fit-content; }
    .qty-btn { width: 24px; height: 24px; border: none; background: transparent; color: #fff; cursor: pointer; font-weight: bold; }

    /* Payment Area */
    .checkout-area { flex-shrink: 0; display: flex; flex-direction: column; background: #111827; }
    .customer-form { padding: 15px 20px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .fancy-input {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; background: rgba(255,255,255,0.05); color: #fff;
    }

    .payment-area { padding: 20px; border-top: 1px solid var(--border); }
    .pay-mode-chips { display: flex; gap: 8px; margin-bottom: 15px; }
    .chip-radio { display: none; }
    .chip-label { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 13px; background: rgba(255,255,255,0.03); color: var(--text-muted); }
    .chip-radio:checked + .chip-label { background: var(--text-main); color: #000; border-color: var(--text-main); }
    .chip-radio[value="Udhaar"]:checked + .chip-label { background: var(--danger); color: white; border-color: var(--danger); }

    .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
    .grand-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 20px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    
    .checkout-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; margin-top: 15px; }

    /* --- MOBILE --- */
    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; display: block; height: calc(100vh - 65px); position: relative; }
      
      #productList { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; padding-bottom: 80px; }
      .prod-card { min-height: 90px; padding: 8px; }
      .prod-name { font-size: 12px; }
      
      .cart-panel {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh;
        border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
        transform: translateY(calc(100% - 70px)); 
      }
      .cart-panel.open { transform: translateY(0); }

      .cart-toggle-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0 20px; height: 70px; cursor: pointer; background: #1e293b; border-bottom: 1px solid var(--border); width: 100%;
      }
      .mini-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
      .mini-total { font-size: 18px; font-weight: 800; color: var(--success); font-family: 'JetBrains Mono', monospace; }
      .mini-btn { background: var(--primary); color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; }

      .cart-header { display: none; } 
      .cart-panel.open .cart-header { display: flex; }
      .cart-panel.open .cart-toggle-bar { display: none; }
    }
    @media (min-width: 901px) { .cart-toggle-bar { display: none; } }

    /* --- SCANNER --- */
    .scanner-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    .scanner-view { width: 90%; max-width: 500px; height: 300px; background: black; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent); position: relative; }
    #scannerContainer video { width: 100%; height: 100%; object-fit: cover; }
    .scan-laser { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--danger); box-shadow: 0 0 15px red; animation: scan 2s infinite; }
    @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="logo.png" class="global-logo">
    Bharat POS
  </div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="sales.html" class="active">Sales</a>
  </div>
</div>

<div class="app-layout">

  <div class="catalog-panel">
    
    <div class="search-area">
      <div class="search-bar-wrap">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="productSearch" placeholder="Search..." oninput="handleSearch(this.value)" autocomplete="off">
        <button class="btn-scan" onclick="openScanner()">📷</button>
        <input id="barcodeInput" style="display:none;"> 
      </div>
    </div>

    <div class="category-area">
      <div id="categoryFilters"></div>
    </div>

    <div class="product-scroll-area">
      <div id="productList"></div>
    </div>
  </div>

  <div class="cart-panel" id="cartPanel">
    
    <div class="cart-toggle-bar" onclick="toggleCart()">
        <div class="mini-cart-info">
            <span class="mini-label">Total to Pay</span>
            <span class="mini-total" id="miniTotal">₹0</span>
        </div>
        <div class="mini-btn">View Cart ⬆</div>
    </div>

    <div class="cart-header">
      <div class="cart-title">🛒 Bill Details</div>
      <div style="display:flex; gap:10px;">
          <button onclick="toggleCart()" style="background:rgba(255,255,255,0.1); border:none; color:white; padding:5px 10px; border-radius:6px; cursor:pointer;">⬇ Hide</button>
          <button onclick="clearCartConfirm()" style="color:var(--danger); background:none; border:none; font-weight:bold; cursor:pointer;">Reset</button>
      </div>
    </div>

    <div class="cart-body">
      <div id="cartList" class="cart-items-list"></div>
    </div>

    <div class="checkout-area">
      <div class="customer-form">
        <div class="input-row">
          <input id="custName" class="fancy-input" placeholder="Customer Name">
          <input type="number" id="custPhone" class="fancy-input" placeholder="Mobile No.">
        </div>
        <button onclick="sendWhatsAppBill()" style="width:100%; background:rgba(37, 211, 102, 0.1); color:#25d366; border:1px solid #25d366; padding:10px; border-radius:8px; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:0.2s;">
          <span style="font-size:16px;">📱</span> Send via WhatsApp
        </button>
      </div>

      <div class="payment-area">
        <div class="summary-row">
          <span>Subtotal</span><span id="subTotalVal">₹0</span>
        </div>
        <div class="summary-row" style="align-items:center;">
          <span>Discount</span>
          <input id="discount" type="number" placeholder="0" style="width:60px; padding:4px; border-radius:4px; text-align:right;" oninput="renderCart()">
        </div>
        
        <div class="grand-total">
          <span>TOTAL</span><span id="grandTotal">₹0</span>
        </div>

        <div style="margin:10px 0;">
          <div class="pay-mode-chips">
            <input type="radio" name="payMode" value="Cash" id="pmCash" class="chip-radio" checked>
            <label for="pmCash" class="chip-label">💵 Cash</label>
            <input type="radio" name="payMode" value="UPI" id="pmUPI" class="chip-radio">
            <label for="pmUPI" class="chip-label">📱 UPI</label>
            <input type="radio" name="payMode" value="Udhaar" id="pmUdhaar" class="chip-radio">
            <label for="pmUdhaar" class="chip-label">📒 Udhaar</label>
          </div>
        </div>

        <button class="checkout-btn" onclick="completeSale()">Confirm & Print</button>
      </div>
    </div>
  </div>

</div>

<div id="scannerModal" class="scanner-modal">
  <div class="scanner-view" id="scannerContainer">
    <div class="scan-laser"></div>
  </div>
  <button onclick="closeScanner()" style="margin-top:20px; background:white; border:none; padding:10px 30px; border-radius:30px; font-weight:bold;">Close</button>
</div>

<div id="invoiceModal" style="display:none;"><div id="invoiceContent"></div></div>

<script>
// --- CORE RENDER LOGIC ---
function renderBillCategories() {
    const products = (typeof getProducts==='function')?getProducts():[];
    const cats = ['All', ...new Set(products.map(p=>p.category).filter(Boolean))];
    const c = document.getElementById('categoryFilters');
    c.innerHTML = cats.map((k, i) => `<button class="cat-btn ${i===0?'active':''}" onclick="filterCat(this, '${k}')">${k}</button>`).join('');
}

function filterCat(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBillGrid(cat);
}

function renderBillGrid(cat='All'){
    const g = document.getElementById('productList');
    const ps = (typeof getProducts==='function')?getProducts():[];
    g.innerHTML = '';
    const f = cat==='All' ? ps : ps.filter(p => p.category === cat);
    
    if(!f.length){ g.innerHTML='<div style="grid-column:1/-1; text-align:center; padding:30px; color:#64748b;">No items</div>'; return; }
    
    f.forEach(p => {
        const isOut = p.stock <= 0;
        const div = document.createElement('div');
        div.className = `prod-card ${isOut ? 'out-stock' : ''}`;
        div.onclick = () => { if(!isOut && window.addToBill) window.addToBill(p.id); };
        div.innerHTML = `
            <div class="prod-name">${p.name}</div>
            <div class="prod-meta"><div class="prod-unit">${p.quantity || ''}</div><div class="prod-price">₹${p.price}</div></div>
            ${isOut ? '<div style="font-size:10px; color:#ef4444; font-weight:bold;">OUT</div>' : ''}
        `;
        g.appendChild(div);
    });
}

function handleSearch(q){
    const ps = getProducts();
    const g = document.getElementById('productList');
    g.innerHTML = '';
    const f = ps.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || (p.barcode && p.barcode.includes(q)));
    f.forEach(p => {
        const div = document.createElement('div');
        div.className = 'prod-card';
        div.onclick = () => { if(window.addToBill) window.addToBill(p.id); };
        div.innerHTML = `<div class="prod-name">${p.name}</div><div class="prod-price">₹${p.price}</div>`;
        g.appendChild(div);
    });
}

// --- CART RENDER ---
window.renderCart = function() {
    const list = document.getElementById('cartList');
    const totalEl = document.getElementById('grandTotal');
    const subTotalEl = document.getElementById('subTotalVal');
    const miniTotal = document.getElementById('miniTotal');
    const discInput = document.getElementById('discount');
    
    if(!window.cart || window.cart.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:40px; color:#475569;">Cart Empty</div>';
        totalEl.innerText = "₹0";
        if(miniTotal) miniTotal.innerText = "₹0";
        return;
    }

    let subTotal = 0;
    let html = '<table><thead><tr><th>Item</th><th style="width:70px;">Qty</th><th style="text-align:right;">Price</th><th style="width:20px;"></th></tr></thead><tbody>';
    
    window.cart.forEach((item, index) => {
        subTotal += item.price * item.qty;
        html += `<tr>
            <td>${item.name}</td>
            <td><div class="qty-ctrl"><button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>${item.qty}<button class="qty-btn" onclick="updateQty(${index}, 1)">+</button></div></td>
            <td style="text-align:right;">₹${item.price*item.qty}</td>
            <td style="text-align:right;"><button onclick="removeFromCart(${index})" style="color:#ef4444; background:none; border:none; cursor:pointer;">&times;</button></td>
        </tr>`;
    });
    html += '</tbody></table>';
    list.innerHTML = html;

    if(subTotalEl) subTotalEl.innerText = "₹" + subTotal;
    const disc = parseFloat(discInput.value) || 0;
    const final = Math.max(0, subTotal - disc);
    
    const finalStr = "₹" + final;
    totalEl.innerText = finalStr;
    if(miniTotal) miniTotal.innerText = finalStr; // Update Mobile Bar
}

// --- MOBILE UI ---
function toggleCart() {
    document.getElementById('cartPanel').classList.toggle('open');
}

function clearCartConfirm() {
    if(confirm('Clear Cart?')) { window.cart = []; renderCart(); }
}

// --- SCANNER ---
function openScanner() {
    document.getElementById('scannerModal').style.display = 'flex';
    const btn = document.getElementById('openCamera'); 
    if(btn) btn.click();
}
function closeScanner() {
    document.getElementById('scannerModal').style.display = 'none';
    const btn = document.getElementById('stopCamera'); 
    if(btn) btn.click();
}

// --- WHATSAPP LOGIC (RESTORED) ---
function sendWhatsAppBill() {
    const phone = document.getElementById('custPhone').value; 
    const custName = document.getElementById('custName').value || "Customer";
    if (!phone || phone.length < 10) { alert("Please enter valid Mobile No."); return; }
    const khataLink = "https://oneanush.github.io/BharatPOS/my_khata.html";
    
    let total = 0;
    if(window.cart) window.cart.forEach(i => total += i.price * i.qty);
    const disc = parseFloat(document.getElementById('discount').value) || 0;
    const final = Math.max(0, total - disc);

    let msg = `Namaste ${custName}! 🙏%0A%0A`;
    msg += `Your bill total is *₹${final}*.%0A`;
    msg += `View details: ${khataLink}`;
    window.open(`https://wa.me/91${phone}?text=${msg}`, '_blank');
}

// --- INIT ---
document.addEventListener("DOMContentLoaded", ()=>{
    renderBillCategories();
    renderBillGrid();
    renderCart();
});
</script>
</body>
</html>
