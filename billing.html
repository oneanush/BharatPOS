<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Billing - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ... (Your existing styles) ... */
    table { width:100%; border-collapse: collapse; margin: 6px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    .total { margin-top: 6px; font-weight: bold; font-size: 1.1em; color: #0b5ed7; text-align: right; }
    .card { padding: 12px; margin-bottom: 12px; background: #f7f7f7; border-radius: 6px; position: relative; }
    .form-row { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .small { font-size: 0.85em; color: #555; }
    button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; background: #0b5ed7; color: white; }
    button:hover { background: #084298; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bb2d3b; }
    .hidden { display:none !important; } /* Force hide */
    nav a { margin-right: 12px; }
    .header { display:flex; justify-content: space-between; align-items:center; margin-bottom:12px; }
    .brand { font-weight:bold; font-size:1.2em; }
    .nav a { margin-left:8px; }

    .billing-container { display: flex; gap: 16px; justify-content:center; align-items:flex-start; flex-wrap: wrap; }
    .billing-container, .cart-section, #stockScrollBox { max-height: none !important; overflow: visible !important; }

    #productGridWrap { width: 90%; margin: 6px auto; max-width: 1200px; }
    #categoryFilters { display:flex; gap:6px; flex-wrap:wrap;margin-bottom:10px; }
    #categoryFilters button { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; padding: 6px 12px; background-color: #0b5ed7; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; }
    #categoryFilters button:hover { background-color: #0740a0; }

    #productList { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; align-items: start; }
    .prod-btn { aspect-ratio: 1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; font-size:12px; border-radius:8px; border:1px solid #ccc; background: linear-gradient(180deg,#ffffff,#f0f6ff); cursor:pointer; overflow:hidden; transition: 0.15s; }
    .prod-btn:active { transform: scale(0.97); }
    .prod-name { font-size:12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; font-weight: 600; }
    .prod-unit { font-size: 11px; font-weight: 700; color: #0b5ed7; margin: 2px 0; }
    .prod-price { font-size:11px; color:#333; opacity:0.8; }

    .stock-scroll { max-height: 50vh; overflow-y: auto; padding: 6px; border-radius: 8px; background: #f9f9f9; }
    .cart-section { flex: 0.9; max-width:650px; min-width:320px; }
    
    .pay-mode-group { display: flex; gap: 15px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
    .pay-mode-group label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500; font-size: 0.9em; }

    @media (max-width:700px){
      #productGridWrap{ width: 96%; }
      .billing-container{  align-items:center; flex-direction:column; }
      .cart-section{ width:96%; max-width: none; }
    }

    #scannerContainer { display: block; position: relative; width: 100%; max-width: 500px; height: 250px; background: #000; overflow: hidden; border-radius: 8px; margin: 10px auto; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
    #scannerContainer video, #scannerContainer canvas { width: 100% !important; height: 100% !important; object-fit: cover; position: absolute; top: 0; left: 0; }
    #scannerContainer::after { content: ''; position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: rgba(255, 0, 0, 0.7); box-shadow: 0 0 4px red; pointer-events: none; z-index: 10; }
  </style>
</head>

<body>
  <nav>
    <a href="sales.html">Sales</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
    <a href="index.html">About</a>
  </nav>

  <div class="header">
    <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
    <div class="brand"> Bharat POS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
    </div>
  </div>

  <div id="scannerContainer"></div>
  <div style="margin-bottom:6px;">
    <button id="openCamera">Start Scanner</button>
    <button id="stopCamera" style="display:none; margin-left:6px;" class="btn-danger">Stop Scanner</button>
    <span id="detectedCode" class="small"></span>
  </div>
  <input id="barcodeInput" class="hidden" autocomplete="off">

  <div class="stock-scroll">
    <div id="productGridWrap">
      <h3 style="text-align:center;margin:6px 0;">Available Products</h3>
      <div id="categoryFilters"></div>
      <div id="productList" role="list"></div>
    </div>
  </div>

  <div class="billing-container">
    <div class="cart-section">
      
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Billing Details</h3>
            <span id="billDateDisplay" class="small" style="font-weight:bold;"></span>
        </div>
        
        <div class="form-row">
            <input type="text" id="productSearch" placeholder="Search product..." style="flex:1; padding:8px;" oninput="handleSearch(this.value)">
        </div>

        <div class="form-row">
            <input id="custName" placeholder="Customer Name" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
            <input type="number" id="custPhone" placeholder="Mobile No. (Required for Udhaar)" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>

        <div id="searchResults" class="card" style="display:none;"></div>
      </div>

      <div class="card">
        <h3>Cart Items</h3>
        <div id="cartList"></div>
        
        <div class="form-row">
          <input id="discount" type="number" placeholder="Discount ₹" value="" style="padding:6px; width:100px;" 
            oninput="if(window.renderCart) renderCart(); if(window.renderBillItems) renderBillItems();">
        </div>

        <hr style="border-top:1px dashed #ccc; margin:10px 0;">

        <div style="margin-bottom: 10px;">
            <label class="small" style="font-weight:bold;">Payment Mode:</label>
            <div class="pay-mode-group">
                <label><input type="radio" name="payMode" value="Cash" checked> 💵 Cash</label>
                <label><input type="radio" name="payMode" value="UPI"> 📱 UPI</label>
                <label style="color:#dc3545; font-weight:bold;"><input type="radio" name="payMode" value="Udhaar"> 📒 Udhaar</label>
            </div>
        </div>

        <div style="margin: 10px 0; text-align: right;">
            <button onclick="sendWhatsAppBill()" style="background:#25d366; color:white; font-weight:bold; width:100%;">
                📱 Send Bill on WhatsApp
            </button>
        </div>

        <div class="total" id="grandTotal">Total: ₹0</div>
        
        <div class="form-row" style="margin-top:15px; justify-content: space-between;">
            <button onclick="if(confirm('Clear cart?')) { window.cart=[]; window.renderCart(); }" class="btn-danger">Reset Cart</button>
            <button onclick="completeSale()" style="font-size:1.1em; padding: 8px 20px;">✅ Checkout & Print</button>
        </div>
      </div>
    </div>
  </div>

  <div id="invoiceModal" class="card hidden" style="position:fixed; top:5%; left:5%; right:5%; z-index:1000; max-width:700px; margin:auto; border:2px solid #333; max-height:90vh; overflow-y:auto; box-shadow:0 0 20px rgba(0,0,0,0.5);">
    <div id="invoiceContent"></div>
    <div style="text-align:center; margin-top:10px;">
      <h2 class="shop-name">Bharat POS</h2>
      <p class="shop-phone"></p>
      <div id="upiSection" style="display:none; text-align:center;">
        <p><strong>Scan to Pay</strong></p>
        <img id="upiQRImg" style="max-width:180px; border:1px solid #ccc; padding:5px;">
      </div>
    </div>
    <div style="text-align:right;margin-top:8px">
      <button onclick="window.print()">Print</button>
      <button onclick="closeInvoice()" class="btn-danger">Close</button>
    </div>
  </div>

  <script src="bharatpos.js"></script>
  <script src="quagga.js"></script>

<script>
// --- UI FUNCTIONS ---
function updateDateTime() { const now = new Date(); document.getElementById('billDateDisplay').innerText = now.toLocaleString('en-IN'); }
setInterval(updateDateTime, 1000); updateDateTime();
function renderBillCategories() { const products = (typeof getProducts==='function')?getProducts():[]; const c=document.getElementById('categoryFilters'); if(!c)return; const cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))]; c.innerHTML=cats.map(k=>`<button onclick="renderBillGrid('${k}')">${k}</button>`).join(''); }
function renderBillGrid(cat='All'){ const g=document.getElementById('productList'); if(!g)return; const ps=(typeof getProducts==='function')?getProducts():[]; g.innerHTML=''; const f=cat==='All'?ps:ps.filter(p=>p.category===cat); if(!f.length){g.innerHTML='<div class="small">No products</div>';return;} f.forEach(p=>{ const s=p.stock>0?`₹${p.price}`:'Out'; const u=p.quantity?`<div class="prod-unit">${p.quantity}</div>`:''; const d=document.createElement('div'); d.className='prod-btn'; d.onclick=()=>{if(window.addToBill)window.addToBill(p.id)}; d.innerHTML=`<div class="prod-name">${p.name}</div>${u}<div class="prod-price">${s}</div>`; g.appendChild(d); }); }
function handleSearch(q){ const ps=getProducts(); const g=document.getElementById('productList'); g.innerHTML=''; const f=ps.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||(p.barcode&&p.barcode.includes(q))); f.forEach(p=>{ const u=p.quantity?`<div class="prod-unit">${p.quantity}</div>`:''; const d=document.createElement('div'); d.className='prod-btn'; d.onclick=()=>{if(window.addToBill)window.addToBill(p.id)}; d.innerHTML=`<div class="prod-name">${p.name}</div>${u}<div class="prod-price">₹${p.price}</div>`; g.appendChild(d); }); }
document.addEventListener("DOMContentLoaded", ()=>{ renderBillCategories(); renderBillGrid(); });

// --- FIXED CLOSE FUNCTION ---
function closeInvoice() {
    document.getElementById('invoiceModal').classList.add('hidden');
}

// --- FIXED WHATSAPP LOGIC (Reads Storage Directly) ---
function sendWhatsAppBill() {
    const phone = document.getElementById('custPhone').value; 
    const custName = document.getElementById('custName').value || "Customer";
    
    // 1. Validation
    if (!phone || phone.length < 10) { 
        alert("Please enter a valid Mobile Number!"); 
        return; 
    }

    // 2. The Link to your Khata Page
    const khataLink = "https://oneanush.github.io/BharatPOS/my_khata.html";

    // 3. Construct the Message (Using %0A for new lines)
    let msg = `Namaste ${custName}! 🙏%0A%0A`;
    msg += `Thank you for visiting our shop!%0A`;
    msg += `You can view your invoice history and pending dues here:%0A`;
    msg += `${khataLink}`;

    // 4. Open WhatsApp
    window.open(`https://wa.me/91${phone}?text=${msg}`, '_blank');
}
</script>
</body>
</html>
