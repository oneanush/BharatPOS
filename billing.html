<!-- (replace the <script> ... scanner script ... </script> block in billing-bharat-pos.html with this updated script) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const scannerContainer = document.getElementById("scannerContainer");
  const openBtn = document.getElementById("openCamera");
  const stopBtn = document.getElementById("stopCamera");
  const barcodeInput = document.getElementById("barcodeInput");
  const detectedCodeEl = document.getElementById("detectedCode");

  let scanning = false;
  let lastAccepted = null;
  const DUPLICATE_TIMEOUT = 1500; // ms

  // Consensus settings: require this many consistent reads within WINDOW_MS
  const REQUIRED_CONFIRMS = 3;
  const WINDOW_MS = 1200;

  // sliding counts: { code: {count, lastSeen} }
  const readCounts = new Map();

  function registerRead(code) {
    const now = Date.now();
    const rec = readCounts.get(code) || { count: 0, lastSeen: now };
    // reset count if last seen too long ago
    if (now - rec.lastSeen > WINDOW_MS) rec.count = 0;
    rec.count += 1;
    rec.lastSeen = now;
    readCounts.set(code, rec);

    // prune old entries
    for (const [k, v] of readCounts.entries()) {
      if (now - v.lastSeen > WINDOW_MS) readCounts.delete(k);
    }

    return rec.count;
  }

  function acceptCode(code) {
    // prevent immediate-repeat acceptance
    const now = Date.now();
    if (code === lastAccepted && (now - (lastAccepted?.time || 0)) < DUPLICATE_TIMEOUT) return;
    lastAccepted = { code, time: now };

    detectedCodeEl.textContent = "Confirmed: " + code;

    // fill hidden input for backward compatibility
    if (barcodeInput) {
      barcodeInput.value = code;
      barcodeInput.dispatchEvent(new Event('input', { bubbles: true }));
      barcodeInput.dispatchEvent(new Event('change', { bubbles: true }));
    }

    // lookup product and add to cart OR redirect to product page
    try {
      if (typeof getProducts === 'function') {
        const products = getProducts() || [];
        const found = products.find(p => String(p.barcode) === String(code));
        if (found) {
          if (typeof window.addToBill === 'function') {
            window.addToBill(found.id);
            return;
          } else {
            localStorage.setItem('temp_add_product_id', found.id);
            window.location.href = 'billing.html';
            return;
          }
        } else {
          // not found -> go to products page with barcode prefilled
          localStorage.setItem('temp_new_barcode', String(code));
          window.location.href = 'products.html';
          return;
        }
      }
    } catch (e) {
      console.warn('Product lookup failed after scan', e);
    }

    // If we reach here, just display code (no breaking of other features)
    const ps = document.getElementById('productSearch');
    if (ps) { ps.value = ''; } // do not auto-fill productSearch with barcode
  }

  function handleScannedCandidate(code) {
    if (!code) return;
    const count = registerRead(code);
    // update UI with intermediate status
    detectedCodeEl.textContent = `Detected (${count}/${REQUIRED_CONFIRMS}): ${code}`;

    if (count >= REQUIRED_CONFIRMS) {
      acceptCode(code);
      // clear read counts so we don't accept again immediately
      readCounts.clear();
    }
  }

  // QUAGGA initialization (used as fallback if no native BarcodeDetector)
  function startQuagga() {
    if (scanning) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Camera API not supported on this browser.");
      return;
    }

    scanning = true;
    stopBtn.style.display = "inline-block";

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: scannerContainer,
        constraints: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "environment"
        }
      },
      // improve accuracy: larger patch and full sampling (slower but more accurate)
      locator: {
        patchSize: "large",
        halfSample: false
      },
      numOfWorkers: navigator.hardwareConcurrency ? Math.max(1, Math.min(4, navigator.hardwareConcurrency - 1)) : 2,
      decoder: {
        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]
      },
      locate: true
    }, function(err) {
      if (err) {
        console.error("Quagga init error:", err);
        scanning = false;
        stopBtn.style.display = "none";
        // if Quagga fails, try native fallback
        startBarcodeDetectorFallback();
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      try {
        if (!result || !result.codeResult) return;
        const code = result.codeResult.code;
        // Only accept if result has good structure - do not auto-insert into productSearch
        handleScannedCandidate(code);
      } catch (e) {
        console.error("onDetected error:", e);
      }
    });
  }

  function stopScanner() {
    if (!scanning) return;
    try { Quagga.offDetected(); } catch (e) {}
    try { Quagga.stop(); } catch (e) {}
    // if using native stream we will stop when scanning flag cleared
    scanning = false;
    stopBtn.style.display = "none";
    scannerContainer.innerHTML = "";
    detectedCodeEl.textContent = "";
    readCounts.clear();
    lastAccepted = null;
  }

  // Prefer native BarcodeDetector when available (better accuracy on modern Chrome/Android)
  async function startBarcodeDetectorFallback() {
    if (!('BarcodeDetector' in window)) {
      // nothing available
      alert("No barcode scanner available in this browser.");
      return;
    }

    const formats = ['ean_13','ean_8','upc_a','upc_e','code_128'];
    const detector = new BarcodeDetector({ formats });
    const video = document.createElement('video');
    video.style.width = "100%";
    video.style.height = "100%";
    scannerContainer.innerHTML = "";
    scannerContainer.appendChild(video);

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      console.error("Camera fallback error:", err);
      alert("Camera access error: " + err.message);
      return;
    }

    scanning = true;
    stopBtn.style.display = "inline-block";

    const tick = async () => {
      if (!scanning) {
        if (stream) stream.getTracks().forEach(t => t.stop());
        return;
      }
      try {
        const barcodes = await detector.detect(video);
        if (barcodes && barcodes.length) {
          // use the first barcode; don't immediately accept — run through consensus
          const raw = barcodes[0].rawValue || barcodes[0].raw;
          handleScannedCandidate(raw);
        }
      } catch (err) {
        console.warn("Detector error:", err);
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  // Start scanner: prefer native detector, else Quagga
  openBtn.addEventListener('click', async () => {
    if (scanning) return;
    if ('BarcodeDetector' in window) {
      // prefer native when available
      await startBarcodeDetectorFallback();
    } else {
      startQuagga();
    }
  });

  stopBtn.addEventListener('click', stopScanner);

});
</script>
