<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Billing - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <!-- your main app script (existing) -->
  <script src="bharatpos.js" defer></script>

  <!-- Quagga for older browsers / broad barcode support -->
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

  <style>
    body { font-family: Inter, Arial, sans-serif; padding: 12px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
    .brand { font-weight:700; font-size:1.2rem; }
    #scannerContainer { width:100%; max-width:720px; height:220px; background:#000; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; }
    button { padding:8px 10px; margin-right:8px; cursor:pointer; }
    .small { font-size:0.9rem; color:#444; }
    #detectedInfo { margin-top:8px; font-weight:600; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">🛰️ Bharat POS — Billing</div>
    <div>
      <a href="products.html">Products</a>
      <a href="reports.html" style="margin-left:10px">Reports</a>
    </div>
  </div>

  <div id="scannerContainer"> 
    <div id="scannerPlaceholder" style="text-align:center; padding:12px;">
      <div style="font-size:1.05rem">Camera preview</div>
      <div class="small">Click Start Scanner to grant camera access</div>
    </div>
  </div>

  <div style="margin-top:8px;">
    <button id="startScannerBtn">Start Scanner</button>
    <button id="stopScannerBtn" style="display:none;">Stop Scanner</button>
    <span id="detectedInfo"></span>
  </div>

  <div style="margin-top:16px;" class="card">
    <h3>Manual Barcode / Add</h3>
    <div style="display:flex; gap:8px; align-items:center;">
      <input id="barcodeInput" placeholder="Enter or paste barcode then press Enter" style="flex:1; padding:8px;">
      <button id="manualLookupBtn">Lookup</button>
    </div>
  </div>

  <div style="margin-top:12px;" id="lastResults" class="small"></div>

<script>
/* ----------------------------
  Billing page scanner + API lookup
  - Tries local DB first, then OpenFoodFacts -> OpenBeauty -> UPCItemDB trial
  - Saves result as localStorage.newProductData and redirects to products.html
  - If product exists locally: adds to bill if on billing.html
---------------------------- */

(function(){
  const scannerContainer = document.getElementById('scannerContainer');
  const startBtn = document.getElementById('startScannerBtn');
  const stopBtn = document.getElementById('stopScannerBtn');
  const detectedInfo = document.getElementById('detectedInfo');
  const lastResults = document.getElementById('lastResults');
  const barcodeInput = document.getElementById('barcodeInput');
  const manualLookupBtn = document.getElementById('manualLookupBtn');

  let scanning = false;
  let quaggaRunning = false;
  let videoEl = null;
  let lastAccepted = { code: null, time: 0 };
  const DUPLICATE_WINDOW_MS = 1500;

  // Helper: update last results area
  function showStatus(text){
    lastResults.textContent = text;
  }

  // Central fetcher (same logic we discussed) - returns {found:true, name, brand, mrp, image, source} or {found:false}
  async function fetchProductDataAPIs(barcode) {
    barcode = String(barcode || '').trim();
    if (!barcode) return { found:false };

    // 1) Try OpenFoodFacts
    try {
      const url = `https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(barcode)}.json`;
      const resp = await fetch(url);
      if (resp.ok) {
        const j = await resp.json();
        if (j && j.status === 1 && j.product) {
          return {
            found:true,
            name: j.product.product_name || '',
            brand: j.product.brands || '',
            mrp: j.product.price || j.product.stores || '',
            image: j.product.image_small_url || j.product.image_url || '',
            source: 'openfoodfacts'
          };
        }
      }
    } catch (e) {
      console.warn('OpenFoodFacts error', e);
    }

    // 2) Try OpenBeauty (cosmetics)
    try {
      const urlB = `https://world.openbeautyfacts.org/api/v0/product/${encodeURIComponent(barcode)}.json`;
      const respB = await fetch(urlB);
      if (respB.ok) {
        const j2 = await respB.json();
        if (j2 && j2.status === 1 && j2.product) {
          return {
            found:true,
            name: j2.product.product_name || '',
            brand: j2.product.brands || '',
            mrp: j2.product.price || '',
            image: j2.product.image_small_url || j2.product.image_url || '',
            source: 'openbeauty'
          };
        }
      }
    } catch (e) {
      console.warn('OpenBeauty error', e);
    }

    // 3) Try UPCItemDB (trial, 100/day)
    try {
      const upcUrl = `https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(barcode)}`;
      const r3 = await fetch(upcUrl);
      if (r3.ok) {
        const j3 = await r3.json();
        if (j3 && j3.code === 'OK' && j3.total && j3.total > 0 && j3.items && j3.items.length) {
          const it = j3.items[0];
          // price may be in offers or lowest_recorded_price
          const price = (it.lowest_recorded_price) || (it.offers && it.offers[0] && it.offers[0].price) || '';
          return {
            found:true,
            name: it.title || it.description || '',
            brand: it.brand || '',
            mrp: price || '',
            image: (it.images && it.images[0]) || '',
            source: 'upcitemdb'
          };
        } else {
          console.warn('UPCItemDB no items or limit reached', j3);
        }
      } else {
        console.warn('UPCItemDB fetch failed', r3.status);
      }
    } catch (e) {
      console.warn('UPCItemDB error', e);
    }

    // not found
    return { found:false };
  }

  // Central handler invoked whenever we get a decoded code
  async function handleDetectedCode(code) {
    if (!code) return;
    const now = Date.now();
    if (lastAccepted.code === code && (now - lastAccepted.time) < DUPLICATE_WINDOW_MS) {
      // duplicate within window -> ignore
      return;
    }
    lastAccepted = { code, time: now };

    detectedInfo.textContent = `Detected: ${code}`;

    // 1) check local products first
    try {
      const products = (typeof getProducts === 'function') ? getProducts() : JSON.parse(localStorage.getItem('bharatpos_products')||'[]');
      const found = products.find(p => String(p.barcode) === String(code) || String(p.barcode) === String(Number(code)));
      if (found) {
        // If we're on billing page: add to bill
        if (typeof window.addToBill === 'function') {
          window.addToBill(found.id);
          showStatus(`Added to bill from local DB: ${found.name}`);
          return;
        } else {
          // fallback: redirect to billing
          localStorage.setItem('temp_add_product_id', found.id);
          window.location.href = 'billing.html';
          return;
        }
      }
    } catch (e) {
      console.warn('Local product check failed', e);
    }

    // 2) not in local DB -> call APIs
    showStatus('Fetching product details (Open APIs)...');
    const apiResult = await fetchProductDataAPIs(code);

    if (apiResult && apiResult.found) {
      // Save to localStorage so products page auto-fills
      const payload = {
        barcode: code,
        name: apiResult.name || '',
        brand: apiResult.brand || '',
        mrp: apiResult.mrp || '',
        image: apiResult.image || '',
        source: apiResult.source || ''
      };
      localStorage.setItem('newProductData', JSON.stringify(payload));

      showStatus(`Fetched: ${payload.name || '(no name)'} — ${payload.brand || ''} — ${payload.mrp || ''} (source: ${payload.source})`);
      // Redirect user to products page to confirm & save product
      setTimeout(()=> window.location.href = 'products.html', 600);
      return;
    } else {
      // not found anywhere -> store simple barcode and go products page for manual add
      localStorage.setItem('temp_new_barcode', String(code));
      showStatus('No details found — open add product page to enter manually');
      setTimeout(()=> window.location.href = 'products.html', 600);
      return;
    }
  }

  /* ------------------------------
     Scanner start/stop logic
  ------------------------------ */

  function startQuaggaScanner() {
    if (quaggaRunning) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Camera API not supported in this browser.');
      return;
    }

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: scannerContainer,
        constraints: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} }
      },
      decoder: {
        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]
      },
      locate: true,
      numOfWorkers: navigator.hardwareConcurrency ? Math.max(1, Math.min(4, navigator.hardwareConcurrency-1)) : 2,
      locator: { patchSize: "medium", halfSample: true }
    }, function(err) {
      if (err) {
        console.error("Quagga init err", err);
        // fallback to native detector
        startNativeDetector();
        return;
      }
      Quagga.start();
      quaggaRunning = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      showStatus('Quagga scanner started');
    });

    Quagga.onDetected(function(result) {
      try {
        if (result && result.codeResult && result.codeResult.code) {
          const code = result.codeResult.code;
          handleDetectedCode(code);
        }
      } catch (e) { console.error('Quagga onDetected error', e); }
    });
  }

  // Native BarcodeDetector fallback
  async function startNativeDetector() {
    if (scanning) return;
    if (!('BarcodeDetector' in window)) {
      showStatus('No barcode detection available in this browser.');
      return;
    }

    const formats = ['ean_13','ean_8','upc_a','upc_e','code_128'];
    const detector = new BarcodeDetector({ formats });

    videoEl = document.createElement('video');
    videoEl.style.width = '100%';
    videoEl.style.height = '100%';
    scannerContainer.innerHTML = '';
    scannerContainer.appendChild(videoEl);

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      videoEl.srcObject = stream;
      await videoEl.play();
      scanning = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      showStatus('Native BarcodeDetector started');
    } catch (err) {
      console.error('Camera start error', err);
      alert('Camera access error: ' + err.message);
      return;
    }

    const tick = async () => {
      if (!scanning) {
        try { videoEl && videoEl.srcObject && videoEl.srcObject.getTracks().forEach(t=>t.stop()); } catch(e){}
        return;
      }
      try {
        const barcodes = await detector.detect(videoEl);
        if (barcodes && barcodes.length) {
          const raw = barcodes[0].rawValue || barcodes[0].raw || (barcodes[0].rawText || '');
          if (raw) handleDetectedCode(String(raw));
        }
      } catch (err) {
        // detector may throw occasionally
        console.warn('Detector error', err);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function stopScanner() {
    // stop Quagga if running
    try { Quagga.stop(); } catch(e){}
    quaggaRunning = false;
    scanning = false;
    startBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    scannerContainer.innerHTML = '<div id="scannerPlaceholder" style="text-align:center; padding:12px;"><div style="font-size:1.05rem">Camera preview</div><div class="small">Click Start Scanner to grant camera access</div></div>';
    showStatus('Scanner stopped');
    try { if (videoEl && videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t=>t.stop()); } catch(e){}
    videoEl = null;
  }

  // start/stop UI
  startBtn.addEventListener('click', async () => {
    // prefer Quagga for best detection
    startQuaggaScanner();
  });
  stopBtn.addEventListener('click', stopScanner);

  // Manual input handling
  barcodeInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const val = String(barcodeInput.value || '').trim();
      if (!val) return;
      await handleDetectedCode(val);
      barcodeInput.value = '';
    }
  });
  manualLookupBtn.addEventListener('click', async () => {
    const val = String(barcodeInput.value || '').trim();
    if (!val) return;
    await handleDetectedCode(val);
    barcodeInput.value = '';
  });

  // show stored last product if present
  const last = localStorage.getItem('last_scanned_product');
  if (last) {
    try {
      const L = JSON.parse(last);
      showStatus('Last: ' + (L.name || '') + ' ' + (L.mrp || ''));
    } catch(e){}
  }

})(); // IIFE end
</script>

</body>
</html>
