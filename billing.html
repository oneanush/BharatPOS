<script type="module">
import { db } from "./bharatpos.js";
import { doc, setDoc, deleteDoc, collection, getDocs, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

window.db = db;

// ─── STATE ───────────────────────────────────────────────────────────────────
window.allProducts = [];
window.customers = [];
window.cart = [];
window.heldCarts = [];
window.onlineOrders = [];

window.currentCustomer = { name: '', phone: '' };
window.activeCategory = 'ALL';
window.configState = { prod: null, step: 'variant', selectedVariant: null, selectedBrand: null };
window.currentPaymentMode = 'Cash';
window.partialSplitData = null;

const langs = ['en', 'hinglish', 'hi'];

// ─── INITIALIZATION ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    try {
        bindAllEvents();
        
        const savedLang = localStorage.getItem('app_lang') || 'en'; 
        document.body.className = `lang-${savedLang}`;

        // 🟢 ASYNC BRIDGE: Fetch massive datasets from IndexedDB
        window.allProducts = await window.dbGet('bharatpos_products', '[]');
        window.customers = await window.dbGet('bharatpos_customers', '[]');
        window.heldCarts = await window.dbGet('bharatpos_held_carts', '[]');
        
        // Sort products by popularity
        const sales = await window.dbGet('bharatpos_sales', '[]');
        const freqs = {};
        sales.forEach(s => (s.items||[]).forEach(i => freqs[i.id] = (freqs[i.id]||0) + (i.qty||1)));
        window.allProducts.sort((a,b) => (freqs[b.id]||0) - (freqs[a.id]||0));

        renderCategories();
        renderProductGrid();
        renderCart();
        
        // Setup Mobile Swipe to close cart
        setupMobileCartSwipe();

        // Listen to Online Orders & Branch Selection
        const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
        
        if(typeof window.loadOwnedShops === 'function') {
            window.loadOwnedShops(user.mobile || user.phone).then(shops => {
                if(shops && shops.length > 1) {
                    const switcher = document.getElementById('shopSwitcher');
                    switcher.style.display = 'inline-block';
                    switcher.innerHTML = shops.map(s => 
                        `<option value="${s.merchantId}" ${s.merchantId === user.merchantId ? 'selected' : ''}>
                            ${s.shopName} ${s.isMain ? '⭐' : ''}
                        </option>`
                    ).join('');
                    switcher.addEventListener('change', (e) => window.switchActiveShop(e.target.value));
                }
            });
        }

        if(user.merchantId && db) {
            onSnapshot(collection(db, "shops", user.merchantId, "onlineOrders"), (snap) => {
                window.onlineOrders = snap.docs.map(d => ({...d.data(), orderId: d.id}));
                document.getElementById('onlineBadge').innerText = window.onlineOrders.length;
                if(window.onlineOrders.length > 0) document.getElementById('btnOnlineOrders').classList.add('active');
                else document.getElementById('btnOnlineOrders').classList.remove('active');
            });
        }
    } catch (err) {
        console.error("Init Error:", err);
        showToast("Initialization error.", true);
    }
});

// ─── UTILITIES & HELPERS ─────────────────────────────────────────────────────
function formatStock(amount, unitType) {
    const u = (unitType || '').toLowerCase();
    if (u.includes('kg') || u.includes('g') || u.includes('l') || u.includes('ml')) {
        return parseFloat(amount || 0).toFixed(2).replace(/\.00$/, '');
    }
    return Math.floor(amount || 0);
}

function getUnitPrice(prod, variant) {
    if (!prod.isLoose) return Number(variant.price);
    const baseQty = Number(variant.baseQty) || 1;
    return Number(variant.price) / baseQty;
}

function getUnitLabel(prod, variant) {
    if (!prod.isLoose) return 'unit';
    return variant.baseUnit || 'unit';
}

function getVariantStockInfo(p, v) {
    if (p.isLoose) {
        const bq = Number(v.baseQty) || 1;
        const totalBase = (Number(v.stock) || 0) * bq;
        return { available: totalBase, label: v.baseUnit || 'pcs', isLoose: true };
    } else {
        return { available: Number(v.stock) || 0, label: 'units', isLoose: false };
    }
}

function getProductTotalStockInfo(p) {
    if (p.isLoose) {
        let totalBase = 0;
        let unit = p.variants[0]?.baseUnit || 'units';
        p.variants.forEach(v => {
            const bq = Number(v.baseQty) || 1;
            totalBase += (Number(v.stock) || 0) * bq;
        });
        return `${formatStock(totalBase, unit)} ${unit}`;
    } else {
        let total = 0;
        p.variants.forEach(v => total += Number(v.stock) || 0);
        return `${total} in stock`;
    }
}

// ─── EVENT BINDING ENGINE ─────────────────────────────────────────────────────
function bindAllEvents() {
    // Nav & Lang
    document.getElementById('btnLangToggle').addEventListener('click', () => {
        let currentIdx = langs.indexOf(localStorage.getItem('app_lang') || 'en');
        currentIdx = (currentIdx + 1) % langs.length;
        const nextLang = langs[currentIdx];
        document.body.className = `lang-${nextLang}`;
        localStorage.setItem('app_lang', nextLang);
    });

    document.getElementById('btnOpenMenu').addEventListener('click', toggleMenu);
    document.getElementById('btnCloseMenu').addEventListener('click', toggleMenu);
    document.getElementById('menuOverlay').addEventListener('click', toggleMenu);
    
    // Mobile Cart FAB
    document.getElementById('mobileCartFab').addEventListener('click', () => {
        document.getElementById('rightPane').classList.add('open');
        document.getElementById('btnCloseMobileCart').style.display = 'block';
    });
    document.getElementById('btnCloseMobileCart').addEventListener('click', () => {
        document.getElementById('rightPane').classList.remove('open');
        document.getElementById('btnCloseMobileCart').style.display = 'none';
    });

    // Catalog Events
    document.getElementById('prodSearchInput').addEventListener('input', renderProductGrid);
    document.getElementById('catTabs').addEventListener('click', (e) => {
        if(e.target.classList.contains('cat-chip')) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            window.activeCategory = e.target.getAttribute('data-cat');
            renderProductGrid();
        }
    });

    document.getElementById('productGrid').addEventListener('click', (e) => {
        if(e.target.closest('.pc-info-btn')) return; // handled by info btn click
        const card = e.target.closest('.prod-card');
        if(card) window.openAddToCartWizard(card.getAttribute('data-id'));
    });

    // Customer Auto-suggest
    const cName = document.getElementById('custNameInput');
    const cPhone = document.getElementById('custPhoneInput');
    const dName = document.getElementById('custNameDropdown');
    const dPhone = document.getElementById('custPhoneDropdown');

    const handleSearch = (e, drop) => {
        const val = e.target.value.toLowerCase().trim();
        window.currentCustomer.name = cName.value;
        window.currentCustomer.phone = cPhone.value;
        
        if(!val) { drop.style.display = 'none'; return; }
        const matches = window.customers.filter(c => {
            const phoneVal = c.phone || c.mobile || '';
            return (c.name||'').toLowerCase().startsWith(val) || phoneVal.startsWith(val);
        }).slice(0, 5);

        if(matches.length > 0) {
            drop.innerHTML = matches.map(c => {
                const phoneVal = c.phone || c.mobile || '';
                return `<div class="cust-option" data-name="${c.name}" data-phone="${phoneVal}"><span>${c.name}</span><span style="color:var(--text-muted);">${phoneVal}</span></div>`;
            }).join('');
            drop.style.display = 'block';
        } else {
            drop.style.display = 'none';
        }
    };
    cName.addEventListener('input', (e) => handleSearch(e, dName));
    cPhone.addEventListener('input', (e) => handleSearch(e, dPhone));

    const handleSelect = (e, drop) => {
        const opt = e.target.closest('.cust-option');
        if(opt) {
            window.currentCustomer = { name: opt.getAttribute('data-name'), phone: opt.getAttribute('data-phone') };
            cName.value = window.currentCustomer.name;
            cPhone.value = window.currentCustomer.phone;
            drop.style.display = 'none';
        }
    };
    dName.addEventListener('click', (e) => handleSelect(e, dName));
    dPhone.addEventListener('click', (e) => handleSelect(e, dPhone));

    document.addEventListener('click', (e) => { 
        if(e.target !== cName && e.target !== dName) dName.style.display = 'none'; 
        if(e.target !== cPhone && e.target !== dPhone) dPhone.style.display = 'none'; 
    });

    // Wizard Flow Events
    document.getElementById('btnCloseConf').addEventListener('click', () => document.getElementById('addToCartModal').style.display='none');
    document.getElementById('btnConfBack').addEventListener('click', window.wizardBack);
    document.getElementById('confVariantGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-step');
        if(btn) window.wizardSelectVariant(btn.getAttribute('data-vid'));
    });
    document.getElementById('confBrandGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-step');
        if(btn) window.wizardSelectBrand(btn.getAttribute('data-bname'));
    });
    
    // Qty Presets
    document.getElementById('confPresetContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-preset');
        if(btn) {
            document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('confCustomQty').value = btn.getAttribute('data-val');
            window.recalcConfigTotal();
        }
    });
    document.getElementById('confCustomQty').addEventListener('input', () => {
        document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
        window.recalcConfigTotal();
    });
    document.getElementById('btnConfirmAddToCart').addEventListener('click', window.confirmAddToCart);

    // Cart Controls
    document.getElementById('cartItemsList').addEventListener('click', (e) => {
        const idx = e.target.closest('[data-idx]')?.getAttribute('data-idx');
        if(idx === undefined) return;
        
        if(e.target.closest('.ci-del')) {
            window.cart.splice(idx, 1);
            renderCart();
        } else if(e.target.closest('.ci-plus')) {
            const cartItem = window.cart[idx];
            const p = window.allProducts.find(prod => prod.id === cartItem.prodId);
            const v = p.variants.find(vx => vx.id === cartItem.id);
            const stockInfo = getVariantStockInfo(p, v);
            
            // Check inventory limit before adding
            let maxAvail = stockInfo.available;
            if (cartItem.brand && v.brands) {
                const b = v.brands.find(bx => bx.name === cartItem.brand);
                if (b) {
                    maxAvail = Number(b.stock) || 0;
                    if(p.isLoose) maxAvail = maxAvail * (Number(v.baseQty) || 1);
                }
            }

            if (cartItem.qty + 1 > maxAvail) {
                return showToast(`Max stock reached! Only ${formatStock(maxAvail, stockInfo.label)} ${stockInfo.label} available.`, true);
            }
            
            cartItem.qty += 1;
            cartItem.total = cartItem.qty * cartItem.unitPrice;
            renderCart();
        } else if(e.target.closest('.ci-minus')) {
            if(window.cart[idx].qty > 1) {
                window.cart[idx].qty -= 1;
                window.cart[idx].total = window.cart[idx].qty * window.cart[idx].unitPrice;
                renderCart();
            }
        }
    });

    // Payment Flow
    document.querySelectorAll('.btn-mode').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const mode = e.currentTarget.getAttribute('data-mode');
            window.currentPaymentMode = mode;
            
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');

            if(mode === 'Partial') { openPartialPayment(); }
        });
    });

    document.getElementById('btnGenerateBill').addEventListener('click', () => {
        if(window.cart.length === 0) return showToast("Cart is empty", true);
        if(window.currentPaymentMode === 'Udhaar' && !window.currentCustomer.name) {
            return showToast("Customer name required for Udhaar", true);
        }
        if(window.currentPaymentMode === 'Partial') {
            const grand = parseFloat(document.getElementById('cartGrandTotal').innerText);
            if(!window.partialSplitData || window.partialSplitData.total !== grand) {
                openPartialPayment();
                return;
            }
        }
        processCheckout(window.currentPaymentMode, window.partialSplitData);
    });
    
    // Partial Math
    document.getElementById('btnClosePartial').addEventListener('click', () => document.getElementById('partialPayModal').style.display='none');
    const pcCash = document.getElementById('payCash'), pcOnline = document.getElementById('payOnline'), pcUdhaar = document.getElementById('payUdhaar');
    const recalcPartial = (source) => {
        const grand = parseFloat(document.getElementById('cartGrandTotal').innerText) || 0;
        let c = parseFloat(pcCash.value) || 0;
        let o = parseFloat(pcOnline.value) || 0;
        let u = parseFloat(pcUdhaar.value) || 0;

        if (source === 'cash') {
            o = Math.max(0, grand - c);
            u = 0;
            pcOnline.value = o > 0 ? o : '';
            pcUdhaar.value = '';
        } 
        else if (source === 'online') {
            u = Math.max(0, grand - c - o);
            pcUdhaar.value = u > 0 ? u : '';
            if (c + o > grand) { pcOnline.value = Math.max(0, grand - c); pcUdhaar.value = ''; }
        } 
        else if (source === 'udhaar') {
            o = Math.max(0, grand - c - u);
            pcOnline.value = o > 0 ? o : '';
            if (c + u > grand) { pcUdhaar.value = Math.max(0, grand - c); pcOnline.value = ''; }
        }
    };
    pcCash.addEventListener('input', () => recalcPartial('cash'));
    pcOnline.addEventListener('input', () => recalcPartial('online'));
    pcUdhaar.addEventListener('input', () => recalcPartial('udhaar'));

    document.getElementById('btnConfirmPartial').addEventListener('click', () => {
        const c = Number(pcCash.value) || 0;
        const o = Number(pcOnline.value) || 0;
        const u = Number(pcUdhaar.value) || 0;
        const grand = parseFloat(document.getElementById('cartGrandTotal').innerText);

        if(Math.abs(c + o + u - grand) > 0.01) return showToast("Amounts must equal Grand Total", true);
        if(u > 0 && !window.currentCustomer.name) return showToast("Customer required for Partial Udhaar", true);

        window.partialSplitData = { cash: c, online: o, udhaar: u, total: grand };
        document.getElementById('partialPayModal').style.display = 'none';
        showToast("Mix Payment Saved");
    });

    // Held Carts
    document.getElementById('btnHoldCart').addEventListener('click', window.holdCurrentCart);
    document.getElementById('btnViewHeld').addEventListener('click', window.showHeldCarts);
    document.getElementById('btnCloseHeld').addEventListener('click', () => document.getElementById('heldCartsModal').style.display='none');
    document.getElementById('heldCartsList').addEventListener('click', (e) => {
        const idx = e.target.closest('[data-hidx]')?.getAttribute('data-hidx');
        if(idx !== undefined && e.target.tagName === 'BUTTON') window.restoreHeldCart(idx);
    });

    // Online Orders
    document.getElementById('btnOnlineOrders').addEventListener('click', window.showOnlineOrders);
    document.getElementById('btnCloseOnline').addEventListener('click', () => document.getElementById('onlineOrdersModal').style.display='none');
    document.getElementById('onlineOrdersList').addEventListener('click', (e) => {
        const id = e.target.closest('[data-oid]')?.getAttribute('data-oid');
        if(id && e.target.tagName === 'BUTTON') window.loadOnlineOrderToCart(id);
    });

    // Invoice
    document.getElementById('btnCloseInvoice').addEventListener('click', () => {
        document.getElementById('invoiceModal').style.display='none';
        window.cart = []; window.currentCustomer = {name:'', phone:''}; 
        document.getElementById('custNameInput').value = ''; document.getElementById('custPhoneInput').value = '';
        document.getElementById('cartDiscountInput').value = '';
        
        // Reset Payment Mode to Cash
        window.currentPaymentMode = 'Cash'; window.partialSplitData = null;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        document.getElementById('modeCash').classList.add('active');

        renderCart();
    });
    document.getElementById('btnPrintInvoice').addEventListener('click', () => {
        const invoiceContent = document.getElementById('invoicePaper');
        html2canvas(invoiceContent, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jspdf.jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: [canvas.width * 0.264583, canvas.height * 0.264583] // Convert px to mm
            });
            pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width * 0.264583, canvas.height * 0.264583);
            pdf.autoPrint();
            window.open(pdf.output('bloburl'), '_blank');
        });
    });

    // Product Info Modal
    document.getElementById('btnCloseInfo').addEventListener('click', () => document.getElementById('productInfoModal').style.display='none');

    // Scanner
    document.getElementById('btnOpenBarcode').addEventListener('click', window.startBarcodeScan);
    document.getElementById('btnCancelBarcode').addEventListener('click', window.stopBarcodeScan);

    // Modals Background Clicks
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay && e.target.id !== 'barcodeScannerModal' && e.target.id !== 'invoiceModal') overlay.style.display = 'none';
        });
    });
}

function setupMobileCartSwipe() {
    const rightPane = document.getElementById('rightPane');
    const cartHeader = document.getElementById('cartHeader');
    const dragHandle = document.getElementById('mobileDragHandle');
    
    if (window.innerWidth <= 900) {
        dragHandle.style.display = 'block';
    }

    let startY = 0;
    let currentY = 0;
    
    cartHeader.addEventListener('touchstart', (e) => {
        if(window.innerWidth > 900) return;
        startY = e.touches[0].clientY;
        rightPane.style.transition = 'none'; 
    }, {passive: true});

    cartHeader.addEventListener('touchmove', (e) => {
        if (!startY || window.innerWidth > 900) return;
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;
        if (diff > 0) { rightPane.style.transform = `translateY(${diff}px)`; }
    }, {passive: true});

    cartHeader.addEventListener('touchend', (e) => {
        if (!startY || window.innerWidth > 900) return;
        rightPane.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
        
        const diff = currentY - startY;
        if (diff > 100) {
            rightPane.classList.remove('open');
            rightPane.style.transform = ''; 
            document.getElementById('btnCloseMobileCart').style.display = 'none';
        } else {
            rightPane.style.transform = 'translateY(0)';
        }
        startY = 0;
    }, {passive: true});
}

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('open');
    const overlay = document.getElementById('menuOverlay');
    overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
}

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.background = isError ? 'var(--danger)' : 'var(--success)';
    t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── RENDERING LOGIC ─────────────────────────────────────────────────────────
function renderCategories() {
    const cats = new Set();
    window.allProducts.forEach(p => { if(p.category) cats.add(p.category); });
    let html = `<button class="cat-chip active" data-cat="ALL">All Items</button>`;
    Array.from(cats).forEach(c => { html += `<button class="cat-chip" data-cat="${c}">${c}</button>`; });
    document.getElementById('catTabs').innerHTML = html;
}

function renderProductGrid() {
    const q = document.getElementById('prodSearchInput').value.toLowerCase().trim();
    let filtered = window.allProducts;

    if(window.activeCategory !== 'ALL') {
        filtered = filtered.filter(p => (p.category||'').toLowerCase() === window.activeCategory.toLowerCase());
    }
    if(q) {
        filtered = filtered.filter(p => 
            (p.name||'').toLowerCase().includes(q) || 
            (p.variants||[]).some(v => (v.barcode||'').includes(q))
        );
    }

    const grid = document.getElementById('productGrid');
    if(filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">No products found.</div>`;
        return;
    }

    grid.innerHTML = filtered.map(p => {
        const vCount = (p.variants||[]).length;
        const vBase = p.variants?.[0] || {price: 0, stock: 0};
        const displayStock = getProductTotalStockInfo(p);
        
        let badges = '';
        if(vCount > 1) badges += `<div class="pc-badge">${vCount} Types</div>`;
        if(p.isLoose) badges += `<div class="pc-badge-loose" style="right:${vCount>1?'55px':'0'};">Loose / Wt</div>`;
        
        const varPrices = p.variants.map(v => {
            const uPrice = getUnitPrice(p, v);
            const uLabel = getUnitLabel(p, v);
            return `<span class="pc-variant-item">${v.quantity}: ₹${uPrice.toFixed(2)}/${uLabel}</span>`;
        }).join('');
        
        return `
        <div class="prod-card" data-id="${p.id}">
            <button class="pc-info-btn" onclick="event.stopPropagation(); window.openProductInfo('${p.id}')"><i class="fa-solid fa-circle-info"></i></button>
            ${badges}
            <div class="pc-cat">${p.category || 'Gen'}</div>
            <div class="pc-name">${p.name}</div>
            <div class="pc-variant-prices">${varPrices}</div>
            <div class="pc-bottom">
                <span class="pc-stock">${displayStock}</span>
            </div>
        </div>
        `;
    }).join('');
}

function renderCart() {
    const list = document.getElementById('cartItemsList');
    const badge = document.getElementById('mobileCartBadge');
    badge.innerText = window.cart.length;

    if(window.cart.length === 0) {
        list.innerHTML = `
            <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">
                <i class="fa-solid fa-cart-arrow-down" style="font-size:30px; opacity:0.3; margin-bottom:10px;"></i>
                <div style="font-weight:600; font-size:14px;"><span class="lang-en">Cart is empty</span><span class="lang-hinglish">Cart khali hai</span><span class="lang-hi">कार्ट खाली है</span></div>
            </div>`;
        document.getElementById('cartTotalItems').innerText = '0';
        document.getElementById('cartSubtotal').innerText = '0.00';
        document.getElementById('cartGrandTotal').innerText = '0.00';
        document.getElementById('cartGstRow').style.display = 'none';
        
        if(window.partialSplitData) { window.partialSplitData.total = 0; document.getElementById('payCash').value = ''; }
        return;
    }

    let subtotal = 0;
    let totalGst = 0;
    let hasGst = false;

    list.innerHTML = window.cart.map((item, idx) => {
        const amt = item.total; 
        let gstAmt = 0;
        if(item.gstRate > 0) {
            hasGst = true;
            if(item.priceType === 'exclusive') {
                gstAmt = amt * (item.gstRate / 100);
                subtotal += amt;
            } else {
                const base = amt / (1 + (item.gstRate / 100));
                gstAmt = amt - base;
                subtotal += base;
            }
            totalGst += gstAmt;
        } else {
            subtotal += amt;
        }
        
        return `
        <div class="cart-item">
            <div class="ci-details">
                <div class="ci-name">${item.name}</div>
                <div class="ci-meta">${item.variant} ${item.brand ? `• ${item.brand}` : ''} @ ₹${item.unitPrice.toFixed(2)}/${item.unitLabel}</div>
                <div class="ci-controls">
                    <button class="ci-btn ci-minus" data-idx="${idx}">-</button>
                    <span class="ci-qty">${item.qty} ${item.unitLabel==='unit'?'':item.unitLabel}</span>
                    <button class="ci-btn ci-plus" data-idx="${idx}">+</button>
                </div>
            </div>
            <div class="ci-pricing">
                <button class="ci-del" data-idx="${idx}"><i class="fa-solid fa-trash"></i></button>
                <div class="ci-total">₹${item.total.toFixed(2)}</div>
            </div>
        </div>`;
    }).join('');

    const discount = parseFloat(document.getElementById('cartDiscountInput').value) || 0;
    const grand = Math.max(0, subtotal + totalGst - discount);

    document.getElementById('cartTotalItems').innerText = window.cart.length;
    document.getElementById('cartSubtotal').innerText = subtotal.toFixed(2);
    document.getElementById('cartGrandTotal').innerText = grand.toFixed(2);

    if(hasGst) {
        document.getElementById('cartGstRow').style.display = 'flex';
        document.getElementById('cartTotalGst').innerText = totalGst.toFixed(2);

window.wizardBack = function() {
    const step = window.configState.step;
    const p = window.configState.prod;
    const v = window.configState.selectedVariant;

    if(step === 'qty') {
        if(v.brands && v.brands.length > 0) window.wizardRenderBrands();
        else if(p.variants.length > 1) window.wizardRenderVariants();
    } else if(step === 'brand') {
        window.wizardRenderVariants();
    }
}

window.recalcConfigTotal = function() {
    const p = window.configState.prod;
    const v = window.configState.selectedVariant;
    const uPrice = getUnitPrice(p, v);
    const qty = parseFloat(document.getElementById('confCustomQty').value) || 0;
    const tot = uPrice * qty;
    document.getElementById('confItemTotal').innerText = `₹${tot.toFixed(2)}`;
}

window.confirmAddToCart = function() {
    const p = window.configState.prod;
    const v = window.configState.selectedVariant;
    const qty = parseFloat(document.getElementById('confCustomQty').value) || 0;
    
    if(qty <= 0) return showToast("Enter valid quantity", true);

    const uPrice = getUnitPrice(p, v);
    const uLabel = getUnitLabel(p, v);
    const brandStr = window.configState.selectedBrand || '';

    const stockInfo = getVariantStockInfo(p, v);
    let maxAvail = stockInfo.available;
    
    if (brandStr && v.brands) {
        const b = v.brands.find(bx => bx.name === brandStr);
        if (b) {
            maxAvail = Number(b.stock) || 0;
            if(p.isLoose) maxAvail = maxAvail * (Number(v.baseQty) || 1);
        }
    }

    const existingIdx = window.cart.findIndex(i => i.prodId === p.id && i.variant === v.quantity && i.brand === brandStr);
    const existingQty = existingIdx >= 0 ? window.cart[existingIdx].qty : 0;
    
    if (existingQty + qty > maxAvail) {
        return showToast(`Max stock reached! Only ${formatStock(maxAvail - existingQty, stockInfo.label)} available.`, true);
    }

    if(existingIdx >= 0) {
        window.cart[existingIdx].qty += qty;
        window.cart[existingIdx].total = window.cart[existingIdx].qty * uPrice;
    } else {
        window.cart.push({
            id: v.id,
            prodId: p.id,
            name: p.name,
            variant: v.quantity,
            brand: brandStr,
            qty: qty,
            unitPrice: uPrice,
            unitLabel: uLabel,
            total: uPrice * qty,
            hsn: p.hsn || '',
            gstRate: parseFloat(p.gstRate || 0),
            priceType: p.priceType || 'inclusive'
        });
    }

    document.getElementById('addToCartModal').style.display = 'none';
    renderCart();
    
    if(window.innerWidth <= 900) {
        document.getElementById('rightPane').classList.add('open');
        document.getElementById('btnCloseMobileCart').style.display = 'block';
    }
}

function openPartialPayment() {

async function processCheckout(method, split = null) {
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    if(!user.merchantId) return showToast("Merchant ID missing", true);

    const btn = document.getElementById('btnGenerateBill');
    const origHtml = btn.innerHTML;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`; btn.disabled = true;

    try {
        const grand = parseFloat(document.getElementById('cartGrandTotal').innerText);
        const discount = parseFloat(document.getElementById('cartDiscountInput').value) || 0;
        let cashAmt = 0, onlineAmt = 0, udhaarAmt = 0;

        if(method === 'Cash') cashAmt = grand;
        else if(method === 'Online') onlineAmt = grand;
        else if(method === 'Udhaar') udhaarAmt = grand;
        else if(method === 'Partial' && split) {
            cashAmt = split.cash; onlineAmt = split.online; udhaarAmt = split.udhaar;
        }

        const saleDoc = {
            id: `inv_${Date.now()}`,
            date: new Date().toISOString(),
            customer: window.currentCustomer.name || 'Walk-in',
            customerPhone: window.currentCustomer.phone || '',
            items: window.cart,
            total: grand,
            discount: discount,
            paymentMethod: method,
            split: { cash: cashAmt, online: onlineAmt, udhaar: udhaarAmt }
        };

        const batch = writeBatch(db);
        batch.set(doc(db, "shops", user.merchantId, "sales", saleDoc.id), saleDoc);

        window.cart.forEach(cItem => {
            const pIdx = window.allProducts.findIndex(p => p.id === cItem.prodId);
            if(pIdx > -1) {
                const vIdx = window.allProducts[pIdx].variants.findIndex(v => v.id === cItem.id);
                if(vIdx > -1) {
                    const p = window.allProducts[pIdx];
                    const v = p.variants[vIdx];
                    let deduction = cItem.qty;
                    if(p.isLoose) {
                        const bq = Number(v.baseQty) || 1;
                        deduction = cItem.qty / bq; 
                    }
                    v.stock -= deduction;
                    
                    if(cItem.brand && v.brands) {
                        const bIdx = v.brands.findIndex(b => b.name === cItem.brand);
                        if(bIdx > -1) v.brands[bIdx].stock -= deduction;
                    }
                    batch.set(doc(db, "shops", user.merchantId, "products", cItem.prodId), window.allProducts[pIdx]);
                }
            }
        });
        await window.dbSave('bharatpos_products', window.allProducts);

        if(window.currentCustomer.name || window.currentCustomer.phone) {
            const custId = window.currentCustomer.phone || window.currentCustomer.name.toLowerCase().replace(/\s/g,'_');
            let cIdx = window.customers.findIndex(c => c.id === custId || (window.currentCustomer.phone && c.phone === window.currentCustomer.phone));
            
            if(cIdx === -1) {
                const newCust = { id: custId, name: window.currentCustomer.name, phone: window.currentCustomer.phone, balance: udhaarAmt };
                window.customers.push(newCust);
                cIdx = window.customers.length - 1;
            } else {
                if(window.currentCustomer.name) window.customers[cIdx].name = window.currentCustomer.name;
                if(window.currentCustomer.phone) window.customers[cIdx].phone = window.currentCustomer.phone;
                window.customers[cIdx].balance = (Number(window.customers[cIdx].balance)||0) + udhaarAmt;
            }
            
            await window.dbSave('bharatpos_customers', window.customers);
            batch.set(doc(db, "shops", user.merchantId, "customers", window.customers[cIdx].id), window.customers[cIdx]);
        }

        const sales = await window.dbGet('bharatpos_sales', '[]');
        sales.push(saleDoc);
        await window.dbSave('bharatpos_sales', sales);

        await batch.commit();

        document.getElementById('partialPayModal').style.display = 'none';
        generateInvoice(saleDoc); 
        renderProductGrid();

    } catch(e) {
        console.error(e);
        showToast("Transaction failed.", true);
    } finally {
        btn.innerHTML = origHtml; btn.disabled = false;
    }
}

// ─── INVOICE GENERATION ───────────────────────────────────────────────────────
function generateInvoice(sale) {
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    const hasGst = sale.items.some(i => i.gstRate > 0);
    
    let rows = '';
    let totalTax = 0;
    let subtotal = 0;

    sale.items.forEach(i => {
        let taxHtml = '';
        const amt = i.total;
        if(hasGst) {
            let base = amt; let tax = 0;
            if(i.gstRate > 0) {
                if(i.priceType === 'inclusive') { base = amt / (1 + (i.gstRate/100)); tax = amt - base; }
                else { tax = amt * (i.gstRate/100); base = amt; }
            }
            totalTax += tax; subtotal += base;
            taxHtml = `<td class="inv-center">${i.gstRate}%</td>`;
        } else {
            subtotal += amt;
        }

        rows += `
        <tr>
            <td>${i.name} <div style="font-size:10px; color:#555;">${i.variant} ${i.brand?`(${i.brand})`:''}</div></td>
            <td class="inv-center">${i.qty}${i.unitLabel==='unit'?'':i.unitLabel}</td>
            <td class="inv-center">${i.unitPrice.toFixed(2)}</td>
            ${taxHtml}
            <td class="inv-right">${amt.toFixed(2)}</td>
        </tr>`;
    });

    let taxSummary = hasGst ? `<div class="inv-row"><span>Total GST:</span><span>₹${totalTax.toFixed(2)}</span></div>` : '';
    let discountRow = sale.discount > 0 ? `<div class="inv-row" style="color:red;"><span>Discount:</span><span>-₹${sale.discount.toFixed(2)}</span></div>` : '';

    const html = `
        <div class="inv-header">
            <h2 style="margin:0; font-size:18px;">${user.shopName || 'Retail Store'}</h2>
            <div>${user.address || ''}</div>
            <div>GSTIN: ${user.gstin || 'N/A'}</div>
            <div style="margin-top:10px; font-weight:bold;">TAX INVOICE</div>
        </div>
        <div style="margin-bottom:10px;">
            <div class="inv-row"><span>Inv No: ${sale.id.slice(-6)}</span><span>Date: ${new Date(sale.date).toLocaleDateString()}</span></div>
            <div class="inv-row"><span>Customer: ${sale.customer}</span><span>Pay: ${sale.paymentMethod}</span></div>
        </div>
        <table class="inv-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th class="inv-center">Qty</th>
                    <th class="inv-center">Rate</th>
                    ${hasGst ? '<th class="inv-center">GST</th>' : ''}
                    <th class="inv-right">Total</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
        <div class="inv-totals">
            <div class="inv-row"><span>SubTotal:</span><span>₹${subtotal.toFixed(2)}</span></div>
            ${taxSummary}
            ${discountRow}
            <div class="inv-row" style="font-weight:bold; font-size:16px; margin-top:5px;">
                <span>Grand Total:</span><span>₹${sale.total.toFixed(2)}</span>
            </div>
            ${sale.paymentMethod === 'Partial' ? `
            <div style="font-size:10px; margin-top:10px; border-top:1px dotted #ccc; padding-top:5px;">
                Split: Cash: ₹${sale.split.cash} | Online: ₹${sale.split.online} | Udhaar: ₹${sale.split.udhaar}
            </div>` : ''}
        </div>
        <div style="text-align:center; margin-top:20px; font-size:10px;">Thank you for visiting!</div>
    `;

    document.getElementById('invoicePaper').innerHTML = html;
    document.getElementById('invoiceModal').style.display = 'flex';
}

window.holdCurrentCart = async function() {

    window.heldCarts.push({
        id: `hold_${Date.now()}`,
        time: new Date().toLocaleTimeString(),
        cust: window.currentCustomer,
        items: [...window.cart],
        discount: parseFloat(document.getElementById('cartDiscountInput').value) || 0
    });
    
    await window.dbSave('bharatpos_held_carts', window.heldCarts);
    
    window.cart = []; window.currentCustomer = {name:'', phone:''}; 
    document.getElementById('custNameInput').value = ''; document.getElementById('custPhoneInput').value = '';
    document.getElementById('cartDiscountInput').value = '';
    renderCart();
    showToast("Cart held securely.");
}

    if(window.heldCarts.length === 0) {

            </div>
        `).join('');
    }
    document.getElementById('heldCartsModal').style.display = 'flex';
}

window.restoreHeldCart = async function(idx) {
    const h = window.heldCarts[idx];
    window.cart = [...h.items];
    window.currentCustomer = {...h.cust};
    document.getElementById('custNameInput').value = window.currentCustomer.name;
    document.getElementById('custPhoneInput').value = window.currentCustomer.phone;

window.loadOnlineOrderToCart = async function(orderId) {
    const order = window.onlineOrders.find(o => o.orderId === orderId);
    if(!order) return;

    if(window.cart.length > 0) await window.holdCurrentCart();
    
    window.cart = order.items.map(i => {
        const p = window.allProducts.find(prod => prod.id === i.prodId);
        const uPrice = p ? (p.priceType === 'inclusive' ? i.price : i.price) : i.price; 
        return {
            id: i.variantId || 'unknown', prodId: i.prodId, name: i.name, variant: i.variant || '1 pcs', brand: '',
            qty: i.qty, unitPrice: i.price, unitLabel: 'unit', total: i.qty * i.price, 
            hsn: p?.hsn||'', gstRate: p?.gstRate||0, priceType: p?.priceType||'inclusive'
        };
    });
    
    window.currentCustomer = { name: order.customerName, phone: order.customerMobile || '' };
    document.getElementById('custNameInput').value = order.customerName;
    document.getElementById('custPhoneInput').value = order.customerMobile || '';
    
    document.getElementById('onlineOrdersModal').style.display = 'none';
    renderCart();
    
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    if(user.merchantId && window.db) {
        await deleteDoc(doc(db, "shops", user.merchantId, "onlineOrders", orderId));
    }
}

window.startBarcodeScan = function() {
    document.getElementById('barcodeScannerModal').style.display = 'flex';
    
    Quagga.init({
        inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#quaggaPreview'), constraints: { facingMode: "environment", advanced: [{ focusMode: "continuous" }] } },
        decoder: { readers: ["ean_reader", "upc_reader", "code_128_reader"] }
    }, function(err) {
        if (err) { console.log(err); showToast("Scanner failed to start", true); return; }
        Quagga.start();
    });

    Quagga.onDetected(function(result) {
        if(result.codeResult.code) {
            const code = result.codeResult.code;
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(e=>{});
            window.stopBarcodeScan();
            
            let foundProd = null, foundVar = null;
            window.allProducts.forEach(p => {
                const v = p.variants.find(vx => vx.barcode === code);
                if(v) { foundProd = p; foundVar = v; }
            });

            if(foundProd && foundVar) {
                window.openAddToCartWizard(foundProd.id);
                const varIdx = foundProd.variants.findIndex(v => v.id === foundVar.id);
                if(varIdx > -1) {
                    window.configState.selectedVarIdx = varIdx;
                    window.wizardSelectVariant(foundVar.id);
                }
            } else {
                showToast("Product not found in inventory", true);
            }
        }
    });
}

window.stopBarcodeScan = function() {
    Quagga.stop();
    document.getElementById('barcodeScannerModal').style.display = 'none';
}
</script>
