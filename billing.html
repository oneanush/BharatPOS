



<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Bill Banao - Bharat POS</title>

  <link rel="icon" type="image/png" href="logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script src="https://oneanush.github.io/BharatPOS/bharatpos.js"></script>
  <script src="quagga.js"></script>

  <style>
    /* --- VARIABLES --- */
    :root { --bg-body: #0f172a; --bg-panel: #1e293b; --border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #f59e0b; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --glass: blur(12px); }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* LAYOUT */
    .app-layout { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 60px); overflow: hidden; }
    .header { height: 60px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; backdrop-filter: var(--glass); flex-shrink: 0; }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; }
    .global-logo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); }
    .nav { display: flex; gap: 15px; align-items: center; } .nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; } .nav a.active { color: var(--accent); }

    /* CATALOG */
    .catalog-panel { display: flex; flex-direction: column; height: 100%; background: radial-gradient(circle at 0% 0%, rgba(59,130,246,0.05), transparent 50%); overflow: hidden; }
    .search-area { padding: 10px 15px; flex-shrink: 0; }
    .search-bar-wrap { background: var(--bg-panel); padding: 6px 12px; border-radius: 12px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); }
    #productSearch { border: none; flex: 1; font-size: 14px; padding: 5px; font-family: 'Inter', sans-serif; background: transparent; color: white; }
    .btn-scan { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 18px; transition:0.2s; }
    .btn-scan:hover { color: var(--accent); }
    
    .category-area { padding: 0 15px 10px 15px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    #categoryFilters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .cat-btn { white-space: nowrap; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-muted); }
    .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .product-scroll-area { flex-grow: 1; overflow-y: auto; padding: 10px; padding-bottom: 100px; }
    #productList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .prod-card { background: var(--bg-panel); border-radius: 8px; padding: 12px 10px; border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 95px; position: relative; overflow: hidden; transition: 0.1s; }
    .prod-card:active { transform: scale(0.95); border-color: var(--accent); }
    .prod-name { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }
    .prod-unit { font-size: 10px; color: var(--text-muted); }
    .prod-price { font-size: 13px; color: var(--success); font-weight: 700; margin-top: 6px; }
    .out-stock { opacity: 0.5; filter: grayscale(1); border: 1px dashed var(--danger); pointer-events: none; }

    /* CART */
    .cart-panel { background: #111827; border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; z-index: 500; }
    .cart-header { padding: 15px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; position: relative; }
    .cart-title { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 10px; }
    .cart-body { flex: 1; overflow-y: auto; padding: 0; }
    .cart-items-list table { width: 100%; border-collapse: collapse; }
    .cart-items-list td { padding: 10px 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px; }
    .qty-btn { width: 22px; height: 22px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; }
    
    .checkout-area { flex-shrink: 0; background: #0f172a; border-top: 1px solid var(--border); }
    .customer-form { padding: 10px 15px; border-bottom: 1px solid var(--border); position: relative; }
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; position: relative; }
    .fancy-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff; font-size: 13px; }
    
    .suggestions-box { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #1e293b; border: 1px solid var(--primary); border-radius: 8px; z-index: 1000; max-height: 180px; overflow-y: auto; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .suggestion-item { padding: 12px 15px; font-size: 13px; color: #e2e8f0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--primary); color: white; }
    .suggestion-phone { color: var(--text-muted); font-size: 11px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .suggestion-item:hover .suggestion-phone { color: #fff; background: rgba(255,255,255,0.2); }

    .payment-area { padding: 15px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: var(--text-muted); }
    .grand-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--accent); margin: 10px 0; border-top: 1px dashed var(--border); padding-top: 10px; }
    
    .pay-mode-chips { display: flex; gap: 8px; margin-bottom: 10px; }
    .chip-radio { display: none; }
    .chip-label { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: 12px; background: rgba(255,255,255,0.03); color: var(--text-muted); cursor: pointer; }
    .chip-radio:checked + .chip-label { background: var(--text-main); color: #000; border-color: var(--text-main); font-weight: 700; }
    .chip-radio[value="Udhaar"]:checked + .chip-label { background: var(--danger); color: white; border-color: var(--danger); }

    .checkout-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .checkout-btn:hover { opacity: 0.9; }

    /* MOBILE EXTENSIONS */
    .mobile-only { display: none; }
    .swipe-handle { display: none; width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
    .close-cart-btn { display: none; background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    
    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; display: block; height: calc(100vh - 60px); }
      .cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(calc(100% - 70px)); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 2000; }
      .cart-panel.open { transform: translateY(0); }
      .cart-toggle-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 70px; background: #1e293b; border-bottom: 1px solid var(--border); width: 100%; cursor: pointer; }
      .mini-cart-info { display: flex; flex-direction: column; }
      .mini-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
      .mini-total { font-size: 18px; font-weight: 800; color: var(--success); font-family: 'JetBrains Mono', monospace; }
      .mini-btn { background: var(--primary); color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; }
      
      .cart-header { display: none; padding-top: 20px; } 
      .cart-panel.open .cart-header { display: flex; }
      .cart-panel.open .cart-toggle-bar { display: none; }
      .swipe-handle { display: block; }
      .mobile-only { display: block; }
      .close-cart-btn { display: block; }
    }

    /* MODALS */
    .scanner-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    .variant-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .variant-box { background: #1e293b; width: 90%; max-width: 350px; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
    .variant-option { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
    .variant-option:hover { background: rgba(59, 130, 246, 0.2); border-color: var(--primary); }

    .loose-btn { background: rgba(255,255,255,0.05); color: #fff; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .loose-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    /* INVOICE MODAL */
    .invoice-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; align-items: center; justify-content: center; }
    .invoice-paper { background: white; color: black; width: 380px; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 12px; max-height: 90vh; overflow-y: auto; }
    .inv-header { text-align: center; margin-bottom: 10px; border-bottom: 1px dashed #000; padding-bottom: 10px; }
    .inv-shop { font-size: 16px; font-weight: bold; }
    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    .inv-table th { text-align: left; border-bottom: 1px solid #000; padding: 4px 0; font-size: 11px; }
    .inv-table td { padding: 4px 0; vertical-align: top; }
    .inv-totals { border-top: 1px dashed #000; padding-top: 5px; text-align: right; }
    .inv-row { display: flex; justify-content: space-between; }
    .inv-btn-grp { display: flex; gap: 10px; margin-top: 15px; }
    .inv-btn { flex: 1; padding: 10px; background: #000; color: white; border: none; cursor: pointer; font-weight: bold; }
    .inv-close { background: #ccc; color: #000; }
    
    /* ONLINE ORDERS MODAL */
    .oo-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(59,130,246,0.3); }
    .oo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 8px; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand"><img src="logo.png" class="global-logo"> Bharat POS</div>
  <div class="nav">
    <button id="onlineOrderBtn" onclick="document.getElementById('onlineOrdersModal').style.display='flex'" style="position:relative; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px; margin-right:10px; transition:0.2s;">
        <i class="fa-solid fa-bell"></i>
        <span id="onlineOrderBadge" style="display:none; position:absolute; top:-6px; right:-6px; background:var(--danger); color:white; font-size:10px; font-weight:bold; border-radius:50%; padding:2px 5px; border:2px solid #0f172a;">0</span>
    </button>
    <a href="dashboard.html">Home</a>
    <a href="products.html">Stock</a>
    <a href="sales.html">Bikri</a>
  </div>
</div>

<div class="app-layout">
  <div class="catalog-panel">
    <div class="search-area">
      <div class="search-bar-wrap">
        <input type="text" id="productSearch" placeholder="Item dhundo (Search)..." oninput="handleSearch(this.value)">
        <button class="btn-scan" onclick="openBarcodeScanner()"><i class="fa-solid fa-barcode"></i></button>
      </div>
    </div>
    <div class="category-area"><div id="categoryFilters"></div></div>
    <div class="product-scroll-area"><div id="productList"></div></div>
  </div>

  <div class="cart-panel" id="cartPanel">
    <div class="cart-toggle-bar" onclick="toggleCart()">
        <div class="mini-cart-info"><span class="mini-label">Total Bill</span><span class="mini-total" id="miniTotal">₹0</span></div>
        <div class="mini-btn">Bill Dekho ⬆</div>
    </div>

    <div class="cart-header" id="cartHeaderHandle">
      <div class="swipe-handle"></div>
      <div class="cart-title">
          <button class="close-cart-btn" onclick="toggleCart()"><i class="fa-solid fa-chevron-down"></i></button> 
          🛒 Bill Details
      </div>
      <button onclick="window.cart=[]; renderCart();" style="color:var(--danger); background:none; border:none; font-weight:bold; cursor:pointer;">Khali Karein</button>
    </div>
    
    <div class="cart-body"><div id="cartList" class="cart-items-list"></div></div>
    
    <div class="checkout-area">
      <div class="customer-form">
        <div class="input-row" style="position:relative;">
          <input id="custName" class="fancy-input" placeholder="Grahak Ka Naam (Name)" autocomplete="off">
          <input type="number" id="custPhone" class="fancy-input" placeholder="Mobile Number" autocomplete="off">
          
          <div id="customerSuggestions" class="suggestions-box"></div>
        </div>
      </div>

     <div class="payment-area">
        <div class="summary-row"><span>Kul Daam (Subtotal)</span><span id="subTotalVal">₹0</span></div>
        <div class="summary-row" id="taxInfoRow" style="display:none; color:var(--text-muted);">
            <span>GST (Tax)</span><span id="taxTotalVal">₹0</span>
        </div>
        <div class="summary-row" style="align-items:center;">
          <span>Discount</span>
          <input id="discount" type="number" placeholder="0" style="width:60px; padding:4px; border-radius:4px; text-align:right; background:rgba(0,0,0,0.3); color:white; border:1px solid var(--border);" oninput="renderCart()">
        </div>

         <div style="margin:10px 0;">
          <div class="pay-mode-chips">
            <input type="radio" name="payMode" value="Cash" id="pmCash" class="chip-radio" checked>
            <label for="pmCash" class="chip-label">Cash</label>
            <input type="radio" name="payMode" value="UPI" id="pmUPI" class="chip-radio">
            <label for="pmUPI" class="chip-label">UPI</label>
            <input type="radio" name="payMode" value="Udhaar" id="pmUdhaar" class="chip-radio">
            <label for="pmUdhaar" class="chip-label">Udhaar</label>
          </div>
        </div>
        
        <button class="checkout-btn" onclick="completeSale()">✅ Bill Final & Print</button>
      </div>
    </div>
  </div>
</div>

<div id="onlineOrdersModal" class="variant-overlay">
    <div class="variant-box" style="max-width: 450px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px dashed rgba(255,255,255,0.1); padding-bottom:10px;">
            <h3 style="margin:0; color:#fff; font-size:18px;">🛒 Live Customer Orders</h3>
            <button onclick="document.getElementById('onlineOrdersModal').style.display='none'" style="background:none; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="onlineOrdersList" style="max-height: 60vh; overflow-y: auto;">

        </div>
    </div>
</div>

<div id="variantModal" class="variant-overlay">
    <div class="variant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px dashed rgba(255,255,255,0.1); padding-bottom:10px;">
            <h3 id="variantModalName" style="margin:0; color:#fff; font-size:16px;">Select Type</h3>
            <button onclick="document.getElementById('variantModal').style.display='none'" style="background:none; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
        </div>

</div>

<div id="looseModal" class="variant-overlay">
  <div class="variant-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px dashed rgba(255,255,255,0.1); padding-bottom:10px;">
        <h3 id="looseModalName" style="margin:0; color:#fff; font-size:16px;">Kitna Tolna Hai?</h3>
        <button onclick="document.getElementById('looseModal').style.display='none'" style="background:none; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
        <button class="loose-btn" onclick="addLooseItem(0.100)">100g</button>
        <button class="loose-btn" onclick="addLooseItem(0.250)">250g</button>
        <button class="loose-btn" onclick="addLooseItem(0.500)">500g</button>
        <button class="loose-btn" onclick="addLooseItem(0.750)">750g</button>
        <button class="loose-btn" onclick="addLooseItem(1.000)" style="grid-column: span 2; background:var(--primary); border-color:var(--primary);">1 KG</button>
    </div>
    <div style="display:flex; gap:10px; align-items:center; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
        <input type="number" id="customWeight" step="0.001" placeholder="Custom (e.g. 0.167)" style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:#fff; outline:none; font-size:14px;">
        <span style="color:var(--text-muted); font-size:14px; font-weight:bold;">KG</span>
        <button class="checkout-btn" style="width:auto; padding:12px 20px;" onclick="addCustomLooseItem()">Add</button>
    </div>
  </div>
</div>

<div id="invoiceModal" class="invoice-overlay">
    <div class="invoice-paper" id="invoicePaper"></div>
</div>

<div id="scannerModal" class="scanner-modal">
  <div style="width:100%; height:300px; background:black; position:relative; max-width:500px;">
    <div id="cameraPreview" style="width:100%; height:100%;"></div>
    <div class="scan-laser" style="position:absolute;top:0;left:0;width:100%;height:2px;background:red;animation:scan 2s infinite;"></div>
  </div>
  <button onclick="closeBarcodeScanner()" style="margin-top:20px; padding:10px 20px; background:white; border:none; border-radius:20px; font-weight:bold; color:black;">Band Karo</button>
</div>
<script type="module">
// 🟢 1. IMPORT FIREBASE SDK & YOUR DATABASE
import { db } from "./bharatpos.js";
import { collection, doc, setDoc, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- GLOBAL STATE ---
window.cart = [];
let isGstMode = localStorage.getItem('bharatpos_gst_mode') === 'true';
let liveOrdersArray = [];

document.addEventListener('DOMContentLoaded', () => {
    renderBillCategories();
    renderBillGrid();
    renderCart();
    setupAutocomplete();
    setupMobileCartDrag();
    
    fetchOnlineOrders();
    setInterval(fetchOnlineOrders, 10000); // Checks Firebase every 10s
});

function setupAutocomplete() {
    const nameInput = document.getElementById('custName');
    const phoneInput = document.getElementById('custPhone');
    const list = document.getElementById('customerSuggestions');
    
    function escapeHtml(str){ if(!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    function handleInput(val) {
        val = val.toLowerCase().trim();
        if (val.length < 1) { list.style.display = 'none'; return; }
        
        const customers = JSON.parse(localStorage.getItem('bharatpos_customers') || '[]');
        const sales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
        const salesCustomers = sales
            .filter(s => s.phone || (s.customerName && s.customerName !== "Walk-in"))
            .map(s => ({ name: s.customerName || s.customer || "Customer", phone: s.phone || "" }));
        
        const allCust = [...customers, ...salesCustomers];
        const uniqueCust = Array.from(new Set(allCust.map(a => a.phone || a.name)))
            .map(id => allCust.find(a => (a.phone || a.name) === id));
        
        const matches = uniqueCust.filter(c => 
            (c.name && c.name.toLowerCase().includes(val)) || 
            (c.phone && String(c.phone).includes(val))
        );
        
        if (matches.length > 0) {
            list.innerHTML = matches.slice(0, 5).map(c => `
                <div class="suggestion-item" onclick="selectCustomer('${escapeHtml(c.name)}', '${escapeHtml(c.phone)}')">
                    <span style="font-weight:600;">${escapeHtml(c.name)}</span>
                    ${c.phone ? `<span class="suggestion-phone"><i class="fa-solid fa-phone" style="font-size:8px; margin-right:3px;"></i>${escapeHtml(c.phone)}</span>` : ''}
                </div>
            `).join('');
            list.style.display = 'block';
        } else { 
            list.style.display = 'none'; 
        }
    }

    nameInput.addEventListener('input', (e) => handleInput(e.target.value));
    phoneInput.addEventListener('input', (e) => handleInput(e.target.value));
    document.addEventListener('click', e => { 
        if (!nameInput.contains(e.target) && !phoneInput.contains(e.target) && !list.contains(e.target)) {
            list.style.display = 'none'; 
        }
    });
}

// Ensure global access for onclick handlers inside dynamically generated HTML
window.selectCustomer = function(n, p) { 
    document.getElementById('custName').value = n; 
    document.getElementById('custPhone').value = p; 
    document.getElementById('customerSuggestions').style.display = 'none';

// 🟢 FIREBASE: Fetch Online Orders directly from Cloud
async function fetchOnlineOrders() {
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    if(!user.merchantId) return;
    try {
        const ordersRef = collection(db, "shops", user.merchantId, "onlineOrders");
        const snapshot = await getDocs(ordersRef);
        
        liveOrdersArray = snapshot.docs.map(doc => doc.data());
        
        const badge = document.getElementById('onlineOrderBadge');
        const btn = document.getElementById('onlineOrderBtn');
        if (liveOrdersArray.length > 0) {
            badge.innerText = liveOrdersArray.length; badge.style.display = 'inline-block'; btn.style.color = '#fff';
        } else { badge.style.display = 'none'; btn.style.color = 'var(--text-muted)'; }
        renderOnlineOrdersModal();
    } catch(e) { console.error("Firebase Sync Error:", e); }
}

function renderOnlineOrdersModal() {
    const list = document.getElementById('onlineOrdersList');
    if (liveOrdersArray.length === 0) { list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Koi naya order nahi hai.</div>'; return; }
    list.innerHTML = liveOrdersArray.map(o => {
        const d = new Date(o.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        return `
        <div class="oo-card">
            <div class="oo-header">
                <div>
                    <div style="font-weight:700; color:#fff;">${o.customerName}</div>
                    <div style="font-size:11px; color:var(--text-muted);"><i class="fa-solid fa-phone"></i> ${o.phone} • ${d}</div>
                </div>
                <div style="font-weight:800; color:var(--success); font-size:16px;">${o.total}</div>
            </div>
            <div style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">${o.cart.map(c => `• ${c.name} (x${c.qty})`).join('<br>')}</div>
            <button class="checkout-btn" style="padding:8px; font-size:12px;" onclick="loadOrderIntoCart('${o.orderId}')"><i class="fa-solid fa-cart-arrow-down"></i> Load into Cart</button>
        </div>`;
    }).join('');
}

// 🟢 FIREBASE: Delete Online Order once loaded into Cart
window.loadOrderIntoCart = async function(orderId) {
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    const order = liveOrdersArray.find(o => o.orderId === orderId);
    if(!order) return;
    
    window.cart = [];
    document.getElementById('custName').value = order.customerName || "";
    document.getElementById('custPhone').value = order.phone || "";
    
    order.cart.forEach(item => { window.addToBill(item.id, item.qty); });
    
    document.getElementById('onlineOrdersModal').style.display = 'none';
    if(window.innerWidth <= 900) toggleCart();
    
    try {
        const orderRef = doc(db, "shops", user.merchantId, "onlineOrders", orderId);
        await deleteDoc(orderRef);
    } catch(e) { console.error("Firebase Delete Error:", e); }
    
    fetchOnlineOrders();
}

function getProducts() { try { return JSON.parse(localStorage.getItem('bharatpos_products') || '[]'); } catch(e) { return []; } }

function renderBillCategories() {
    const products = getProducts();
    const cats = ['Sab', ...new Set(products.map(p => p.category).filter(Boolean))];
    const container = document.getElementById('categoryFilters');
    if(container) container.innerHTML = cats.map((k, i) => `<button class="cat-btn ${i===0?'active':''}" onclick="filterCat(this, '${k==='Sab'?'All':k}')">${k}</button>`).join('');
}

window.filterCat = function(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBillGrid(cat);
}

function displayProducts(productArray) {
    const container = document.getElementById('productList');
    container.innerHTML = '';
    
    const grouped = {};
    productArray.forEach(p => {
        const key = p.name.trim().toLowerCase();
        if(!grouped[key]) grouped[key] = { name: p.name, totalStock: 0, variants: [] };
        grouped[key].totalStock += Number(p.stock || 0);
        grouped[key].variants.push(p);
    });

    const groups = Object.values(grouped);
    if(groups.length === 0){ container.innerHTML='<div style="grid-column:1/-1; text-align:center; padding:30px; color:#64748b;">Khali Hai</div>'; return; }
    
    groups.forEach(g => {
        const isOut = g.totalStock <= 0;
        const isLoose = g.variants[0].isLoose;
        const div = document.createElement('div');
        div.className = `prod-card ${isOut ? 'out-stock' : ''}`;
        
        div.onclick = () => { if(!isOut) handleCardTap(g.name); };
        
        let priceText = `₹${g.variants[0].price}`;
        if (g.variants.length > 1) {
            const prices = g.variants.map(v => Number(v.price));
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            priceText = min === max ? `₹${min}` : `₹${min} - ₹${max}`;
        }
        
        const typeText = g.variants.length > 1 ? `<span style="background:rgba(245, 158, 11, 0.1); color:var(--accent); padding:2px 6px; border-radius:4px; font-size:9px; border:1px solid rgba(245, 158, 11, 0.3);">${g.variants.length} Types</span>` : (g.variants[0].quantity || '');

        div.innerHTML = `
            <div class="prod-name">${g.name} ${isLoose ? '⚖️' : ''}</div>
            <div class="prod-unit" style="font-size:10px; color:#94a3b8; margin-top:2px;">${typeText}</div>
            <div class="prod-price">${priceText}</div>
            ${isOut ? '<div style="position:absolute; top:0; left:0; width:100%; text-align:center; background:rgba(239,68,68,0.9); color:white; font-size:10px; font-weight:bold; padding:2px 0;">OUT OF STOCK</div>' : ''}
        `;
        container.appendChild(div);
    });
}

function renderBillGrid(cat='All'){
    const products = getProducts();
    const filtered = cat === 'All' ? products : products.filter(p => p.category === cat);
    displayProducts(filtered);
}

// Added to window for global access from HTML inputs
window.handleSearch = function(q){
    const ps = getProducts();
    const f = ps.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || (p.barcode && p.barcode.includes(q)));
    displayProducts(f);
}

function handleCardTap(productName) {
    const validVariants = getProducts().filter(p => p.name === productName && Number(p.stock) > 0);
    if (validVariants.length === 0) return;
    if (validVariants.length === 1) {
        if (validVariants[0].isLoose) openLooseWeightModal(validVariants[0]);
        else window.addToBill(validVariants[0].id, 1);
    } else { openVariantSelector(productName, validVariants); }
}

function openVariantSelector(productName, validVariants) {
    document.getElementById('variantModalName').innerText = productName;
    const list = document.getElementById('variantModalList');
    list.innerHTML = validVariants.map(p => `
        <div class="variant-option" onclick="selectVariantAndClose('${p.id}')">
            <div>
                <div style="font-weight:700; color:#fff; font-size:14px;">${p.quantity || 'Standard'} ${p.isLoose ? '⚖️' : ''}</div>
                <div style="font-size:10px; color:var(--text-muted);">Stock: ${p.isLoose ? Number(p.stock).toFixed(3) + ' kg' : p.stock}</div>
            </div>
            <div style="color:var(--success); font-weight:800; font-size:16px;">₹${p.price}</div>
        </div>
    `).join('');
    document.getElementById('variantModal').style.display = 'flex';
}

window.selectVariantAndClose = function(id) {
    document.getElementById('variantModal').style.display = 'none';
    const p = getProducts().find(x => x.id === id);
    if (p.isLoose) openLooseWeightModal(p);
    else window.addToBill(id, 1);
}

let currentLooseProduct = null;
function openLooseWeightModal(product) {
    currentLooseProduct = product;
    document.getElementById('looseModalName').innerText = product.name + (product.quantity ? ` (${product.quantity})` : '');
    document.getElementById('customWeight').value = '';
    document.getElementById('looseModal').style.display = 'flex';
}

window.addLooseItem = function(weightStr) {
    const weight = parseFloat(weightStr);
    if (weight > 0 && currentLooseProduct) {
        window.addToBill(currentLooseProduct.id, weight);
        document.getElementById('looseModal').style.display = 'none';
    }
}

window.addCustomLooseItem = function() {
    const w = document.getElementById('customWeight').value;
    if(w) window.addLooseItem(w);
}

function extractBaseWeightKg(qtyStr) {
    if (!qtyStr) return 1;
    const str = String(qtyStr).toLowerCase().replace(/\s/g, '');
    let num = parseFloat(str);
    if (isNaN(num) || num <= 0) return 1; 
    if ((str.includes('g') || str.includes('gm')) && !str.includes('kg')) return num / 1000;
    if (str.includes('ml')) return num / 1000;
    return num; 
}

window.addToBill = function(productId, qtyToAdd = 1) {
    const products = getProducts();
    const p = products.find(i => i.id == productId);
    if(!p) return;
    
    const existing = window.cart.find(i => i.id == productId);
    if(existing) {
        existing.qty += parseFloat(qtyToAdd);
    } else {
        let finalRate = parseFloat(p.price);
        let packWeightKg = 1;
        let unitLabel = "";

        if (p.isLoose) {
            packWeightKg = extractBaseWeightKg(p.quantity);
            finalRate = finalRate / packWeightKg;
            unitLabel = "/kg";
        }

        let tax = 0;
        let base = finalRate;
        const gstRate = parseFloat(p.gstRate) || 0;

        if (isGstMode && gstRate > 0) {
            if (p.priceType === 'exclusive') {
                base = finalRate;
                tax = base * (gstRate / 100);
                finalRate = base + tax;
            } else {
                base = finalRate / (1 + (gstRate / 100));
                tax = finalRate - base;
            }
        }

        const typeHint = p.quantity ? `<span style="color:#94a3b8; font-size:10px;">(${p.quantity})</span>` : '';
        const displayName = p.isLoose ? `⚖️ ${p.name} ${typeHint}` : `${p.name} ${typeHint}`;

        window.cart.push({
            id: p.id,
            name: displayName,
            printName: p.quantity ? `${p.name} (${p.quantity})` : p.name,
            qty: parseFloat(qtyToAdd),
            price: finalRate, 
            basePrice: base,
            taxAmt: tax,
            gstRate: gstRate,
            hsn: p.hsn,
            isLoose: p.isLoose,
            unitLabel: unitLabel,
            packWeightKg: packWeightKg 
        });
    }
    playBeep();
    renderCart();
}

window.updateQty = function(index, change) {
    if (window.cart[index]) {
        window.cart[index].qty += change;
        if (window.cart[index].qty <= 0) window.cart.splice(index, 1);
        renderCart();
    }
}

function renderCart() {
    const list = document.getElementById('cartList');
    const totalEl = document.getElementById('grandTotal');
    const subTotalEl = document.getElementById('subTotalVal');
    const taxEl = document.getElementById('taxTotalVal');
    const taxRow = document.getElementById('taxInfoRow');
    const miniTotal = document.getElementById('miniTotal');
    const discInput = document.getElementById('discount');

    let subTotal = 0, totalTax = 0;

    window.cart.forEach(i => { 
        subTotal += i.price * i.qty; 
        totalTax += i.taxAmt * i.qty;
    });

    const disc = parseFloat(discInput.value) || 0;
    const final = Math.max(0, subTotal - disc);

    if(totalEl) totalEl.innerText = "₹" + final.toFixed(2);
    if(subTotalEl) subTotalEl.innerText = "₹" + subTotal.toFixed(2);
    if(miniTotal) miniTotal.innerText = "₹" + final.toFixed(2);
    
    if(isGstMode && totalTax > 0) {
        taxRow.style.display = "flex"; taxEl.innerText = "₹" + totalTax.toFixed(2);
    } else { taxRow.style.display = "none"; }

    if(list) {
        if(window.cart.length === 0) list.innerHTML = '<div style="text-align:center; padding:30px; color:#4b5563;">Empty</div>';
        else {
            list.innerHTML = window.cart.map((item, i) => {
                const qtyDisplay = item.isLoose ? `${item.qty.toFixed(3)} kg` : item.qty;
                const stepAmount = item.isLoose ? 0.1 : 1; 
                
                return `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 15px; border-bottom:1px solid rgba(255,255,255,0.05); color:white;">
                    <div style="flex:1;">
                        <div style="font-size:13px; font-weight:600;">${item.name}</div>
                        <div style="font-size:11px; color:#94a3b8; margin-top:3px;">
                            ₹${item.price.toFixed(2)}${item.unitLabel} x ${qtyDisplay} 
                            ${isGstMode && item.gstRate ? `<span style="color:var(--accent)">(${item.gstRate}%)</span>` : ''}
                        </div>
                    </div>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <span style="font-weight:bold; font-size:14px; color:var(--success);">₹${(item.price * item.qty).toFixed(2)}</span>
                        <div class="qty-ctrl">
                            <button class="qty-btn" onclick="updateQty(${i}, -${stepAmount})">-</button>
                            <span style="font-size:12px; font-weight:bold; width:45px; text-align:center;">${qtyDisplay}</span>
                            <button class="qty-btn" onclick="updateQty(${i}, ${stepAmount})">+</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    }
}

// 🟢 FIREBASE: The core synchronization engine for completing sales
window.completeSale = function() {
    if(window.cart.length === 0) return alert("Cart khali hai!");

    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    const custName = document.getElementById('custName').value || "Walk-in";
    const custPhone = document.getElementById('custPhone').value || "";
    const disc = parseFloat(document.getElementById('discount').value) || 0;
    const payMode = document.querySelector('input[name="payMode"]:checked').value; 

    // 1. Sync Customer to Firebase
    if (custPhone && custPhone.length >= 10 && custName !== "Walk-in") {
        let customers = JSON.parse(localStorage.getItem('bharatpos_customers') || '[]');
        const existingIndex = customers.findIndex(c => c.phone === custPhone);
        
        let customersChanged = false;
        if (existingIndex === -1) {
            customers.push({ name: custName, phone: custPhone, addedAt: new Date().toISOString() });
            customersChanged = true;
        } else if (customers[existingIndex].name !== custName) {
            customers[existingIndex].name = custName; 
            customersChanged = true;
        }
        
        if (customersChanged) {
            localStorage.setItem('bharatpos_customers', JSON.stringify(customers));
            if (user.merchantId) {
                const custRef = doc(db, "shops", user.merchantId, "customers", custPhone);
                setDoc(custRef, { name: custName, phone: custPhone, addedAt: new Date().toISOString() }, { merge: true })
                    .catch(e => console.error('Firebase Cust Sync failed', e));
            }
        }
    }

    let subTotal = 0, totalTax = 0, totalItems = 0;
    window.cart.forEach(i => { 
        subTotal += i.price * i.qty; 
        totalTax += i.taxAmt * i.qty;
        totalItems += i.qty;
    });
    
    const finalTotal = Math.max(0, subTotal - disc);
    const billId = "INV-" + Math.floor(1000 + Math.random() * 9000);
    const dateStr = new Date().toLocaleString('en-IN');

    // 2. Deduct and Sync Product Stock to Firebase
    let allProducts = getProducts();
    window.cart.forEach(cartItem => {
        let pIndex = allProducts.findIndex(p => p.id === cartItem.id);
        if(pIndex > -1) {
            const deductionValue = cartItem.qty / (cartItem.packWeightKg || 1);
            allProducts[pIndex].stock = Math.max(0, allProducts[pIndex].stock - deductionValue);
            
            if(user.merchantId) {
                const prodRef = doc(db, "shops", user.merchantId, "products", cartItem.id);
                updateDoc(prodRef, { stock: allProducts[pIndex].stock }).catch(e => {});
            }
        }
    });
    localStorage.setItem('bharatpos_products', JSON.stringify(allProducts));

    // 3. Save and Sync Bill to Firebase
    const billData = {
        id: billId, date: new Date().toISOString(), customerName: custName, phone: custPhone,
        items: window.cart, totalItems, amount: finalTotal, subTotal, tax: totalTax,
        discount: disc, paymentMode: payMode, isPaid: payMode !== "Udhaar"
    };
    
    const localSales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
    localSales.push(billData);
    localStorage.setItem('bharatpos_sales', JSON.stringify(localSales));
    
    if (user.merchantId) {
        const billRef = doc(db, "shops", user.merchantId, "sales", billId);
        setDoc(billRef, billData).catch(e => console.error('Firebase Bill Sync failed', e));
    }
    
    generateInvoiceHTML(billData, dateStr);
    
    window.cart = []; renderCart();
    document.getElementById('custName').value = "";
    document.getElementById('custPhone').value = "";
    document.getElementById('discount').value = "";
    renderBillGrid(); 
}

function generateInvoiceHTML(bill, dateStr) {
    const shopName = localStorage.getItem('shopName') || "Bharat POS Shop";
    const shopAddr = localStorage.getItem('shopAddress') || "";
    const gstin = localStorage.getItem('bharatpos_gstin');
    
    let gstHeader = isGstMode ? '<th style="text-align:right">GST</th>' : '';
    
    let itemsHTML = bill.items.map(i => {
        let taxVal = (i.taxAmt * i.qty).toFixed(2);
        let gstCell = isGstMode ? `<td style="text-align:right">${taxVal}<br><small>(${i.gstRate}%)</small></td>` : '';
        let qtyPrint = i.isLoose ? `${i.qty.toFixed(3)}kg` : i.qty;
        
        return `
        <tr>
            <td>
                ${i.printName} 
                ${isGstMode && i.hsn ? '<br><small>HSN:'+i.hsn+'</small>' : ''}
            </td>
            <td style="text-align:center">${qtyPrint}</td>
            <td style="text-align:right">${i.price.toFixed(2)}${i.unitLabel}</td>
            ${gstCell}
            <td style="text-align:right">${(i.price*i.qty).toFixed(2)}</td>
        </tr>`;
    }).join('');

    let taxRowHTML = "";
    if (isGstMode && bill.tax > 0) {
        const halfTax = bill.tax / 2;
        taxRowHTML = `
            <div class="inv-row"><span>Taxable Value:</span><span>${(bill.amount - bill.tax).toFixed(2)}</span></div>
            <div class="inv-row"><span>CGST:</span><span>${halfTax.toFixed(2)}</span></div>
            <div class="inv-row"><span>SGST:</span><span>${halfTax.toFixed(2)}</span></div>
        `;
    }

    const html = `
        <div class="inv-header">
            <div class="inv-shop">${shopName}</div>
            <div>${shopAddr}</div>
            ${isGstMode && gstin ? `<div>GSTIN: ${gstin}</div>` : ''}
            <div>Bill #${bill.id} | ${dateStr}</div>
        </div>
        <div class="inv-meta">
            <span>Customer: ${bill.customerName}</span>
            <span>${bill.phone}</span>
        </div>
        <table class="inv-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th style="text-align:center">Qty</th>
                    <th style="text-align:right">Rate</th>
                    ${gstHeader}
                    <th style="text-align:right">Amt</th>
                </tr>
            </thead>
            <tbody>${itemsHTML}</tbody>
        </table>
        <div class="inv-totals">
            <div class="inv-row"><span>Subtotal:</span><span>${bill.subTotal.toFixed(2)}</span></div>
            ${bill.discount > 0 ? `<div class="inv-row"><span>Discount:</span><span>-${bill.discount}</span></div>` : ''}
            ${taxRowHTML}
            <div class="inv-row inv-bold" style="margin-top:5px; border-top:1px solid #000; padding-top:5px;">
                <span>GRAND TOTAL:</span><span>₹${bill.amount.toFixed(2)}</span>
            </div>
        </div>
        <div style="text-align:center; margin-top:10px; font-size:10px;">Thank you! Visit Again.</div>
        <div class="inv-btn-grp">
            <button class="inv-btn inv-close" onclick="document.getElementById('invoiceModal').style.display='none'">Close</button>
            <button class="inv-btn" onclick="window.print()">🖨 Print</button>
        </div>
    `;
    
    document.getElementById('invoicePaper').innerHTML = html;
    document.getElementById('invoiceModal').style.display = "flex";
}

window.toggleCart = function() { document.getElementById('cartPanel').classList.toggle('open'); }
function playBeep() { const a=new(window.AudioContext||window.webkitAudioContext);const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=800;g.gain.value=0.1;o.start();setTimeout(()=>o.stop(),100); }

function setupMobileCartDrag() {
    const cartHeader = document.getElementById('cartHeaderHandle');
    const cartPanel = document.getElementById('cartPanel');
    let startY = 0;
    cartHeader.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, {passive: true});
    cartHeader.addEventListener('touchmove', (e) => {
        if (!startY) return;
        const currentY = e.touches[0].clientY;
        if (currentY - startY > 40) { cartPanel.classList.remove('open'); startY = 0; }
    }, {passive: true});
}

let isScanning = false;
window.openBarcodeScanner = function() {
    document.getElementById('scannerModal').style.display = 'flex';
    if(isScanning) return;
    isScanning = true;
    Quagga.init({
        inputStream: { type: "LiveStream", target: document.querySelector('#cameraPreview'), constraints: { facingMode: "environment" } },
        decoder: { readers: ["ean_reader", "upc_reader", "code_128_reader"] }
    }, function(err) { if (err) { console.log(err); return; } Quagga.start(); });

    Quagga.onDetected(function(result) {
        const code = result.codeResult.code;
        const products = getProducts();
        const p = products.find(x => x.barcode === code && Number(x.stock) > 0);
        if(p) {
            closeBarcodeScanner();
            if (p.isLoose) { openLooseWeightModal(p); } 
            else { window.addToBill(p.id, 1); }
        }
    });
}

window.closeBarcodeScanner = function() { 
    document.getElementById('scannerModal').style.display = 'none'; 
    if(isScanning) { Quagga.stop(); isScanning = false; }
}
