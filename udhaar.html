<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Udhaar - BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="bharatpos.js"></script>

  <style>
    /* --- THEME MATCHING DASHBOARD --- */
    :root {
      --bg-body: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --glass: blur(12px);
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --primary: #3b82f6;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding-bottom: 80px;
    }

    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.1), transparent 40%),
                  radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.05), transparent 40%);
      z-index: -1; pointer-events: none;
    }

    /* HEADER */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 24px; background: rgba(15, 23, 42, 0.95); backdrop-filter: var(--glass);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
    .global-logo { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }
    .nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; margin-left: 20px; transition: 0.2s; }
    .nav a:hover { color: var(--accent); }

    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

    .page-title {
      font-size: 20px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    
    /* TOTAL CARD */
    .total-dues-card {
      background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(15,23,42,0.8));
      border: 1px solid rgba(239,68,68,0.4); border-radius: 16px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
    }
    .dues-label { font-size: 12px; color: #fca5a5; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .dues-amount { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: #fff; margin-top: 5px; }

    /* GROUP LIST */
    .group-card {
      background: var(--bg-card); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px;
      margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
    }
    .group-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
    .group-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }

    .cust-name { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .cust-phone { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .debt-amt { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--danger); }
    .debt-count { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; margin-left: 10px; color: var(--text-muted); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000;
      align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-box {
      background: #1e293b; width: 95%; max-width: 450px;
      border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; display: flex; flex-direction: column;
    }
    .modal-header {
      padding: 15px 20px; background: rgba(255,255,255,0.05); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-body { padding: 0; overflow-y: auto; }

    /* INVOICE LIST */
    .inv-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; border-bottom: 1px solid var(--border);
    }
    .inv-info h4 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
    .inv-info p { margin: 0; font-size: 11px; color: var(--text-muted); }
    .inv-action { text-align: right; }
    .inv-price { font-weight: 700; color: var(--danger); font-size: 14px; margin-bottom: 5px; }
    .btn-view {
      background: rgba(59, 130, 246, 0.2); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
    }

    /* RECEIPT MODAL */
    .receipt-content { padding: 20px; background: #fff; color: #000; font-family: 'Courier New', monospace; }
    .rec-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top:10px; }
    .rec-table th { text-align: left; border-bottom: 1px dashed #000; padding-bottom: 5px; }
    .rec-table td { padding: 4px 0; }
    .rec-total { border-top: 1px dashed #000; margin-top: 10px; padding-top: 10px; text-align: right; font-weight: 800; font-size: 1.2em; }
    
    .btn-settle {
      width: 100%; padding: 15px; background: var(--success); color: #000;
      border: none; font-size: 14px; font-weight: 800; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .empty-state { text-align: center; padding: 50px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand"><img src="logo.png" class="global-logo"> BharatPOS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="sales.html">Sales</a>
    </div>
  </div>

  <div class="container">
    <div class="page-title">
      <i class="fa-solid fa-book-journal-whills" style="color:var(--accent)"></i> Udhaar Khata
    </div>

    <div class="total-dues-card">
      <div>
        <div class="dues-label">Total Pending Collection</div>
        <div class="dues-amount" id="totalPending">₹0</div>
      </div>
      <i class="fa-solid fa-hand-holding-dollar" style="font-size:30px; color:var(--danger); opacity:0.8;"></i>
    </div>

    <div id="groupList">
      <div class="empty-state">Loading records...</div>
    </div>
  </div>

  <div id="customerModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h3 style="margin:0; font-size:16px; color:#fff;" id="custModalName">Customer</h3>
          <small style="color:var(--text-muted);" id="custModalPhone">Phone</small>
        </div>
        <button onclick="closeModal('customerModal')" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" id="invoiceListBody"></div>
    </div>
  </div>

  <div id="receiptModal" class="modal-overlay" style="z-index: 1100;">
    <div class="modal-box" style="max-width:350px; background:white;">
      <div class="modal-header" style="background:#f8f9fa; border-bottom:1px solid #ddd; color:#333;">
        <strong>Invoice Details</strong>
        <button onclick="closeModal('receiptModal')" style="background:none;border:none;font-size:20px;cursor:pointer;color:#333;">&times;</button>
      </div>
      <div class="receipt-content">
        <div style="text-align:center; margin-bottom:10px;">
          <h3 style="margin:0;">BHARAT POS</h3>
          <div style="font-size:10px;" id="rec-id"></div>
          <div style="font-size:10px;" id="rec-date"></div>
        </div>
        <div style="font-size:12px; margin-bottom:10px; border-bottom:1px dashed #000; padding-bottom:5px;">
          Customer: <span id="rec-name"></span><br>
          Phone: <span id="rec-phone"></span>
        </div>
        <table class="rec-table">
          <thead><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Amt</th></tr></thead>
          <tbody id="rec-items"></tbody>
        </table>
        <div class="rec-total">Total: <span id="rec-total"></span></div>
      </div>
      <button id="btnSettle" class="btn-settle">✅ Mark Paid (Cash)</button>
    </div>
  </div>

<script>
    // --- UTILS ---
    function getSales() { return JSON.parse(localStorage.getItem('bharatpos_sales') || '[]'); }
    function formatCurrency(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    document.addEventListener("DOMContentLoaded", () => {
        renderGroups();
    });

    // --- 1. RENDER MAIN LIST ---
    function renderGroups() {
        const allSales = getSales();
        const container = document.getElementById('groupList');
        
        // 🟢 ID CORRECTION: Ensure we look for 'amount' and 'isPaid'
        const pending = allSales.filter(s => (s.paymentMode === 'Udhaar' && s.isPaid !== true));

        // Update Total Header
        const totalPending = pending.reduce((acc, s) => acc + Number(s.amount || s.total || 0), 0);
        document.getElementById('totalPending').innerText = formatCurrency(totalPending);

        if (pending.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-face-smile"></i><br>No pending dues!</div>`;
            return;
        }

        // Group by Phone
        const groups = {};
        pending.forEach(inv => {
            const ph = inv.phone || "Unknown";
            const name = inv.customerName || inv.customer || "Walk-in";
            const amt = Number(inv.amount || inv.total || 0);

            if(!groups[ph]) groups[ph] = { phone: ph, name: name, total: 0, count: 0 };
            
            // Name Normalization
            if(groups[ph].name === "Walk-in" && name !== "Walk-in") groups[ph].name = name;

            groups[ph].total += amt;
            groups[ph].count++;
        });

        const sortedGroups = Object.values(groups).sort((a,b) => b.total - a.total);

        container.innerHTML = sortedGroups.map(g => `
            <div class="group-card" onclick="openCustomerModal('${g.phone}')">
                <div>
                    <div class="cust-name">${g.name}</div>
                    <div class="cust-phone"><i class="fa-solid fa-phone"></i> ${g.phone}</div>
                </div>
                <div style="text-align:right;">
                    <div class="debt-amt">${formatCurrency(g.total)}</div>
                    <div class="debt-count">${g.count} Bills</div>
                </div>
            </div>
        `).join('');
    }

    // --- 2. OPEN CUSTOMER DETAILS ---
    window.openCustomerModal = function(phone) {
        const allSales = getSales();
        const invoices = allSales.filter(s => 
            (s.phone === phone || (phone === "Unknown" && !s.phone)) && 
            s.paymentMode === 'Udhaar' && s.isPaid !== true
        );
        
        invoices.sort((a,b) => new Date(b.date) - new Date(a.date));

        const first = invoices[0];
        document.getElementById('custModalName').textContent = first.customerName || first.customer || "Customer";
        document.getElementById('custModalPhone').textContent = phone;

        const listBody = document.getElementById('invoiceListBody');
        listBody.innerHTML = invoices.map(inv => {
            const dataStr = encodeURIComponent(JSON.stringify(inv));
            const amt = inv.amount || inv.total || 0;
            const invId = inv.id || inv.invoiceNo || '???';

            return `
            <div class="inv-item">
                <div class="inv-info">
                    <h4>#${invId}</h4>
                    <p>${new Date(inv.date).toLocaleDateString()}</p>
                </div>
                <div class="inv-action">
                    <div class="inv-price">${formatCurrency(amt)}</div>
                    <button class="btn-view" onclick="openReceipt('${dataStr}')">Settle</button>
                </div>
            </div>`;
        }).join('');

        document.getElementById('customerModal').style.display = 'flex';
    };

    // --- 3. OPEN SETTLEMENT RECEIPT ---
    window.openReceipt = function(dataStr) {
        const inv = JSON.parse(decodeURIComponent(dataStr));
        const amt = inv.amount || inv.total || 0;
        const invId = inv.id || inv.invoiceNo;

        document.getElementById('rec-id').innerText = "INV: " + invId;
        document.getElementById('rec-date').innerText = new Date(inv.date).toLocaleString();
        document.getElementById('rec-name').innerText = inv.customerName || inv.customer;
        document.getElementById('rec-phone').innerText = inv.phone;
        document.getElementById('rec-total').innerText = formatCurrency(amt);

        const tbody = document.getElementById('rec-items');
        tbody.innerHTML = (inv.items || []).map(i => `
            <tr><td>${i.name}</td><td style="text-align:right">${i.qty}</td><td style="text-align:right">${Math.round(i.price * i.qty)}</td></tr>
        `).join('');

        const payBtn = document.getElementById('btnSettle');
        payBtn.onclick = () => settleDebt(invId);

        document.getElementById('receiptModal').style.display = 'flex';
    };

    // --- 4. SETTLE DEBT (Update Master List) ---
    function settleDebt(id) {
        if(!confirm("Mark as PAID?")) return;

        const allSales = getSales();
        // 🟢 CONNECTION CORRECTION: Update master list
        const index = allSales.findIndex(s => (s.id == id || s.invoiceNo == id));

        if(index > -1) {
            allSales[index].isPaid = true;
            allSales[index].paymentMode = "Cash (Settled)"; 
            allSales[index].settledDate = new Date().toISOString();

            localStorage.setItem('bharatpos_sales', JSON.stringify(allSales));

            alert("✅ Payment Recorded!");
            closeModal('receiptModal');
            closeModal('customerModal');
            renderGroups();
        } else {
            alert("Error: Invoice not found.");
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
