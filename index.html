<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatPOS • AI Retail Revolution</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Deep Space Theme */
            --bg-dark: #02060c; 
            --bg-panel: #0d1626;
            --primary: #FFD700; /* Gold */
            --primary-glow: rgba(255, 215, 0, 0.4);
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --glass: rgba(13, 22, 38, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- BACKGROUND GLOWS --- */
        .glow-spot {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(11,94,215,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 0; right: -100px; background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, rgba(0,0,0,0) 70%); }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: flex-start; /* Aligns to left */
            align-items: center;
            padding: 20px 5%;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px; /* Space between logo and text */
            cursor: pointer;
        }

        .logo-img {
            height: 45px; /* Perfect size for header */
            width: auto;
            /* Adds a subtle gold glow to the png */
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.2)); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hover Effect: Logo tilts slightly */
        .logo-container:hover .logo-img {
            transform: rotate(-10deg) scale(1.1);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 100px 5% 50px 5%;
            gap: 40px;
        }

        .hero-text {
            flex: 1;
            max-width: 600px;
            z-index: 2;
        }
