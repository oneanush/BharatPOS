<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>AI Strategist - Bharat POS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  
<script type="module" src="bharatpos.js"></script>
 <link rel="stylesheet" href="bharatpos.css">
  <style>
    /* ═══════════════════════════════════════════════════════════
       AI PAGE SPECIFIC ANIMATIONS & BLOBS
    ═══════════════════════════════════════════════════════════ */
    .bg-blob {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    .bg-blob-a {
      width: 520px; height: 520px;
      background: rgba(135,180,255,0.28);
      border-radius: 45% 55% 50% 50% / 50% 50% 50% 50%;
      top: -140px; left: -130px;
      animation: blobMorph 9s infinite ease-in-out;
    }
    .bg-blob-b {
      width: 600px; height: 600px;
      background: rgba(135,180,255,0.18);
      border-radius: 55% 45% 50% 50% / 50% 50% 50% 50%;
      top: -180px; right: -150px;
      animation: blobMorph 12s infinite reverse ease-in-out;
    }
    .bg-blob-c {
      width: 400px; height: 400px;
      background: rgba(165,180,252,0.20);
      border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%;
      bottom: -100px; right: 60px;
      animation: blobMorph 10s infinite ease-in-out;
    }
    .bg-blob-d {
      width: 280px; height: 280px;
      background: rgba(147,197,253,0.22);
      border-radius: 60% 40% 55% 45%;
      bottom: 80px; left: -60px;
      animation: blobMorph 14s infinite reverse ease-in-out;
    }

    @keyframes blobMorph {
      0%,100% { border-radius:45% 55% 50% 50% / 50% 50% 50% 50%; transform:translate(0,0); }
      25%      { border-radius:55% 45% 48% 52% / 52% 48% 52% 48%; transform:translate(24px,-24px); }
      50%      { border-radius:48% 52% 55% 45% / 45% 55% 45% 55%; transform:translate(-16px,18px); }
      75%      { border-radius:52% 48% 45% 55% / 55% 45% 55% 45%; transform:translate(16px,24px); }
    }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(28px) scale(.97)} to{opacity:1;transform:none} }
    @keyframes wave    { 0%,100%{height:8px;opacity:.45} 50%{height:30px;opacity:1} }
    @keyframes floatY  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* ═══════════════════════════════════════════════════════════
       PAGE WRAPPER & HERO
    ═══════════════════════════════════════════════════════════ */
    .page-wrapper {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px 80px;
      min-height: calc(100vh - 65px);
    }

    .hero-text {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeIn 0.65s ease-out both;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.80);
      border: 1.5px solid var(--blue-200);
      color: var(--blue-600);
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 5px 16px; border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    .hero-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue-600);
      animation: floatY 2s ease-in-out infinite;
    }
    .hero-text h1 {
      font-family: var(--font-head);
      font-size: 40px; font-weight: 800;
      color: var(--text-main);
      letter-spacing: -.7px; line-height: 1.12;
      margin-bottom: 14px;
    }
    .hero-text h1 .grad {
      background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-text p {
      color: var(--text-muted);
      font-size: 15.5px; line-height: 1.65;
      max-width: 480px; margin: 0 auto;
    }

    /* ═══════════════════════════════════════════════════════════
       AI CHAT CONTAINER
    ═══════════════════════════════════════════════════════════ */
    .ai-container {
      width: 100%; max-width: 800px;
      background: var(--white);
      border: 2px solid var(--blue-200);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: fadeUp .65s cubic-bezier(.22,1,.36,1) both;
    }

    /* Blue header stripe */
    .card-header-stripe {
      background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
      padding: 28px 36px 26px;
      position: relative; overflow: hidden;
    }
    .card-header-stripe::before,
    .card-header-stripe::after {
      content: '';
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.14);
      pointer-events: none;
    }
    .card-header-stripe::before { width:240px; height:240px; top:-90px; right:-60px; }
    .card-header-stripe::after  { width:140px; height:140px; top:-30px; right:80px; }
    .stripe-inner {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .stripe-label {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,0.60); margin-bottom: 5px;
    }
    .stripe-title {
      font-family: var(--font-head);
      font-size: 22px; font-weight: 800;
      color: #fff; letter-spacing: -.3px;
    }
    .stripe-icon {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }

    .card-body { padding: 32px 36px 36px; }

    /* ═══════════════════════════════════════════════════════════
       INPUT INNER CARD
    ═══════════════════════════════════════════════════════════ */
    .input-card {
      background: #f9f9f9;
      border: 1.5px solid var(--blue-100);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      margin-bottom: 22px;
      transition: border-color var(--trans), box-shadow var(--trans);
    }
    .input-card:focus-within {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px rgba(25,118,210,0.12), 0 4px 16px rgba(25,118,210,0.08);
      background: var(--white);
    }

    .prompt-label-row {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 18px 0;
    }
    .prompt-label-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #1976D2, #1565C0);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: white;
    }
    .prompt-label-text {
      font-size: 11.5px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-muted);
    }

    .ai-prompt {
      width: 100%; background: transparent; border: none;
      color: var(--text-main); font-size: 15px;
      font-family: var(--font-body);
      padding: 12px 18px 18px;
      resize: none; min-height: 80px; line-height: 1.65;
      outline: none;
    }
    .ai-prompt::placeholder { color: #b0bec8; }

    .action-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px 14px;
      background: rgba(255,255,255,0.70);
      border-top: 1.5px solid var(--blue-100);
      gap: 12px;
    }

    /* ═══════════════════════════════════════════════════════════
       CHIPS & BUTTONS
    ═══════════════════════════════════════════════════════════ */
    .chip-scroll {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none; flex: 1;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip {
      background: #fff; color: var(--text-muted);
      border: 1.5px solid var(--blue-200);
      padding: 7px 15px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      font-family: var(--font-body);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: background var(--trans), color var(--trans),
                  border-color var(--trans), transform var(--trans),
                  box-shadow var(--trans);
    }
    .chip:hover {
      background: rgba(25,118,210,0.09); color: var(--blue-600);
      border-color: var(--blue-600);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(25,118,210,0.14);
    }
    .chip:active { transform: translateY(0) scale(.97); }

    .ai-btn {
      background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
      color: #fff; border: none;
      padding: 11px 24px; border-radius: var(--radius-input);
      font-weight: 700; font-size: 14px;
      font-family: var(--font-body);
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(25,118,210,0.32);
      transition: transform var(--trans), box-shadow var(--trans);
    }
    .ai-btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(25,118,210,0.44); }
    .ai-btn:active { transform: scale(.97); }
    .ai-btn:disabled { opacity:.52; cursor:not-allowed; transform:none; }

    /* ═══════════════════════════════════════════════════════════
       AI OUTPUT AREA
    ═══════════════════════════════════════════════════════════ */
    .output-divider {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 20px;
    }
    .output-divider hr { flex:1; border:none; border-top:1.5px solid var(--blue-100); }
    .output-divider span {
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-muted); white-space: nowrap;
    }

    .ai-output-area { min-height: 60px; }

    /* Success card */
    .ai-suggestion-card {
      background: #fff;
      border: 1.5px solid var(--blue-100);
      border-left: 4px solid var(--blue-600);
      border-radius: 16px;
      padding: 30px 28px;
      box-shadow: 0 4px 16px rgba(25,118,210,0.08);
      position: relative; overflow: hidden;
      animation: slideUp .5s cubic-bezier(.16,1,.3,1) both;
    }
    .ai-badge {
      position: absolute; top: 0; right: 0;
      background: linear-gradient(135deg, #EAF2FF, #C7DDFF);
      color: var(--blue-600);
      font-size: 8.5px; font-weight: 800; letter-spacing: 1.3px;
      padding: 6px 14px; border-bottom-left-radius: 12px;
      border-left: 1.5px solid var(--blue-100);
      border-bottom: 1.5px solid var(--blue-100);
    }
    .ai-text { color: var(--text-main); line-height: 1.78; font-size: 14.5px; }
    .ai-text h3 { font-family:var(--font-head); font-size:17px; color:var(--text-main); margin:0 0 14px; font-weight:700; }
    .ai-text strong { color: var(--blue-600); font-weight: 700; }
    .ai-text li { margin-bottom:10px; list-style:none; position:relative; padding-left:20px; color:#334155; }
    .ai-text li::before { content:"›"; position:absolute; left:0; color:var(--blue-600); font-weight:700; font-size:18px; line-height:1.3; }

    /* Loading state */
    .thinking-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 52px 20px;
      background: #fff; border: 1.5px solid var(--blue-100);
      border-radius: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      animation: fadeIn .3s ease both;
    }
    .brain-waves { display:flex; gap:5px; margin-bottom:18px; height:32px; align-items:center; }
    .wave { width:4px; background:linear-gradient(180deg,#1976D2,#1565C0); border-radius:3px; animation:wave 1s ease-in-out infinite; }
    .wave:nth-child(2) { animation-delay:.10s; background:linear-gradient(180deg,#2196F3,#1976D2); }
    .wave:nth-child(3) { animation-delay:.20s; }
    .wave:nth-child(4) { animation-delay:.30s; background:linear-gradient(180deg,#2196F3,#1976D2); }
    .wave:nth-child(5) { animation-delay:.40s; }
    .thinking-label { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-600); opacity:.75; }

    /* Error card */
    .ai-error-card {
      background: #fff8f8; border: 1.5px solid #fecaca;
      border-left: 4px solid #ef4444;
      border-radius: 16px; padding: 28px;
      box-shadow: 0 8px 28px rgba(239,68,68,0.08);
      animation: slideUp .4s cubic-bezier(.16,1,.3,1) both;
    }
    .ai-error-card h3 { font-family:var(--font-head); font-size:16px; color:#dc2626; margin:0 0 8px; font-weight:700; }
    .ai-error-card p  { font-size:14px; color:#7f1d1d; line-height:1.6; margin:0; }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 640px) {
      .page-wrapper       { padding: 28px 14px 60px; }
      .hero-text h1       { font-size: 28px; }
      .hero-text p        { font-size: 14px; }
      .card-header-stripe { padding: 22px 22px 20px; }
      .stripe-title       { font-size: 18px; }
      .card-body          { padding: 22px 18px 28px; }
      .action-bar         { flex-direction: column; align-items: stretch; gap: 10px; }
      .ai-btn             { justify-content: center; }
      .ai-suggestion-card,.ai-error-card { padding: 20px 18px; }
      .bg-blob-b,.bg-blob-c { opacity:.5; }
    }
  </style>
</head>
<body>

  <div class="bg-blob bg-blob-a"></div>
  <div class="bg-blob bg-blob-b"></div>
  <div class="bg-blob bg-blob-c"></div>
  <div class="bg-blob bg-blob-d"></div>

  <nav class="navbar">
    <div class="brand">
      <img src="logo.png" class="global-logo">
      Bharat POS
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="billing.html">Billing</a>
      <a href="settings.html">Settings</a>
    </div>
  </nav>

  <div class="page-wrapper">

    <div class="hero-text">
      <div class="hero-badge">
        <div class="dot"></div>
        Powered by AI
      </div>
      <h1>Your <span class="grad">AI Strategist</span></h1>
      <p>Ask anything about your business — sales, stock, pricing, or growth strategy.</p>
    </div>

    <div class="ai-container">

      <div class="card-header-stripe">
        <div class="stripe-inner">
          <div>
            <div class="stripe-label">BharatPOS Intelligence</div>
            <div class="stripe-title">Business Insights Engine</div>
          </div>
          <div class="stripe-icon">🧠</div>
        </div>
      </div>

      <div class="card-body">

        <div class="input-card">
          <div class="prompt-label-row">
            <div class="prompt-label-icon">
              <svg width="13" height="13" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <span class="prompt-label-text">Your Question</span>
          </div>

          <textarea id="aiPrompt" class="ai-prompt" rows="3"
            placeholder="Ask anything — e.g. 'How can I increase profits next week?'"></textarea>

          <div class="action-bar">
            <div class="chip-scroll">
              <div class="chip" onclick="setPrompt('Analyze my sales trends')">📊 Analyze Sales</div>
              <div class="chip" onclick="setPrompt('Suggest stock improvements')">📦 Inventory Audit</div>
              <div class="chip" onclick="setPrompt('Give me marketing ideas')">🚀 Marketing Ideas</div>
            </div>
            <button id="aiBtn" class="ai-btn" onclick="getAIAdvice()">
              <span>Generate</span>
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="output-divider">
          <hr><span>AI Response</span><hr>
        </div>

        <div id="aiOutput" class="ai-output-area"></div>

      </div></div></div><script>

  // --- 1. DATA GATHERING (Updated to support Singularity Variants) ---
  window.getStoredSnapshot = function() {
    try {
      const products = JSON.parse(localStorage.getItem('bharatpos_products') || '[]');
      const sales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
      
      let revenue = 0;
      sales.forEach(s => revenue += Number(s.total || s.amount || 0));

      const lowStockItems = products.filter(p => {
          let totalStock = 0;
          if (p.variants && Array.isArray(p.variants)) {
              p.variants.forEach(v => {
                  const bq = p.isLoose ? (Number(v.baseQty) || 1) : 1;
                  totalStock += (Number(v.stock) || 0) * bq;
              });
          } else {
              totalStock = Number(p.stock || 0);
          }
          const threshold = (p.reorderPoint !== undefined && p.reorderPoint !== '') ? Number(p.reorderPoint) : 5;
          return totalStock <= threshold;
      }).map(p => p.name || 'Unknown');

      // Ensure we always return a valid object even if data is empty
      return {
        generated_at: new Date().toISOString(),
        revenue: revenue || 0,
        total_bills: sales.length || 0,
        products_count: products.length || 0,
        low_stock: lowStockItems
      };
    } catch (e) {
      console.error("Snapshot error:", e);
      return { generated_at: new Date().toISOString(), error: "Data load failed" };
    }
  };

  // --- 2. UI LOGIC ---
  window.setPrompt = function(text) {
    const el = document.getElementById('aiPrompt');
    el.value = text;
    el.focus();
  };

  window.getAIAdvice = async function() {
    const aiOutput = document.getElementById('aiOutput');
    const aiBtn = document.getElementById('aiBtn');
    const promptBox = document.getElementById('aiPrompt');

    // 1. UI Loading State
    aiBtn.disabled = true;
    aiOutput.innerHTML = `
      <div class="thinking-state">
        <div class="brain-waves">
           <div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>
        </div>
        <div class="thinking-label">Waking up AI Brain... (Can take 60s)</div>
      </div>
    `;

    try {
        // 2. Build Data
        const prompt = promptBox ? promptBox.value.trim() : '';
        const snapshot = window.getStoredSnapshot();
        
        if (typeof window.buildUrl !== 'function') {
            throw new Error("Core library not loaded yet.");
        }

        const url = window.buildUrl('/ai-business-consult');

        // 3. The Fetch with long timeout logic
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                snapshot: snapshot, 
                user_prompt: prompt 
            })
        });

        if (!response.ok) throw new Error(`Server Sleep: ${response.status}`);

        const result = await response.json();
        const advice = result.advice || result.reply || result.message;

        if (advice) {
            let formattedText = String(advice).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            aiOutput.innerHTML = `
                <div class="ai-suggestion-card">
                    <div class="ai-badge">CORTEX ANALYTICS</div>
                    <div class="ai-text">${formattedText}</div>
                </div>`;
        } else {
            throw new Error("AI returned an empty response.");
        }

    } catch (err) {
        console.error("AI Error:", err);
        aiOutput.innerHTML = `
            <div class="ai-error-card">
                <h3>⚡ Connection Stalled</h3>
                <p>The AI server is likely waking up from sleep. Please wait 10 seconds and <strong>click Generate again.</strong></p>
                <small style="opacity:0.5">${err.message}</small>
            </div>`;
    } finally {
        aiBtn.disabled = false;
    }
  };
</script>
</body>
</html>
