<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>AI Strategist - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="bharatpos.js"></script>

  <style>
    /* ─────────────────────────────────────────────
       VARIABLES & RESET
    ───────────────────────────────────────────── */
    :root {
      --bg-body:      #EAF2FF;
      --bg-card:      #ffffff;
      --border:       #DBEAFE;
      --text-main:    #0F172A;
      --text-muted:   #64748B;
      --accent:       #1976D2;
      --accent-dark:  #1565C0;
      --accent-glow:  rgba(25, 118, 210, 0.12);
      --accent-soft:  rgba(25, 118, 210, 0.08);
      --shadow-sm:    0 2px 8px rgba(0,0,0,0.06);
      --shadow-md:    0 8px 28px rgba(25,118,210,0.10);
      --shadow-lg:    0 20px 60px rgba(25,118,210,0.13);
      --radius-card:  20px;
      --radius-input: 14px;
      --radius-btn:   10px;
      --font-head:    'Sora', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --ease:         cubic-bezier(.4,0,.2,1);
      --trans:        .22s var(--ease);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-body);
      background-image:
        radial-gradient(ellipse 700px 500px at 85% -5%,  rgba(147,197,253,.50), transparent),
        radial-gradient(ellipse 500px 400px at -5%  92%, rgba(165,180,252,.28), transparent);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* ─────────────────────────────────────────────
       NAVBAR
    ───────────────────────────────────────────── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(255,255,255,0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1.5px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(25,118,210,0.07);
    }

    .brand {
      font-family: var(--font-head);
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -.2px;
    }

    .global-logo {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      transition: background var(--trans), color var(--trans);
    }

    .nav-links a:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ─────────────────────────────────────────────
       MAIN CONTAINER
    ───────────────────────────────────────────── */
    .ai-container {
      max-width: 780px;
      margin: 48px auto;
      padding: 0 20px 100px;
    }

    /* ─────────────────────────────────────────────
       HERO SECTION
    ───────────────────────────────────────────── */
    .hero-text {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeIn 0.7s ease-out both;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      border: 1.5px solid var(--border);
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .hero-text h1 {
      font-family: var(--font-head);
      font-size: 38px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -.6px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .hero-text h1 span {
      background: linear-gradient(135deg, #1976D2, #1565C0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─────────────────────────────────────────────
       INPUT CARD
    ───────────────────────────────────────────── */
    .input-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 6px;
      box-shadow: var(--shadow-md);
      transition: border-color var(--trans), box-shadow var(--trans);
      animation: fadeIn 0.7s .1s ease-out both;
    }

    .input-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-md);
    }

    .ai-prompt {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      font-family: var(--font-body);
      padding: 16px 18px;
      resize: none;
      min-height: 70px;
      line-height: 1.6;
    }

    .ai-prompt::placeholder {
      color: #b0bec8;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px 12px;
      border-top: 1.5px solid #f1f5f9;
      gap: 12px;
    }

    /* ─────────────────────────────────────────────
       CHIPS
    ───────────────────────────────────────────── */
    .chip-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      flex: 1;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }

    .chip {
      background: #f1f5ff;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--trans), color var(--trans),
                  border-color var(--trans), transform var(--trans),
                  box-shadow var(--trans);
      font-family: var(--font-body);
    }

    .chip:hover {
      background: rgba(25,118,210,0.10);
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(25,118,210,0.12);
    }

    /* ─────────────────────────────────────────────
       GENERATE BUTTON
    ───────────────────────────────────────────── */
    .ai-btn {
      background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 14px;
      font-family: var(--font-body);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: transform var(--trans), box-shadow var(--trans), opacity var(--trans);
      box-shadow: 0 4px 16px rgba(25,118,210,0.30);
    }

    .ai-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(25,118,210,0.42);
    }

    .ai-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(25,118,210,0.25);
    }

    .ai-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* ─────────────────────────────────────────────
       OUTPUT AREA
    ───────────────────────────────────────────── */
    .ai-output-area {
      margin-top: 28px;
      min-height: 80px;
    }

    /* ── Success Card ── */
    .ai-suggestion-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-card);
      padding: 32px 30px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Subtle top-right watermark badge */
    .ai-badge {
      position: absolute;
      top: 0; right: 0;
      background: linear-gradient(135deg, #EAF2FF, #C7DDFF);
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      padding: 6px 14px;
      border-bottom-left-radius: 14px;
      letter-spacing: 1.2px;
      border-left: 1.5px solid var(--border);
      border-bottom: 1.5px solid var(--border);
    }

    /* ── Output Typography ── */
    .ai-text {
      color: var(--text-main);
      line-height: 1.75;
      font-size: 14.5px;
    }

    .ai-text h3 {
      font-family: var(--font-head);
      font-size: 17px;
      color: var(--text-main);
      margin-bottom: 14px;
      margin-top: 0;
    }

    .ai-text strong {
      color: var(--accent);
      font-weight: 700;
    }

    .ai-text br + br { display: block; margin: 4px 0; }

    .ai-text li {
      margin-bottom: 10px;
      list-style: none;
      position: relative;
      padding-left: 20px;
      color: #334155;
    }

    .ai-text li::before {
      content: "›";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 700;
      font-size: 18px;
      line-height: 1.3;
    }

    /* ── Loading State ── */
    .thinking-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      animation: fadeIn .3s ease both;
    }

    .brain-waves {
      display: flex;
      gap: 5px;
      margin-bottom: 18px;
      height: 32px;
      align-items: center;
    }

    .wave {
      width: 4px;
      background: linear-gradient(180deg, #1976D2, #1565C0);
      border-radius: 3px;
      animation: wave 1s ease-in-out infinite;
    }
    .wave:nth-child(2) { animation-delay: .10s; background: linear-gradient(180deg, #2196F3, #1976D2); }
    .wave:nth-child(3) { animation-delay: .20s; }
    .wave:nth-child(4) { animation-delay: .30s; background: linear-gradient(180deg, #2196F3, #1976D2); }
    .wave:nth-child(5) { animation-delay: .40s; }

    .thinking-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: .8;
    }

    /* ── Error Card ── */
    .ai-error-card {
      background: #fff8f8;
      border: 1.5px solid #fecaca;
      border-left: 4px solid #ef4444;
      border-radius: var(--radius-card);
      padding: 28px 30px;
      box-shadow: 0 8px 28px rgba(239,68,68,0.08);
      animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .ai-error-card h3 {
      font-family: var(--font-head);
      font-size: 16px;
      color: #dc2626;
      margin-bottom: 8px;
      margin-top: 0;
    }

    .ai-error-card p {
      font-size: 14px;
      color: #7f1d1d;
      line-height: 1.6;
    }

    /* ─────────────────────────────────────────────
       KEYFRAMES
    ───────────────────────────────────────────── */
    @keyframes wave {
      0%, 100% { height: 8px;  opacity: 0.45; }
      50%       { height: 30px; opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────── */
    @media (max-width: 600px) {
      .ai-container   { margin: 28px auto; }
      .hero-text h1   { font-size: 28px; }
      .action-bar     { flex-direction: column; align-items: stretch; gap: 12px; }
      .ai-btn         { justify-content: center; }
      .navbar         { padding: 12px 18px; }
      .nav-links a    { padding: 6px 10px; font-size: 12px; }
      .ai-suggestion-card, .ai-error-card { padding: 22px 18px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="logo.png" class="global-logo">
    Bharat POS
  </div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">Billing</a>
    <a href="settings.html">Settings</a>
  </div>
</nav>

<div class="ai-container">

  <div class="hero-text">
    <div class="hero-badge">
      ✦ Powered by AI
    </div>
    <h1>Your <span>AI Strategist</span></h1>
    <p>Analyze sales, optimize stock, and grow your business with smart insights.</p>
  </div>

  <div class="input-card">
    <textarea id="aiPrompt" class="ai-prompt" rows="2" placeholder="Ask anything — e.g. 'How can I increase profits next week?'"></textarea>

    <div class="action-bar">
      <div class="chip-scroll">
        <div class="chip" onclick="setPrompt('Analyze my sales trends')">📊 Analyze Sales</div>
        <div class="chip" onclick="setPrompt('Suggest stock improvements')">📦 Inventory Audit</div>
        <div class="chip" onclick="setPrompt('Give me marketing ideas')">🚀 Marketing Ideas</div>
      </div>
      <button id="aiBtn" class="ai-btn" onclick="getAIAdvice()">
        <span>Generate</span>
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </button>
    </div>
  </div>

  <div id="aiOutput" class="ai-output-area"></div>

</div>

<script>
  // --- 1. DATA GATHERING (Preserved) ---
  function getStoredSnapshot() {
    try {
      const snap = localStorage.getItem('bharatpos_ai_snapshot');
      if (snap) return JSON.parse(snap);
    } catch(e) { }
    
    // Fallback: Generate fresh snapshot
    try {
      const products = JSON.parse(localStorage.getItem('bharatpos_products') || '[]');
      const sales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
      let revenue = 0;
      const productQty = {};
      sales.forEach(s=>{
        revenue += Number(s.total||0);
        (s.items||[]).forEach(i=>{ if (i && i.name) productQty[i.name] = (productQty[i.name]||0) + Number(i.qty||0); });
      });
      const lowStock = products.filter(p=>Number(p.stock||0) <= 5).map(p=>p.name);
      return {
        generated_at: new Date().toISOString(),
        revenue, total_bills: sales.length,
        low_stock: lowStock, products_count: products.length
      };
    } catch(e){ return { generated_at: new Date().toISOString() }; }
  }

  // --- 2. UI LOGIC ---
  function setPrompt(text) {
    const el = document.getElementById('aiPrompt');
    el.value = text;
    el.focus();
    // Optional: Auto-submit
    // getAIAdvice(); 
  }

  async function getAIAdvice() {
    const aiOutput = document.getElementById('aiOutput');
    const aiBtn = document.getElementById('aiBtn');
    
    // A. LOADING STATE (The "Brain" Animation)
    aiOutput.innerHTML = `
      <div class="thinking-state">
        <div class="brain-waves">
           <div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>
        </div>
        <div class="thinking-label">Processing retail data…</div>
      </div>
    `;
    aiBtn.disabled = true;

    // B. PREPARE DATA
    const promptBox = document.getElementById('aiPrompt');
    const prompt = promptBox ? promptBox.value.trim() : '';
    const snapshot = getStoredSnapshot();
    const payload = { snapshot, user_prompt: prompt };
    const url = buildUrl('/ai-business-consult');

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`Server connection failed`);

        const result = await res.json();
        const rawAdvice = result.advice || result.reply || result.message;

        if (result.success && rawAdvice) {
            // C. FORMATTING
            let formattedText = rawAdvice
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                .replace(/\n/g, '<br>'); // Newlines

            // D. SUCCESS CARD
            aiOutput.innerHTML = `
                <div class="ai-suggestion-card">
                    <div class="ai-badge">CORTEX ANALYTICS</div>
                    <div class="ai-text">
                        ${formattedText}
                    </div>
                </div>`;
        } else {
            throw new Error(result.message || 'No insights generated.');
        }

    } catch (err) {
        // E. ERROR CARD
        aiOutput.innerHTML = `
            <div class="ai-error-card">
                <h3>⚡ Connection Interrupted</h3>
                <p>${err.message}. Please check your internet and try again.</p>
            </div>`;
    } finally {
        aiBtn.disabled = false;
    }
  }
</script>
</body>
</html>
