<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Business Advice - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
<script src="bharatpos.js"></script>
  <style>
    .ai-container { max-width:900px; margin:20px auto; padding:20px }
    .ai-card { background:var(--card-bg,#fff); border-radius:8px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.1) }
    .ai-output { margin-top:15px; padding:15px; background:#f5f7fa; border-radius:6px; min-height:120px; white-space:pre-line }
    .ai-btn { margin-top:10px; padding:10px 18px; font-size:15px; background:#0d6efd; color:#fff; border:none; border-radius:6px; cursor:pointer }
    .ai-prompt { width:100%; padding:8px; border-radius:6px; margin-top:10px; resize:vertical }
    .ai-loading { opacity:0.7 }




/* AI Container Styles */
.ai-suggestion-card {
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 1px solid #333;
    border-left: 5px solid #00d2ff; /* Cyber Blue Accent */
    border-radius: 12px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1);
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
    line-height: 1.6;
    position: relative;
    overflow: hidden;
}

/* The Glowing "AI" Badge */
.ai-badge {
    position: absolute;
    top: 0;
    right: 0;
    background: #00d2ff;
    color: #000;
    font-size: 10px;
    font-weight: bold;
    padding: 4px 12px;
    border-bottom-left-radius: 12px;
}

/* Formatting for the text returned by AI */
.ai-text h3, .ai-text strong {
    color: #fff;
    font-weight: 700;
    font-size: 1.1em;
}

.ai-text ul {
    margin: 10px 0;
    padding-left: 20px;
}

.ai-text li {
    margin-bottom: 8px;
    list-style-type: none;
    position: relative;
}

.ai-text li::before {
    content: "⚡";
    position: absolute;
    left: -25px;
    color: #ffd700;
}





  </style>
</head>
<body>
  <div class="header">
    <div class="global-header"><img src="logo.png" class="global-logo" alt="logo"></div>
    <div class="brand">Bharat POS</div>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="billing.html">Billing</a>
      <a href="sales.html">Sales</a>
      <a href="report.html">Report</a>
      <a href="settings.html">Settings</a>
      <a href="ai.html">AI</a>
    </div>
  </div>

  <div class="ai-container">
    <div class="ai-card">
      <h3>🤖 AI Business Consultation</h3>
      <p>This AI automatically analyses your sales, products and stock data. You can also type a question below (optional).</p>

      <textarea id="aiPrompt" class="ai-prompt" rows="2" placeholder="Ask a question about your shop (optional)"></textarea>

      <button id="aiBtn" class="ai-btn" onclick="getAIAdvice()">Get AI Advice</button>

      <div id="aiOutput" class="ai-output">AI advice will appear here...</div>
    </div>
  </div>

<script>
  // Use your Cloudflare server as API base (no trailing slash)
 
  function getStoredSnapshot() {
    try {
      const snap = localStorage.getItem('bharatpos_ai_snapshot');
      if (snap) return JSON.parse(snap);
    } catch(e) { console.warn('Invalid snapshot in storage', e); }
    try {
      const products = JSON.parse(localStorage.getItem('bharatpos_products') || '[]');
      const sales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
      let revenue = 0;
      const productQty = {};
      sales.forEach(s=>{
        revenue += Number(s.total||0);
        (s.items||[]).forEach(i=>{
          if (i && i.name) productQty[i.name] = (productQty[i.name]||0) + Number(i.qty||0);
        });
      });
      const totalBills = sales.length;
      const avgBill = totalBills ? Math.round(revenue/totalBills) : 0;
      const lowStock = products.filter(p=>Number(p.stock||0) <= 5).map(p=>p.name);
      const highStock = products.filter(p=>Number(p.stock||0) > 50).map(p=>p.name);
      return {
        generated_at: new Date().toISOString(),
        revenue, total_bills: totalBills, average_bill: avgBill,
        low_stock: lowStock, high_stock: highStock, products_count: products.length, sales_count: sales.length
      };
    } catch(e){
      return { generated_at: new Date().toISOString() };
    }
  }
async function getAIAdvice() {
    const aiOutput = document.getElementById('aiOutput');
    const aiBtn = document.getElementById('aiBtn');
    
    // 1. Better Loading State
    aiOutput.classList.add('ai-loading');
    aiOutput.innerHTML = `
        <div style="text-align:center; padding:20px; color:#888;">
            <div style="font-size:24px; margin-bottom:10px; animation: pulse 1.5s infinite;">🧠</div>
            <div>Analyzing Sales Patterns & Thinking...</div>
        </div>`;
    aiBtn.disabled = true;

    // 2. Prepare Data (Keep your existing logic)
    const promptBox = document.getElementById('aiPrompt');
    const prompt = promptBox ? promptBox.value.trim() : '';
    
    // Ensure getStoredSnapshot exists, otherwise send empty object
    const snapshot = (typeof getStoredSnapshot === 'function') ? getStoredSnapshot() : {};
    const payload = { snapshot, user_prompt: prompt };

    const url = buildUrl('/ai-business-consult');

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const text = await res.text().catch(() => null);
            throw new Error(`Server error: ${res.status} ${text || ''}`);
        }

        const result = await res.json();
        const rawAdvice = result.advice || result.reply || result.message;

        if (result.success && rawAdvice) {
            // 3. THE UPGRADE: Format the text to look professional
            // Converts **bold** to <strong> and new lines to <br>
            let formattedText = rawAdvice
                .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fff;">$1</strong>')
                .replace(/\n/g, '<br>');

            // 4. Inject the Fancy Card HTML
            aiOutput.innerHTML = `
                <div class="ai-suggestion-card">
                    <div class="ai-badge">BHARAT AI STRATEGIST</div>
                    <div class="ai-text">
                        ${formattedText}
                    </div>
                </div>`;
            aiOutput.classList.remove('ai-loading');

        } else {
            throw new Error(result.message || 'AI returned no advice.');
        }

    } catch (err) {
        console.error('AI request failed:', err);
        aiOutput.classList.remove('ai-loading');
        // Show error in a red box
        aiOutput.innerHTML = `
            <div style="border:1px solid #ff4444; background:#330000; color:#ffcccc; padding:15px; border-radius:8px;">
                <strong>Connection Failed:</strong> <br> ${err.message}
            </div>`;
    } finally {
        aiBtn.disabled = false;
    }
}
</script>
</body>
</html>
