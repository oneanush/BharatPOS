<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchant Login • BharatPOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="module" src="bharatpos.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════
       VARIABLES — JS-referenced tokens must not be removed
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --accent:      #1976d2;
      --border:      rgba(147, 197, 253, 0.55);
      --text-muted:  #64748B;
      --bg-body:     #e8f0fe;

      --blue-50:  #EFF6FF;
      --blue-100: #DBEAFE;
      --blue-200: #BFDBFE;
      --blue-400: #60A5FA;
      --blue-500: #3B82F6;
      --blue-600: #1976d2;
      --blue-700: #1565c0;
      --blue-900: #0d3a78;

      --slate-400: #94A3B8;
      --slate-500: #64748B;
      --slate-700: #334155;
      --slate-900: #1a3a52;
      --white:     #FFFFFF;

      --text-main: #1a3a52;

      --shadow-card: 0 20px 60px rgba(0,0,0,0.10), 0 4px 16px rgba(25,118,210,0.10);
      --radius-card:  30px;
      --radius-input: 8px;

      --font-head: 'Sora',    sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --ease:      cubic-bezier(.4,0,.2,1);
      --trans:     .22s var(--ease);

      --primary-gradient: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
    }

    /* ═══════════════════════════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: linear-gradient(135deg, #e8f0fe 0%, #b8d8f8 50%, #a8d5f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
      color: var(--text-main);
    }

    /* ═══════════════════════════════════════════════════════════════
       ANIMATED BACKGROUND BLOBS
    ═══════════════════════════════════════════════════════════════ */
    .blob {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    .blob-tl {
      width: 420px; height: 420px;
      background: rgba(135,180,255,0.30);
      border-radius: 45% 55% 50% 50% / 50% 50% 50% 50%;
      top: -110px; left: -110px;
      animation: blobMorph 8s infinite ease-in-out;
    }
    .blob-tr {
      width: 520px; height: 520px;
      background: rgba(135,180,255,0.18);
      border-radius: 55% 45% 50% 50% / 50% 50% 50% 50%;
      top: -160px; right: -120px;
      animation: blobMorph 10s infinite reverse ease-in-out;
    }
    .blob-br {
      width: 360px; height: 360px;
      background: rgba(135,180,255,0.22);
      border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%;
      bottom: -100px; right: 0;
      animation: blobMorph 12s infinite ease-in-out;
    }

    @keyframes blobMorph {
      0%,100% { border-radius: 45% 55% 50% 50% / 50% 50% 50% 50%; transform: translate(0,0); }
      25%      { border-radius: 55% 45% 50% 50% / 50% 50% 50% 50%; transform: translate(28px,-28px); }
      50%      { border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%; transform: translate(-18px,18px); }
      75%      { border-radius: 50% 50% 55% 45% / 50% 50% 50% 50%; transform: translate(18px,28px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* ═══════════════════════════════════════════════════════════════
       SPLIT CARD  — main container
    ═══════════════════════════════════════════════════════════════ */
    .split-card {
      position: relative;
      z-index: 10;
      display: flex;
      width: min(1080px, 100%);
      height: min(660px, 92vh);
      background: var(--white);
      border: 4px solid #1976d2;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── LEFT: form panel ── */
    .split-left {
      flex: 0 0 40%;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
      /* hide scrollbar visually but keep scroll functional */
      scrollbar-width: none;
    }
    .split-left::-webkit-scrollbar { display: none; }

    /* ── RIGHT: illustration panel ── */
    .split-right {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f0f5ff 0%, #e8f0fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ═══════════════════════════════════════════════════════════════
       LOGIN-CONTAINER  (JS animation hook — keep class)
    ═══════════════════════════════════════════════════════════════ */
    .login-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ═══════════════════════════════════════════════════════════════
       LOGO + HEADER
    ═══════════════════════════════════════════════════════════════ */
    .logo-box {
      width: 90px; height: 90px;
      border-radius: 20px;
      background: var(--white);
      border: 2px solid #BFDBFE;
      padding: 4px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(25,118,210,0.14);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-img {
      width: 100%; height: 100%;
      border-radius: 11px;
      object-fit: cover;
    }

    /* Word-mark above heading (like index.html "REERUI") */
    .wordmark {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ═══════════════════════════════════════════════════════════════
       FORM BOX
    ═══════════════════════════════════════════════════════════════ */
    .form-box {
      width: 100%;
    }

    h2 {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 700;
      color: var(--slate-900);
      margin: 0 0 4px;
      letter-spacing: -.5px;
      line-height: 1.15;
    }

    .subtitle {
      color: #999;
      font-size: 12.5px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════════════════════════════
       MODE TOGGLE — IDs: btnModeRegistered / btnModeNew (.active by JS)
    ═══════════════════════════════════════════════════════════════ */
    .mode-select {
      display: flex;
      gap: 0;
      margin-bottom: 18px;
      background: #eef4ff;
      padding: 4px;
      border-radius: 10px;
      border: 1.5px solid #DBEAFE;
    }

    .mode-select button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #94A3B8;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12.5px;
      transition: background var(--trans), color var(--trans), box-shadow var(--trans);
      outline: none;
    }

    .mode-select button.active {
      background: var(--white);
      color: #1976d2;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(25,118,210,0.13);
    }
    .mode-select button:not(.active):hover {
      color: #64748B;
    }

    /* ═══════════════════════════════════════════════════════════════
       INPUTS — clean label-above style
    ═══════════════════════════════════════════════════════════════ */
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    /* Floating label (kept for JS compatibility; styled as top label) */
    .floating-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      /* override absolute positioning from original */
      position: static;
      transform: none;
      pointer-events: auto;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      max-width: 100%;
      transition: none;
    }

    input, select {
      width: 100%;
      padding: 9px 14px;
      background: #f9f9f9;
      border: 1.5px solid #e0e7ef;
      border-radius: var(--radius-input);
      color: var(--slate-900);
      font-size: 13px;
      font-family: var(--font-body);
      appearance: none;
      transition: border-color var(--trans), box-shadow var(--trans), background var(--trans);
      caret-color: #1976d2;
      outline: none;
    }

    input::placeholder { color: #c0ccd8; }

    input:focus, select:focus {
      border-color: #1976d2;
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(25,118,210,0.12);
    }

    input:hover:not(:focus), select:hover:not(:focus) {
      border-color: #b8cfe8;
    }

    select option { color: var(--slate-900); background: white; }

    /* keep floating-label transitions from raising (override) */
    input:focus          ~ .floating-label,
    input:not(:placeholder-shown) ~ .floating-label,
    select:focus         ~ .floating-label,
    select:valid         ~ .floating-label {
      position: static;
      top: auto;
      transform: none;
      font-size: 12px;
      color: #333;
      font-weight: 600;
    }

    /* ── Input wrapper so label comes BEFORE input ── */
    .input-group .floating-label { order: -1; }

    /* phone prefix decoration */
    .phone-wrap {
      position: relative;
    }
    .phone-wrap input {
      padding-left: 52px;
    }
    .phone-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      pointer-events: none;
      border-right: 1.5px solid #e0e7ef;
      padding-right: 10px;
    }

    /* ═══════════════════════════════════════════════════════════════
       BUTTON GROUP  — login + "New Merchant?" side by side
    ═══════════════════════════════════════════════════════════════ */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    /* ── PRIMARY BUTTON (class used by JS for .loading toggle) ── */
    button.primary {
      flex: 1;
      padding: 12px 16px;
      background: var(--primary-gradient);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-input);
      border: none;
      cursor: pointer;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: transform var(--trans), box-shadow var(--trans), background var(--trans);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(25,118,210,0.28);
    }

    button.primary:hover {
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(25,118,210,0.38);
    }
    button.primary:active { transform: scale(.98); }

    /* ── SECONDARY / OUTLINE BUTTON ── */
    button.secondary {
      flex: 1;
      padding: 12px 16px;
      background: var(--white);
      color: #1976d2;
      border: 2px solid #1976d2;
      border-radius: var(--radius-input);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: background var(--trans), transform var(--trans), box-shadow var(--trans);
    }
    button.secondary:hover {
      background: #f0f5ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(25,118,210,0.15);
    }
    button.secondary:active { transform: scale(.98); }

    /* ── Loading spinner (.loading added/removed by JS) ── */
    .spinner {
      width: 17px; height: 17px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    .btn-text { transition: opacity var(--trans); }
    .loading .spinner  { display: block; }
    .loading .btn-text { display: none; }

    /* ── Status text ── */
    #regStatus {
      margin-top: 14px;
      font-size: 13px;
      color: #1976d2;
      text-align: center;
      font-weight: 600;
      min-height: 20px;
    }

    /* ── New merchant register full-width btn ── */
    #newSendOtpBtn {
      width: 100%;
      flex: unset;
      margin-top: 4px;
    }

    /* ═══════════════════════════════════════════════════════════════
       MODALS
    ═══════════════════════════════════════════════════════════════ */
    #otpModal,
    #idModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .otp-box {
      background: var(--white);
      border: 2px solid #BFDBFE;
      padding: 38px 32px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 28px 70px rgba(25,118,210,0.18);
      color: var(--slate-900);
    }

    .otp-box > div:first-child {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 20px;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    #otpMsg { font-size: 13px; color: var(--slate-400); }

    .otp-input {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: 1.5px solid #BFDBFE;
      margin-top: 18px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      font-weight: 700;
      font-family: monospace;
      color: #1565c0;
      background: #EFF6FF;
      outline: none;
      transition: border-color var(--trans), box-shadow var(--trans);
    }

    .otp-input:focus {
      border-color: #60A5FA;
      box-shadow: 0 0 0 3px rgba(96,165,250,.18);
    }

    .id-card {
      background: var(--white);
      border: 2px solid #BFDBFE;
      padding: 38px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 28px 70px rgba(25,118,210,0.18);
      color: var(--slate-900);
    }

    .id-card h3 {
      font-family: var(--font-head);
      margin: 6px 0 18px;
      color: var(--slate-900);
      font-size: 22px;
    }

    .id-value {
      font-family: monospace;
      font-weight: 800;
      color: #1976d2;
      font-size: 30px;
      margin: 12px 0;
      background: #EFF6FF;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #DBEAFE;
      letter-spacing: .04em;
    }

    /* Shop select modal overrides */
    #shopSelectModal > div {
      background: var(--white) !important;
      border-color: #BFDBFE !important;
      color: var(--slate-900);
    }
    #shopSelectModal h3 { color: var(--slate-900) !important; }
    #shopSelectModal p  { color: var(--slate-400) !important; }

    #shopSelectList button {
      background: #F3F8FF !important;
      border-color: #DBEAFE !important;
      color: var(--slate-900) !important;
      border-radius: 10px !important;
      transition: background var(--trans);
    }
    #shopSelectList button:hover { background: #DBEAFE !important; }
    #shopSelectList button strong { color: #1976d2 !important; }

    #otpCancel {
      background: transparent !important;
      border: 1.5px solid #BFDBFE !important;
      color: #1976d2 !important;
      box-shadow: none !important;
    }
    #otpCancel:hover { background: #EFF6FF !important; }

    /* ═══════════════════════════════════════════════════════════════
       RIGHT PANEL — illustration
    ═══════════════════════════════════════════════════════════════ */
    .ill-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Decorative circles (index.html style) */
    .ill-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .ill-circle-a {
      width: 70px; height: 70px;
      background: rgba(135,181,255,0.42);
      top: 14%; left: 12%;
      animation: floatY 5s ease-in-out infinite;
    }
    .ill-circle-b {
      width: 48px; height: 48px;
      background: rgba(135,181,255,0.28);
      top: 18%; right: 14%;
      animation: floatY 7s ease-in-out 1s infinite;
    }
    .ill-circle-c {
      width: 90px; height: 90px;
      background: rgba(135,181,255,0.20);
      bottom: 12%; left: 8%;
      animation: floatY 6s ease-in-out .5s infinite;
    }

    /* Small floating square (index.html) */
    .ill-square {
      position: absolute;
      top: 10%; left: 8%;
      width: 48px; height: 48px;
      border-radius: 10px;
      background: rgba(255,255,255,0.65);
      border: 2px solid rgba(135,181,255,0.5);
      animation: floatY 6s ease-in-out .8s infinite;
    }

    /* Cloud blob */
    .ill-cloud {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 85%;
      max-width: 400px;
      pointer-events: none;
    }
    .ill-cloud svg { width: 100%; height: auto; display: block; }

    /* Main mockup card */
    .ill-mockup {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 78%;
      max-width: 360px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.09));
      animation: floatY 6s ease-in-out .5s infinite;
    }
    .ill-mockup svg { width: 100%; height: auto; display: block; }

    /* Characters */
    .ill-person { position: absolute; bottom: 0; }
    .ill-person svg { display: block; height: auto; }
    .ill-person-l { left: 4%;  width: 80px; animation: floatY 5.5s ease-in-out .2s infinite; }
    .ill-person-r { right: 4%; width: 70px; animation: floatY 5s ease-in-out .8s infinite; }

    .ill-badge {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      color: #0d3a78;
      opacity: .4;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 780px) {
      .split-card     { flex-direction: column; height: auto; max-height: none; }
      .split-right    { min-height: 220px; order: -1; flex: none; }
      .split-left     { flex: 1; padding: 28px 24px; justify-content: flex-start; }
      .blob-tr, .blob-br { opacity: .5; }
    }
    @media (max-width: 480px) {
      .split-left  { padding: 22px 18px; }
      h2           { font-size: 24px; }
      .split-right { min-height: 170px; }
      .btn-group   { flex-direction: column; }
    }
  </style>
</head>

<body>

  <!-- ── Animated background blobs ── -->
  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-br"></div>

  <!-- Firebase reCAPTCHA anchor — must stay in DOM -->
  <div id="recaptcha-container"></div>

  <!-- ════════════════════════ SPLIT CARD ════════════════════════ -->
  <div class="split-card">

    <!-- ── LEFT: form panel ── -->
    <div class="split-left">
      <div class="login-container">

        <div class="logo-box">
          <img src="logo.png" alt="BharatPOS" class="logo-img">
        </div>

        <div class="form-box">
          <p class="wordmark">BharatPOS</p>
          <h2>Merchant<br>Portal</h2>
          <p class="subtitle">Welcome! Log in or register your retail business.</p>

          <!-- Mode toggle (IDs untouched — JS binds to them) -->
          <div class="mode-select" role="tablist">
            <button id="btnModeRegistered" class="active">Registered</button>
            <button id="btnModeNew">New Merchant</button>
          </div>

          <!-- ── Registered pane ── -->
          <div id="registeredPane">

            <div class="input-group">
              <label class="floating-label" for="reg_mobile">Mobile Number</label>
              <div class="phone-wrap">
                <span class="phone-prefix">+91</span>
                <input type="tel" id="reg_mobile" placeholder="10-digit number" maxlength="10" inputmode="numeric" autocomplete="tel">
              </div>
            </div>

            <!-- Two-button layout: Login + New Merchant shortcut -->
            <div class="btn-group">
              <button class="primary" id="regSendOtpBtn">
                <span class="btn-text">Login &nbsp;<i class="fa-solid fa-arrow-right"></i></span>
                <div class="spinner"></div>
              </button>
            </div>

            <div id="regStatus" style="margin-top:14px; font-size:13px; color:var(--accent); text-align:center; font-weight:600;"></div>
          </div><!-- /#registeredPane -->

          <!-- ── New Merchant pane ── -->
          <form id="newPane" style="display:none;">

            <div class="input-group">
              <label class="floating-label" for="ownerName">Owner Name</label>
              <input type="text" id="ownerName" placeholder="e.g. Rajesh Kumar" autocomplete="name">
            </div>

            <div class="input-group">
              <label class="floating-label" for="mobile">Mobile Number</label>
              <div class="phone-wrap">

  <!-- ID / Welcome modal -->
  <div id="idModal">
    <div class="id-card">

        <img src="logo.png" alt="B" class="logo-img">

      <h3 id="modalShopName">Shop Name</h3>
      <div style="font-size:12px; color:var(--text-muted);">Your Unique Merchant ID</div>
      <div class="id-value" id="generatedCode">-----</div>
      <button class="primary" onclick="finishLogin()">Enter Dashboard &nbsp;<i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>

  <!-- OTP modal -->
  <div id="otpModal">
    <div class="otp-box">
      <div style="font-weight:800; font-size:20px; margin-bottom:8px;">Verify Identity</div>
      <div style="font-size:13px;" id="otpMsg">We sent a secure code to your mobile.</div>
      <input id="otpInput" class="otp-input" placeholder="------" maxlength="6" inputmode="numeric">
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="verifyOtpBtn" class="primary" style="flex:2;"><span class="btn-text">Verify &amp; Proceed</span><div class="spinner"></div></button>
        <button id="otpCancel"    class="primary" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Shop select modal -->
  <div id="shopSelectModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.65); justify-content:center; align-items:center; z-index:3000; backdrop-filter:blur(8px);">
    <div style="background:#fff; padding:28px; border-radius:20px; text-align:center; border:1.5px solid var(--border); max-width:420px; width:90%; box-shadow:0 32px 80px rgba(37,99,235,.18);">
      <h3 style="margin-top:0; color:var(--slate-900);">🏢 Select Shop</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Multiple branches found for your number.</p>
      <div id="shopSelectList" style="display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto; padding-right:4px;"></div>
      <button class="primary" style="margin-top:16px;" onclick="document.getElementById('shopSelectModal').style.display='none'">Cancel</button>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════════════
       ALL ORIGINAL SCRIPTS — COMPLETELY UNTOUCHED
  ═══════════════════════════════════════════════════════════════ -->
  <script type="module">
  // 🟢 1. IMPORT FIREBASE SDK (OTP Bypassed)
  import { db } from "./bharatpos.js";
  import { collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  /* --- UI TAB SWITCHING --- */
  const btnModeRegistered = document.getElementById('btnModeRegistered');
  const btnModeNew = document.getElementById('btnModeNew');
  const registeredPane = document.getElementById('registeredPane');
  const newPaneForm = document.getElementById('newPane');

  function setMode(mode) {
    if (mode === 'registered') {
      btnModeRegistered.classList.add('active');
      btnModeNew.classList.remove('active');
      registeredPane.style.display = 'block';
      newPaneForm.style.display = 'none';
    } else {
      btnModeNew.classList.add('active');
      btnModeRegistered.classList.remove('active');
      registeredPane.style.display = 'none';
      newPaneForm.style.display = 'block';
    }
  }
  btnModeRegistered.addEventListener('click', ()=> setMode('registered'));
  btnModeNew.addEventListener('click', ()=> setMode('new'));


  /* --- 🟢 LOGIN EXISTING MERCHANT (FOOLPROOF & BYPASSED) --- */
  document.getElementById('regSendOtpBtn').addEventListener('click', async function() {
    const btn = this; const status = document.getElementById('regStatus');
    const mobile = (document.getElementById('reg_mobile').value || '').trim();
    
    if (!mobile || mobile.length !== 10) { status.innerText = 'Enter valid 10-digit mobile'; return; }
    
    btn.classList.add('loading'); 
    status.innerText = 'Searching database...';
    console.log("🔍 TARGET MOBILE:", mobile);

    try {
        const shopsRef = collection(db, "shops");
        const querySnapshot = await getDocs(shopsRef);
        
        console.log("📦 TOTAL SHOPS IN FIREBASE:", querySnapshot.size);

        if (querySnapshot.size === 0) {
            status.innerText = 'Firebase is empty. Click "New Merchant" to register.';
            btn.classList.remove('loading');
            return;
        }

        const shops = [];
        const inputMobile = String(mobile).replace("+91", "").trim();

        querySnapshot.forEach((doc) => { 
            const data = doc.data();
            const dbMobile = String(data.mobile || data.profile?.mobile || data.profile?.phone || "").replace("+91", "").trim();
            
            if (dbMobile === inputMobile) {
                if(!data.merchantId) data.merchantId = doc.id;
                if(!data.profile) data.profile = { shopName: "My Shop", mobile: dbMobile };
                shops.push(data); 
            }
        });

        if (shops.length > 0) {
            if (shops.length === 1) {
                window.triggerRestoreSequenceObj(encodeURIComponent(JSON.stringify(shops[0])), mobile);
            } else {
                const listHtml = shops.map(shop => `
                    <button type="button" style="width: 100%; text-align: left; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;" onclick="window.triggerRestoreSequenceObj('${encodeURIComponent(JSON.stringify(shop))}', '${mobile}')">
                        <div>
                            <strong style="font-size:16px; color: var(--accent);">${shop.profile?.shopName || shop.merchantId}</strong>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">ID: ${shop.merchantId}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                    </button>
                `).join('');
                
                document.getElementById('shopSelectList').innerHTML = listHtml;
                document.getElementById('shopSelectModal').style.display = 'flex';
            }
        } else {
            status.innerText = 'Looked at all shops, but no phone number matched. Register new.';
        }
    } catch(e) { 
        console.error("🚨 FIREBASE ERROR:", e);
        status.innerText = 'Firebase Error! Check console (F12).';
    } finally {
        btn.classList.remove('loading');
    }
  });


  /* --- 🟢 REGISTER NEW MERCHANT (OTP BYPASSED) --- */
  document.getElementById('newSendOtpBtn').addEventListener('click', async function() {
    const btn = this; 
    const formData = {
      ownerName: (document.getElementById('ownerName').value || '').trim(),
      mobile: (document.getElementById('mobile').value || '').trim(),
      shopName: (document.getElementById('shopName').value || '').trim(),
      category: (document.getElementById('shopCategory').value || '').trim()
    };
    
    if (!formData.shopName || !formData.mobile || formData.mobile.length !== 10) { 
        alert('Please fill out all required fields correctly (10 digit mobile).'); 
        return; 
    }

    btn.classList.add('loading');

    try {
        const codePrefix = (formData.category || 'SHP').substring(0, 3).toUpperCase();
        const codeSuffix = (formData.mobile || '0000000000').substring(6, 10);
        const merchantId = `${codePrefix}-${codeSuffix}`;
        
        const shopRef = doc(db, "shops", merchantId);
        await setDoc(shopRef, {
            merchantId: merchantId,
            profile: { ...formData, joinedDate: new Date().toISOString() }
        });

        const userObj = { ...formData, merchantId: merchantId };
        localStorage.setItem('bharatpos_user', JSON.stringify(userObj));
        
        document.getElementById('modalShopName').innerText = formData.shopName;
        document.getElementById('generatedCode').innerText = merchantId;
        document.getElementById('idModal').style.display = 'flex';
    } catch(e) { 
        alert('Registration Failed. Check console.');
        console.error(e);
    } finally {
        btn.classList.remove('loading');
    }
  });


  /* --- 🟢 LIGHTWEIGHT RESTORE SEQUENCE --- */
  window.triggerRestoreSequenceObj = function(shopString, mobile) {
      const shop = JSON.parse(decodeURIComponent(shopString));
      document.getElementById('shopSelectModal').style.display = 'none';
      triggerRestoreSequence(shop, () => {}, mobile);
  }

  async function triggerRestoreSequence(shopDoc, cleanupCallback, mobile) {
      if(cleanupCallback) cleanupCallback();
      
      // Wipe old session completely
      localStorage.removeItem('bharatpos_products');
      localStorage.removeItem('bharatpos_sales');
      localStorage.removeItem('bharatpos_customers');
      localStorage.removeItem('bill_items');
      
      // Set Identity
      const user = { ...shopDoc.profile, merchantId: shopDoc.merchantId, mobile: mobile };
      localStorage.setItem('bharatpos_user', JSON.stringify(user));

      try {
          const prodRef = collection(db, "shops", shopDoc.merchantId, "products");
          const prodSnap = await getDocs(prodRef);
          const products = prodSnap.docs.map(d => d.data());
          localStorage.setItem('bharatpos_products', JSON.stringify(products));

          const custRef = collection(db, "shops", shopDoc.merchantId, "customers");
          const custSnap = await getDocs(custRef);
          const customers = custSnap.docs.map(d => d.data());
          localStorage.setItem('bharatpos_customers', JSON.stringify(customers));

          const salesRef = collection(db, "shops", shopDoc.merchantId, "sales");
          const salesSnap = await getDocs(salesRef);
          const sales = salesSnap.docs.map(d => d.data());
          localStorage.setItem('bharatpos_sales', JSON.stringify(sales));
      } catch(e) {
          console.warn("Could not cache offline data. Proceeding to dashboard.", e);
      }

      document.getElementById('modalShopName').innerText = user.shopName || 'Shop Restored';
      document.getElementById('generatedCode').innerText = shopDoc.merchantId;
      document.getElementById('idModal').style.display = 'flex';
  }

  window.finishLogin = function() { window.location.href = 'dashboard.html'; }

  setMode('registered');
  </script>

</body>
