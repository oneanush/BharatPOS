<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchant Login • BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

 

<script type="module" src="bharatpos.js"></script>
  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-body: #0f172a;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b; /* Gold */
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow-y: auto;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.1), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1), transparent 40%);
      padding: 20px 0;
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- FORM CONTAINER --- */
    .login-container {
      width: 100%; max-width: 500px; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* LOGO AREA */
    .logo-box {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--bg-body); border: 2px solid var(--accent);
      padding: 5px; margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
      display: flex; justify-content: center; align-items: center;
    }
    .logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .form-box {
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 28px; width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h2 { text-align: center; margin: 0 0 8px 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }

    /* mode toggle */
    .mode-select { display:flex; gap:10px; justify-content:center; margin-bottom:20px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; }
    .mode-select button { flex: 1; padding:10px 12px; border-radius:8px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-weight: 600; transition: 0.3s;}
    .mode-select button.active { background:var(--accent); color:#000; font-weight:700; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2); }

    /* --- FLOATING LABEL INPUTS --- */
    .input-group { position: relative; margin-bottom: 16px; }
    
    input, select {
      width: 100%; padding: 14px 14px; background: rgba(0,0,0,0.3);
      border: 1px solid var(--border); border-radius: 10px;
      color: #fff; font-size: 15px; transition: 0.3s;
      appearance: none; font-family: 'Inter', sans-serif;
    }

    input:focus, select:focus {
      border-color: var(--accent); background: rgba(0,0,0,0.5);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
    }

    .floating-label {
      position: absolute; left: 14px; top: 14px;
      color: var(--text-muted); font-size: 14px; pointer-events: none;
      transition: 0.2s ease all;
    }
    
    input:focus ~ .floating-label,
    input:not(:placeholder-shown) ~ .floating-label,
    select:focus ~ .floating-label,
    select:valid ~ .floating-label {
      top: -10px; left: 10px; font-size: 11px;
      color: var(--accent); background: var(--bg-body);
      padding: 0 6px; border-radius: 4px;
    }

    /* --- BUTTON --- */
    button.primary {
      width: 100%; padding: 14px; margin-top: 10px;
      background: var(--primary-gradient); color: #000;
      font-size: 15px; font-weight: 800; border-radius: 10px;
      border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    button.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
    button.primary:active { transform: scale(0.98); }

    /* Loading Spinner */
    .spinner {
      width: 18px; height: 18px; border: 3px solid rgba(0,0,0,0.3);
      border-top-color: #000; border-radius: 50%;
      animation: spin 0.8s linear infinite; display: none;
    }
    .btn-text { transition: 0.2s; }

    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }

    /* OTP Modal */
    #otpModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
      justify-content: center; align-items: center; z-index: 2000;
    }
    .otp-box {
      background: #0f172a; border:1px solid var(--accent);
      padding: 30px; border-radius: 16px; max-width: 400px; width: 90%; text-align:center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .otp-input { width: 100%; padding: 15px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); margin-top:15px; font-size: 18px; text-align: center; letter-spacing: 5px; font-weight: 700; font-family: monospace;}

    /* ID Modal */
    #idModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content:center; align-items:center; z-index:3000; }
    .id-card { background:#0f172a; padding:30px; border-radius:16px; text-align:center; border:1px solid var(--accent); max-width: 400px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);}
    .id-value { font-family:monospace; font-weight:800; color:var(--accent); font-size:32px; margin:15px 0; background: rgba(245, 158, 11, 0.1); padding: 10px; border-radius: 8px;}

    @media (max-width:600px) {
      .form-box { padding:20px; }
      .login-container { padding:15px; }
    }
  </style>
</head>

<body>

  <div id="recaptcha-container"></div>

  <div class="login-container">
    
    <div class="logo-box">
      <img src="logo.png" alt="BharatPOS" class="logo-img">
    </div>

    <div class="form-box">
      <h2>Merchant Portal</h2>
      <p class="subtitle">Log in or start your free retail setup</p>

      <div class="mode-select" role="tablist">
        <button id="btnModeRegistered" class="active">Registered</button>
        <button id="btnModeNew">New Merchant</button>
      </div>

      <div id="registeredPane">
        <div class="input-group">
          <input type="tel" id="reg_mobile" placeholder=" " maxlength="10" inputmode="numeric" autocomplete="tel">
          <label class="floating-label">Mobile Number</label>
        </div>

        <button class="primary" id="regSendOtpBtn">
            <span class="btn-text">Send OTP & Login <i class="fa-solid fa-arrow-right"></i></span>
            <div class="spinner"></div>
        </button>

        <div id="regStatus" style="margin-top:15px; font-size:13px; color: var(--accent); text-align: center; font-weight: 600;"></div>
      </div>

      <form id="newPane" style="display:none;">
        
        <div class="input-group">
          <input type="text" id="ownerName" placeholder=" " autocomplete="name">
          <label class="floating-label">Owner Name</label>
        </div>

        <div class="input-group">
          <input type="tel" id="mobile" placeholder=" " maxlength="10" pattern="[0-9]{10}" autocomplete="tel">
          <label class="floating-label">Mobile Number</label>
        </div>

        <div class="input-group">
          <input type="text" id="shopName" placeholder=" " autocomplete="organization">
          <label class="floating-label">Shop Name (e.g. Raju General Store)</label>
        </div>

        <div class="input-group">
          <select id="shopCategory">
            <option value="" disabled selected></option>
            <option value="GROCERY">Kirana / Grocery Store</option>
            <option value="MEDICINE">Medical / Pharmacy</option>
            <option value="CLOTHING">Clothing / Garments</option>
            <option value="ELECTRONIC">Electronics / Mobile Shop</option>
            <option value="RESTAURANT">Restaurant / Cafe / Bakery</option>
            <option value="OTHER">Other Business</option>
          </select>
          <label class="floating-label">Shop Category</label>
        </div>

        <button type="button" id="newSendOtpBtn" class="primary">
            <span class="btn-text">Register Free Account <i class="fa-solid fa-bolt"></i></span>
            <div class="spinner"></div>
        </button>
      </form>

    </div>
  </div>

  <div id="idModal">
    <div class="id-card">
      <div class="logo-box" style="width:50px; height:50px; margin: 0 auto 15px auto;">
        <img src="logo.png" alt="B" class="logo-img">
      </div>
      <div style="font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Welcome to BharatPOS</div>
      <h3 style="margin: 5px 0 15px 0; color:white; font-size: 24px;" id="modalShopName">Shop Name</h3>
      
      <div style="font-size: 12px; color: var(--text-muted);">Your Unique Merchant ID</div>
      <div class="id-value" id="generatedCode">-----</div>
      
      <button class="primary" onclick="finishLogin()">Enter Dashboard</button>
    </div>
  </div>

  <div id="otpModal">
    <div class="otp-box">
      <div style="font-weight:800; font-size:20px; color: white; margin-bottom:10px;">Verify Identity</div>
      <div style="font-size:13px; color:var(--text-muted);" id="otpMsg">We sent a secure code to your mobile.</div>
      
      <input id="otpInput" class="otp-input" placeholder="------" maxlength="6" inputmode="numeric">
      
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="verifyOtpBtn" class="primary" style="flex:2;"><span class="btn-text">Verify & Proceed</span><div class="spinner"></div></button>
        <button id="otpCancel" class="primary" style="flex:1; background: transparent; border: 1px solid var(--border); color: white;">Cancel</button>
      </div>
    </div>
  </div>

  <div id="shopSelectModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:3000; backdrop-filter:blur(5px);">
    <div style="background:#0f172a; padding:24px; border-radius:16px; text-align:center; border:1px solid var(--accent); max-width: 400px; width: 90%;">
      <h3 style="margin-top:0; color:#fff;">🏢 Select Shop</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">Multiple branches found.</p>
      <div id="shopSelectList" style="display:flex; flex-direction:column; gap: 10px; max-height:300px; overflow-y:auto; padding-right:5px;"></div>
      <button class="primary" style="margin-top:15px; background: transparent; border: 1px solid var(--border); color: white;" onclick="document.getElementById('shopSelectModal').style.display='none'">Cancel</button>
    </div>
  </div>
<script type="module">
// 🟢 1. IMPORT FIREBASE SDK (OTP Bypassed)
import { db } from "./bharatpos.js";
import { collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* --- UI TAB SWITCHING --- */
const btnModeRegistered = document.getElementById('btnModeRegistered');
const btnModeNew = document.getElementById('btnModeNew');
const registeredPane = document.getElementById('registeredPane');
const newPaneForm = document.getElementById('newPane');

function setMode(mode) {
  if (mode === 'registered') {
    btnModeRegistered.classList.add('active');
    btnModeNew.classList.remove('active');
    registeredPane.style.display = 'block';
    newPaneForm.style.display = 'none';
  } else {
    btnModeNew.classList.add('active');
    btnModeRegistered.classList.remove('active');
    registeredPane.style.display = 'none';
    newPaneForm.style.display = 'block';
  }
}
btnModeRegistered.addEventListener('click', ()=> setMode('registered'));
btnModeNew.addEventListener('click', ()=> setMode('new'));


/* --- 🟢 LOGIN EXISTING MERCHANT (FOOLPROOF & BYPASSED) --- */
document.getElementById('regSendOtpBtn').addEventListener('click', async function() {
  const btn = this; const status = document.getElementById('regStatus');
  const mobile = (document.getElementById('reg_mobile').value || '').trim();
  
  if (!mobile || mobile.length !== 10) { status.innerText = 'Enter valid 10-digit mobile'; return; }
  
  btn.classList.add('loading'); 
  status.innerText = 'Searching database...';
  console.log("🔍 TARGET MOBILE:", mobile);

  try {
      const shopsRef = collection(db, "shops");
      const querySnapshot = await getDocs(shopsRef);
      
      console.log("📦 TOTAL SHOPS IN FIREBASE:", querySnapshot.size);

      if (querySnapshot.size === 0) {
          status.innerText = 'Firebase is empty. Click "New Merchant" to register.';
          btn.classList.remove('loading');
          return;
      }

      const shops = [];
      const inputMobile = String(mobile).replace("+91", "").trim();

      querySnapshot.forEach((doc) => { 
          const data = doc.data();
          const dbMobile = String(data.mobile || data.profile?.mobile || data.profile?.phone || "").replace("+91", "").trim();
          
          if (dbMobile === inputMobile) {
              if(!data.merchantId) data.merchantId = doc.id;
              if(!data.profile) data.profile = { shopName: "My Shop", mobile: dbMobile };
              shops.push(data); 
          }
      });

      if (shops.length > 0) {
          if (shops.length === 1) {
              window.triggerRestoreSequenceObj(encodeURIComponent(JSON.stringify(shops[0])), mobile);
          } else {
              const listHtml = shops.map(shop => `
                  <button type="button" style="width: 100%; text-align: left; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;" onclick="window.triggerRestoreSequenceObj('${encodeURIComponent(JSON.stringify(shop))}', '${mobile}')">
                      <div>
                          <strong style="font-size:16px; color: var(--accent);">${shop.profile?.shopName || shop.merchantId}</strong>
                          <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">ID: ${shop.merchantId}</div>
                      </div>
                      <i class="fa-solid fa-chevron-right" style="color: var(--text-muted);"></i>
                  </button>
              `).join('');
              
              document.getElementById('shopSelectList').innerHTML = listHtml;
              document.getElementById('shopSelectModal').style.display = 'flex';
          }
      } else {
          status.innerText = 'Looked at all shops, but no phone number matched. Register new.';
      }
  } catch(e) { 
      console.error("🚨 FIREBASE ERROR:", e);
      status.innerText = 'Firebase Error! Check console (F12).';
  } finally {
      btn.classList.remove('loading');
  }
});


/* --- 🟢 REGISTER NEW MERCHANT (OTP BYPASSED) --- */
document.getElementById('newSendOtpBtn').addEventListener('click', async function() {
  const btn = this; 
  const formData = {
    ownerName: (document.getElementById('ownerName').value || '').trim(),
    mobile: (document.getElementById('mobile').value || '').trim(),
    shopName: (document.getElementById('shopName').value || '').trim(),
    category: (document.getElementById('shopCategory').value || '').trim()
  };
  
  if (!formData.shopName || !formData.mobile || formData.mobile.length !== 10) { 
      alert('Please fill out all required fields correctly (10 digit mobile).'); 
      return; 
  }

  btn.classList.add('loading');

  try {
      const codePrefix = (formData.category || 'SHP').substring(0, 3).toUpperCase();
      const codeSuffix = (formData.mobile || '0000000000').substring(6, 10);
      const merchantId = `${codePrefix}-${codeSuffix}`;
      
      const shopRef = doc(db, "shops", merchantId);
      await setDoc(shopRef, {
          merchantId: merchantId,
          profile: { ...formData, joinedDate: new Date().toISOString() }
      });

      const userObj = { ...formData, merchantId: merchantId };
      localStorage.setItem('bharatpos_user', JSON.stringify(userObj));
      
      document.getElementById('modalShopName').innerText = formData.shopName;
      document.getElementById('generatedCode').innerText = merchantId;
      document.getElementById('idModal').style.display = 'flex';
  } catch(e) { 
      alert('Registration Failed. Check console.');
      console.error(e);
  } finally {
      btn.classList.remove('loading');
  }
});


/* --- 🟢 LIGHTWEIGHT RESTORE SEQUENCE --- */
window.triggerRestoreSequenceObj = function(shopString, mobile) {
    const shop = JSON.parse(decodeURIComponent(shopString));
    document.getElementById('shopSelectModal').style.display = 'none';
    triggerRestoreSequence(shop, () => {}, mobile);
}

async function triggerRestoreSequence(shopDoc, cleanupCallback, mobile) {
    if(cleanupCallback) cleanupCallback();
    
    // Wipe old session completely
    localStorage.removeItem('bharatpos_products');
    localStorage.removeItem('bharatpos_sales');
    localStorage.removeItem('bharatpos_customers');
    localStorage.removeItem('bill_items');
    
    // Set Identity
    const user = { ...shopDoc.profile, merchantId: shopDoc.merchantId, mobile: mobile };
    localStorage.setItem('bharatpos_user', JSON.stringify(user));

    try {
        const prodRef = collection(db, "shops", shopDoc.merchantId, "products");
        const prodSnap = await getDocs(prodRef);
        const products = prodSnap.docs.map(d => d.data());
        localStorage.setItem('bharatpos_products', JSON.stringify(products));

        const custRef = collection(db, "shops", shopDoc.merchantId, "customers");
        const custSnap = await getDocs(custRef);
        const customers = custSnap.docs.map(d => d.data());
        localStorage.setItem('bharatpos_customers', JSON.stringify(customers));
    } catch(e) {
        console.warn("Could not cache offline data. Proceeding to dashboard.", e);
    }

    document.getElementById('modalShopName').innerText = user.shopName || 'Shop Restored';
    document.getElementById('generatedCode').innerText = shopDoc.merchantId;
    document.getElementById('idModal').style.display = 'flex';
}

window.finishLogin = function() { window.location.href = 'dashboard.html'; }

setMode('registered');
</script>
</body>
</html>
