<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchant Login • BharatPOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="assets/images/logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  
  <style>
    /* LOGIN SPECIFIC STYLES (Isolated from main app) */
    body { display: flex !important; align-items: center !important; justify-content: center !important; padding: 24px 16px !important; overflow-x: hidden !important; position: relative !important; min-height: 100vh !important; margin: 0 !important; background: #EAF2FF !important; }

    /* Animated Background Blobs */
    .blob { position: fixed; pointer-events: none; z-index: 0; }
    .blob-tl { width: 420px; height: 420px; background: rgba(135,180,255,0.30); border-radius: 45% 55% 50% 50% / 50% 50% 50% 50%; top: -110px; left: -110px; animation: blobMorph 8s infinite ease-in-out; }
    .blob-tr { width: 520px; height: 520px; background: rgba(135,180,255,0.18); border-radius: 55% 45% 50% 50% / 50% 50% 50% 50%; top: -160px; right: -120px; animation: blobMorph 10s infinite reverse ease-in-out; }
    .blob-br { width: 360px; height: 360px; background: rgba(135,180,255,0.22); border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%; bottom: -100px; right: 0; animation: blobMorph 12s infinite ease-in-out; }

    @keyframes blobMorph {
      0%,100% { border-radius: 45% 55% 50% 50% / 50% 50% 50% 50%; transform: translate(0,0); }
      25%     { border-radius: 55% 45% 50% 50% / 50% 50% 50% 50%; transform: translate(28px,-28px); }
      50%     { border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%; transform: translate(-18px,18px); }
      75%     { border-radius: 50% 50% 55% 45% / 50% 50% 50% 50%; transform: translate(18px,28px); }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* Split Card Layout */
    .split-card { position: relative; z-index: 10; display: flex; width: min(1080px, 100%); height: min(660px, 92vh); background: #FFFFFF; border: 4px solid var(--primary); border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.10), 0 4px 16px var(--primary-glow); overflow: hidden; animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both; }
    .split-left { flex: 0 0 40%; padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; scrollbar-width: none; }
    .split-left::-webkit-scrollbar { display: none; }
    .split-right { flex: 1; position: relative; overflow: hidden; background: linear-gradient(135deg, #f0f5ff 0%, #e8f0fe 100%); display: flex; align-items: center; justify-content: center; }

    .login-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .logo-box { width: 90px; height: 90px; border-radius: 20px; background: #FFFFFF; border: 2px solid var(--border); padding: 4px; margin-bottom: 14px; box-shadow: 0 6px 20px var(--primary-glow); display: flex; justify-content: center; align-items: center; }
    .logo-img { width: 100%; height: 100%; border-radius: 11px; object-fit: cover; }
    .wordmark { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--text-light); text-transform: uppercase; margin-bottom: 6px; }
    
    .form-box { width: 100%; }
    .form-box h2 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; color: #1a3a52; margin: 0 0 4px; letter-spacing: -.5px; line-height: 1.15; }
    .subtitle { color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; line-height: 1.5; }

    /* Mode Toggle */
    .mode-select { display: flex; gap: 0; margin-bottom: 18px; background: #eef4ff; padding: 4px; border-radius: 10px; border: 1.5px solid var(--border); }
    .mode-select button { flex: 1; padding: 8px 12px; border-radius: 7px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12.5px; transition: var(--trans); outline: none; }
    .mode-select button.active { background: #FFFFFF; color: var(--primary); font-weight: 700; box-shadow: var(--shadow-sm); }
    .mode-select button:not(.active):hover { color: var(--text-main); }

    /* Inputs */
    .input-group { position: relative; margin-bottom: 12px; }
    .floating-label { display: block; font-size: 11.5px !important; font-weight: 600 !important; color: #333 !important; margin-bottom: 4px !important; position: static !important; }
    .input-group input, .input-group select { width: 100%; padding: 9px 14px; background: #f9f9f9; border: 1.5px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 13px; font-family: 'DM Sans', sans-serif; transition: 0.22s; outline: none; box-sizing: border-box;}
    .input-group input::placeholder { color: var(--text-light); }
    .input-group input:focus, .input-group select:focus { border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 3px var(--primary-glow); }
    .phone-wrap { position: relative; }
    .phone-wrap input { padding-left: 52px; }
    .phone-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; color: var(--text-muted); border-right: 1.5px solid var(--border); padding-right: 10px; z-index: 5; }

    /* Buttons */
    .btn-group { display: flex; gap: 10px; margin-top: 8px; }
    button.primary { flex: 1; padding: 12px 16px; background: var(--primary-gradient); color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; letter-spacing: .04em; text-transform: uppercase; transition: 0.22s; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 6px 20px var(--primary-glow); }
    button.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--primary-glow); }
    button.primary:active { transform: scale(.98); }

    .spinner { width: 17px; height: 17px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: none; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner  { display: block; }
    .loading .btn-text { display: none; }

    #regStatus { margin-top: 14px; font-size: 13px; color: var(--primary); text-align: center; font-weight: 600; min-height: 20px; }
    #newSendOtpBtn { width: 100%; flex: unset; margin-top: 4px; }

    /* Modals */
    #idModal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 2000; }
    .id-card { background: #FFFFFF; border: 2px solid var(--border); padding: 38px 32px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 28px 70px var(--primary-glow); }
    .id-card h3 { font-family: 'Sora', sans-serif; margin: 6px 0 18px; color: #1a3a52; font-size: 22px; }
    .id-value { font-family: monospace; font-weight: 800; color: var(--primary); font-size: 30px; margin: 12px 0; background: #EFF6FF; padding: 12px; border-radius: 10px; border: 1.5px solid var(--border); letter-spacing: .04em; }

    #shopSelectModal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.65); justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(8px); }
    #shopSelectModal > div { background: #FFFFFF; padding: 28px; border-radius: 20px; text-align: center; border: 1.5px solid var(--border); max-width: 420px; width: 90%; box-shadow: 0 32px 80px rgba(37,99,235,.18); }
    .shop-select-btn { width: 100%; text-align: left; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: #F3F8FF; color: var(--text-main); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; transition: var(--trans); }
    .shop-select-btn:hover { background: var(--border); }

    /* Illustrations */
    .ill-wrap { position: absolute; inset: 0; overflow: hidden; }
    .ill-circle { position: absolute; border-radius: 50%; pointer-events: none; }
    .ill-circle-a { width: 70px; height: 70px; background: rgba(135,181,255,0.42); top: 14%; left: 12%; animation: floatY 5s ease-in-out infinite; }
    .ill-circle-b { width: 48px; height: 48px; background: rgba(135,181,255,0.28); top: 18%; right: 14%; animation: floatY 7s ease-in-out 1s infinite; }
    .ill-circle-c { width: 90px; height: 90px; background: rgba(135,181,255,0.20); bottom: 12%; left: 8%; animation: floatY 6s ease-in-out .5s infinite; }
    .ill-square { position: absolute; top: 10%; left: 8%; width: 48px; height: 48px; border-radius: 10px; background: rgba(255,255,255,0.65); border: 2px solid rgba(135,181,255,0.5); animation: floatY 6s ease-in-out .8s infinite; }
    .ill-cloud { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 85%; max-width: 400px; pointer-events: none; }
    .ill-cloud svg { width: 100%; height: auto; display: block; }
    .ill-mockup { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 78%; max-width: 360px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.09)); animation: floatY 6s ease-in-out .5s infinite; }
    .ill-mockup svg { width: 100%; height: auto; display: block; }
    .ill-person { position: absolute; bottom: 0; }
    .ill-person svg { display: block; height: auto; }
    .ill-person-l { left: 4%; width: 80px; animation: floatY 5.5s ease-in-out .2s infinite; }
    .ill-person-r { right: 4%; width: 70px; animation: floatY 5s ease-in-out .8s infinite; }
    .ill-badge { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: #0d3a78; opacity: .4; white-space: nowrap; }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE REWRITE (The UI Fix)
    ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 780px) {
      body { padding: 0 !important; align-items: flex-start !important; }
      .split-card { flex-direction: column; height: 100vh !important; max-height: none !important; width: 100%; border: none; border-radius: 0; box-shadow: none; }
      .split-right { min-height: 220px; order: -1; flex: none; border-radius: 0 0 30px 30px; }
      .split-left { flex: 1; padding: 28px 24px; justify-content: flex-start; overflow-y: auto; }
      .blob-tr, .blob-br { opacity: .5; }
    }
    @media (max-width: 480px) {
      .split-left { padding: 24px 16px; }
      .form-box h2 { font-size: 24px; }
      .split-right { min-height: 180px; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-br"></div>

  <div class="split-card">

    <div class="split-left">
      <div class="login-container">

        <div class="logo-box">
          <img src="logo.png" alt="BharatPOS" class="logo-img" onerror="this.style.display='none'">
        </div>

        <div class="form-box">
          <p class="wordmark">BharatPOS</p>
          <h2>Merchant<br>Portal</h2>
          <p class="subtitle">Welcome! Log in or register your retail business.</p>

          <div class="mode-select" role="tablist">
            <button id="btnModeRegistered" class="active">Registered</button>
            <button id="btnModeNew">New Merchant</button>
          </div>

          <div id="registeredPane">
            <div class="input-group">
              <label class="floating-label" for="reg_mobile">Mobile Number</label>
              <div class="phone-wrap">
                <span class="phone-prefix">+91</span>
                <input type="tel" id="reg_mobile" placeholder="10-digit number" maxlength="10" inputmode="numeric" autocomplete="tel">
              </div>
            </div>
            <div class="btn-group">
              <button class="primary" id="regSendOtpBtn">
                <span class="btn-text">Login &nbsp;<i class="fa-solid fa-arrow-right"></i></span>
                <div class="spinner"></div>
              </button>
            </div>
            <div id="regStatus"></div>
          </div>

          <form id="newPane" style="display:none;">
            <div class="input-group">
              <label class="floating-label" for="ownerName">Owner Name</label>
              <input type="text" id="ownerName" placeholder="e.g. Rajesh Kumar" autocomplete="name">
            </div>
            <div class="input-group">
              <label class="floating-label" for="mobile">Mobile Number</label>
              <div class="phone-wrap">
                <span class="phone-prefix">+91</span>
                <input type="tel" id="mobile" placeholder="10-digit number" maxlength="10" pattern="[0-9]{10}" autocomplete="tel">
              </div>
            </div>
            <div class="input-group">
              <label class="floating-label" for="shopName">Shop Name</label>
              <input type="text" id="shopName" placeholder="e.g. Raju General Store" autocomplete="organization">
            </div>
            <div class="input-group">
              <label class="floating-label" for="shopCategory">Shop Category</label>
              <select id="shopCategory" required>
                <option value="" disabled selected>Select category…</option>
                <option value="GROCERY">Kirana / Grocery Store</option>
                <option value="MEDICINE">Medical / Pharmacy</option>
                <option value="CLOTHING">Clothing / Garments</option>
                <option value="ELECTRONIC">Electronics / Mobile Shop</option>
                <option value="RESTAURANT">Restaurant / Cafe / Bakery</option>
                <option value="OTHER">Other Business</option>
              </select>
            </div>
            <button type="button" id="newSendOtpBtn" class="primary">
              <span class="btn-text">Register Free Account &nbsp;<i class="fa-solid fa-bolt"></i></span>
              <div class="spinner"></div>
            </button>
          </form>

        </div>
      </div>
    </div>

    <div class="split-right" aria-hidden="true">
      <div class="ill-wrap">
        <div class="ill-badge">BHARATPOS</div>
        <div class="ill-square"></div>
        <div class="ill-circle ill-circle-a"></div>
        <div class="ill-circle ill-circle-b"></div>
        <div class="ill-circle ill-circle-c"></div>

        <div class="ill-cloud">
          <svg viewBox="0 0 500 340" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 170 120 Q 220 55 330 80 Q 430 58 462 160 Q 482 200 432 262 Q 382 305 282 294 Q 182 294 130 252 Q 80 210 170 120 Z" fill="#a8d5ff" opacity="0.50"/>
          </svg>
        </div>

        <div class="ill-mockup">
          <svg viewBox="0 0 460 290" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="55" y="18" width="350" height="240" rx="14" fill="white" fill-opacity=".75" stroke="#5a9adb" stroke-width="2.5"/>
            <rect x="55" y="18" width="350" height="28" rx="14" fill="#5a9adb"/>
            <rect x="55" y="32" width="350" height="14" fill="#5a9adb"/>
            <circle cx="72" cy="32" r="5" fill="white" opacity=".7"/>
            <circle cx="88" cy="32" r="5" fill="white" opacity=".7"/>
            <rect x="55" y="46" width="52" height="212" fill="#D6E6FF" fill-opacity=".75"/>
            <circle cx="81" cy="68"  r="9" fill="#7AA8F4"/>
            <circle cx="81" cy="92"  r="9" fill="#A5C0F0"/>
            <circle cx="81" cy="116" r="9" fill="#C9DAFD"/>
            <circle cx="81" cy="140" r="9" fill="#D6E6FF"/>
            <rect x="122" y="56"  width="82" height="7" rx="3.5" fill="#BDD2F7"/>
            <rect x="122" y="70"  width="60" height="7" rx="3.5" fill="#C9DAFD"/>
            <rect x="122" y="84"  width="98" height="7" rx="3.5" fill="#D0DFFC"/>
            <circle cx="304" cy="108" r="46" fill="#D6E4FF" fill-opacity=".9"/>
            <path d="M304 108 L304 62 A46 46 0 0 1 340 130 Z" fill="#5a9adb"/>
            <path d="M304 108 L340 130 A46 46 0 0 1 268 130 Z" fill="#87b5ff"/>
            <rect x="122" y="100" width="120" height="7" rx="3.5" fill="#BDD2F7"/>
            <rect x="122" y="114" width="90"  height="7" rx="3.5" fill="#C9DAFD"/>
            <rect x="122" y="128" width="110" height="7" rx="3.5" fill="#BDD2F7"/>
            <rect x="122" y="142" width="70"  height="7" rx="3.5" fill="#D0DFFC"/>
            <rect x="74"  y="188" width="20" height="46" rx="4" fill="#7AA8F4" fill-opacity=".85"/>
            <rect x="102" y="206" width="20" height="28" rx="4" fill="#BDD2F7" fill-opacity=".85"/>
            <rect x="130" y="176" width="20" height="58" rx="4" fill="#5a9adb" fill-opacity=".85"/>
            <rect x="158" y="200" width="20" height="34" rx="4" fill="#A5C0F0" fill-opacity=".75"/>
            <rect x="360" y="52" width="34" height="6" rx="3" fill="#BDD2F7"/>
            <rect x="360" y="66" width="34" height="6" rx="3" fill="#C9DAFD"/>
            <rect x="360" y="80" width="34" height="6" rx="3" fill="#BDD2F7"/>
            <rect x="360" y="94" width="34" height="6" rx="3" fill="#D0DFFC"/>
            <rect x="360" y="108" width="34" height="6" rx="3" fill="#BDD2F7"/>
          </svg>
        </div>

        <div class="ill-person ill-person-l">
          <svg viewBox="0 0 90 162" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="45" cy="91" rx="22" ry="38" fill="#5a7c99"/>
            <circle cx="45" cy="42" r="18" fill="#d4a574"/>
            <path d="M28 43Q30 22 45 20Q60 22 62 43Q55 31 45 33Q35 31 28 43Z" fill="#2D2D2D"/>
            <rect x="30" y="122" width="12" height="30" rx="6" fill="#4a6fb5"/>
            <rect x="48" y="122" width="12" height="30" rx="6" fill="#4a6fb5"/>
            <ellipse cx="36" cy="153" rx="10" ry="5" fill="#2D2D2D"/>
            <ellipse cx="54" cy="153" rx="10" ry="5" fill="#2D2D2D"/>
            <rect x="2" y="87" width="33" height="25" rx="4" fill="#D6E6FF" stroke="#87b5ff" stroke-width="1.4"/>
            <rect x="6"  y="92" width="6" height="4" rx="1" fill="#5a9adb"/>
            <rect x="14" y="92" width="6" height="4" rx="1" fill="#87b5ff"/>
            <rect x="22" y="92" width="6" height="4" rx="1" fill="#BDD2F7"/>
            <rect x="6"  y="99" width="4" height="9" rx="1" fill="#5a9adb" fill-opacity=".7"/>
            <rect x="12" y="103" width="4" height="5" rx="1" fill="#87b5ff" fill-opacity=".7"/>
            <rect x="18" y="101" width="4" height="7" rx="1" fill="#BDD2F7" fill-opacity=".7"/>
            <rect x="24" y="105" width="4" height="3" rx="1" fill="#C9DAFD" fill-opacity=".7"/>
          </svg>
        </div>

        <div class="ill-person ill-person-r">
          <svg viewBox="0 0 90 162" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="45" cy="91" rx="22" ry="38" fill="#4a6fb5"/>
            <circle cx="45" cy="42" r="18" fill="#d4a574"/>
            <path d="M28 45Q29 24 45 22Q61 24 62 45Q55 35 45 37Q35 35 28 45Z" fill="#2D2D2D"/>
            <rect x="30" y="122" width="12" height="30" rx="6" fill="#3D5FA8"/>
            <rect x="48" y="122" width="12" height="30" rx="6" fill="#3D5FA8"/>
            <ellipse cx="36" cy="153" rx="10" ry="5" fill="#4a6fb5"/>
            <ellipse cx="54" cy="153" rx="10" ry="5" fill="#4a6fb5"/>
            <rect x="64" y="78" width="22" height="14" rx="5" fill="#d4a574"/>
          </svg>
        </div>

      </div>
    </div>
  </div>

  <div id="idModal">
    <div class="id-card">
      <div class="logo-box" style="width:52px; height:52px; margin:0 auto 14px auto;">
        <img src="logo.png" alt="B" class="logo-img" onerror="this.style.display='none'">
      </div>
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; font-weight:700; letter-spacing:1.2px;">Welcome to BharatPOS</div>
      <h3 id="modalShopName">Shop Name</h3>
      <div style="font-size:12px; color:var(--text-muted);">Your Unique Merchant ID</div>
      <div class="id-value" id="generatedCode">-----</div>
      <button class="primary" id="btnEnterDashboard" style="width:100%;">Enter Dashboard &nbsp;<i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>

  <div id="shopSelectModal">
    <div>
      <h3 style="margin-top:0; color:var(--text-main);">🏢 Select Shop</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Multiple branches found for your number.</p>
      <div id="shopSelectList" style="display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto; padding-right:4px;"></div>
      <button class="primary" style="margin-top:16px; width:100%;" id="btnCancelShopSelect">Cancel</button>
    </div>
  </div>

  <script type="module" src="./js/pages/login.js"></script>
<script> 
  // Register Service Worker for PWA
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(registration => {
                console.log('ServiceWorker registered with scope:', registration.scope);
            })
            .catch(error => {
                console.log('ServiceWorker registration failed:', error);
            });
    });
}
</script>
</body>
</html>
