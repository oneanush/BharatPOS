<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mera Khata - Customer Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">

    <style>
        :root {
            --app-bg: #f4f7f6; --card-bg: #ffffff;
            --brand-primary: #6366f1; --brand-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --brand-accent: #f59e0b; --text-main: #1e293b; --text-sub: #64748b;
        }

        body { background: var(--app-bg); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; color: var(--text-main); }
        
        /* Top App Bar */
        .app-header { background: var(--card-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border-bottom: 1px solid #e2e8f0; gap: 10px; flex-wrap: wrap;}
        .app-brand { font-size: 20px; font-weight: 800; background: var(--brand-gradient); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Global Shop Selector */
        .shop-selector-wrapper { flex: 1; min-width: 150px; display: none; position: relative; }
        .shop-selector-wrapper i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--brand-primary); pointer-events: none; z-index: 10;}
        .shop-selector { width: 100%; appearance: none; background: #e0e7ff; color: var(--brand-primary); border: 1.5px solid #c7d2fe; padding: 8px 30px 8px 32px; border-radius: 20px; font-size: 13px; font-weight: 800; outline: none; cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;}
        .shop-selector-wrapper::after { content: '▼'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--brand-primary); font-size: 10px; pointer-events: none; }

        .user-chip { background: #f1f5f9; color: var(--text-sub); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .user-chip:hover { background: #e2e8f0; color: var(--danger); }
        
        /* Main Containers */
        .tab-view { display: none; padding: 16px 16px 90px 16px; animation: fadeIn 0.3s ease; min-height: calc(100vh - 140px); }
        .tab-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: space-around; padding: 12px 10px 24px 10px; z-index: 1000; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); text-decoration: none; font-size: 11px; font-weight: 700; width: 33%; transition: 0.2s; cursor: pointer;}
        .nav-item i { font-size: 20px; padding: 8px 16px; border-radius: 16px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item.active { color: var(--brand-primary); }
        .nav-item.active i { background: #e0e7ff; transform: translateY(-4px); }

        /* Auth Modal */
        .auth-overlay, .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
        .auth-box, .modal-box { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; position: relative;}
        .auth-input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; letter-spacing: 2px; outline: none; box-sizing: border-box;}
        .auth-input:focus { border-color: var(--brand-primary); }
        .btn-main { background: var(--brand-gradient); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); transition: 0.2s;}
        .btn-main:active { transform: scale(0.97); }
        .btn-close { position: absolute; right: 16px; top: 16px; background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 16px; color: var(--text-main); cursor: pointer; }
        
        .loader-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--brand-primary); }

        /* Thermal Receipt Styles */
        .thermal-receipt { background: #fff; width: 100%; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #000; line-height: 1.4; padding: 10px 0;}
        .thermal-header { text-align: center; border-bottom: 1.5px dashed #000; padding-bottom: 12px; margin-bottom: 12px; }
        .thermal-table { width: 100%; text-align: left; border-collapse: collapse; margin-bottom: 12px;}
        .thermal-table th, .thermal-table td { padding: 6px 2px; border-bottom: 1px dotted #ccc; vertical-align: top;}
        .thermal-totals { border-top: 1.5px dashed #000; padding-top: 12px; margin-top: 12px; }
        .thermal-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 700;}

        /* Map Route Box */
        .route-info-box { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--brand-primary); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 12px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none; align-items: center; gap: 8px;}
        
        /* Store Wizard */
        .wizard-step-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; max-height: 250px; overflow-y: auto;}
        .btn-wizard-opt { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; transition: 0.2s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .btn-wizard-opt:hover, .btn-wizard-opt.active { border-color: var(--brand-primary); background: #e0e7ff; color: var(--brand-primary);}
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-brand">Khata</div>
        <div class="shop-selector-wrapper" id="globalShopWrapper">
            <i class="fa-solid fa-store"></i>
            <select id="globalShopSelect" class="shop-selector"></select>
        </div>
        <div class="user-chip" id="btnProfile" style="display:none;" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></div>
    </header>

    <div id="globalLoader" class="loader-screen" style="display:none; height: 100vh; position:fixed; inset:0; background:var(--app-bg); z-index:1500;">
        <i class="fa-solid fa-circle-notch fa-spin fa-3x"></i>
        <p style="margin-top:16px; font-weight:800; font-size:16px;">Syncing Your Khata...</p>
    </div>

    <main id="tab-bills" class="tab-view active"><div id="billsContent"></div></main>
    <main id="tab-store" class="tab-view"><div id="storeContent"></div></main>
    <main id="tab-khoj" class="tab-view" style="padding:0;">
        <div class="loader-screen" id="khojLoader">
            <i class="fa-solid fa-map-location-dot fa-bounce fa-2x"></i>
            <p style="margin-top:12px; font-weight:700;">Initializing Radar...</p>
        </div>
        <div id="khojContent" style="height: calc(100vh - 140px); width: 100%; position:relative;"></div>
        <div id="routeInfoBox" class="route-info-box"><i class="fa-solid fa-route"></i> <span id="routeDistanceText">0 km</span></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" style="display:none;">
        <div class="nav-item active" data-target="tab-bills"><i class="fa-solid fa-file-invoice-dollar"></i><span>Bills</span></div>
        <div class="nav-item" data-target="tab-store"><i class="fa-solid fa-basket-shopping"></i><span>Order</span></div>
        <div class="nav-item" data-target="tab-khoj"><i class="fa-solid fa-radar"></i><span>Khoj</span></div>
    </nav>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <div style="font-size:40px; margin-bottom:16px;">👋</div>
            <h2 style="margin:0 0 8px 0; font-family:var(--font-head);">Welcome to Khata</h2>
            <p style="color:var(--text-sub); font-size:14px; margin-bottom:24px;">Enter your phone number to access your digital bills & local stores.</p>
            <input type="tel" id="loginPhone" class="auth-input" placeholder="10-digit Mobile No." maxlength="10">
            <button id="btnLoginBypass" class="btn-main">Enter Securely <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="receiptModal" class="modal-overlay">
        <div class="modal-box" style="padding: 20px 16px; background: #f8fafc; border-radius: 8px;">
            <button class="btn-close" onclick="document.getElementById('receiptModal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            <div class="thermal-receipt" id="receiptPaper"></div>
        </div>
    </div>

    <div id="storeWizardModal" class="modal-overlay">
        <div class="modal-box" style="padding: 24px;">
            <button class="btn-close" onclick="document.getElementById('storeWizardModal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="wizardProdName" style="margin:0 0 16px 0; font-family:var(--font-head); font-size:18px;">Product Name</h3>
            
            <div id="wizardStepType">
                <div style="font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; margin-bottom:10px;">Select Type/Size</div>
                <div class="wizard-step-grid" id="wizardVariantGrid"></div>
            </div>

            <div id="wizardStepBrand" style="display:none;">
                <div style="font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; margin-bottom:10px;">Select Brand</div>
                <div class="wizard-step-grid" id="wizardBrandGrid"></div>
            </div>

            <div id="wizardStepQty" style="display:none; text-align:center;">
                <div style="font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; margin-bottom:10px;">Quantity</div>
                <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
                    <button id="wizQtyMinus" style="width:40px; height:40px; border-radius:20px; border:none; background:#e2e8f0; font-size:20px; font-weight:800; cursor:pointer;">-</button>
                    <div id="wizQtyDisplay" style="font-size:28px; font-weight:800; font-family:'JetBrains Mono';">1</div>
                    <button id="wizQtyPlus" style="width:40px; height:40px; border-radius:20px; border:none; background:#e0e7ff; color:var(--brand-primary); font-size:20px; font-weight:800; cursor:pointer;">+</button>
                </div>
                <button id="wizAddToCart" class="btn-main"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script type="module" src="./js/pages/khata_main.js"></script>
</body>
</html>
