<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Finance HQ - BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════
       FINANCE HQ SPECIFIC LAYOUT & RESPONSIVENESS
    ═══════════════════════════════════════════════════════════ */
    .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; font-family: var(--font-body); }

    /* KPI Top Bar */
    .finance-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .fkpi-card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-card); padding: 20px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
    .fkpi-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
    .fkpi-card.balance::before { background: var(--primary); }
    .fkpi-card.in::before { background: var(--success); }
    .fkpi-card.out::before { background: var(--danger); }
    
    .fkpi-label { font-size: 12px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .fkpi-value { font-size: 28px; font-weight: 800; color: var(--text-main); font-family: 'JetBrains Mono', monospace; letter-spacing: -1px; }
    .fkpi-sub { font-size: 11px; color: var(--text-light); font-weight: 600; margin-top: 4px; }

    /* Tab Navigation (Scrollable on mobile) */
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; border-bottom: 1.5px solid var(--border); }
    .tab-container::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 12px 24px; border: none; background: transparent; font-size: 14px; font-weight: 800; color: var(--text-muted); cursor: pointer; transition: var(--trans); border-bottom: 3px solid transparent; white-space: nowrap; font-family: var(--font-head); }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Panels */
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    
    .panel { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-card); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1.5px dashed var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .panel-title { font-size: 16px; font-weight: 800; color: var(--text-main); margin: 0; font-family: var(--font-head); display: flex; align-items: center; gap: 8px; }
    
    /* Layouts */
    .expense-layout { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
    @media(min-width: 900px) { .expense-layout { grid-template-columns: 350px 1fr; } }
    
    .charts-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media(min-width: 900px) { .charts-layout { grid-template-columns: 2fr 1fr; } }

    /* Chart Wrappers (Crucial for mobile Canvas scaling) */
    .chart-wrapper { position: relative; height: 320px; width: 100%; }
    .chart-wrapper.pie-wrapper { height: 280px; }

    /* Expense List Items (Grid prevents overlap) */
    .expense-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
    .expense-item { 
        background: #f9f9f9; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; 
        display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; transition: var(--trans);
    }
    .expense-item:hover { background: var(--white); border-color: var(--primary); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
    
    .exp-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .exp-title { font-size: 14px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap;}
    
    .exp-amount { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; color: var(--danger); text-align: right; }
    
    .btn-delete-exp { background: transparent; border: 1px solid rgba(220,38,38,0.2); color: var(--danger); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--trans); }
    .btn-delete-exp:hover { background: var(--danger); color: white; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 40px; color: var(--border-hover); margin-bottom: 16px; }
    .empty-state p { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body class="lang-en">

<div class="container">
    
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;">
        <div>
            <h1 style="margin:0; font-size:24px; font-weight:800; font-family:var(--font-head); color:var(--text-main);">Finance HQ</h1>
            <div style="font-size:13px; color:var(--text-muted); font-weight:600; margin-top:4px;">Manage expenses and view real-time profit & loss.</div>
        </div>
        <select id="filterBranch" class="form-select" style="width:auto; font-weight:800; color:var(--primary); border-color:var(--primary); display:none;">
            <option value="all">🌍 All Branches</option>
        </select>
    </div>

    <div class="finance-kpi-grid">
        <div class="fkpi-card balance">
            <div class="fkpi-label">Current Balance <i class="fa-solid fa-wallet" style="color:var(--primary);"></i></div>
            <div class="fkpi-value" id="kpiBalance" style="color:var(--primary);">₹0</div>
            <div class="fkpi-sub">Net available cash/bank</div>
        </div>
        <div class="fkpi-card in">
            <div class="fkpi-label">Money In (Revenue) <i class="fa-solid fa-arrow-trend-up" style="color:var(--success);"></i></div>
            <div class="fkpi-value" id="kpiMoneyIn">₹0</div>
            <div class="fkpi-sub">Total sales collected</div>
        </div>
        <div class="fkpi-card out">
            <div class="fkpi-label">Money Out (Expense) <i class="fa-solid fa-arrow-trend-down" style="color:var(--danger);"></i></div>
            <div class="fkpi-value" id="kpiMoneyOut">₹0</div>
            <div class="fkpi-sub">Total business expenses</div>
        </div>
    </div>

    <div class="tab-container" id="financeTabs">
        <button class="tab-btn active" data-target="tab-expenses">Expense Book</button>
        <button class="tab-btn" data-target="tab-analytics">P&L Analytics</button>
    </div>

    <div id="tab-expenses" class="tab-content active">
        <div class="expense-layout">
            
            <div class="panel">
                <div class="panel-header" style="margin-bottom:15px; padding-bottom:10px;">
                    <h3 class="panel-title"><i class="fa-solid fa-file-invoice-dollar" style="color:var(--warning);"></i> Record Expense</h3>
                </div>
                <form id="formAddExpense">
                    <div class="form-group">
                        <label class="floating-label" style="position:static; margin-bottom:6px;">Amount (₹)</label>
                        <input type="number" id="expAmount" class="form-input" placeholder="0.00" required style="font-size:18px; font-weight:800; color:var(--danger);">
                    </div>
                    <div class="form-group">
                        <label class="floating-label" style="position:static; margin-bottom:6px;">Category</label>
                        <select id="expCategory" class="form-select" required>
                            <option value="Stock/Inventory">Stock / Inventory Purchase</option>
                            <option value="Rent">Shop Rent</option>
                            <option value="Electricity/Utility">Electricity / Utilities</option>
                            <option value="Staff Salary">Staff Salary</option>
                            <option value="Marketing">Marketing / Ads</option>
                            <option value="Maintenance">Repair & Maintenance</option>
                            <option value="Other">Other Expenses</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="floating-label" style="position:static; margin-bottom:6px;">Payment Mode</label>
                        <select id="expMode" class="form-select">
                            <option value="Cash">Cash</option>
                            <option value="Bank/UPI">Bank / UPI</option>
                            <option value="Credit">Credit (To pay later)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="floating-label" style="position:static; margin-bottom:6px;">Description / Notes</label>
                        <input type="text" id="expDesc" class="form-input" placeholder="e.g. Paid to supplier ABC">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px; background:linear-gradient(135deg, var(--danger), #b91c1c); box-shadow:0 4px 15px rgba(220,38,38,0.3);">
                        <i class="fa-solid fa-minus"></i> Deduct from Balance
                    </button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title"><i class="fa-solid fa-list" style="color:var(--text-main);"></i> Recent Expenses</h3>
                    <button id="btnDownloadCSV" class="btn btn-outline" style="width:auto; padding:6px 12px; font-size:12px;">
                        <i class="fa-solid fa-download"></i> CSV
                    </button>
                </div>
                <div class="expense-list" id="expenseListBody">
                    </div>
            </div>

        </div>
    </div>

    <div id="tab-analytics" class="tab-content">
        <div class="charts-layout">
            
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title"><i class="fa-solid fa-chart-area" style="color:var(--primary);"></i> 30-Day Income vs Expense Trend</h3>
                </div>
                <div class="chart-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title"><i class="fa-solid fa-chart-pie" style="color:var(--purple);"></i> Expense Breakdown</h3>
                </div>
                <div class="chart-wrapper pie-wrapper">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

        </div>
    </div>

</div>

<script type="module" src="./js/pages/my_dukkan.js"></script>

</body>
</html>
