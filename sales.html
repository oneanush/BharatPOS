
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Sales Audit - BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  
  <script src="bharatpos.js" defer></script>

  <style>
    :root {
      --bg-body: #0f172a; --bg-card: rgba(30, 41, 59, 0.6); --glass: blur(12px);
      --border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8;
      --accent: #f59e0b; --success: #10b981; --primary: #3b82f6; --danger: #ef4444;
    }

    * { box-sizing: border-box; outline: none; }
    body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; padding-bottom: 80px; }
    
    /* HEADER */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: var(--glass); }
    .brand { font-size: 18px; font-weight: 800; color: #fff; }
    .nav { display: flex; gap: 15px; }
    .nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .nav a:hover, .nav a.active { color: var(--accent); }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

    /* TOOLBAR */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
    .toolbar h3 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    
    .search-box { position: relative; flex-grow: 1; min-width: 200px; }
    .search-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 12px 12px 12px 38px; border-radius: 8px; font-size: 14px; }
    .search-icon { position: absolute; left: 12px; top: 13px; color: var(--text-muted); font-size: 14px; }

    .btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; justify-content: center; }
    .btn-report { background: var(--success); color: white; white-space: nowrap; }
    
    /* TABLE STYLES */
    .sales-grid { display: flex; flex-direction: column; gap: 8px; }
    
    /* Desktop Header */
    .grid-header { display: grid; grid-template-columns: 1.2fr 1.5fr 2fr 1fr 1fr; padding: 10px 15px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Rows */
    .sale-row { display: grid; grid-template-columns: 1.2fr 1.5fr 2fr 1fr 1fr; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 8px; align-items: center; transition: 0.2s; color: var(--text-main); font-size: 14px; border: 1px solid transparent; }
    .sale-row:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    
    .btn-view { padding: 6px 12px; background: rgba(255,255,255,0.1); color: #fff; border-radius: 6px; font-size: 11px; border: 1px solid var(--border); cursor: pointer; width: 100%; }
    .btn-view:hover { background: var(--primary); border-color: var(--primary); }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
        .grid-header { display: none; }
        .sale-row { display: flex; flex-direction: column; gap: 8px; padding: 15px; background: rgba(30, 41, 59, 0.8); }
        .row-top { display: flex; justify-content: space-between; width: 100%; }
        .row-mid { display: flex; flex-direction: column; width: 100%; }
        .m-id { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--accent); font-size: 12px; }
        .m-date { font-size: 11px; color: var(--text-muted); }
        .m-cust { font-weight: 600; color: white; font-size: 15px; }
        .m-amt { font-weight: 700; color: var(--success); font-size: 16px; }
    }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    
    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .date-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; color-scheme: dark; }
    
    .quick-filters { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
    .filter-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .filter-chip.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
    
    .export-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-action { padding: 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; }
    .btn-excel { background: #107c41; color: white; }
    .btn-pdf { background: #ef4444; color: white; }
    .btn-ca { grid-column: span 2; background: #25d366; color: white; margin-top: 5px; }

    /* FORMAL INVOICE STYLES (A4) */
    .invoice-paper { background: white; color: #000; width: 100%; max-width: 800px; padding: 30px; font-family: 'Times New Roman', serif; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    .inv-head { border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
    .inv-title { font-size: 22px; font-weight: bold; text-transform: uppercase; }
    .inv-grid { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; }
    .inv-grid th, .inv-grid td { border: 1px solid #ccc; padding: 6px; }
    .inv-grid th { background: #f3f3f3; font-weight: bold; text-align: center; }
    .inv-right { text-align: right; }
    .inv-summary { margin-left: auto; width: 280px; border: 1px solid #000; padding: 10px; font-size: 13px; }
    .inv-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .inv-bold { font-weight: bold; font-size: 14px; }
    
    @media print {
        body * { visibility: hidden; }
        .invoice-paper, .invoice-paper * { visibility: visible; }
        .invoice-paper { position: absolute; left: 0; top: 0; width: 100%; height: auto; box-shadow: none; padding: 0; margin: 0; }
        .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">BharatPOS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="sales.html" class="active">Sales</a>
    <a href="settings.html">Settings</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="toolbar">
      <h3><i class="fa-solid fa-file-invoice-dollar"></i> Sales Register</h3>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="searchBar" placeholder="Search Invoice / Name..." oninput="renderSales(this.value)">
      </div>
      <button onclick="openReportModal()" class="btn btn-report">
        <i class="fa-solid fa-file-export"></i> Report Center
      </button>
    </div>

    <div class="grid-header">
      <div>Date</div>
      <div>Invoice No</div>
      <div>Customer</div>
      <div style="text-align:right">Total</div>
      <div style="text-align:center">View</div>
    </div>

    <div id="salesList" class="sales-grid">
      </div>
  </div>
</div>

<div id="reportModal" class="modal-overlay">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px dashed var(--border); padding-bottom:10px;">
            <h3 style="margin:0; font-size:18px; color:white;">📅 Audit Reports</h3>
            <button onclick="document.getElementById('reportModal').style.display='none'" style="background:none; border:none; color:white; font-size:24px;">&times;</button>
        </div>
        
        <div class="quick-filters">
            <div class="filter-chip active" onclick="setDateFilter('today', this)">Today</div>
            <div class="filter-chip" onclick="setDateFilter('month', this)">This Month</div>
            <div class="filter-chip" onclick="setDateFilter('all', this)">All Time</div>
        </div>

        <div class="date-row">
            <div><label class="form-label" style="color:var(--text-muted); font-size:11px;">Start</label><input type="date" id="startDate" class="date-input"></div>
            <div><label class="form-label" style="color:var(--text-muted); font-size:11px;">End</label><input type="date" id="endDate" class="date-input"></div>
        </div>

        <div class="export-actions">
            <button onclick="exportExcel()" class="btn-action btn-excel"><i class="fa-solid fa-file-excel"></i> Excel (Detailed)</button>
            <button onclick="exportPDF()" class="btn-action btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF Ledger</button>
            <button onclick="sendToCA()" class="btn-action btn-ca"><i class="fa-brands fa-whatsapp"></i> Send Report to CA</button>
        </div>
    </div>
</div>

<div id="invoiceModal" class="modal-overlay" style="z-index: 3000;">
    <div class="invoice-paper" id="invoicePaper">
        </div>
</div>
<script type="module">
// 🟢 1. IMPORT FIREBASE SDK
import { db } from "./bharatpos.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- STATE ---
let allSales = [];
const isGstMode = localStorage.getItem('bharatpos_gst_mode') === 'true';
const shopGstin = localStorage.getItem('bharatpos_gstin') || "";

// --- INIT & FIREBASE SYNC ---
document.addEventListener("DOMContentLoaded", () => {
    loadSalesFromCloud();
    const today = new Date();
    document.getElementById('endDate').valueAsDate = today;
    document.getElementById('startDate').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 1);
});

async function loadSalesFromCloud() {
    const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    const container = document.getElementById('salesList');
    
    // Show quick local cache first for instant UI response
    allSales = JSON.parse(localStorage.getItem('bharatpos_sales') || '[]');
    allSales.sort((a, b) => new Date(b.date) - new Date(a.date));
    renderSales();

    if (!user.merchantId) return;

    try {
        if(container) container.innerHTML = `<div style="text-align:center; padding:10px; color:var(--accent); font-size:12px;"><i class="fa-solid fa-cloud-arrow-down fa-beat"></i> Syncing latest bills...</div>` + container.innerHTML;

        // 🟢 FIREBASE: Fetch absolute latest bills from cloud
        const salesRef = collection(db, "shops", user.merchantId, "sales");
        const snapshot = await getDocs(salesRef);
        
        const fetchedSales = [];
        snapshot.forEach(doc => fetchedSales.push(doc.data()));
        
        // Sort newest first
        fetchedSales.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        allSales = fetchedSales;
        localStorage.setItem('bharatpos_sales', JSON.stringify(allSales));
        renderSales();
    } catch (e) {
        console.warn("Firebase fetch failed, relying on local cache.", e);
        renderSales();
    }
}

// 🟢 TAX CALCULATOR HELPER (With Safety Fallbacks)
function calculateTaxDetails(sale) {
    let taxable = 0, totalTax = 0;
    const amount = parseFloat(sale.amount || sale.total || 0) || 0;
    
    if(sale.tax && parseFloat(sale.tax) > 0) {
        totalTax = parseFloat(sale.tax);
        taxable = amount - totalTax;
    } else {
        taxable = amount;
        totalTax = 0;
    }
    
    return {
        taxable: taxable,
        totalTax: totalTax,
        cgst: totalTax / 2,
        sgst: totalTax / 2,
        total: amount
    };
}

window.renderSales = function(filterText = "") {
    const container = document.getElementById('salesList');
    if(!container) return;
    const term = filterText.toLowerCase();
    
    const filtered = allSales.filter(s => {
        const inv = (s.id || s.invoiceNo || '').toLowerCase();
        const cust = (s.customerName || s.customer || '').toLowerCase();
        return inv.includes(term) || cust.includes(term);
    });

    if(filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">No records found.</div>`;
        return;
    }

    container.innerHTML = filtered.map(s => {
        const invId = s.id || s.invoiceNo;
        const total = Number(s.amount || s.total || 0).toFixed(2);
        const dateStr = new Date(s.date).toLocaleDateString('en-IN');
        const custName = s.customerName || 'Walk-in';

        if(window.innerWidth > 768) {
            return `
            <div class="sale-row">
                <div style="color:var(--text-muted)">${dateStr}</div>
                <div style="font-family:'JetBrains Mono'; font-weight:700;">#${invId}</div>
                <div>${custName}</div>
                <div style="text-align:right; font-weight:700; color:var(--success);">₹${total}</div>
                <div style="text-align:center;"><button onclick="window.viewFormalInvoice('${invId}')" class="btn-view">View Bill</button></div>
            </div>`;
        } else {
            return `
            <div class="sale-row">
                <div class="row-top">
                    <span class="m-id">#${invId}</span>
                    <span class="m-date">${dateStr}</span>
                </div>
                <div class="row-mid">
                    <span class="m-cust">${custName}</span>
                    <span class="m-amt">₹${total}</span>
                </div>
                <div style="margin-top:10px;">
                    <button onclick="window.viewFormalInvoice('${invId}')" class="btn-view">View Invoice</button>
                </div>
            </div>`;
        }
    }).join('');
}

// --- REPORTING ---
window.openReportModal = function() { document.getElementById('reportModal').style.display = 'flex'; }
window.closeReportModal = function() { document.getElementById('reportModal').style.display = 'none'; }

window.setDateFilter = function(type, btn) {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const end = new Date();
    let start = new Date();
    if(type === 'month') start = new Date(end.getFullYear(), end.getMonth(), 1);
    if(type === 'all') start = new Date('2020-01-01');
    document.getElementById('endDate').valueAsDate = end;
    document.getElementById('startDate').valueAsDate = start;
}

function getFilteredData() {
    const startInput = document.getElementById('startDate').value;
    const endInput = document.getElementById('endDate').value;
    if(!startInput || !endInput) return allSales;
    
    const s = new Date(startInput);
    const e = new Date(endInput);
    e.setHours(23, 59, 59);
    
    return allSales.filter(sale => { 
        const d = new Date(sale.date); 
        return d >= s && d <= e; 
    });
}

// 🟢 UPGRADED EXCEL EXPORT (Professional Formatting)
window.exportExcel = function() {
    const data = getFilteredData();
    if(!data.length) return alert("No sales in selected range.");
    
    let rows = [];
    data.forEach(s => {
        const taxDetails = calculateTaxDetails(s);
        rows.push({
            "Date": new Date(s.date).toLocaleDateString(),
            "Invoice No": s.id || s.invoiceNo,
            "Customer": s.customerName || 'Walk-in',
            "Payment Mode": s.paymentMode || 'Cash',
            "Taxable Value": taxDetails.taxable.toFixed(2),
            "CGST Amount": taxDetails.cgst.toFixed(2),
            "SGST Amount": taxDetails.sgst.toFixed(2),
            "Total Tax": taxDetails.totalTax.toFixed(2),
            "Total Amount": taxDetails.total.toFixed(2)
        });
    });
    
    const ws = XLSX.utils.json_to_sheet(rows);
    
    // Auto-adjust column widths for professional look
    ws['!cols'] = [
        {wch: 12}, {wch: 15}, {wch: 20}, {wch: 15}, 
        {wch: 15}, {wch: 15}, {wch: 15}, {wch: 12}, {wch: 15}
    ];
    
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "GST_Sales_Ledger");
    XLSX.writeFile(wb, `BharatPOS_Ledger_${Date.now()}.xlsx`);
}

// 🟢 UPGRADED PDF LEDGER EXPORT (Right-aligned Accounting Standards)
window.exportPDF = function() {
    const data = getFilteredData();
    if(!data.length) return alert("No sales in selected range.");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4'); 
    
    const shopName = localStorage.getItem('shopName') || "BharatPOS Merchant";
    
    doc.setFontSize(16); 
    doc.setTextColor(41, 128, 185);
    doc.text("SALES TAX LEDGER", 14, 15);
    
    doc.setFontSize(10); 
    doc.setTextColor(100, 100, 100);
    doc.text(`Business Name: ${shopName}`, 14, 22);
    if(shopGstin) doc.text(`GSTIN: ${shopGstin}`, 14, 27);
    
    let grandTotal = 0;
    let grandTax = 0;
    
    const tableData = data.map(s => {
        const t = calculateTaxDetails(s);
        grandTotal += t.total;
        grandTax += t.totalTax;
        return [
            new Date(s.date).toLocaleDateString(),
            s.id || s.invoiceNo,
            s.customerName || 'Walk-in',
            t.taxable.toFixed(2),
            t.cgst.toFixed(2),
            t.sgst.toFixed(2),
            t.total.toFixed(2)
        ];
    });

    doc.autoTable({
        head: [['Date', 'Invoice#', 'Customer', 'Taxable (Rs)', 'CGST (Rs)', 'SGST (Rs)', 'Total (Rs)']],
        body: tableData,
        startY: 35,
        theme: 'grid',
        headStyles: { fillColor: [41, 128, 185], textColor: [255, 255, 255] },
        columnStyles: {
            3: { halign: 'right' },
            4: { halign: 'right' },
            5: { halign: 'right' },
            6: { halign: 'right', fontStyle: 'bold' }
        }
    });
    
    // Summary Section at the bottom
    let finalY = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(12);
    doc.setTextColor(0, 0, 0);
    doc.text(`Total Revenue: Rs ${grandTotal.toFixed(2)}`, 14, finalY);
    doc.text(`Total Tax Collected: Rs ${grandTax.toFixed(2)}`, 14, finalY + 7);
    
    doc.save(`Sales_Ledger_${Date.now()}.pdf`);
}

window.sendToCA = function() {
    const data = getFilteredData();
    if(!data.length) return alert("No data in range.");
    
    let totalSale = 0, totalTax = 0;
    data.forEach(s => {
        const t = calculateTaxDetails(s);
        totalSale += t.total;
        totalTax += t.totalTax;
    });
    
    let msg = `*GST Report for CA*%0A`;
    msg += `Shop: ${localStorage.getItem('shopName') || 'Store'}%0A`;
    msg += `GSTIN: ${shopGstin || 'N/A'}%0A`;
    msg += `Period: ${document.getElementById('startDate').value} to ${document.getElementById('endDate').value}%0A`;
    msg += `Total Sales: ₹${totalSale.toFixed(2)}%0A`;
    msg += `Total GST Collected: ₹${totalTax.toFixed(2)}%0A%0A`;
    msg += `(Please find the attached Excel/PDF file for detailed invoice breakdown)`;
    
    window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// 🟢 FORMAL INVOICE VIEW
window.viewFormalInvoice = function(invId) {
    const sale = allSales.find(s => (s.id == invId) || (s.invoiceNo == invId));
    if(!sale) return;

    const shop = localStorage.getItem('shopName') || "BharatPOS Store";
    const address = localStorage.getItem('shopAddress') || "";
    const t = calculateTaxDetails(sale);
    const isGST = t.totalTax > 0;

    let rows = (sale.items || []).map((it, idx) => {
        let baseRate = parseFloat(it.basePrice || it.price || 0);
        // Calculation fallback if basePrice missing in item
        if(isGST && !it.basePrice && it.gstRate) {
             baseRate = parseFloat(it.price) / (1 + (parseFloat(it.gstRate)/100));
        }
        let taxableRow = baseRate * parseFloat(it.qty || 1);
        let finalRowPrice = parseFloat(it.price || 0) * parseFloat(it.qty || 1);
        
        return `
        <tr>
            <td style="text-align:center">${idx+1}</td>
            <td>${it.name} ${isGST && it.hsn ? '<br><small>HSN:'+it.hsn+'</small>' : ''}</td>
            <td style="text-align:center">${it.qty}</td>
            <td class="inv-right">${baseRate.toFixed(2)}</td>
            ${isGST ? `<td class="inv-right">${taxableRow.toFixed(2)}</td>` : ''}
            <td class="inv-right">${finalRowPrice.toFixed(2)}</td>
        </tr>`;
    }).join('');

    let taxHtml = '';
    if(isGST) {
        taxHtml = `
            <div class="inv-row"><span>Taxable Amount:</span><span>₹${t.taxable.toFixed(2)}</span></div>
            <div class="inv-row"><span>CGST:</span><span>₹${t.cgst.toFixed(2)}</span></div>
            <div class="inv-row"><span>SGST:</span><span>₹${t.sgst.toFixed(2)}</span></div>
            <hr style="margin:5px 0">`;
    }

    const html = `
        <div class="inv-head">
            <div>
                <div class="inv-title">TAX INVOICE</div>
                <div><strong>${shop}</strong></div>
                <div style="font-size:12px;">${address}</div>
                ${shopGstin ? `<div>GSTIN: <strong>${shopGstin}</strong></div>` : ''}
            </div>
            <div style="text-align:right">
                <div>Inv: <strong>${invId}</strong></div>
                <div>Date: ${new Date(sale.date).toLocaleDateString()}</div>
                <div style="font-size:11px; margin-top:5px; color:var(--text-muted);">${sale.paymentMode || 'Cash'}</div>
            </div>
        </div>
        <div style="border:1px solid #ccc; padding:8px; margin-bottom:15px; background:rgba(255,255,255,0.02);">
            <strong>Bill To:</strong> ${sale.customerName || 'Walk-in Customer'} ${sale.phone ? `(${sale.phone})` : ''}
        </div>
        <table class="inv-grid">
            <thead>
                <tr>
                    <th style="width:30px">#</th>
                    <th>Item</th>
                    <th style="width:40px">Qty</th>
                    <th class="inv-right">Rate</th>
                    ${isGST ? '<th class="inv-right">Taxable</th>' : ''}
                    <th class="inv-right">Total</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
        
        <div class="inv-total-box">
            <div class="inv-summary">
                <div class="inv-row"><span>SubTotal:</span><span>₹${t.total.toFixed(2)}</span></div>
                ${parseFloat(sale.discount || 0) > 0 ? `<div class="inv-row" style="color:var(--danger);"><span>Discount:</span><span>-₹${parseFloat(sale.discount).toFixed(2)}</span></div>` : ''}
                ${taxHtml}
                <div class="inv-row" style="font-weight:bold; font-size:16px;">
                    <span>Grand Total:</span><span>₹${t.total.toFixed(2)}</span>
                </div>
            </div>
        </div>
        
        <div class="no-print" style="text-align:center; margin-top:20px; display: flex; gap: 10px; justify-content: center;">
            <button onclick="window.print()" class="btn btn-report">🖨 Print</button>
            <button onclick="document.getElementById('invoiceModal').style.display='none'" class="btn" style="background:var(--text-muted);">Close</button>
        </div>
    `;
    
    document.getElementById('invoicePaper').innerHTML = html;
    document.getElementById('invoiceModal').style.display = 'flex';
}

window.addEventListener('resize', () => {
    const searchBar = document.getElementById('searchBar');
    window.renderSales(searchBar ? searchBar.value : "");
});
</script>
</body>
</html>
