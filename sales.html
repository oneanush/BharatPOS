<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Sales Ledger - BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════
       SALES SPECIFIC LAYOUT & CARDS (Overlap Fixes Applied)
    ═══════════════════════════════════════════════════════════ */
    .filter-bar { background: var(--white); border: 1.5px solid var(--border); padding: 16px; border-radius: var(--radius-card); margin-bottom: 20px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    
    /* Fixed Filter Inputs for Mobile */
    .filter-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 250px; }
    .filter-input { width: 100%; background: #f9f9f9; border: 1.5px solid var(--border); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; transition: var(--trans); color: var(--text-main); font-family: var(--font-body); box-sizing: border-box;}
    .filter-input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px var(--primary-glow); }
    
    .search-box-wide { position: relative; flex: 2; min-width: 200px; }
    .search-box-wide i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 14px; pointer-events: none; }
    .search-box-wide input { width: 100%; padding: 10px 14px 10px 40px; background: #f9f9f9; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; transition: var(--trans); color: var(--text-main); font-family: var(--font-body); box-sizing: border-box;}
    .search-box-wide input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px var(--primary-glow); }

    .header-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }

    /* Fixed Grid to prevent card squishing */
    .sales-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
    
    .invoice-card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-card); padding: 16px; box-shadow: var(--shadow-sm); transition: var(--trans); display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;}
    .invoice-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    
    .inv-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1.5px dashed var(--border); padding-bottom: 10px; }
    .inv-id { font-size: 14px; font-weight: 800; color: var(--text-main); font-family: var(--font-head); }
    .inv-date { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
    
    .inv-amount { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: var(--success); text-align: right; }
    .inv-mode { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-top: 4px;}
    
    /* Dynamic Payment Badges */
    .mode-cash { background: var(--success-soft); color: var(--success); }
    .mode-online { background: var(--purple-soft); color: var(--purple); }
    .mode-udhaar { background: var(--danger-soft); color: var(--danger); }
    .mode-partial { background: var(--warning-soft); color: var(--warning); }
    .mode-settled { background: var(--border); color: var(--text-muted); }

    .inv-body { display: flex; flex-direction: column; gap: 6px; }
    .inv-customer { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .inv-items { font-size: 11px; color: var(--text-muted); font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .inv-footer { display: flex; justify-content: flex-end; gap: 8px; border-top: 1.5px solid var(--bg-input); padding-top: 12px; margin-top: auto; }
    .btn-action { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: var(--trans); display: flex; align-items: center; gap: 6px; border: 1.5px solid transparent; background: transparent; font-family: var(--font-body);}
    .btn-view { color: var(--primary); background: var(--primary-soft); }
    .btn-view:hover { background: var(--primary); color: white; }
    .btn-delete { color: var(--danger); border-color: rgba(220,38,38,0.2); }
    .btn-delete:hover { background: var(--danger); color: white; }

    /* ═══════════════════════════════════════════════════════════
       INVOICE PRINT MODAL
    ═══════════════════════════════════════════════════════════ */
    .invoice-paper { background: white; padding: 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #000; line-height: 1.5; border: 1px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px;}
    .inv-paper-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 12px; margin-bottom: 12px; }
    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .inv-table th { border-bottom: 1px dashed #000; padding: 6px 2px; text-align: left; }
    .inv-table td { padding: 8px 2px; vertical-align: top; border-bottom: 1px dotted #ccc; }
    .inv-table tr:last-child td { border-bottom: none; }
    .inv-right { text-align: right !important; }
    .inv-center { text-align: center !important; }
    .inv-totals { border-top: 1px dashed #000; padding-top: 12px; }
    .inv-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  </style>
</head>
<body class="lang-en">

<div class="container">
    
    <div class="header-controls" style="margin-top: 20px;">
        <h2 style="margin:0; font-family:var(--font-head); font-weight:800; font-size:22px;"><i class="fa-solid fa-book-journal-whills" style="color:var(--primary);"></i> Sales Ledger</h2>
        <div style="display:flex; gap:10px;">
            <button id="btnExportExcel" class="btn btn-outline" style="border-color:#10b981; color:#10b981;"><i class="fa-solid fa-file-excel"></i> Excel</button>
            <button id="btnExportPDF" class="btn btn-outline" style="border-color:#ef4444; color:#ef4444;"><i class="fa-solid fa-file-pdf"></i> PDF</button>
        </div>
    </div>

    <div class="kpi-grid" style="margin-bottom: 20px;">
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--success-soft); color:var(--success);"><i class="fa-solid fa-money-bill-wave"></i></div>
            <div class="kpi-details">
                <h4>Net Sales (Cash+Online)</h4>
                <div class="value" id="kpiTotalSales">₹0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--blue-50); color:var(--primary);"><i class="fa-solid fa-receipt"></i></div>
            <div class="kpi-details">
                <h4>Total Invoices</h4>
                <div class="value" id="kpiTotalBills">0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--purple-soft); color:var(--purple);"><i class="fa-solid fa-chart-pie"></i></div>
            <div class="kpi-details">
                <h4>Average Ticket Size</h4>
                <div class="value" id="kpiAvgBill">₹0</div>
            </div>
        </div>
        <div class="kpi-card glass-panel">
            <div class="kpi-icon" style="background:var(--danger-soft); color:var(--danger);"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <div class="kpi-details">
                <h4>Pending Udhaar</h4>
                <div class="value" id="kpiUdhaar">₹0</div>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <input type="date" id="startDate" class="filter-input">
            <span style="font-size:12px; font-weight:800; color:var(--text-muted);">TO</span>
            <input type="date" id="endDate" class="filter-input">
        </div>
        
        <div class="filter-group">
            <select id="filterMode" class="filter-input">
                <option value="ALL">All Payment Modes</option>
                <option value="Cash">Cash</option>
                <option value="Online">Online (UPI/Card)</option>
                <option value="Partial">Partial / Mixed</option>
                <option value="Udhaar">Udhaar (Pending)</option>
                <option value="Settled">Settled Dues</option>
            </select>
        </div>

        <div class="search-box-wide">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by Bill No, Customer, or Phone..." autocomplete="off">
        </div>
    </div>

    <div class="sales-grid" id="salesGrid">
        </div>
    
    <div id="loadMoreTrigger" style="text-align: center; padding: 24px; color: var(--text-muted); font-weight: 600; display:none;">
        Loading more invoices…
    </div>

</div>

<div id="invoiceModal" class="modal-overlay" style="z-index: 10000; background:rgba(0,0,0,0.8);">
    <div class="modal-box" style="max-width:400px; border-radius:0; max-height:100vh; overflow-y:auto; background:#f1f5f9; padding:20px;">
        <div id="invoicePaper" class="invoice-paper"></div>
        <div class="no-print" style="display:flex; gap:10px; margin-top:15px;">
            <button id="btnPrintInvoice" class="btn btn-primary" style="flex:1;"><i class="fa-solid fa-print"></i> Print Receipt</button>
            <button id="btnCloseInvoice" class="btn btn-outline" style="flex:1;">Close</button>
        </div>
    </div>
</div>

<script type="module" src="./js/pages/sales.js"></script>

</body>
</html>
