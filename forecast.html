<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>DemandMitra AI • BharatPOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════
       FORECAST SPECIFIC LAYOUT & RESPONSIVENESS
    ═══════════════════════════════════════════════════════════ */
    .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; font-family: var(--font-body); }
    
    .forecast-panel {
        background: var(--white); border: 1.5px solid var(--border);
        border-radius: var(--radius-card); padding: 24px;
        box-shadow: var(--shadow-card);
    }
    
    .panel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 15px; border-bottom: 1.5px dashed var(--border); }
    .panel-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--blue-50); color: var(--primary); }
    .panel-title h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; font-family: var(--font-head); color: var(--text-main); }
    .panel-title p { margin: 0; font-size: 12px; color: var(--text-muted); font-weight: 600; }

    .control-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; align-items: flex-end; }
    .selector-wrapper { flex: 1; min-width: 250px; }
    
    /* Responsive Chart Wrapper to prevent overlap/overflow on mobile */
    .chart-wrapper { position: relative; height: 350px; width: 100%; margin-bottom: 24px; background: #f9f9f9; border-radius: 12px; border: 1.5px solid var(--border); padding: 10px; box-sizing: border-box;}
    @media(max-width: 600px) { .chart-wrapper { height: 280px; padding: 5px; } }

    /* AI Message Box */
    .ai-msg-box {
        background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px;
        padding: 24px; position: relative; overflow: hidden; display: none;
        animation: slideUp 0.4s ease-out;
    }
    .ai-msg-box.alert { background: #FEF2F2; border-color: #FECACA; }
    
    .ai-msg-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    
    .ai-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .badge-normal { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: #FEF3C7; color: #D97706; }
    .badge-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220,38,38,0.2); }
    
    .ai-reason { font-size: 14px; color: var(--text-main); line-height: 1.6; font-weight: 600; margin-bottom: 20px; }
    
    .stock-info { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .stock-stat { background: var(--white); border: 1.5px solid var(--border); padding: 12px 16px; border-radius: 10px; flex: 1; min-width: 120px; text-align: center; }
    .stock-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .stock-stat-val { font-size: 20px; font-weight: 800; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    
    .btn-restock { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; transition: var(--trans); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(220,38,38,0.3); width: 100%; font-family: var(--font-body); text-transform: uppercase;}
    .btn-restock:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(220,38,38,0.4); }
    
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 40px; color: var(--border-hover); margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
  </style>
</head>
<body class="lang-en">

<div class="container">
    <div class="forecast-panel">
        
        <div class="panel-header">
            <div class="panel-icon"><i class="fa-solid fa-chart-line"></i></div>
            <div class="panel-title">
                <h2>Product Demand Forecaster</h2>
                <p>Select a product to analyze its 30-day historical data and predict the next 7 days of demand.</p>
            </div>
        </div>

        <div class="control-row">
            <div class="selector-wrapper">
                <label class="floating-label" style="position:static; display:block; margin-bottom:8px; font-size:12px;">Select Product to Analyze</label>
                <select id="productSelect" class="form-select" style="font-weight:700;">
                    <option value="">Loading products...</option>
                </select>
            </div>
            <button id="btnPredict" class="btn btn-primary" style="padding: 11px 24px; min-width: 140px;">
                <i class="fa-solid fa-brain"></i> Run AI Forecast
            </button>
        </div>

        <div class="chart-wrapper">
            <canvas id="forecastChart"></canvas>
        </div>

        <div id="aiMsgBox" class="ai-msg-box">
            <div class="ai-msg-header">
                <div class="ai-badge" id="aiStatusBadge">Status</div>
                <div class="ai-badge badge-warning" id="aiQuantityBadge" style="display:none;"></div>
            </div>
            
            <div class="ai-reason" id="aiReason">AI Analysis will appear here.</div>
            
            <div class="stock-info">
                <div class="stock-stat">
                    <div class="stock-stat-label">Current Stock</div>
                    <div class="stock-stat-val" id="statCurrentStock">0</div>
                </div>
                <div class="stock-stat">
                    <div class="stock-stat-label">Predicted 7-Day Demand</div>
                    <div class="stock-stat-val" style="color:var(--primary);" id="statPredictedDemand">0</div>
                </div>
            </div>

            <button id="btnRestock" class="btn-restock" style="display:none;">
                <i class="fa-solid fa-cart-plus"></i> Auto-Fill Inventory
            </button>
        </div>

    </div>
</div>

<script type="module" src="./js/pages/forecast.js"></script>

</body>
</html>
