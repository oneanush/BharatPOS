<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Products - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="quagga.js"></script>
  <script src="bharatpos.js" defer></script>

  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-body: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.6);
      --glass: blur(12px);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b; /* Bharat POS Gold */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding-bottom: 80px;
    }

    /* BACKGROUND MESH */
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05), transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05), transparent 40%);
      z-index: -1; pointer-events: none;
    }

    /* --- NAVIGATION --- */
    nav {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 15px 20px; gap: 15px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: var(--glass);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
    nav a:hover { color: var(--accent); }
    
    .profile-name {
      font-weight: 700; color: var(--accent);
      padding: 6px 12px; border: 1px solid var(--accent);
      border-radius: 20px; background: rgba(245, 158, 11, 0.1);
      font-size: 13px; margin-left: 10px;
    }

    /* --- HEADER --- */
    .header {
      padding: 20px; display: flex; align-items: center; justify-content: space-between;
      max-width: 1200px; margin: 0 auto;
    }
    .global-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .brand { font-size: 20px; font-weight: 800; margin-left: 10px; flex-grow: 1; color: #fff; }
    .nav a { margin-left: 15px; font-size: 14px; }

    /* --- LAYOUT --- */
    .main-container {
      display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px;
      max-width: 1200px; margin: 0 auto; padding: 0 20px;
    }
    @media(max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

    .card {
      background: var(--bg-card); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    h3 { margin: 0 0 20px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    /* --- SCANNER HUD --- */
    .scanner-section { max-width: 1200px; margin: 0 auto 20px auto; padding: 0 20px; }
    .scan-controls { display: flex; gap: 10px; margin-bottom: 15px; }
    
    .btn-scan {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer; transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-start { background: var(--accent); color: #000; }
    .btn-stop { background: var(--input-bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn-reset { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); }
    .btn-scan:active { transform: scale(0.96); }

    .camera-wrapper {
      position: relative; border-radius: 12px; overflow: hidden;
      background: #000; display: none; 
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); border: 1px solid var(--accent);
    }
    #cameraPreview { width: 100%; height: 300px; object-fit: cover; display: block; }
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: var(--success); box-shadow: 0 0 10px var(--success);
      animation: scanMove 2s infinite linear; z-index: 10;
    }
    @keyframes scanMove { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    /* --- FORM --- */
    .form-row { margin-bottom: 16px; position: relative; }
    input {
      width: 100%; padding: 14px 12px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: #fff; font-size: 14px; transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
    input::placeholder { color: transparent; } 

    .floating-label {
      position: absolute; left: 12px; top: 14px; color: var(--text-muted);
      font-size: 14px; pointer-events: none; transition: 0.2s;
    }
    input:focus ~ .floating-label,
    input:not(:placeholder-shown) ~ .floating-label {
      top: -8px; left: 10px; font-size: 11px; color: var(--accent);
      background: var(--bg-body); padding: 0 4px; border-radius: 4px;
    }

    button[type="submit"] {
      width: 100%; background: var(--success); color: #fff;
      padding: 14px; border: none; border-radius: 8px; font-weight: 700;
      cursor: pointer; font-size: 15px; margin-top: 10px;
    }

    /* --- INVENTORY LIST (TABLE) --- */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--text-muted); font-size: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .delete-btn {
      background: rgba(239, 68, 68, 0.2); color: var(--danger);
      border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .delete-btn:hover { background: var(--danger); color: white; }

    /* --- MOBILE LIST FIX (COMPACT CARD) --- */
    @media (max-width: 600px) {
      .card { padding: 15px; } /* Less padding on container */
      
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; } /* Hide headers */
      
      /* Card Container */
      tr {
        display: grid;
        grid-template-columns: 1fr auto; /* Name area | Action area */
        gap: 4px;
        background: rgba(255,255,255,0.03);
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        align-items: center;
      }

      /* Reset Cells */
      td { padding: 0; border: none; }

      /* 1. Name: Top Left, Bold */
      td:nth-child(1) {
        grid-column: 1; grid-row: 1;
        font-weight: 600; font-size: 14px; color: #fff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* 2. Price: Top Right, Gold */
      td:nth-child(3) {
        grid-column: 2; grid-row: 1;
        text-align: right; font-weight: 700; color: var(--accent); font-size: 14px;
      }

      /* 3. Info Row: Bottom Left (Stock + Category) */
      td:nth-child(4) {
        grid-column: 1; grid-row: 2;
        font-size: 11px; color: var(--text-muted);
        display: flex; align-items: center; gap: 8px;
      }
      /* Inject Context via CSS */
      td:nth-child(4)::before { content: "Stock: "; opacity: 0.7; }
      
      /* 4. Delete Button: Bottom Right */
      td:nth-child(7) {
        grid-column: 2; grid-row: 2;
        text-align: right;
      }
      .delete-btn { padding: 4px 10px; font-size: 10px; }

      /* Hide less critical info on mobile to save space */
      td:nth-child(2), /* Qty */
      td:nth-child(5), /* Tax */
      td:nth-child(6)  /* Category */
      { display: none; }
    }

    /* --- TOAST --- */
    #toast {
      visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff;
      text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000;
      right: 20px; bottom: 30px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      opacity: 0; transition: opacity 0.3s, bottom 0.3s;
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
  </style>
</head>
<body>

<nav>
   <a href="sales.html">Sales</a>
   <a href="settings.html">Settings</a>
   <a href="index.html">About</a>
   <div id="profileName" class="profile-name"></div>
</nav>

<div class="header">
  <div style="display:flex; align-items:center;">
      <img src="logo.png" class="global-logo" alt="Logo">
      <div class="brand">Bharat POS</div>
  </div>
  <div class="nav">
    <a href="dashboard.html" style="color:var(--accent);">Dashboard</a>
    <a href="billing.html" style="color:#fff;">Billing</a>
  </div>
</div>

<div class="scanner-section">
  <div class="scan-controls">
    <button type="button" class="btn-scan btn-start" onclick="uiStartScan()">
      <span>📷 AI Scan</span>
    </button>
    <button type="button" class="btn-scan btn-stop" onclick="uiStopScan()">
      <span>⛔ Stop</span>
    </button>
    <button type="button" class="btn-scan btn-reset" onclick="resetAIScan()">
      <span>🔄 Next Item</span>
    </button>
  </div>

  <div id="cameraContainer" class="camera-wrapper">
    <div class="scan-line"></div>
    <video id="cameraPreview" autoplay playsinline></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>
  </div>
  <div id="barcodePreview" style="margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:12px;"></div>
</div>

<div class="main-container">
  
  <div class="card">
    <h3>Add New Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      
      <div class="form-row">
        <input id="productName" placeholder=" " required>
        <label for="productName" class="floating-label">Product Name (e.g. Amul Milk)</label>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="position:relative;">
            <input id="productQuantity" placeholder=" ">
            <label for="productQuantity" class="floating-label">Qty/Unit</label>
        </div>
        <div style="position:relative;">
            <input id="productPrice" type="number" step="0.01" placeholder=" " required>
            <label for="productPrice" class="floating-label">Price (₹)</label>
        </div>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="position:relative;">
            <input id="productStock" type="number" placeholder=" ">
            <label for="productStock" class="floating-label">Stock Qty</label>
        </div>
        <div style="position:relative;">
            <input id="productTax" type="number" placeholder=" ">
            <label for="productTax" class="floating-label">Tax %</label>
        </div>
      </div>

      <div class="form-row">
        <input id="productCategory" placeholder=" ">
        <label for="productCategory" class="floating-label">Category (Optional)</label>
      </div>

      <div class="form-row" style="border-top:1px dashed var(--border); padding-top:15px; margin-top:5px;">
        <input type="text" id="productBarcode" placeholder=" " style="font-family:'JetBrains Mono'; color:var(--accent);">
        <label for="productBarcode" class="floating-label">Barcode / SKU</label>
      </div>

      <div class="form-row">
        <button type="submit">Save Product to Inventory</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Inventory List</h3>
    <div id="productsList"></div>
  </div>
</div>

<div id="toast">Message Here</div>
<div id="aiLoadingOverlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.6); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
    <div style="font-size:30px; animation:spin 1s infinite;">✨</div>
    <div style="color:white; font-weight:bold; margin-top:10px; font-size:14px; letter-spacing:1px;">AI IS THINKING...</div>
</div>
<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

<script>
// --- UPDATED BACKEND SYNC (With Merchant ID) ---
async function syncStockToBackend(allProducts) {
    try {
        // 1. Get Merchant ID from Login Data
        const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
        const merchantId = user.merchantId;

        if (!merchantId) {
            console.warn("⚠️ No Merchant ID found. Stock not synced to cloud.");
            return;
        }

        console.log(`📤 Syncing ${allProducts.length} items for ${merchantId}...`);
        
        const url = (typeof buildUrl === 'function') ? buildUrl('/api/save-stock') : '/api/save-stock';
        
        // 2. Send Secure Payload
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                merchantId: merchantId, // <--- CRITICAL: Prevents Data Leaks
                products: allProducts
            })
        });
        
        const result = await res.json();
        if(result.success) console.log("✅ Cloud Sync Complete");

    } catch (error) {
        console.error("❌ Sync Failed:", error);
    }
}


// --- 2. CORE LOGIC ---
function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent = data.name ? "👤 " + data.name : "👤 Guest";
}
loadUser();

function getProducts() {
    try { return JSON.parse(localStorage.getItem('bharatpos_products') || '[]'); } 
    catch(e) { return []; }
}

function renderProducts(){
  const products = getProducts();
  
  if(products.length === 0) { 
    document.getElementById('productsList').innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">📦 No products found.</div>'; 
    return;
  }
  
  let html = '<table><thead><tr><th>Name</th><th>Qty</th><th>Price</th><th>Stock</th><th>Tax %</th><th>Category</th><th>Action</th></tr></thead><tbody>';
  products.forEach(p=>{
    html += `<tr>
      <td>${p.name}</td>
      <td>${p.quantity || '-'}</td>
      <td style="color:var(--accent);">₹${p.price}</td>
      <td>${p.stock || 0}</td>
      <td>${p.taxPercent || 0}%</td>
      <td>${p.category || '-'}</td>
      <td><button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('productsList').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  // Auto-sync on load just to be safe
  syncStockToBackend(getProducts());
  
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    const field = document.getElementById("productBarcode");
    if (field) field.value = temp;
    localStorage.removeItem("temp_new_barcode");
  }
});

async function handleAddProduct(event){
  if(event && event.preventDefault) event.preventDefault();
  try {
    const name = document.getElementById('productName').value;
    const price = document.getElementById('productPrice').value;
    const qty = document.getElementById('productQuantity').value;
    const stock = document.getElementById('productStock').value;
    const tax = document.getElementById('productTax').value;
    const cat = document.getElementById('productCategory').value;
    const bar = document.getElementById('productBarcode').value;
    
    const products = getProducts();
    products.push({
        id: Date.now().toString(),
        name, price, quantity: qty, stock, taxPercent: tax, category: cat, barcode: bar
    });
    
    // Save Local
    localStorage.setItem('bharatpos_products', JSON.stringify(products));
    
    // 🟢 TRIGGER BACKEND SYNC
    await syncStockToBackend(products);

    renderProducts();
    document.getElementById('productForm').reset();
    showToast("Product Added & Synced!");
  } catch(err){
    console.error(err);
    showToast('Failed to add product', true);
  }
}

function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== pid);
  localStorage.setItem('bharatpos_products', JSON.stringify(products));
  
  // 🟢 SYNC DELETION
  syncStockToBackend(products);
  
  renderProducts();
  showToast("Product deleted");
}

// --- 3. ENHANCED SCANNER LOGIC ---
let cameraStream = null;
let aiScanInterval = null;
let aiScanLocked = false;          

function uiStartScan() {
  document.getElementById('cameraContainer').style.display = 'block';
  startLiveScan(); 
}

function uiStopScan() {
  document.getElementById('cameraContainer').style.display = 'none';
  stopLiveScan(); 
}

async function startLiveScan() {
  if (cameraStream) return;
  const video = document.getElementById("cameraPreview");
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    }); 
    video.srcObject = cameraStream;
    video.onloadedmetadata = () => {
      video.play();
      // Scan every 3 seconds to avoid overwhelming the server
      aiScanInterval = setInterval(() => { if(!aiScanLocked) captureAndSendToAI(); }, 3000);
    };
  } catch(err) { alert("Camera access denied."); }
}

function stopLiveScan() {
  if(aiScanInterval) { clearInterval(aiScanInterval); aiScanInterval = null; }
  if(cameraStream){ try { cameraStream.getTracks().forEach(t=>t.stop()); } catch(e){} cameraStream=null; }
  const video = document.getElementById("cameraPreview");
  if(video) try { video.srcObject = null; } catch(e) {}
}

async function captureAndSendToAI(){
  const video = document.getElementById("cameraPreview");
  const canvas = document.getElementById("captureCanvas"); 
  const overlay = document.getElementById("aiLoadingOverlay");

  if(!video || !canvas) return;
  
  // Capture Frame
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const base64 = canvas.toDataURL("image/jpeg", 0.7).split(",")[1]; // Compressed for speed

  aiScanLocked = true; // Lock scanning
  if(overlay) overlay.style.display = 'flex'; // Show "Thinking" UI

  try{
    const url = (typeof buildUrl === 'function') ? buildUrl('/ai-product-scan') : '/ai-product-scan';
    
    const res = await fetch(url, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64: base64 })
    });
    
    if(!res.ok) throw new Error("Server Error");
    
    const data = await res.json();
    
    // 🟢 ENHANCEMENT: Check for Valid Data
    if(data && data.success && data.product && data.product.name){
      fillProductFromAI(data.product);
      showToast("✨ AI Identified: " + data.product.name, false);
      
      // Stop scanning temporarily to let user edit
      uiStopScan(); 
    } 
  } catch(e){
    // Silent fail, keep scanning
  } finally { 
    aiScanLocked = false; 
    if(overlay) overlay.style.display = 'none'; // Hide UI
  }
}

function fillProductFromAI(product){
  const nameEl=document.getElementById("productName");
  const qtyEl=document.getElementById("productQuantity");
  const priceEl=document.getElementById("productPrice");
  const catEl=document.getElementById("productCategory");

  // Highlight effect
  const inputs = [nameEl, qtyEl, priceEl, catEl];
  inputs.forEach(el => { if(el) el.style.borderColor = "var(--accent)"; });

  if(nameEl) nameEl.value = product.name || "";
  if(qtyEl) qtyEl.value = product.quantity || "1 pc";
  if(priceEl) priceEl.value = product.price || "";
  if(catEl) catEl.value = product.category || "General";

  setTimeout(() => {
     inputs.forEach(el => { if(el) el.style.borderColor = ""; });
  }, 2000);
}

function resetAIScan(){
  document.getElementById("productForm").reset();
  aiScanLocked=false;
  if(!cameraStream) uiStartScan(); 
}

// Toast UI Helper
function showToast(msg, isError = false) {
  const x = document.getElementById("toast");
  if(!x) return;
  x.innerText = msg;
  x.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
  x.className = "show";
  setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
}
</script>
</body>
</html>
