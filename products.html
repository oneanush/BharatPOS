<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="bharatpos.js" defer></script>
  <style>
    /* --- AI Product Scanner Styles (added, non-intrusive) --- */
    .ai-scanner-box {
      background: var(--card,#fff);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(28,72,212,0.07);
      margin-bottom: 16px;
      padding: 14px 18px;
      max-width: 650px;
    }
    .ai-video-container {
      width:100%;max-width:410px;height:180px;border-radius:10px;overflow:hidden;
      border:1.5px solid #0082cd; margin-bottom: 10px;background: #000;display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    .ai-scanner-controls {
      display:flex;gap:14px;margin:8px 0 0 0;align-items:center;
    }
    .ai-detected-fields {
      font-size:14px;background:#e8f0fd;border-radius:7px;padding:7px 10px;margin:9px 0;color:#005f99;
    }
    .ai-loader {
      display:none;align-items:center;gap:7px;font-size:13px;color:#0b5ed7;
    }
    .ai-loader.active {
      display:inline-flex;
    }
  </style>
</head>
<body>
<nav>
   <a href="sales.html">Sales</a>
  <a href="settings.html">Settings</a>
 <a href="index.html">About</a>
<div id="profileName" class="profile-name" ></div>
</nav>

<style>
.profile-name {
  font-weight: 700;
  color: #ffcc00;
  margin-left: 12px;
  margin-right: 5px;
  padding: 6px 10px;
  border: 1px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
}
</style>

<div class="header">
  <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
  <div class="brand"> Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">billing</a>
  </div>
</div>

<div class="container">

  <!-- ***** AI Product Scanner Card (NEW FEATURE, SAFE) ***** -->
  <div class="card ai-scanner-box">
    <h3>AI Product Scanner</h3>
    <div>
      <div class="ai-video-container" id="aiVideoPreview">
        <!-- Live video stream will appear here -->
        <video id="aiScannerVideo" autoplay muted playsinline style="width:100%;height:100%;display:none;border-radius:10px;background:#000;"></video>
        <canvas id="aiScannerCanvas" style="display:none;"></canvas>
        <span id="aiVideoPlaceholder" style="width:100%;text-align:center;color:#b5ccff;">Camera inactive</span>
      </div>
      <div class="ai-scanner-controls">
        <button type="button" id="aiStartBtn">Start Camera</button>
        <button type="button" id="aiStopBtn" style="display:none;">Stop Camera</button>
        <button type="button" id="aiDetectBtn" style="display:none;">Detect Product</button>
        <span id="aiLoader" class="ai-loader"><span>Detecting...</span></span>
      </div>
      <div id="aiDetectedFields" class="ai-detected-fields" style="display:none;"></div>
    </div>
    <div style="font-size:13px;color:#555;margin-top:7px;">
      Show packaging or label flatly, allow a clear view for best AI results.<br>
      <b>Detected fields will auto-fill below.</b>
    </div>
  </div>
  <!-- ******** End AI Scanner Card ******** -->

  <div class="card">
    <h3>Add Product</h3>
    <!-- changed onsubmit to call local handler so we can ensure the UI re-renders after addProduct() -->
    <form id="productForm" onsubmit="handleAddProduct(event);">
      <div class="form-row"><input id="productName" placeholder="Product name"></div>
      <div class="form-row"><input id="productPrice" type="number" step="0.01" placeholder="Price"></div>
      <div class="form-row"><input id="productStock" type="number" placeholder="Stock"></div>
      <div class="form-row"><input id="productTax" type="number" placeholder="Tax % (optional)"></div>
      <div class="form-row"><input id="productCategory" placeholder="Category (optional)"></div>
      <label>Barcode:</label>
      <input type="text" id="productBarcode" placeholder="Enter Barcode">
      <div class="form-row"><button type="submit">Save Product</button></div>
    </form>
  </div>

  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>
</div>

<script>
  // ----- Existing: Render Product List -----
  function renderProducts(){
    const products = getProducts();
    if(products.length===0) { document.getElementById('productsList').innerHTML = '<div class="small">No products</div>'; return;}
    let html = '<table><tr><th>Name</th><th>Price</th><th>Stock</th><th>Tax %</th><th>category</th><th>Action</th></tr>';
    products.forEach(p=>{
      html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${p.stock}</td>
        <td>${p.taxPercent}%</td>
        <td>${p.category}</td>
        <td>
          <button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button>
        </td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('productsList').innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    renderProducts();
    const temp = localStorage.getItem("temp_new_barcode");
    if (temp) {
      const barcodeField = document.getElementById("productBarcode");
      if (barcodeField) barcodeField.value = temp;
      localStorage.removeItem("temp_new_barcode");
    }
  });

  // ----- User Profile Name -----
  function loadUser(){
    const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
    if(data.name){
      document.getElementById('profileName').textContent = "👤 " + data.name;
    } else {
      document.getElementById('profileName').textContent = "👤 Guest";
    }
  }
  loadUser();

  // ----- Confirm and Delete Product -----
  function deleteProductConfirm(pid){
    if(!confirm("Are you sure you want to delete this product?")) return;
    let products = getProducts();
    products = products.filter(p => p.id !== pid);
    saveProducts(products);
    renderProducts(); // re-render after deletion
    alert("Product deleted successfully!");
  }

  /*
    handleAddProduct ensures the UI is updated immediately after a product is added.
    It calls addProduct() (defined in bharatpos.js). If addProduct returns a Promise it will await it;
    otherwise it proceeds synchronously. After a successful add it calls renderProducts()
    so the newly added product shows without a manual refresh.
    Minimal and safe: does not change how addProduct() works — only ensures the product list UI is refreshed.
  */
  async function handleAddProduct(event){
    if(event && event.preventDefault) event.preventDefault();
    try {
      // Call the existing addProduct function from bharatpos.js.
      await addProduct();
      // Re-render product list so new product appears immediately.
      renderProducts();
      // Optionally reset form fields (keeps existing behavior minimal)
      const form = document.getElementById('productForm');
      if(form) {
        // Only clear inputs that are not barcode (in case barcode was prefilled by scanner)
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productStock').value = '';
        document.getElementById('productTax').value = '';
        document.getElementById('productCategory').value = '';
        // keep productBarcode untouched if you want to preserve scanning flow; uncomment to clear:
        // document.getElementById('productBarcode').value = '';
      }
    } catch (err) {
      console.error('Error adding product:', err);
      alert('Failed to add product. See console for details.');
    }
  }

  // ----- Prefill barcode field from temp_new_barcode -----
  document.addEventListener("DOMContentLoaded", () => {
    const barcode = localStorage.getItem("temp_new_barcode");
    if (barcode) {
      const barcodeField = document.getElementById("productBarcode");
      if (barcodeField) {
        barcodeField.value = barcode;
        barcodeField.focus();
      }
      localStorage.removeItem("temp_new_barcode");
    }
  });

</script>

<!-- ********* NEW: AI SCANNER JS (only affects products.html) ********* -->
<script>
(function() {
  const startBtn   = document.getElementById('aiStartBtn');
  const stopBtn    = document.getElementById('aiStopBtn');
  const detectBtn  = document.getElementById('aiDetectBtn');
  const video      = document.getElementById('aiScannerVideo');
  const canvas     = document.getElementById('aiScannerCanvas');
  const placeholder= document.getElementById('aiVideoPlaceholder');
  const loader     = document.getElementById('aiLoader');
  const fieldsBox  = document.getElementById('aiDetectedFields');

  let cameraStream = null;

  function showVideo(active) {
    video.style.display = active ? 'block' : 'none';
    placeholder.style.display = active ? 'none' : 'block';
    detectBtn.style.display = active ? 'inline-block' : 'none';
    stopBtn.style.display   = active ? 'inline-block' : 'none';
    startBtn.style.display  = active ? 'none' : 'inline-block';
  }

  // Start camera
  startBtn.addEventListener('click', async () => {
    if (cameraStream) return;
    try {
      let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' }, audio:false });
      cameraStream = stream;
      video.srcObject = stream;
      video.play();
      showVideo(true);
    } catch (err) {
      alert("Camera access denied or unavailable: " + err.message);
      showVideo(false);
    }
  });

  // Stop camera
  stopBtn.addEventListener('click', () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      video.srcObject = null;
    }
    showVideo(false);
    loader.classList.remove("active");
    fieldsBox.style.display = "none";
  });

  // ----- AI Detection Stub -----
 async function aiDetectProduct(imageDataUrl) {
  const endpoint = "https://asia-south1-aiplatform.googleapis.com/v1/projects/gen-lang-client-0257924792/locations/asia-south1/publishers/google/models/gemini-3-pro-preview:predict";
  const apiKey = "AIzaSyCZcdjSy6exAUpSW2WPHu8BdY2010RtSAg";

  const resp = await fetch(`${endpoint}?key=${apiKey}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      instances: [{ image: imageDataUrl }] // structure depends on your model
    })
  });
  const result = await resp.json();

  // Adjust below: parse response as per your model's response format
  return {
    name: result.predictions[0]?.name || "",
    price: result.predictions[0]?.price || "",
    category: result.predictions[0]?.category || "",
    tax: result.predictions[0]?.tax || ""
  };
}
  // Detect button
  detectBtn.addEventListener('click', async () => {
    if (!cameraStream) return;
    loader.classList.add("active");
    fieldsBox.style.display = "none";
    try {
      // -- Take snapshot from video --
      canvas.width  = video.videoWidth || 400;
      canvas.height = video.videoHeight || 200;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      let dataUrl = canvas.toDataURL("image/jpeg", 0.8);

      // -- Call AI API --
      const result = await aiDetectProduct(dataUrl);

      // -- Auto-fill detected fields --
      fieldsBox.innerHTML = "";
      if (result.name) {
        document.getElementById('productName').value = result.name || "";
        fieldsBox.innerHTML += "<b>Name:</b> " + (result.name || "") + "  ";
      }
      if (result.price) {
        document.getElementById('productPrice').value = result.price || "";
        fieldsBox.innerHTML += "<b>Price:</b> " + (result.price || "") + "  ";
      }
      if (result.category) {
        document.getElementById('productCategory').value = result.category || "";
        fieldsBox.innerHTML += "<b>Category:</b> " + (result.category || "") + "  ";
      }
      if (result.tax !== undefined) {
        document.getElementById('productTax').value = result.tax || "";
        fieldsBox.innerHTML += "<b>Tax %:</b> " + (result.tax || "") + "  ";
      }
      if (fieldsBox.innerHTML==="") {
        fieldsBox.innerHTML = "<span style='color:#dc3545;'>No details detected.</span>";
      }
      fieldsBox.style.display = "block";
    } catch (err) {
      fieldsBox.innerHTML = "<span style='color:#dc3545;'>Detection error.</span>";
      fieldsBox.style.display = "block";
    }
    loader.classList.remove("active");
  });

  // Camera stops if page leaves or reloads
  window.addEventListener("beforeunload", () => {
    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  });
})();
</script>

</body>
</html>
