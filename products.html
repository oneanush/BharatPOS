<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="quagga.js"></script> <!-- Quagga must be loaded first -->
  <script src="bharatpos.js" defer></script>
</head>
<body>
<nav>
   <a href="sales.html">Sales</a>
   <a href="settings.html">Settings</a>
   <a href="index.html">About</a>
   <div id="profileName" class="profile-name"></div>
</nav>

<style>
.profile-name {
  font-weight: 700;
  color: #ffcc00;
  margin-left: 12px;
  margin-right: 5px;
  padding: 6px 10px;
  border: 1px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
}
</style>

<div class="header">
  <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
  <div class="brand"> Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">Billing</a>
  </div>
</div>

<!-- AI Camera Scan -->
<div class="form-row">
  <button type="button" onclick="startLiveScan()">📷 Start AI Scan</button>
  <button type="button" onclick="stopLiveScan()">⛔ Stop</button>
  <button type="button" onclick="resetAIScan()">🔄 Scan Next Product</button>
</div>

<video id="cameraPreview" autoplay playsinline style="width:80%;display:none;"></video>
<canvas id="captureCanvas" style="display:none;"></canvas>
<div id="barcodePreview" style="width:100%; height:300px;"></div>

<div class="main-container">
  <div class="card">
    <h3>Add Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      <div class="form-row"><input id="productName" placeholder="Product name (e.g. Amul Milk)"></div>
      <div class="form-row"><input id="productQuantity" placeholder="Quantity/Unit (e.g. 250g, 1L, 500ml)"></div>
      <div class="form-row"><input id="productPrice" type="number" step="0.01" placeholder="Price"></div>
      <div class="form-row"><input id="productStock" type="number" placeholder="Stock"></div>
      <div class="form-row"><input id="productTax" type="number" placeholder="Tax % (optional)"></div>
      <div class="form-row"><input id="productCategory" placeholder="Category (optional)"></div>
      <label>Barcode:</label>
      <input type="text" id="productBarcode" placeholder="Enter Barcode">
      <div class="form-row"><button type="submit">Save Product</button></div>
    </form>
  </div>

  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>
</div>

<script>
/* ------------------------ USER PROFILE & PRODUCT LIST ------------------------ */
function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent = data.name ? "👤 " + data.name : "👤 Guest";
}
loadUser();

function renderProducts(){
  const products = getProducts();
  if(products.length===0) { 
    document.getElementById('productsList').innerHTML = '<div class="small">No products</div>'; 
    return;
  }
  let html = '<table><tr><th>Name</th><th>Qty/Unit</th><th>Price</th><th>Stock</th><th>Tax %</th><th>Category</th><th>Action</th></tr>';
  products.forEach(p=>{
    html += `<tr>
      <td>${p.name}</td>
      <td>${p.quantity || '-'}</td>
      <td>${p.price}</td>
      <td>${p.stock}</td>
      <td>${p.taxPercent}%</td>
      <td>${p.category}</td>
      <td><button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button></td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('productsList').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    const barcodeField = document.getElementById("productBarcode");
    if (barcodeField) barcodeField.value = temp;
    localStorage.removeItem("temp_new_barcode");
  }
});

function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== pid);
  saveProducts(products);
  renderProducts();
  alert("Product deleted successfully!");
}

async function handleAddProduct(event){
  if(event && event.preventDefault) event.preventDefault();
  try {
    const qtyValue = document.getElementById('productQuantity').value;
    await addProduct(); // from bharatpos.js
    let products = getProducts();
    if(products.length > 0){
      let lastProduct = products[products.length - 1];
      lastProduct.quantity = qtyValue;
      saveProducts(products);
    }
    renderProducts();
    // Reset form
    const form = document.getElementById('productForm');
    if(form){
      document.getElementById('productName').value = '';
      document.getElementById('productQuantity').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productStock').value = '';
      document.getElementById('productTax').value = '';
      document.getElementById('productCategory').value = '';
    }
  } catch(err){
    console.error('Error adding product:', err);
    alert('Failed to add product. See console.');
  }
}
</script>
<script>
/* ------------------------ AI + BARCODE SCANNER (SIMULTANEOUS & OPTIMIZED) ------------------------ */


let cameraStream = null;
let aiScanInterval = null;
let barcodeScanFrameId = null; // For requestAnimationFrame

let aiScanLocked = false;          
let barcodeDecodeInProgress = false; 
let lastDetectedBarcode = null;
let lastBarcodeTime = 0;

// Dedicated canvas for barcode processing to avoid conflicts with AI canvas
const barcodeCanvas = document.createElement('canvas'); 
const barcodeCtx = barcodeCanvas.getContext('2d', { willReadFrequently: true });

// Start live camera + Dual Scanning Loops
async function startLiveScan() {
  if (cameraStream) return;
  const video = document.getElementById("cameraPreview");
  if (!video) return console.error("❌ cameraPreview missing");
  
  video.style.display = "block";

  try {
    // Requesting HD if possible for better barcode clarity
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 } 
      }
    }); 
    video.srcObject = cameraStream;
    
    // Wait for video to actually play to get dimensions
    video.onloadedmetadata = () => {
      video.play();
      // Start AI Loop (Slow & Heavy)
      aiScanInterval = setInterval(() => { if(!aiScanLocked) captureAndSendToAI(); }, 2500);
      
      // Start Barcode Loop (Fast & Local)
      loopBarcodeScanning();
    };

  } catch(err) {
    console.error("Could not access camera:", err);
    alert("Could not access camera. Check permissions.");
  }
}

function stopLiveScan() {
  // Stop AI Loop
  if(aiScanInterval) {
    clearInterval(aiScanInterval);
    aiScanInterval = null;
  }

  // Stop Barcode Loop
  if(barcodeScanFrameId) {
    cancelAnimationFrame(barcodeScanFrameId);
    barcodeScanFrameId = null;
  }

  barcodeDecodeInProgress = false;

  if(cameraStream){
    try { cameraStream.getTracks().forEach(t=>t.stop()); } catch(e){}
    cameraStream=null;
  }

  const video = document.getElementById("cameraPreview");
  if(video) {
    video.style.display="none";
    try { video.srcObject = null; } catch(e) {}
  }

  const barcodePreview = document.getElementById('barcodePreview');
  if(barcodePreview) barcodePreview.innerHTML = '';
}

// ---------------------- 1. AI SCANNING LOOP (Every 2.5s) ----------------------
async function captureAndSendToAI(){
  const video = document.getElementById("cameraPreview");
  const canvas = document.getElementById("captureCanvas"); // Visible/Debug canvas
  if(!video || !canvas) return;

  const ctx = canvas.getContext("2d");
  // AI needs a decent resolution, but not huge
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // use JPEG for AI (smaller payload)
  const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

  aiScanLocked = true;

  try{
    const url = buildUrl('/ai-product-scan');
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64: base64 })
    });

    if(!res.ok) return;

    const data = await res.json();
    console.log("🧠 AI scan data:", data);

    if(data && data.success && hasLogicalData(data.product)){
      fillProductFromAI(data.product);
    } 
  } catch(e){ 
    console.error("❌ AI scan error:", e);
  } finally {
    aiScanLocked = false;
  }
}

// ---------------------- 2. BARCODE SCANNING LOOP (High Frequency) ----------------------
function loopBarcodeScanning() {
  // Keep looping as long as stream is active
  if (!cameraStream) return;

  const now = Date.now();
  // Throttle: Limit barcode attempts to ~5 times per second (every 200ms) to save CPU
  // You can lower 200 to 100 for faster scanning, or raise to 300 for weaker devices
  if (now - lastBarcodeTime > 200 && !barcodeDecodeInProgress) {
    lastBarcodeTime = now;
    attemptFastBarcodeDecode();
  }

  barcodeScanFrameId = requestAnimationFrame(loopBarcodeScanning);
}

function attemptFastBarcodeDecode() {
  const video = document.getElementById("cameraPreview");
  if (!video || video.videoWidth === 0) return;

  // Check if input is already filled to avoid redundant processing
  const currentVal = document.getElementById("productBarcode")?.value;
  if (currentVal && currentVal === lastDetectedBarcode) return;

  barcodeDecodeInProgress = true;

  // 1. Draw current video frame to our efficient off-screen canvas
  // We limit width to 800px for Quagga performance (scanning 4k is too slow)
  const scale = 800 / video.videoWidth; 
  barcodeCanvas.width = 800;
  barcodeCanvas.height = video.videoHeight * scale;
  
  barcodeCtx.drawImage(video, 0, 0, barcodeCanvas.width, barcodeCanvas.height);

  // 2. Convert to Data URL (PNG is often better for Quagga contrast)
  const dataUrl = barcodeCanvas.toDataURL("image/png");

  // 3. Run Quagga Decode
  Quagga.decodeSingle({
    src: dataUrl,
    numOfWorkers: 2, // Use 2 workers for "peak" performance (non-blocking)
    inputStream: {
      size: 800,
      singleChannel: false // let Quagga decide greyscale
    },
    locate: true, // Important for finding barcode in full image
    locator: {
      patchSize: "medium", // 'medium' or 'large' works best for product labels
      halfSample: true     // CRITICAL: speeds up processing significantly
    },
    decoder: {
      readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"]
    }
  }, function(result) {
    // Callback happens when finish
    barcodeDecodeInProgress = false;

    if (result && result.codeResult && result.codeResult.code) {
      const code = result.codeResult.code;
      
      // Basic validation: EAN/UPC usually numeric and > 5 chars
      if(code.length > 5) {
        console.log('📦 FAST SCAN found:', code);
        
        const barcodeField = document.getElementById("productBarcode");
        if (barcodeField) {
          barcodeField.value = code;
          lastDetectedBarcode = code;
          
          // Audio feedback (optional 'beep')
          // playBeep(); 
        }

        const preview = document.getElementById('barcodePreview');
        if (preview) {
           preview.innerHTML = `<div style="padding:10px; background:#d4edda; color:#155724; border:1px solid #c3e6cb; border-radius:5px; text-align:center;">
             <strong>MATCH!</strong> Barcode: ${code} <br> Format: ${result.codeResult.format}
           </div>`;
        }
      }
    }
  });
}

// ---------------------- HELPERS ----------------------
function hasLogicalData(p){ return p && typeof p.name==="string" && p.name.length>2; }

function fillProductFromAI(product){
  const nameEl=document.getElementById("productName");
  const qtyEl=document.getElementById("productQuantity");
  const priceEl=document.getElementById("productPrice");
  const catEl=document.getElementById("productCategory");

  if(!nameEl) return;
  // Only overwrite if empty or user wants strict AI override? 
  // Currently overwriting for convenience.
  nameEl.value = product.name || nameEl.value;
  if(qtyEl) qtyEl.value = product.quantity || qtyEl.value;
  if(priceEl) priceEl.value = product.price || priceEl.value;
  if(catEl) catEl.value = product.category || catEl.value;
  
  // Highlight that AI updated fields
  nameEl.style.backgroundColor = "#fff3cd";
  setTimeout(()=> nameEl.style.backgroundColor = "", 1000);
}

function resetAIScan(){
  aiScanLocked=false;
  stopLiveScan();
  document.getElementById("productName").value="";
  document.getElementById("productQuantity").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productCategory").value="";
  document.getElementById("productBarcode").value="";
  lastDetectedBarcode = null;
  const preview = document.getElementById('barcodePreview');
  if(preview) preview.innerHTML = '';
  startLiveScan();
}

// Expose functions
window.startLiveScan = startLiveScan;
window.stopLiveScan = stopLiveScan;
window.resetAIScan = resetAIScan;
</script>
</body>
</html>
