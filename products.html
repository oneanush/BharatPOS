<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Stock - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="quagga.js"></script>
  <script src="bharatpos.js" defer></script>

  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-body: #0f172a; --bg-card: rgba(30, 41, 59, 0.6); --glass: blur(12px); --border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8; --success: #10b981; --danger: #ef4444; --input-bg: rgba(15, 23, 42, 0.6);
      --primary: #3b82f6; 
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; padding-bottom: 80px; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05), transparent 40%), radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05), transparent 40%); z-index: -1; pointer-events: none; }

    /* --- HAMBURGER MENU & NAVBAR (Matching Dashboard) --- */
    .menu-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px; }
    .side-menu { position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: #0f172a; z-index: 9999; transition: 0.3s ease; padding: 20px; box-shadow: 5px 0 20px rgba(0,0,0,0.5); border-right: 1px solid var(--border); }
    .side-menu.open { left: 0; }
    .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9998; backdrop-filter: blur(2px); }
    .side-menu-links { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
    .side-menu-links a { padding: 12px 15px; border-radius: 8px; font-size: 15px; color: var(--text-main); font-weight: 500; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: 0.2s;}
    .side-menu-links a:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
    .side-menu-links i { width: 20px; text-align: center; color: var(--text-muted); }

    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; color: #fff; }
    .global-logo { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .brand span { color: var(--accent); }
    .nav-btn-bill { background: var(--success); color: #000; font-weight: 800; padding: 8px 16px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: 0.2s; display: flex; align-items: center; gap: 6px; text-decoration: none;}
    .nav-btn-bill:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
    .profile-pill { font-size: 13px; font-weight: 600; background: rgba(245, 158, 11, 0.15); color: var(--accent); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(245, 158, 11, 0.3); display: none;}
    @media(min-width: 600px) { .profile-pill { display: block; } .mobile-hide { display: inline-block; } }
    @media(max-width: 599px) { .mobile-hide { display: none; } }

    /* --- LAYOUT --- */
    .main-container { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    @media(max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

    .card { background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    h3 { margin: 0 0 20px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    /* --- SCANNER --- */
    .scanner-section { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .scan-controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-scan { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-start { background: var(--accent); color: #000; }
    .btn-stop { background: var(--input-bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn-reset { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); }
    .camera-wrapper { position: relative; border-radius: 12px; overflow: hidden; background: #000; display: none; box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); border: 1px solid var(--accent); }
    #cameraPreview { width: 100%; height: 300px; object-fit: cover; display: block; }
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--success); box-shadow: 0 0 10px var(--success); animation: scanMove 2s infinite linear; z-index: 10; }
    @keyframes scanMove { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    /* --- FORM --- */
    .form-row { margin-bottom: 16px; position: relative; }
    input, select { width: 100%; padding: 14px 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; transition: 0.2s; font-family: 'Inter', sans-serif; appearance: none; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
    input::placeholder { color: transparent; } 
    .floating-label { position: absolute; left: 12px; top: 14px; color: var(--text-muted); font-size: 14px; pointer-events: none; transition: 0.2s; }
    input:focus ~ .floating-label, input:not(:placeholder-shown) ~ .floating-label, select:focus ~ .floating-label, select:valid ~ .floating-label { top: -8px; left: 10px; font-size: 11px; color: var(--accent); background: var(--bg-body); padding: 0 4px; border-radius: 4px; }
    button[type="submit"] { width: 100%; background: var(--success); color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 10px; transition: 0.2s; }
    button[type="submit"]:active { transform: scale(0.98); }

    /* TOGGLE SWITCH */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* --- TABLE STYLES --- */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--text-muted); font-size: 12px; padding: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    td { padding: 12px 10px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .delete-btn { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .delete-btn:hover { background: var(--danger); color: white; }
    
    .eye-btn { background: rgba(59, 130, 246, 0.2); color: var(--primary); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 5px; }
    .eye-btn:hover { background: var(--primary); color: white; }

    /* --- MOBILE RESPONSIVE LIST --- */
    .mobile-only { display: none; }
    
    @media (max-width: 600px) {
      .card { padding: 15px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        background: rgba(255,255,255,0.03); margin-bottom: 8px; padding: 12px;
        border-radius: 8px; border: 1px solid var(--border); align-items: center;
      }
      td { padding: 0; border: none; }
      .desktop-col { display: none; }
      .mobile-only { display: inline-block; }
      td:first-child { grid-column: 1; font-weight: 600; font-size: 14px; color: #fff; }
      td.stock-col { grid-column: 2; text-align: right; font-weight: 700; color: var(--accent); }
      td.action-col { grid-column: 3; display: flex; justify-content: flex-end; }
    }

    /* --- PRODUCT DETAIL MODAL --- */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-box { background: #1e293b; width: 90%; max-width: 400px; border-radius: 16px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border); position: relative; max-height: 90vh; overflow-y: auto;}
    .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
    .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    .detail-label { color: var(--text-muted); }
    .detail-val { color: #fff; font-weight: 600; font-family: 'JetBrains Mono'; }
    .modal-edit-btn { width: 100%; background: var(--accent); color: #000; font-weight: 800; padding: 12px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; transition: 0.2s; }
    .modal-edit-btn:hover { background: #d97706; }

    #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; right: 20px; bottom: 30px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    
    .gst-container { background: rgba(245, 158, 11, 0.05); border: 1px dashed var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
    .gst-active .gst-container { display: block; animation: fadeIn 0.5s; }
    .gst-quick-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text-muted); font-size: 10px; padding: 4px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    .gst-active .gst-quick-btn { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(-5px);} to{opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>
<div id="sideMenu" class="side-menu">
    <button onclick="toggleMenu()" style="background:none; border:none; color:var(--text-muted); font-size:28px; cursor:pointer; position:absolute; right:15px; top:15px;">&times;</button>
    <div style="font-size:22px; font-weight:800; color:#fff; margin-bottom:40px; margin-top:10px;">
        Bharat<span style="color:var(--accent);">POS</span>
    </div>
    <div class="side-menu-links">
        <a href="dashboard.html"><i class="fa-solid fa-home"></i> Home</a>
        <a href="products.html" style="color:var(--accent); background:rgba(245,158,11,0.1);"><i class="fa-solid fa-box-open"></i> Stock / Inventory</a>
        <a href="sales.html"><i class="fa-solid fa-chart-line"></i> Purani Bikri</a>
        <a href="reports.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reports</a>
        <a href="ai.html"><i class="fa-solid fa-robot" style="color:var(--accent);"></i> AI Madad</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </div>
</div>

<nav class="navbar">
  <div style="display:flex; align-items:center; gap:15px;">
      <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
      <div class="brand">
        <img src="logo.png" class="global-logo" alt="Logo">
        <span class="mobile-hide">Bharat<span>POS</span></span>
      </div>
  </div>
  
  <div style="display:flex; align-items:center; gap:12px;">
      <a href="billing.html" class="nav-btn-bill"><i class="fa-solid fa-file-invoice"></i> <span class="mobile-hide">Bill Banao</span></a>
      <div id="profileName" class="profile-pill">Guest</div>
  </div>
</nav>

<div class="scanner-section">
  <div class="scan-controls">
    <button type="button" class="btn-scan btn-start" onclick="uiStartScan()">
      <span>📷 Photo Se Jodein</span>
    </button>
    <button type="button" class="btn-scan btn-stop" onclick="uiStopScan()">
      <span>⛔ Roko</span>
    </button>
    <button type="button" class="btn-scan btn-reset" onclick="resetAIScan()">
      <span>🔄 Agla Item</span>
    </button>
  </div>

  <div id="cameraContainer" class="camera-wrapper">
    <div class="scan-line"></div>
    <video id="cameraPreview" autoplay playsinline></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>
  </div>
  <div id="barcodePreview" style="margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:12px;"></div>
</div>

<div class="main-container">
  
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <h3 style="margin:0; border:none; padding:0;">Naya Maal Jodein</h3>
        
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="gst-quick-btn" onclick="toggleGstQuick()" id="gstQuickBtn">GST: OFF</button>
            
            <button onclick="openGlobalCatalog()" style="background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); transition: 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                <i class="fa-solid fa-cloud-arrow-down"></i> Master Catalog Se Jodein
            </button>
        </div>
    </div>
    
    <form id="productForm" onsubmit="handleAddProduct(event);">
      
      <div class="form-row">
        <input id="productName" placeholder=" " required autocomplete="off">
        <label for="productName" class="floating-label">Samaan Ka Naam (Item Name)</label>
      </div>

      <div class="form-row">
        <input id="productCategory" list="categoryList" placeholder=" " autocomplete="off">
        <label for="productCategory" class="floating-label">Category (Kis type ka hai?)</label>
        <datalist id="categoryList"></datalist>
      </div>

      <div class="form-row" style="border-bottom:1px dashed var(--border); padding-bottom:15px; margin-bottom:15px;">
        <input type="text" id="productBarcode" placeholder=" " style="font-family:'JetBrains Mono'; color:var(--accent);" autocomplete="off">
        <label for="productBarcode" class="floating-label">Barcode (Scan Karein)</label>
      </div>

      <div style="background:rgba(16, 185, 129, 0.05); border:1px dashed var(--success); padding:15px; border-radius:8px; margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
              <label class="form-label" style="margin:0; font-size:14px; color:#fff;">⚖️ Khula Samaan (Sell by Weight)</label>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Daal, Chawal, Cheeni jise tol kar bechte hain</div>
          </div>
          <label class="switch">
              <input type="checkbox" id="isLooseItem">
              <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div id="variantsContainer">
          <div class="variant-row">
              <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div style="position:relative;">
                    <input id="productQuantity" class="var-type" placeholder=" " autocomplete="off">
                    <label for="productQuantity" class="floating-label">Type (e.g. 20kg, 1L)</label>
                </div>
                <div style="position:relative;">
                    <input id="productStock" class="var-stock" type="number" step="0.001" placeholder=" ">
                    <label for="productStock" class="floating-label" style="color:var(--accent);">Add Stock (+/-)</label>
                </div>
              </div>
              <div class="form-row" style="margin-top:15px;">
                <input id="productPrice" class="var-price" type="number" step="0.01" placeholder=" " required style="font-size:18px; font-weight:bold; color:var(--success);">
                <label for="productPrice" class="floating-label" id="priceLabel">Poore Pack Ka Rate (₹)</label>
              </div>
          </div>
      </div>
      
      <div class="form-row" style="text-align:right; margin-bottom:20px;">
          <button type="button" onclick="addVariantRow()" style="background:transparent; border:1px dashed var(--accent); color:var(--accent); padding:8px 16px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600;"><i class="fa-solid fa-plus"></i> Add Other Type</button>
      </div>

      <div class="gst-container">
          <div style="margin-bottom:10px; font-size:12px; color:var(--accent); font-weight:bold;">GST Details</div>
          <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div style="position:relative;"><input id="hsnCode" placeholder=" "><label for="hsnCode" class="floating-label">HSN Code</label></div>
            <div style="position:relative;"><input id="gstRate" type="number" placeholder=" "><label for="gstRate" class="floating-label">GST % (Tax)</label></div>
          </div>
          <div class="form-row">
             <select id="priceType" onchange="togglePriceLabel()">
                 <option value="inclusive" selected>GST Included (Rate mein Tax Juda Hai)</option>
                 <option value="exclusive">GST Extra (Rate + Tax)</option>
             </select>
             <label for="priceType" class="floating-label">Rate Type</label>
          </div>
      </div>

      <div class="form-row">
        <button type="submit">💾 Save Karein</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Stock List</h3>
    <div id="productsList"></div>
  </div>
</div>

<div id="detailModal" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeDetailModal()">&times;</button>
        <h3 style="margin-top:0; color:#fff; border-bottom:none;">📦 Item Details</h3>
        <div id="modalContent"></div>
        <button class="modal-edit-btn" onclick="editFromModal()">✏️ Edit Item / Stock</button>
    </div>
</div>

<template id="variantTemplate">
  <div class="variant-row" style="padding-top:15px; margin-top:15px; border-top:1px dashed var(--border); position:relative;">
    <button type="button" onclick="this.parentElement.remove()" style="position:absolute; right:0; top:10px; background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:12px;"><i class="fa-solid fa-trash"></i> Remove</button>
    <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div style="position:relative;">
          <input class="var-type" placeholder=" ">
          <label class="floating-label">Type (e.g. 1L)</label>
      </div>
      <div style="position:relative;">
          <input class="var-stock" type="number" step="0.001" placeholder=" ">
          <label class="floating-label" style="color:var(--accent);">Add Stock (+/-)</label>
      </div>
    </div>
    <div class="form-row" style="margin-top:15px; margin-bottom:0;">
      <input class="var-price" type="number" step="0.01" placeholder=" " required style="font-size:18px; font-weight:bold; color:var(--success);">
      <label class="floating-label">Poore Pack Ka Rate (₹)</label>
    </div>
  </div>
</template>

<div id="toast">Message Here</div>
<div id="aiLoadingOverlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.6); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
    <div style="font-size:30px; animation:spin 1s infinite;">✨</div>
    <div style="color:white; font-weight:bold; margin-top:10px; font-size:14px; letter-spacing:1px;">AI SEARCHING...</div>
</div>
<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

<div id="globalCatalogModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
    <div style="background:#1e293b; width:90%; max-width:500px; border-radius:16px; border:1px solid rgba(99,102,241,0.3); display:flex; flex-direction:column; max-height:85vh;">
        
        <div style="padding:20px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#fff; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-server" style="color:#a855f7;"></i> Master Database</h3>
            <button onclick="document.getElementById('globalCatalogModal').style.display='none'" style="background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        
        <div style="padding:20px; border-bottom:1px solid rgba(255,255,255,0.1);">
            <div style="position:relative;">
                <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:14px; top:16px; color:#64748b;"></i>
                <input type="text" id="globalCatalogSearch" placeholder="Search product or category..." style="width:100%; padding:14px 14px 14px 40px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; outline:none;" oninput="filterGlobalCatalog()">
            </div>
        </div>

        <div id="globalCatalogList" style="flex:1; overflow-y:auto; padding:15px 20px;">
            <div style="text-align:center; color:#64748b; margin-top:20px;">Loading database...</div>
        </div>

    </div>
</div>

<script>
// --- 1. CORE & GST LOGIC ---
const isGstMode = localStorage.getItem('bharatpos_gst_mode') === 'true';
let currentEditingName = null; 

document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  loadUser();
  setupGstUI();
  
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    document.getElementById("productBarcode").value = temp;
    localStorage.removeItem("temp_new_barcode");
  }

  const urlParams = new URLSearchParams(window.location.search);
  const restockName = urlParams.get('restock');
  if(restockName) loadProductForEditByName(restockName);
});

// Navigation Toggle
function toggleMenu() {
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');
    if(menu.classList.contains('open')) {
        menu.classList.remove('open');
        overlay.style.display = 'none';
    } else {
        menu.classList.add('open');
        overlay.style.display = 'block';
    }
}

function setupGstUI() {
    const btn = document.getElementById('gstQuickBtn');
    if(isGstMode) {
        document.body.classList.add('gst-active');
        btn.innerText = "GST: ON";
        togglePriceLabel(); 
    } else {
        document.body.classList.remove('gst-active');
        btn.innerText = "GST: OFF";
    }
}

function toggleGstQuick() {
    const newState = !isGstMode;
    localStorage.setItem('bharatpos_gst_mode', newState ? 'true' : 'false');
    location.reload(); 
}

function togglePriceLabel() {
    if(!isGstMode) return;
    const type = document.getElementById('priceType').value;
    const labels = document.querySelectorAll('#priceLabel, .var-price + .floating-label');
    labels.forEach(label => {
        if(type === 'inclusive') label.innerText = "Final Rate (Tax Mila Ke)";
        else label.innerText = "Base Rate (Tax Alag Se Lagega)";
    });
}

function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent = data.name ? data.name : "Guest";
}

function getProducts() {
    try { return JSON.parse(localStorage.getItem('bharatpos_products') || '[]'); } 
    catch(e) { return []; }
}

// 🟢 Dynamically load unique categories to the Datalist
function populateCategoryDatalist() {
    const products = getProducts();
    const cats = new Set();
    products.forEach(p => {
        if (p.category && p.category.trim() !== '' && p.category.toLowerCase() !== 'all') {
            cats.add(p.category.trim());
        }
    });
    const dl = document.getElementById('categoryList');
    if (dl) {
        dl.innerHTML = Array.from(cats).map(c => `<option value="${c}">`).join('');
    }
}

function extractBaseWeightKg(qtyStr) {
    if (!qtyStr) return 1;
    const str = String(qtyStr).toLowerCase().replace(/\s/g, '');
    let num = parseFloat(str);
    if (isNaN(num) || num <= 0) return 1;
    if ((str.includes('g') || str.includes('gm')) && !str.includes('kg')) return num / 1000;
    if (str.includes('ml')) return num / 1000;
    return num;
}

function formatWeight(kg) {
    if (kg <= 0) return "0";
    if (kg < 1) return Math.round(kg * 1000) + " g";
    return parseFloat(kg.toFixed(3)) + " kg";
}

function renderProducts(){
  const products = getProducts();
  const list = document.getElementById('productsList');
  
  populateCategoryDatalist(); // 🟢 Re-populate categories on every render

  if(products.length === 0) { 
    list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">📦 Stock khali hai.</div>'; 
    return;
  }

  const grouped = {};
  products.forEach(p => {
      const key = p.name.trim().toLowerCase();
      if(!grouped[key]) grouped[key] = { name: p.name, category: p.category, totalStock: 0, totalLooseKg: 0, variants: [] };
      if (p.isLoose) grouped[key].totalLooseKg += Number(p.stock || 0) * extractBaseWeightKg(p.quantity);
      else grouped[key].totalStock += Number(p.stock || 0);
      grouped[key].variants.push(p);
  });
  
  let html = '<table><thead><tr><th>Naam (Name)</th><th>Category</th><th class="desktop-col">Total Stock</th><th>Action</th></tr></thead><tbody>';
  
  Object.values(grouped).forEach(g => {
    const isLoose = g.variants[0].isLoose;
    const variantText = g.variants.length > 1 ? `<br><span style="font-size:10px; color:var(--accent);">${g.variants.length} Types</span>` : '';
    const looseBadge = isLoose ? `<span style="background:rgba(16,185,129,0.1); color:var(--success); border:1px solid var(--success); padding:2px 6px; border-radius:4px; font-size:9px; margin-left:6px;">⚖️ Loose</span>` : '';
    const safeName = encodeURIComponent(g.name);
    const stockDisplay = isLoose ? formatWeight(g.totalLooseKg) : g.totalStock;
    const isOut = isLoose ? g.totalLooseKg <= 0 : g.totalStock <= 0;

    html += `<tr>
      <td><div style="font-weight:600; display:flex; align-items:center;">${g.name} ${looseBadge}</div>${variantText}</td>
      <td>${g.category || '-'}</td>
      <td class="desktop-col" style="${isOut ? 'color:var(--danger); font-weight:bold;' : ''}">${stockDisplay}</td>
      <td class="mobile-only stock-col">${stockDisplay}</td>
      <td class="action-col">
          <button class="eye-btn" onclick="openDetailModal('${safeName}')"><i class="fa-solid fa-eye"></i> View</button>
          <button class="delete-btn" onclick="deleteProductConfirm('${safeName}')"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}

function openDetailModal(encodedName) {
    const name = decodeURIComponent(encodedName);
    const products = getProducts().filter(p => p.name.toLowerCase() === name.toLowerCase());
    if(products.length === 0) return;
    
    const base = products[0];
    currentEditingName = base.name; 

    let variantsHtml = products.map(p => {
        let stockDisplay = p.stock || 0;
        if (base.isLoose) {
            const kg = Number(p.stock) * extractBaseWeightKg(p.quantity);
            stockDisplay = `${formatWeight(kg)} <span style="font-size:10px; color:#64748b;">(${parseFloat(Number(p.stock).toFixed(3))} Packs)</span>`;
        }
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px; margin-bottom:5px; border-left:3px solid var(--accent);">
            <div><strong style="color:#fff">${p.quantity || 'Standard'}</strong><br><span style="font-size:11px; color:var(--text-muted);">Stock: ${stockDisplay}</span></div>
            <div style="text-align:right"><strong style="color:var(--success);">₹${p.price}</strong></div>
        </div>`;
    }).join('');

    const content = `
        <div class="detail-row"><span class="detail-label">Name</span><span class="detail-val">${base.name}</span></div>
        <div class="detail-row"><span class="detail-label">Category</span><span class="detail-val">${base.category || '-'}</span></div>
        <div class="detail-row"><span class="detail-label">Billing Mode</span><span class="detail-val" style="color:var(--accent)">${base.isLoose ? '⚖️ By Weight' : '📦 By Quantity'}</span></div>
        ${isGstMode ? `
        <div class="detail-row"><span class="detail-label">GST Rate</span><span class="detail-val">${base.gstRate || 0}%</span></div>
        <div class="detail-row"><span class="detail-label">HSN Code</span><span class="detail-val">${base.hsn || '-'}</span></div>
        ` : ''}
        <div style="margin-top:20px; font-size:11px; color:var(--text-muted); font-weight:bold; letter-spacing:1px; margin-bottom:10px;">AVAILABLE PACKS / TYPES:</div>
        <div style="max-height: 200px; overflow-y:auto; padding-right:5px;">${variantsHtml}</div>
    `;
    document.getElementById('modalContent').innerHTML = content;
    document.getElementById('detailModal').style.display = 'flex';
}

function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
function editFromModal() { closeDetailModal(); if(currentEditingName) loadProductForEditByName(currentEditingName); }

function addVariantRow() {
    const template = document.getElementById('variantTemplate');
    const clone = template.content.cloneNode(true);
    document.getElementById('variantsContainer').appendChild(clone);
}

function resetVariants() {
    const container = document.getElementById('variantsContainer');
    while(container.children.length > 1) container.removeChild(container.lastChild);
    document.getElementById('isLooseItem').checked = false;
}

// 🟢 SMART ADDITIVE ENGINE
async function handleAddProduct(event){
  if(event) event.preventDefault();
  try {
    const name = document.getElementById('productName').value.trim();
    const cat = document.getElementById('productCategory').value.trim();
    const bar = document.getElementById('productBarcode').value.trim();
    const isLoose = document.getElementById('isLooseItem').checked;
    
    const hsn = isGstMode ? document.getElementById('hsnCode').value : "";
    const gstRate = isGstMode ? document.getElementById('gstRate').value : "";
    const priceType = isGstMode ? document.getElementById('priceType').value : "inclusive";
    
    let products = getProducts();
    let oldVariants = [];

    // If Editing, we extract the old versions so we can update them without overwriting their stock blindly
    if (currentEditingName) {
        oldVariants = products.filter(p => p.name.toLowerCase() === currentEditingName.toLowerCase());
        products = products.filter(p => p.name.toLowerCase() !== currentEditingName.toLowerCase());
    }

    const rows = document.querySelectorAll('.variant-row');
    rows.forEach((row, index) => {
        const qty = row.querySelector('.var-type').value.trim();
        const stockInput = row.querySelector('.var-stock');
        
        // This is the NEW stock being added (can be positive or negative)
        const inputStock = stockInput.value ? parseFloat(stockInput.value) : 0;
        const price = row.querySelector('.var-price').value;

        if(!price) return; 

        const productData = {
            id: Date.now().toString() + index, 
            name, price, quantity: qty, category: cat, barcode: bar,
            hsn: isGstMode ? hsn : "", gstRate: isGstMode ? gstRate : "",
            priceType: isGstMode ? priceType : "inclusive", isLoose: isLoose
        };

        let existingStock = 0;

        if (currentEditingName) {
            // Check if this variant existed before the edit
            const oldMatch = oldVariants.find(o => (o.quantity||'').toLowerCase() === qty.toLowerCase());
            if (oldMatch) existingStock = parseFloat(oldMatch.stock || 0);
        } else {
            // Check if we are just scanning a duplicate item to add stock
            const existIndex = products.findIndex(p => p.name.toLowerCase() === name.toLowerCase() && (p.quantity||'').toLowerCase() === qty.toLowerCase());
            if (existIndex > -1) {
                existingStock = parseFloat(products[existIndex].stock || 0);
                products.splice(existIndex, 1); // remove from array so we can push the updated one below
            }
        }

        // Add the input to the existing stock!
        productData.stock = existingStock + inputStock;
        products.push(productData);
    });

    showToast("✅ Saved Successfully!");
    localStorage.setItem('bharatpos_products', JSON.stringify(products));
    await syncStockToBackend(products);
    renderProducts();
    document.getElementById('productForm').reset();
    resetVariants();
    currentEditingName = null; 
  } catch(err){ console.error(err); showToast('Error saving data', true); }
}

function loadProductForEditByName(name) {
    const products = getProducts().filter(p => p.name.toLowerCase() === name.toLowerCase());
    if(products.length === 0) return;
    
    const base = products[0];
    currentEditingName = base.name;
    
    document.getElementById('productName').value = base.name;
    document.getElementById('productCategory').value = base.category || "";
    document.getElementById('productBarcode').value = base.barcode || "";
    document.getElementById('isLooseItem').checked = base.isLoose || false; 
    
    if(isGstMode) {
        document.getElementById('hsnCode').value = base.hsn || "";
        document.getElementById('gstRate').value = base.gstRate || "";
        document.getElementById('priceType').value = base.priceType || "inclusive";
    }

    resetVariants(); 
    
    const rows = document.getElementById('variantsContainer').children;
    const firstRow = rows[0];
    firstRow.querySelector('.var-type').value = products[0].quantity || "";
    firstRow.querySelector('.var-price').value = products[0].price;
    // 🟢 Keep Add Stock Input Blank so we don't accidentally double the stock
    firstRow.querySelector('.var-stock').value = ""; 

    for(let i=1; i<products.length; i++) {
        addVariantRow();
        const newRow = document.getElementById('variantsContainer').lastElementChild;
        newRow.querySelector('.var-type').value = products[i].quantity || "";
        newRow.querySelector('.var-price').value = products[i].price;
        newRow.querySelector('.var-stock').value = ""; // Blank for additive logic
    }
    
    window.scrollTo({top: 0, behavior: 'smooth'});
    document.getElementById('productName').focus();
    showToast(`Editing: ${base.name}`);
}

function deleteProductConfirm(encodedName){
  const name = decodeURIComponent(encodedName);
  if(!confirm(`Delete all variants of ${name}?`)) return;
  let products = getProducts().filter(p => p.name.toLowerCase() !== name.toLowerCase());
  localStorage.setItem('bharatpos_products', JSON.stringify(products));
  syncStockToBackend(products);
  renderProducts();
}

async function syncStockToBackend(allProducts) {
    try {
        const user = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
        if (!user.merchantId) return;
        const url = (typeof buildUrl === 'function') ? buildUrl('/api/save-stock') : '/api/save-stock';
        await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ merchantId: user.merchantId, products: allProducts }) });
    } catch (error) { console.error("Sync Failed:", error); }
}

// --- 3. SCANNER LOGIC ---
let cameraStream = null; let aiScanInterval = null; let aiScanLocked = false;          
function uiStartScan() { document.getElementById('cameraContainer').style.display = 'block'; startLiveScan(); }
function uiStopScan() { document.getElementById('cameraContainer').style.display = 'none'; stopLiveScan(); }
async function startLiveScan() {
  if (cameraStream) return;
  const video = document.getElementById("cameraPreview");
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } }); 
    video.srcObject = cameraStream;
    video.onloadedmetadata = () => { video.play(); aiScanInterval = setInterval(() => { if(!aiScanLocked) captureAndSendToAI(); }, 3000); };
  } catch(err) { alert("Camera Error"); }
}
function stopLiveScan() {
  if(aiScanInterval) { clearInterval(aiScanInterval); aiScanInterval = null; }
  if(cameraStream){ try { cameraStream.getTracks().forEach(t=>t.stop()); } catch(e){} cameraStream=null; }
  const video = document.getElementById("cameraPreview");
  if(video) try { video.srcObject = null; } catch(e) {}
}
async function captureAndSendToAI(){
  const video = document.getElementById("cameraPreview"); const canvas = document.getElementById("captureCanvas"); const overlay = document.getElementById("aiLoadingOverlay");
  if(!video || !canvas) return;
  const ctx = canvas.getContext("2d"); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const base64 = canvas.toDataURL("image/jpeg", 0.7).split(",")[1]; 
  aiScanLocked = true; if(overlay) overlay.style.display = 'flex'; 
  try{
    const url = (typeof buildUrl === 'function') ? buildUrl('/ai-product-scan') : '/ai-product-scan';
    const res = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ imageBase64: base64 }) });
    const data = await res.json();
    if(data && data.success && data.product){
      fillProductFromAI(data.product); showToast("✨ AI: " + data.product.name, false); uiStopScan(); 
    } 
  } catch(e){} finally { aiScanLocked = false; if(overlay) overlay.style.display = 'none'; }
}
function fillProductFromAI(product){
  document.getElementById("productName").value = product.name || "";
  const firstRow = document.querySelector('.variant-row');
  if(firstRow) { firstRow.querySelector('.var-type').value = product.quantity || "1 pc"; firstRow.querySelector('.var-price').value = product.price || ""; }
  document.getElementById("productCategory").value = product.category || "General";
}
function resetAIScan(){ document.getElementById("productForm").reset(); resetVariants(); aiScanLocked=false; if(!cameraStream) uiStartScan(); currentEditingName = null;}
function showToast(msg, isError = false) {
  const x = document.getElementById("toast"); x.innerText = msg; x.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
  x.className = "show"; setTimeout(() => x.className = "", 3000);
}

// 🟢 GLOBAL CATALOG MASTER DATABASE LOGIC 
let masterCatalog = [];

async function openGlobalCatalog() {
    document.getElementById('globalCatalogModal').style.display = 'flex';
    const list = document.getElementById('globalCatalogList');
    list.innerHTML = '<div style="text-align:center; color:#64748b; margin-top:20px;"><i class="fa-solid fa-spinner fa-spin"></i> Fetching Master Catalog...</div>';
    
    try {
        const url = (typeof buildUrl === 'function') ? buildUrl('/api/get-master-db') : '/api/get-master-db';
        const res = await fetch(url);
        const data = await res.json();
        if(data.success && data.database) {
            masterCatalog = data.database;
            filterGlobalCatalog(); // Render all initially with categories
        } else {
            list.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:20px;">Database empty or offline.</div>';
        }
    } catch(e) {
        list.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:20px;">Connection Error. Check server.</div>';
    }
}

function filterGlobalCatalog() {
    const q = document.getElementById('globalCatalogSearch').value.toLowerCase();
    const list = document.getElementById('globalCatalogList');
    
    const filtered = masterCatalog.filter(p => 
        p.name.toLowerCase().includes(q) || 
        (p.category && p.category.toLowerCase().includes(q))
    );
    
    if(filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#64748b; margin-top:20px;">No matching items found.</div>';
        return;
    }

    const groups = {};
    filtered.forEach(p => {
        const cat = p.category || "General";
        if(!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
    });

    let html = '';
    Object.entries(groups).forEach(([cat, prods]) => {
        html += `<div style="font-family: 'JetBrains Mono', monospace; color: #a855f7; font-size: 12px; font-weight: 800; border-bottom: 1px dashed rgba(168,85,247,0.4); padding-bottom: 5px; margin: 15px 0 10px; text-transform: uppercase;">📁 ${cat}</div>`;
        
        html += prods.map(p => `
            <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:0.2s;" onmouseover="this.style.borderColor='#a855f7'; this.style.background='rgba(168,85,247,0.1)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='rgba(255,255,255,0.05)'" onclick='importProductFromCatalog(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
                <div>
                    <div style="font-weight:700; color:#fff; font-size:14px;">${p.name} ${p.isLoose ? '⚖️' : ''}</div>
                    <div style="font-size:11px; color:#94a3b8; margin-top:4px;">${p.quantity || '-'} • GST: ${p.gstRate || 0}%</div>
                </div>
                <div style="text-align:right;">
                    <div style="color:var(--success); font-weight:800; font-size:15px;">₹${p.price}</div>
                    <div style="font-size:10px; color:#fff; background:var(--primary); font-weight:700; padding:4px 8px; border-radius:6px; margin-top:6px; display:inline-block;">AUTO-FILL <i class="fa-solid fa-bolt"></i></div>
                </div>
            </div>
        `).join('');
    });

    list.innerHTML = html;
}

function importProductFromCatalog(product) {
    document.getElementById('globalCatalogModal').style.display = 'none';

    document.getElementById('productName').value = product.name || '';
    document.getElementById('productCategory').value = product.category || '';
    document.getElementById('productBarcode').value = product.barcode || '';
    document.getElementById('isLooseItem').checked = product.isLoose === true;

    const firstRow = document.querySelector('.variant-row');
    if(firstRow) {
        firstRow.querySelector('.var-type').value = product.quantity || '';
        firstRow.querySelector('.var-price').value = product.price || '';
        firstRow.querySelector('.var-stock').value = ''; 
    }
    
    if(document.getElementById('gstRate')) document.getElementById('gstRate').value = product.gstRate || '0';
    if(document.getElementById('hsnCode')) document.getElementById('hsnCode').value = product.hsn || '';
    if(document.getElementById('priceType')) document.getElementById('priceType').value = product.priceType || 'inclusive';
    
    window.scrollTo({top: 0, behavior: 'smooth'});
    document.getElementById('productStock').focus(); 
    showToast("✅ Auto-filled! Add your stock and click Save.");
}
