<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="quagga.js"></script> <!-- Quagga must be loaded first -->
  <script src="bharatpos.js" defer></script>
</head>
<body>
<nav>
   <a href="sales.html">Sales</a>
   <a href="settings.html">Settings</a>
   <a href="index.html">About</a>
   <div id="profileName" class="profile-name"></div>
</nav>

<style>
.profile-name {
  font-weight: 700;
  color: #ffcc00;
  margin-left: 12px;
  margin-right: 5px;
  padding: 6px 10px;
  border: 1px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
}
</style>

<div class="header">
  <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
  <div class="brand"> Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">Billing</a>
  </div>
</div>

<!-- AI Camera Scan -->
<div class="form-row">
  <button type="button" onclick="startLiveScan()">📷 Start AI Scan</button>
  <button type="button" onclick="stopLiveScan()">⛔ Stop</button>
  <button type="button" onclick="resetAIScan()">🔄 Scan Next Product</button>
</div>

<video id="cameraPreview" autoplay playsinline style="width:80%;display:none;"></video>
<canvas id="captureCanvas" style="display:none;"></canvas>
<div id="barcodePreview" style="width:100%; height:300px;"></div>

<div class="main-container">
  <div class="card">
    <h3>Add Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      <div class="form-row"><input id="productName" placeholder="Product name (e.g. Amul Milk)"></div>
      <div class="form-row"><input id="productQuantity" placeholder="Quantity/Unit (e.g. 250g, 1L, 500ml)"></div>
      <div class="form-row"><input id="productPrice" type="number" step="0.01" placeholder="Price"></div>
      <div class="form-row"><input id="productStock" type="number" placeholder="Stock"></div>
      <div class="form-row"><input id="productTax" type="number" placeholder="Tax % (optional)"></div>
      <div class="form-row"><input id="productCategory" placeholder="Category (optional)"></div>
      <label>Barcode:</label>
      <input type="text" id="productBarcode" placeholder="Enter Barcode">
      <div class="form-row"><button type="submit">Save Product</button></div>
    </form>
  </div>

  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>
</div>

<script>
/* ------------------------ USER PROFILE & PRODUCT LIST ------------------------ */
function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent = data.name ? "👤 " + data.name : "👤 Guest";
}
loadUser();

function renderProducts(){
  const products = getProducts();
  if(products.length===0) { 
    document.getElementById('productsList').innerHTML = '<div class="small">No products</div>'; 
    return;
  }
  let html = '<table><tr><th>Name</th><th>Qty/Unit</th><th>Price</th><th>Stock</th><th>Tax %</th><th>Category</th><th>Action</th></tr>';
  products.forEach(p=>{
    html += `<tr>
      <td>${p.name}</td>
      <td>${p.quantity || '-'}</td>
      <td>${p.price}</td>
      <td>${p.stock}</td>
      <td>${p.taxPercent}%</td>
      <td>${p.category}</td>
      <td><button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button></td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('productsList').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    const barcodeField = document.getElementById("productBarcode");
    if (barcodeField) barcodeField.value = temp;
    localStorage.removeItem("temp_new_barcode");
  }
});

function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== pid);
  saveProducts(products);
  renderProducts();
  alert("Product deleted successfully!");
}

async function handleAddProduct(event){
  if(event && event.preventDefault) event.preventDefault();
  try {
    const qtyValue = document.getElementById('productQuantity').value;
    await addProduct(); // from bharatpos.js
    let products = getProducts();
    if(products.length > 0){
      let lastProduct = products[products.length - 1];
      lastProduct.quantity = qtyValue;
      saveProducts(products);
    }
    renderProducts();
    // Reset form
    const form = document.getElementById('productForm');
    if(form){
      document.getElementById('productName').value = '';
      document.getElementById('productQuantity').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productStock').value = '';
      document.getElementById('productTax').value = '';
      document.getElementById('productCategory').value = '';
    }
  } catch(err){
    console.error('Error adding product:', err);
    alert('Failed to add product. See console.');
  }
}
</script>

<script>
/* ------------------------ AI + BARCODE SCANNER (SIMULTANEOUS) ------------------------ */
// Configure API base to your Cloudflare server (no trailing slash)

                                                                                           const API_BASE = 'https://marie-settled-bernard-allen.trycloudflare.com';

// Build URL helper to avoid doubling endpoints
function buildUrl(endpoint) {
  if (!endpoint) return API_BASE || '';
  const ep = endpoint.replace(/^\//,'');
  if (!API_BASE) return '/' + ep;
  const normalizedBase = API_BASE.replace(/\/+$/,'');
  if (normalizedBase.endsWith('/' + ep) || normalizedBase.endsWith(ep)) return normalizedBase;
  return normalizedBase + '/' + ep;
}

let cameraStream = null;
let scanInterval = null;
let scanLocked = false;            // prevents overlapping AI requests
let barcodeDecodeInProgress = false; // prevents overlapping barcode decodeSingle calls
let lastDetectedBarcode = null;   // remember last barcode to avoid repeated fills

// Start live camera + periodic AI captures
async function startLiveScan() {
  if (cameraStream) return;
  const video = document.getElementById("cameraPreview");
  if (!video) return console.error("❌ cameraPreview missing");
  video.style.display = "block";

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); // single stream
    video.srcObject = cameraStream;
  } catch(err) {
    console.error("Could not access camera:", err);
    alert("Could not access camera. Check permissions.");
    return;
  }

  // periodic capture every 2.5s (adjust as needed)
  scanInterval = setInterval(()=>{ if(!scanLocked) captureAndScan(); },2500);
}

function stopLiveScan() {
  if(scanInterval) {
    clearInterval(scanInterval);
    scanInterval = null;
  }

  // We are not using Quagga.start (live) by default, so just ensure no workers running
  barcodeDecodeInProgress = false;

  if(cameraStream){
    try {
      cameraStream.getTracks().forEach(t=>t.stop());
    } catch(e){ console.warn('Error stopping camera tracks', e); }
    cameraStream=null;
  }

  const video = document.getElementById("cameraPreview");
  if(video) {
    video.style.display="none";
    try { video.srcObject = null; } catch(e) {}
  }

  // clear barcode preview area
  const barcodePreview = document.getElementById('barcodePreview');
  if(barcodePreview) barcodePreview.innerHTML = '';
}

// capture current frame and send to AI product-scan endpoint
async function captureAndScan(){
  const video = document.getElementById("cameraPreview");
  const canvas = document.getElementById("captureCanvas");
  if(!video || !canvas) return console.error("❌ video or canvas missing");

  const ctx = canvas.getContext("2d");
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  canvas.width = vw;
  canvas.height = vh;
  ctx.drawImage(video,0,0,vw,vh);

  // use JPEG for AI (smaller)
  const base64 = canvas.toDataURL("image/jpeg",0.8).split(",")[1];

  // Start barcode detection on this same frame (non-blocking)
  attemptBarcodeDecodeFromCanvas(canvas);

  // Lock AI request so we don't flood
  scanLocked = true;

  try{
    const url = buildUrl('/ai-product-scan');
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64: base64 })
    });

    if(!res.ok){
      const txt = await res.text().catch(()=>null);
      console.warn('AI product scan server error', res.status, txt);
      return;
    }

    const data = await res.json();
    console.log("🧠 AI scan data:", data);

    if(data && data.success && hasLogicalData(data.product)){
      fillProductFromAI(data.product);
      // Note: we intentionally keep the live camera running so barcode decoding can continue.
      // If you prefer to stop camera after AI detection, call stopLiveScan() here.
    } else {
      // no valid product data found — continue scanning
      console.log('AI returned no valid product data');
    }
  }catch(e){ 
    console.error("❌ AI scan error:", e);
  } finally {
    scanLocked=false;
  }
}

// Attempt to decode barcode using Quagga.decodeSingle on the canvas image.
// This avoids opening Quagga LiveStream and uses the same captured frame.
function attemptBarcodeDecodeFromCanvas(canvas) {
  if (barcodeDecodeInProgress) return; // avoid overlapping decodes
  // If the barcode input is already filled with a value we detected earlier, skip decode
  const currentBarcode = document.getElementById("productBarcode")?.value;
  if (currentBarcode && currentBarcode === lastDetectedBarcode) return;

  // Convert canvas to dataURL (PNG typically better for Quagga decoding)
  let dataUrl;
  try {
    dataUrl = canvas.toDataURL('image/png');
  } catch(e) {
    console.warn('Could not get canvas dataURL for barcode decode', e);
    return;
  }

  barcodeDecodeInProgress = true;

  // Quagga.decodeSingle uses the provided src image and runs decoding on it.
  // Set numOfWorkers: 0 if WebWorker creation causes issues in your environment.
  try {
    Quagga.decodeSingle({
      src: dataUrl,
      numOfWorkers: 0, // disable workers to avoid cross-origin worker issues, change to >0 if ok
      locate: true,
      inputStream: {
        size: 800 // set resolution to aid detection
      },
      decoder: {
        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]
      }
    }, function(result) {
      try {
        if (result && result.codeResult && result.codeResult.code) {
          const code = result.codeResult.code;
          console.log('📦 Quagga decodeSingle found barcode:', code);
          const barcodeField = document.getElementById("productBarcode");
          if (barcodeField) {
            barcodeField.value = code;
            lastDetectedBarcode = code;
          }
          // Optionally show the barcodePreview with the detected code
          const preview = document.getElementById('barcodePreview');
          if (preview) preview.innerHTML = `<div style="padding:8px;background:#eef;border-radius:6px">Detected barcode: <b>${code}</b></div>`;
        } else {
          // no barcode found in this frame
          //console.log('No barcode in frame');
        }
      } catch(e) {
        console.warn('Error handling Quagga result', e);
      } finally {
        barcodeDecodeInProgress = false;
      }
    });
  } catch(e) {
    console.warn('Quagga.decodeSingle threw error', e);
    barcodeDecodeInProgress = false;
  }
}

function hasLogicalData(p){ return p && typeof p.name==="string" && p.name.length>2; }

function fillProductFromAI(product){
  const nameEl=document.getElementById("productName");
  const qtyEl=document.getElementById("productQuantity");
  const priceEl=document.getElementById("productPrice");
  const catEl=document.getElementById("productCategory");

  if(!nameEl || !priceEl || !catEl) return console.error("❌ missing input fields");

  nameEl.value = product.name || "";
  if(qtyEl) qtyEl.value = product.quantity || "";
  priceEl.value = product.price || "";
  catEl.value = product.category || "";

  console.log("✅ FILLED VALUES:", {name:nameEl.value,quantity:qtyEl?.value,price:priceEl.value,category:catEl.value});
}

function resetAIScan(){
  scanLocked=false;
  stopLiveScan();
  document.getElementById("productName").value="";
  document.getElementById("productQuantity").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productCategory").value="";
  document.getElementById("productBarcode").value="";
  lastDetectedBarcode = null;
  startLiveScan();
}

/* ------------------------------------------------------------------
  NOTE: Old approach (Quagga LiveStream) is retained below as a fallback,
  but it's NOT used by default in the simultaneous flow because
  Quagga.start requests camera access again and can conflict with the
  existing getUserMedia stream. The preferred path decodes from the
  same canvas frames via Quagga.decodeSingle (above).
------------------------------------------------------------------ */
function startBarcodeOnSameCamera(){
  console.warn('startBarcodeOnSameCamera() available as fallback but not used in simultaneous mode.');
  // If you want to force Quagga live scanning instead of decodeSingle,
  // ensure you stop the live camera first (stopLiveScan) and then call this.
}

/* ------------------------ Initialization / debug ------------------------ */
// Optional quick test fetch removed — actual calls happen in captureAndScan
// Expose functions for debug
window.startLiveScan = startLiveScan;
window.stopLiveScan = stopLiveScan;
window.resetAIScan = resetAIScan;
window.attemptBarcodeDecodeFromCanvas = attemptBarcodeDecodeFromCanvas;
</script>
</body>
</html>
