


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="bharatpos.js" defer></script>
  <style>
    .debug-box {
      background:#fff9e6;
      border:1px solid #ffd580;
      padding:8px;
      margin:8px 0;
      border-radius:6px;
      font-size:13px;
    }
  </style>
</head>
<body>

<!-- SINGLE DOM-READY SCRIPT (handles all autofill cases) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // IDs used in this page (must match inputs)
  const idBarcode = 'productBarcode';
  const idName = 'productName';
  const idMRP = 'productMRP';
  const idBrand = 'brand';

  // helpers
  const setIfPresent = (elId, value) => {
    const el = document.getElementById(elId);
    if (!el) return false;
    if (value !== undefined && value !== null && String(value) !== '') {
      el.value = value;
      return true;
    }
    return false;
  };

  // debug UI
  const debugBox = document.createElement('div');
  debugBox.className = 'debug-box';
  debugBox.id = 'autoFillDebug';
  debugBox.textContent = 'Auto-fill status: waiting...';
  // insert debug box near top
  document.body.insertBefore(debugBox, document.body.firstChild.nextSibling);

  // 1. Try the "auto_" keys that your billing script sets
  const auto_barcode = localStorage.getItem('auto_barcode');
  const auto_name = localStorage.getItem('auto_name');
  const auto_mrp = localStorage.getItem('auto_mrp');
  const auto_brand = localStorage.getItem('auto_brand');

  if (auto_barcode || auto_name || auto_mrp || auto_brand) {
    const used = [];
    if (auto_barcode && setIfPresent(idBarcode, auto_barcode)) used.push('auto_barcode');
    if (auto_name && setIfPresent(idName, auto_name)) used.push('auto_name');
    if (auto_mrp && setIfPresent(idMRP, auto_mrp)) used.push('auto_mrp');
    if (auto_brand && setIfPresent(idBrand, auto_brand)) used.push('auto_brand');

    // Clear them so they don't auto-fill again by mistake
    localStorage.removeItem('auto_barcode');
    localStorage.removeItem('auto_name');
    localStorage.removeItem('auto_mrp');
    localStorage.removeItem('auto_brand');

    debugBox.textContent = 'Auto-filled from billing keys: ' + (used.length ? used.join(', ') : 'none (keys present but fields missing)');
    // renderProducts will run later (or we call it manually below)
  } else {
    // 2. Fallback: older key names (temp_new_barcode / newProductData)
    const temp = localStorage.getItem('temp_new_barcode');
    const newProdRaw = localStorage.getItem('newProductData');

    if (newProdRaw) {
      try {
        const obj = JSON.parse(newProdRaw);
        const used = [];
        if (obj.barcode && setIfPresent(idBarcode, obj.barcode)) used.push('newProductData.barcode');
        if (obj.name && setIfPresent(idName, obj.name)) used.push('newProductData.name');
        if (obj.mrp && setIfPresent(idMRP, obj.mrp)) used.push('newProductData.mrp');
        if (obj.brand && setIfPresent(idBrand, obj.brand)) used.push('newProductData.brand');
        // clear it
        localStorage.removeItem('newProductData');
        debugBox.textContent = 'Auto-filled from newProductData: ' + (used.length ? used.join(', ') : 'none');
      } catch (e) {
        console.warn('Invalid JSON in newProductData', e);
        localStorage.removeItem('newProductData');
        debugBox.textContent = 'newProductData malformed - removed';
      }
    } else if (temp) {
      // only barcode present
      const filled = setIfPresent(idBarcode, temp);
      localStorage.removeItem('temp_new_barcode');
      debugBox.textContent = filled ? 'Auto-filled barcode from temp_new_barcode' : 'temp_new_barcode present but input missing';
    } else {
      debugBox.textContent = 'No auto-fill data found in localStorage';
    }
  }

  // Render product list (if function exists in bharatpos.js)
  if (typeof renderProducts === 'function') {
    try { renderProducts(); } catch(e) { console.warn('renderProducts error', e); }
  }

  // ---------- Manual test helper (use in console) ----------
  // Run: localStorage.setItem('auto_barcode','012345678901'); location.reload();
});
</script>

<!-- NAV -->
<nav>
  <a href="sales.html">Sales</a>
  <a href="settings.html">Settings</a>
  <a href="index.html">About</a>
  <div id="profileName" class="profile-name"></div>
</nav>

<style>
.profile-name { font-weight:700; color:#ffcc00; margin-left:12px; padding:6px 10px; border-radius:8px; }
.container { padding: 12px; }
.card { padding:12px; margin:12px 0; background:#f7f7f7; border-radius:8px; }
</style>

<div class="header">
  <div class="brand">🛰️ Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">Billing</a>
  </div>
</div>

<div class="container">

  <div class="card">
    <h3>Add Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      <div class="form-row"><input id="productName" placeholder="Product Name"></div>
      <div class="form-row"><input id="productMRP" type="number" step="0.01" placeholder="MRP"></div>
      <div class="form-row"><input id="brand" placeholder="Brand"></div>
      <div class="form-row"><input id="productStock" type="number" placeholder="Stock"></div>
      <div class="form-row"><input id="productCategory" placeholder="Category (optional)"></div>

      <label>Barcode:</label>
      <input id="productBarcode" placeholder="Enter Barcode">

      <div class="form-row"><button type="submit">Save Product</button></div>
    </form>
  </div>

  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>

</div>

<script>
/* Render products table (uses getProducts from bharatpos.js) */
function renderProducts(){
  const products = (typeof getProducts === 'function') ? getProducts() : [];
  if(!products || products.length === 0){
    document.getElementById('productsList').innerHTML = '<div class="small">No products</div>';
    return;
  }
  let html = '<table><tr><th>Name</th><th>MRP</th><th>Stock</th><th>Brand</th><th>Category</th><th>Action</th></tr>';
  products.forEach(p=>{
    html += `<tr>
      <td>${p.name}</td><td>${p.price}</td><td>${p.stock}</td><td>${p.brand||'-'}</td><td>${p.category||'-'}</td>
      <td><button onclick="deleteProductConfirm('${p.id}')">Delete</button></td></tr>`;
  });
  html += '</table>';
  document.getElementById('productsList').innerHTML = html;
}
</script>

<script>
// PROFILE
function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user')||'{}');
  document.getElementById('profileName').textContent = data.name ? '👤 ' + data.name : '👤 Guest';
}
loadUser();

// delete helper (uses saveProducts/getProducts from bharatpos.js)
function deleteProductConfirm(pid){
  if(!confirm('Are you sure?')) return;
  if (typeof getProducts === 'function' && typeof saveProducts === 'function') {
    let products = getProducts().filter(p=>p.id!==pid);
    saveProducts(products);
    renderProducts();
  } else {
    alert('save/get product functions missing.');
  }
}
</script>

</body>
</html>
