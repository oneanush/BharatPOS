<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="bharatpos.js" defer></script>
</head>
<body>

<nav>
  <a href="sales.html">Sales</a>
  <a href="settings.html">Settings</a>
  <a href="index.html">About</a>
  <div id="profileName" class="profile-name"></div>
</nav>

<style>
.profile-name {
  font-weight: 700;
  color: #ffccrr;
  margin-left: 12px;
  margin-right: 5px;
  padding: 6px 10px;
  border: 1px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
}
</style>

<div class="header">
  <div class="brand">🛰️ Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">Billing</a>
  </div>
</div>

<div class="container">

  <!-- ADD PRODUCT CARD -->
  <div class="card">
    <h3>Add Product</h3>

    <form id="productForm" onsubmit="handleAddProduct(event);">

      <div class="form-row">
        <input id="productName" placeholder="Product Name">
      </div>

      <div class="form-row">
        <input id="productMRP" type="number" step="0.01" placeholder="MRP">
      </div>

      <div class="form-row">
        <input id="brand" placeholder="Brand">
      </div>

      <div class="form-row">
        <input id="productStock" type="number" placeholder="Stock">
      </div>

      <div class="form-row">
        <input id="productCategory" placeholder="Category (optional)">
      </div>

      <label>Barcode:</label>
      <input id="productBarcode" placeholder="Enter Barcode">

      <div class="form-row">
        <button type="submit">Save Product</button>
      </div>

    </form>
  </div>

  <!-- PRODUCT LIST CARD -->
  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>

</div>

<script>
/* RENDER PRODUCTS TABLE */
function renderProducts(){
  const products = getProducts();
  if(products.length === 0){
    document.getElementById('productsList').innerHTML = '<div class="small">No products</div>';
    return;
  }

  let html = `
  <table>
    <tr>
      <th>Name</th>
      <th>MRP</th>
      <th>Stock</th>
      <th>Brand</th>
      <th>Category</th>
      <th>Action</th>
    </tr>`;

  products.forEach(p => {
    html += `
    <tr>
      <td>${p.name}</td>
      <td>${p.price}</td>
      <td>${p.stock}</td>
      <td>${p.brand || '-'}</td>
      <td>${p.category || '-'}</td>
      <td>
        <button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button>
      </td>
    </tr>`;
  });

  html += '</table>';
  document.getElementById('productsList').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  renderProducts();

  // barcode auto-fill from scanner → product page
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    document.getElementById("productBarcode").value = temp;
    localStorage.removeItem("temp_new_barcode");
  }

  // advanced scanner auto-fill (name, brand, mrp)
  const data = JSON.parse(localStorage.getItem("newProductData") || "{}");

  if (data.barcode) document.getElementById("productBarcode").value = data.barcode;
  if (data.name) document.getElementById("productName").value = data.name;
  if (data.mrp) document.getElementById("productMRP").value = data.mrp;
  if (data.brand) document.getElementById("brand").value = data.brand;

  localStorage.removeItem("newProductData");
});
</script>

<script>
// PROFILE NAME LOAD
function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent =
    data.name ? "👤 " + data.name : "👤 Guest";
}
loadUser();
</script>

<script>
// DELETE PRODUCT
function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts().filter(p => p.id !== pid);
  saveProducts(products);
  renderProducts();
  alert("Product deleted successfully!");
}
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const data = JSON.parse(localStorage.getItem("newProductData") || "{}");

  if (data.barcode) document.getElementById("productBarcode").value = data.barcode;
  if (data.name) document.getElementById("productName").value = data.name;
  if (data.mrp) document.getElementById("productMRP").value = data.mrp;
  if (data.brand) document.getElementById("brand").value = data.brand;

  localStorage.removeItem("newProductData");
});
</script>


</body>
</html>
