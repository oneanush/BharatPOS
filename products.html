<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Products - Bharat POS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <script src="quagga.js"></script>
  <script src="bharatpos.js" defer></script>

  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-body: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.6);
      --glass: blur(12px);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b; /* Bharat POS Gold */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding-bottom: 80px;
    }

    /* BACKGROUND MESH */
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05), transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05), transparent 40%);
      z-index: -1; pointer-events: none;
    }

    /* --- NAVIGATION (Preserved Links) --- */
    nav {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 15px 20px; gap: 15px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: var(--glass);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
    nav a:hover { color: var(--accent); }
    
    .profile-name {
      font-weight: 700; color: var(--accent);
      padding: 6px 12px; border: 1px solid var(--accent);
      border-radius: 20px; background: rgba(245, 158, 11, 0.1);
      font-size: 13px; margin-left: 10px;
    }

    /* --- HEADER --- */
    .header {
      padding: 20px; display: flex; align-items: center; justify-content: space-between;
      max-width: 1200px; margin: 0 auto;
    }
    .global-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .brand { font-size: 20px; font-weight: 800; margin-left: 10px; flex-grow: 1; color: #fff; }
    .nav a { margin-left: 15px; font-size: 14px; }

    /* --- LAYOUT --- */
    .main-container {
      display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px;
      max-width: 1200px; margin: 0 auto; padding: 0 20px;
    }
    @media(max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

    .card {
      background: var(--bg-card); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    h3 { margin: 0 0 20px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    /* --- SCANNER HUD --- */
    .scanner-section { max-width: 1200px; margin: 0 auto 20px auto; padding: 0 20px; }
    .scan-controls { display: flex; gap: 10px; margin-bottom: 15px; }
    
    .btn-scan {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer; transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-start { background: var(--accent); color: #000; }
    .btn-stop { background: var(--input-bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn-reset { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); }
    .btn-scan:active { transform: scale(0.96); }

    /* HUD Video Container */
    .camera-wrapper {
      position: relative; border-radius: 12px; overflow: hidden;
      background: #000; display: none; /* Hidden by default */
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); border: 1px solid var(--accent);
    }
    #cameraPreview { width: 100%; height: 300px; object-fit: cover; display: block; }
    
    /* Scanning Animation Line */
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: var(--success); box-shadow: 0 0 10px var(--success);
      animation: scanMove 2s infinite linear; z-index: 10;
    }
    @keyframes scanMove { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    /* --- FORM STYLES --- */
    .form-row { margin-bottom: 16px; position: relative; }
    
    input {
      width: 100%; padding: 14px 12px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: #fff; font-size: 14px; transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
    input::placeholder { color: transparent; } /* Hide default placeholder for floating label effect */

    /* Floating Label Magic */
    .floating-label {
      position: absolute; left: 12px; top: 14px; color: var(--text-muted);
      font-size: 14px; pointer-events: none; transition: 0.2s;
    }
    input:focus ~ .floating-label,
    input:not(:placeholder-shown) ~ .floating-label {
      top: -8px; left: 10px; font-size: 11px; color: var(--accent);
      background: var(--bg-body); padding: 0 4px; border-radius: 4px;
    }

    button[type="submit"] {
      width: 100%; background: var(--success); color: #fff;
      padding: 14px; border: none; border-radius: 8px; font-weight: 700;
      cursor: pointer; font-size: 15px; margin-top: 10px;
    }

    /* --- PRODUCT LIST (Responsive Table) --- */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--text-muted); font-size: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .delete-btn {
      background: rgba(239, 68, 68, 0.2); color: var(--danger);
      border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .delete-btn:hover { background: var(--danger); color: white; }

    /* Mobile Table Transformation */
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      tr { margin-bottom: 15px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; border: 1px solid var(--border); }
      td { border: none; padding: 6px 0; position: relative; padding-left: 40%; display: flex; align-items: center; }
      td:before { position: absolute; left: 0; width: 35%; white-space: nowrap; content: attr(data-label); color: var(--text-muted); font-size: 12px; font-weight: 600; }
    }

    /* --- TOAST --- */
    #toast {
      visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff;
      text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000;
      right: 20px; bottom: 30px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      opacity: 0; transition: opacity 0.3s, bottom 0.3s;
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
  </style>
</head>
<body>

<nav>
   <a href="sales.html">Sales</a>
   <a href="settings.html">Settings</a>
   <a href="index.html">About</a>
   <div id="profileName" class="profile-name"></div>
</nav>

<div class="header">
  <div style="display:flex; align-items:center;">
      <img src="logo.png" class="global-logo" alt="Logo">
      <div class="brand">Bharat POS</div>
  </div>
  <div class="nav">
    <a href="dashboard.html" style="color:var(--accent);">Dashboard</a>
    <a href="billing.html" style="color:#fff;">Billing</a>
  </div>
</div>

<div class="scanner-section">
  <div class="scan-controls">
    <button type="button" class="btn-scan btn-start" onclick="uiStartScan()">
      <span>📷 AI Scan</span>
    </button>
    <button type="button" class="btn-scan btn-stop" onclick="uiStopScan()">
      <span>⛔ Stop</span>
    </button>
    <button type="button" class="btn-scan btn-reset" onclick="resetAIScan()">
      <span>🔄 Next Item</span>
    </button>
  </div>

  <div id="cameraContainer" class="camera-wrapper">
    <div class="scan-line"></div>
    <video id="cameraPreview" autoplay playsinline></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>
  </div>
  <div id="barcodePreview" style="margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:12px;"></div>
</div>

<div class="main-container">
  
  <div class="card">
    <h3>Add New Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      
      <div class="form-row">
        <input id="productName" placeholder=" " required>
        <label for="productName" class="floating-label">Product Name (e.g. Amul Milk)</label>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="position:relative;">
            <input id="productQuantity" placeholder=" ">
            <label for="productQuantity" class="floating-label">Qty/Unit</label>
        </div>
        <div style="position:relative;">
            <input id="productPrice" type="number" step="0.01" placeholder=" " required>
            <label for="productPrice" class="floating-label">Price (₹)</label>
        </div>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="position:relative;">
            <input id="productStock" type="number" placeholder=" ">
            <label for="productStock" class="floating-label">Stock Qty</label>
        </div>
        <div style="position:relative;">
            <input id="productTax" type="number" placeholder=" ">
            <label for="productTax" class="floating-label">Tax %</label>
        </div>
      </div>

      <div class="form-row">
        <input id="productCategory" placeholder=" ">
        <label for="productCategory" class="floating-label">Category (Optional)</label>
      </div>

      <div class="form-row" style="border-top:1px dashed var(--border); padding-top:15px; margin-top:5px;">
        <input type="text" id="productBarcode" placeholder=" " style="font-family:'JetBrains Mono'; color:var(--accent);">
        <label for="productBarcode" class="floating-label">Barcode / SKU</label>
      </div>

      <div class="form-row">
        <button type="submit">Save Product to Inventory</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Inventory List</h3>
    <div id="productsList"></div>
  </div>
</div>

<div id="toast">Message Here</div>

<script>
/* ------------------------ UI ENHANCEMENTS ------------------------ */

// Custom Toast Function
function showToast(msg, isError = false) {
  const x = document.getElementById("toast");
  x.innerText = msg;
  x.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
  x.className = "show";
  setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
}

// Wrapper for Camera UI toggling
function uiStartScan() {
  const cont = document.getElementById('cameraContainer');
  cont.style.display = 'block'; // Show HUD
  startLiveScan(); // Call original logic
}

function uiStopScan() {
  const cont = document.getElementById('cameraContainer');
  cont.style.display = 'none'; // Hide HUD
  stopLiveScan(); // Call original logic
}

/* ------------------------ ORIGINAL LOGIC PRESERVED ------------------------ */

function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  document.getElementById('profileName').textContent = data.name ? "👤 " + data.name : "👤 Guest";
}
loadUser();

function renderProducts(){
  const products = getProducts();
  if(products.length===0) { 
    document.getElementById('productsList').innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">📦 No products found.<br>Add one using the form.</div>'; 
    return;
  }
  
  // Responsive Table HTML
  let html = '<table><thead><tr><th>Name</th><th>Qty/Unit</th><th>Price</th><th>Stock</th><th>Tax %</th><th>Category</th><th>Action</th></tr></thead><tbody>';
  products.forEach(p=>{
    html += `<tr>
      <td data-label="Name" style="font-weight:600; color:#fff;">${p.name}</td>
      <td data-label="Qty">${p.quantity || '-'}</td>
      <td data-label="Price" style="color:var(--accent);">₹${p.price}</td>
      <td data-label="Stock">${p.stock}</td>
      <td data-label="Tax">${p.taxPercent}%</td>
      <td data-label="Category">${p.category}</td>
      <td data-label="Action"><button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('productsList').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    const barcodeField = document.getElementById("productBarcode");
    if (barcodeField) barcodeField.value = temp;
    localStorage.removeItem("temp_new_barcode");
  }
});

function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== pid);
  saveProducts(products);
  renderProducts();
  showToast("Product deleted successfully!");
}

async function handleAddProduct(event){
  if(event && event.preventDefault) event.preventDefault();
  try {
    const qtyValue = document.getElementById('productQuantity').value;
    await addProduct(); // from bharatpos.js
    let products = getProducts();
    if(products.length > 0){
      let lastProduct = products[products.length - 1];
      lastProduct.quantity = qtyValue;
      saveProducts(products);
    }
    renderProducts();
    
    // Reset form
    document.getElementById('productForm').reset();
    showToast("Product Added Successfully!");

  } catch(err){
    console.error('Error adding product:', err);
    showToast('Failed to add product', true);
  }
}

/* ------------------------ AI + BARCODE SCANNER LOGIC (UNTOUCHED) ------------------------ */

let cameraStream = null;
let aiScanInterval = null;
let barcodeScanFrameId = null; 

let aiScanLocked = false;          
let barcodeDecodeInProgress = false; 
let lastDetectedBarcode = null;
let lastBarcodeTime = 0;

const barcodeCanvas = document.createElement('canvas'); 
const barcodeCtx = barcodeCanvas.getContext('2d', { willReadFrequently: true });

async function startLiveScan() {
  if (cameraStream) return;
  const video = document.getElementById("cameraPreview");
  if (!video) return console.error("❌ cameraPreview missing");
  
  // video.style.display = "block"; // Handled by UI wrapper now

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 } 
      }
    }); 
    video.srcObject = cameraStream;
    
    video.onloadedmetadata = () => {
      video.play();
      aiScanInterval = setInterval(() => { if(!aiScanLocked) captureAndSendToAI(); }, 2500);
      loopBarcodeScanning();
    };

  } catch(err) {
    console.error("Could not access camera:", err);
    alert("Could not access camera. Check permissions.");
  }
}

function stopLiveScan() {
  if(aiScanInterval) {
    clearInterval(aiScanInterval);
    aiScanInterval = null;
  }

  if(barcodeScanFrameId) {
    cancelAnimationFrame(barcodeScanFrameId);
    barcodeScanFrameId = null;
  }

  barcodeDecodeInProgress = false;

  if(cameraStream){
    try { cameraStream.getTracks().forEach(t=>t.stop()); } catch(e){}
    cameraStream=null;
  }

  const video = document.getElementById("cameraPreview");
  if(video) {
    // video.style.display="none"; // Handled by UI wrapper
    try { video.srcObject = null; } catch(e) {}
  }

  const barcodePreview = document.getElementById('barcodePreview');
  if(barcodePreview) barcodePreview.innerHTML = '';
}

async function captureAndSendToAI(){
  const video = document.getElementById("cameraPreview");
  const canvas = document.getElementById("captureCanvas"); 
  if(!video || !canvas) return;

  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

  aiScanLocked = true;

  try{
    const url = buildUrl('/ai-product-scan');
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64: base64 })
    });

    if(!res.ok) return;

    const data = await res.json();
    console.log("🧠 AI scan data:", data);

    if(data && data.success && hasLogicalData(data.product)){
      fillProductFromAI(data.product);
      showToast("AI Detected Product!", false);
    } 
  } catch(e){ 
    console.error("❌ AI scan error:", e);
  } finally {
    aiScanLocked = false;
  }
}

function loopBarcodeScanning() {
  if (!cameraStream) return;
  const now = Date.now();
  if (now - lastBarcodeTime > 200 && !barcodeDecodeInProgress) {
    lastBarcodeTime = now;
    attemptFastBarcodeDecode();
  }
  barcodeScanFrameId = requestAnimationFrame(loopBarcodeScanning);
}

function attemptFastBarcodeDecode() {
  const video = document.getElementById("cameraPreview");
  if (!video || video.videoWidth === 0) return;

  const currentVal = document.getElementById("productBarcode")?.value;
  if (currentVal && currentVal === lastDetectedBarcode) return;

  barcodeDecodeInProgress = true;

  const scale = 800 / video.videoWidth; 
  barcodeCanvas.width = 800;
  barcodeCanvas.height = video.videoHeight * scale;
  
  barcodeCtx.drawImage(video, 0, 0, barcodeCanvas.width, barcodeCanvas.height);
  const dataUrl = barcodeCanvas.toDataURL("image/png");

  Quagga.decodeSingle({
    src: dataUrl,
    numOfWorkers: 2, 
    inputStream: { size: 800, singleChannel: false },
    locate: true, 
    locator: { patchSize: "medium", halfSample: true },
    decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"] }
  }, function(result) {
    barcodeDecodeInProgress = false;

    if (result && result.codeResult && result.codeResult.code) {
      const code = result.codeResult.code;
      
      if(code.length > 5) {
        console.log('📦 FAST SCAN found:', code);
        
        const barcodeField = document.getElementById("productBarcode");
        if (barcodeField) {
          barcodeField.value = code;
          lastDetectedBarcode = code;
          showToast("Barcode Scanned: " + code);
        }

        const preview = document.getElementById('barcodePreview');
        if (preview) {
           preview.innerHTML = `<div style="padding:10px; background:rgba(16,185,129,0.2); color:#10b981; border:1px solid #10b981; border-radius:5px; text-align:center;">
             <strong>MATCH!</strong> Barcode: ${code} <br> Format: ${result.codeResult.format}
           </div>`;
        }
      }
    }
  });
}

function hasLogicalData(p){ return p && typeof p.name==="string" && p.name.length>2; }

function fillProductFromAI(product){
  const nameEl=document.getElementById("productName");
  const qtyEl=document.getElementById("productQuantity");
  const priceEl=document.getElementById("productPrice");
  const catEl=document.getElementById("productCategory");

  if(!nameEl) return;
  
  nameEl.value = product.name || nameEl.value;
  if(qtyEl) qtyEl.value = product.quantity || qtyEl.value;
  if(priceEl) priceEl.value = product.price || priceEl.value;
  if(catEl) catEl.value = product.category || catEl.value;
  
  // Highlighting logic handled by CSS transition
  nameEl.focus();
}

function resetAIScan(){
  aiScanLocked=false;
  stopLiveScan();
  document.getElementById("productForm").reset();
  lastDetectedBarcode = null;
  const preview = document.getElementById('barcodePreview');
  if(preview) preview.innerHTML = '';
  startLiveScan();
}

window.startLiveScan = startLiveScan;
window.stopLiveScan = stopLiveScan;
window.resetAIScan = resetAIScan;

/* URL PARAMS LOGIC */
window.addEventListener('DOMContentLoaded', (event) => {
  const params = new URLSearchParams(window.location.search);
  
  if (params.has('restock')) {
    const pName  = params.get('restock');
    const pPrice = params.get('price');
    const pCat   = params.get('category');
    const pTax   = params.get('tax');
    const pStockCount = params.get('stock_val'); 
    
    const pUnitSize = params.get('unit_val') || params.get('unit') || params.get('quantity');

    const findEl = (ids) => {
      for (let id of ids) {
        const el = document.getElementById(id);
        if (el) return el;
      }
      return null;
    };

    const elName  = findEl(['productName', 'name']);
    const elPrice = findEl(['productPrice', 'price']);
    const elCat   = findEl(['productCategory', 'category']);
    const elTax   = findEl(['productTax', 'tax']);
    const elStock = findEl(['productStock', 'stock']); 
    const elUnit  = findEl(['productQuantity', 'quantity', 'unit', 'size']);

    if (elName) elName.value = pName;
    if (elPrice && pPrice) elPrice.value = pPrice;
    if (elCat && pCat) elCat.value = pCat;
    if (elTax && pTax) elTax.value = pTax;
    
    if (elUnit && pUnitSize) elUnit.value = pUnitSize;

    [elName, elPrice, elCat, elTax, elStock, elUnit].forEach(el => {
      if(el) {
        el.style.borderColor = "var(--accent)"; 
        setTimeout(() => el.style.borderColor = "", 2000);
      }
    });
    
    if(elName) elName.focus();
  }
});
</script>
</body>
</html>
