<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products - Bharat POS</title>
  <link rel="stylesheet" href="bharatpos.css">
  <script src="bharatpos.js" defer></script>
  <style>
    .ai-scanner-box {
      background: var(--card,#fff);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(28,72,212,0.07);
      margin-bottom: 16px;
      padding: 14px 18px;
      max-width: 650px;
    }
    .ai-video-container {
      width:100%;max-width:410px;height:180px;border-radius:10px;overflow:hidden;
      border:1.5px solid #0082cd; margin-bottom: 10px;background: #000;display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    .ai-scanner-controls {
      display:flex;gap:14px;margin:8px 0 0 0;align-items:center;
    }
    .ai-detected-fields {
      font-size:14px;background:#e8f0fd;border-radius:7px;padding:7px 10px;margin:9px 0;color:#005f99;
      white-space: pre-line;
    }
    .ai-loader {
      display:none;align-items:center;gap:7px;font-size:13px;color:#0b5ed7;
    }
    .ai-loader.active {
      display:inline-flex;
    }
    .ai-error {
      color: #dc3545; font-weight: bold;
    }
  </style>
</head>
<body>
<nav>
  <a href="sales.html">Sales</a>
  <a href="settings.html">Settings</a>
  <a href="index.html">About</a>
  <div id="profileName" class="profile-name"></div>
</nav>
<style>
.profile-name {
  font-weight: 700;
  color: #ffcc00;
  margin-left: 12px;
  margin-right: 5px;
  padding: 6px 10px;
  border: 1px solid #ffcc00;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
}
</style>

<div class="header">
  <div class="global-header"> <img src="logo.png" class="global-logo"> </div>
  <div class="brand"> Bharat POS</div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="billing.html">billing</a>
  </div>
</div>

<div class="container">
  <!-- ***** AI Product Scanner Card (NEW FEATURE) ***** -->
  <div class="card ai-scanner-box">
    <h3>AI Product Scanner</h3>
    <div>
      <div class="ai-video-container" id="aiVideoPreview">
        <!-- Live video stream will appear here -->
        <video id="aiScannerVideo" autoplay muted playsinline style="width:100%;height:100%;display:none;border-radius:10px;background:#000;"></video>
        <canvas id="aiScannerCanvas" style="display:none;"></canvas>
        <span id="aiVideoPlaceholder" style="width:100%;text-align:center;color:#b5ccff;">Camera inactive</span>
      </div>
      <div class="ai-scanner-controls">
        <button type="button" id="aiStartBtn">Start Camera</button>
        <button type="button" id="aiStopBtn" style="display:none;">Stop Camera</button>
        <button type="button" id="aiDetectBtn" style="display:none;">Detect Product Details</button>
        <span id="aiLoader" class="ai-loader"><span>Detecting...</span></span>
      </div>
      <div id="aiDetectedFields" class="ai-detected-fields" style="display:none;"></div>
    </div>
    <div style="font-size:13px;color:#555;margin-top:7px;">
      Show the label/packaging flatly and clearly. <br>
      <b>Detected fields (barcode, brand, name, price, tax) auto-fill below.</b>
    </div>
  </div>
  <!-- ******** End AI Scanner Card ******** -->

  <div class="card">
    <h3>Add Product</h3>
    <form id="productForm" onsubmit="handleAddProduct(event);">
      <div class="form-row"><input id="productName" placeholder="Product name"></div>
      <div class="form-row"><input id="productBrand" placeholder="Brand (optional)"></div>
      <div class="form-row"><input id="productPrice" type="number" step="0.01" placeholder="Price"></div>
      <div class="form-row"><input id="productStock" type="number" placeholder="Stock"></div>
      <div class="form-row"><input id="productTax" type="number" placeholder="Tax % (optional)"></div>
      <div class="form-row"><input id="productCategory" placeholder="Category (optional)"></div>
      <label>Barcode:</label>
      <input type="text" id="productBarcode" placeholder="Enter Barcode">
      <div class="form-row"><button type="submit">Save Product</button></div>
    </form>
  </div>

  <div class="card">
    <h3>Products</h3>
    <div id="productsList"></div>
  </div>
</div>

<script>
function renderProducts(){
  const products = getProducts();
  if(products.length===0) { document.getElementById('productsList').innerHTML = '<div class="small">No products</div>'; return;}
  let html = '<table><tr><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th>Tax %</th><th>Category</th><th>Barcode</th><th>Action</th></tr>';
  products.forEach(p=>{
    html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.brand || ''}</td>
        <td>${p.price}</td>
        <td>${p.stock}</td>
        <td>${p.taxPercent}%</td>
        <td>${p.category}</td>
        <td>${p.barcode || ''}</td>
        <td>
          <button class="delete-btn" onclick="deleteProductConfirm('${p.id}')">Delete</button>
        </td>
      </tr>`;
  });
  html += '</table>';
  document.getElementById('productsList').innerHTML = html;
}
document.addEventListener('DOMContentLoaded', ()=>{
  renderProducts();
  const temp = localStorage.getItem("temp_new_barcode");
  if (temp) {
    const barcodeField = document.getElementById("productBarcode");
    if (barcodeField) barcodeField.value = temp;
    localStorage.removeItem("temp_new_barcode");
  }
});

function loadUser(){
  const data = JSON.parse(localStorage.getItem('bharatpos_user') || '{}');
  if(data.name){
    document.getElementById('profileName').textContent = "👤 " + data.name;
  } else {
    document.getElementById('profileName').textContent = "👤 Guest";
  }
}
loadUser();

function deleteProductConfirm(pid){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== pid);
  saveProducts(products);
  renderProducts();
  alert("Product deleted successfully!");
}

async function handleAddProduct(event){
  if(event && event.preventDefault) event.preventDefault();
  try {
    await addProduct();
    renderProducts();
    const form = document.getElementById('productForm');
    if(form) {
      document.getElementById('productName').value = '';
      document.getElementById('productBrand').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productStock').value = '';
      document.getElementById('productTax').value = '';
      document.getElementById('productCategory').value = '';
      // document.getElementById('productBarcode').value = '';
    }
  } catch (err) {
    console.error('Error adding product:', err);
    alert('Failed to add product. See console for details.');
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const barcode = localStorage.getItem("temp_new_barcode");
  if (barcode) {
    const barcodeField = document.getElementById("productBarcode");
    if (barcodeField) {
      barcodeField.value = barcode;
      barcodeField.focus();
    }
    localStorage.removeItem("temp_new_barcode");
  }
});
</script>

<!-- ********* ADVANCED AI + BARCODE SCANNER ********* -->
<script>
(function() {
  const startBtn = document.getElementById('aiStartBtn');
  const stopBtn = document.getElementById('aiStopBtn');
  const detectBtn = document.getElementById('aiDetectBtn');
  const video = document.getElementById('aiScannerVideo');
  const canvas = document.getElementById('aiScannerCanvas');
  const placeholder = document.getElementById('aiVideoPlaceholder');
  const loader = document.getElementById('aiLoader');
  const fieldsBox = document.getElementById('aiDetectedFields');
  const camError = document.getElementById('aiCamError');

  let cameraStream = null;
  let barcodeScanInterval = null;

  function showVideo(active) {
    video.style.display = active ? 'block' : 'none';
    placeholder.style.display = active ? 'none' : 'block';
    detectBtn.style.display = active ? 'inline-block' : 'none';
    stopBtn.style.display = active ? 'inline-block' : 'none';
    startBtn.style.display = active ? 'none' : 'inline-block';
    camError.style.display = 'none';
  }

  async function startBarcodeScan() {
    if (!('BarcodeDetector' in window)) return;
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128'] });
    barcodeScanInterval = setInterval(async () => {
      if (!cameraStream || video.readyState !== video.HAVE_ENOUGH_DATA) return;
      canvas.width = video.videoWidth || 400;
      canvas.height = video.videoHeight || 200;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      try {
        const barcodes = await detector.detect(canvas);
        if (barcodes.length) {
          const barcodeVal = barcodes[0].rawValue;
          document.getElementById('productBarcode').value = barcodeVal;
          fieldsBox.style.display = "block";
          fieldsBox.innerHTML = `<b>Barcode detected:</b> ${barcodeVal}`;
        }
      } catch(e) {}
    }, 700);
  }

  function stopBarcodeScan() {
    if (barcodeScanInterval) clearInterval(barcodeScanInterval);
    barcodeScanInterval = null;
  }

startBtn.addEventListener('click', async () => {
  try {
    const isMobile = /Android|iPhone/i.test(navigator.userAgent);

    const constraints = isMobile
      ? { video: { facingMode: { ideal: "environment" } }, audio: false }
      : { video: true, audio: false };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);

    cameraStream = stream;
    video.srcObject = stream;

    video.onloadedmetadata = () => {
      video.play();
      showVideo(true);

      if ('BarcodeDetector' in window) startBarcodeScan();
    };

  } catch(err) {
    const camError = document.getElementById('aiCamError');
    if (camError) {
      camError.textContent = "Camera error: " + err.message;
      camError.style.display = "block";
    }
    showVideo(false);
  }
});

  

  stopBtn.addEventListener('click', () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      video.srcObject = null;
    }
    showVideo(false);
    loader.classList.remove("active");
    fieldsBox.style.display = "none";
    stopBarcodeScan();
  });

  // --- AI Detection via Local Gemini Backend ---
  async function aiDetectProductDetails(imageDataUrl) {
    try {
      const endpoint = "http://localhost:5185/gemini-predict";
      const payload = {
        instances: [{
          prompt: `
You are an expert AI for extracting product information from Indian retail labels.
Detect and output ONLY JSON:
{"name":"...", "brand":"...", "price":"...", "barcode":"...", "category":"...", "tax":"..."}
If unknown, use empty string "".
          `,
          image: imageDataUrl
        }]
      };
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await resp.json();
      const text = result?.predictions?.[0]?.candidates?.[0]?.content?.text
        || result?.predictions?.[0]?.content?.text
        || "";
      const match = text.match(/{[\s\S]*}/);
      if (!match) return {};
      return JSON.parse(match[0]);
    } catch (err) {
      console.error("AI detection failed:", err);
      return {};
    }
  }

  function highlightField(inputId, isDetected) {
    const el = document.getElementById(inputId);
    if (!el) return;
    el.style.borderColor = isDetected ? "#0082cd" : "#dc3545"; // blue if detected, red if missing
  }

  detectBtn.addEventListener('click', async () => {
    if (!cameraStream) {
      fieldsBox.innerHTML = "<span class='ai-error'>Camera not started.</span>";
      fieldsBox.style.display = "block";
      return;
    }
    loader.classList.add("active");
    fieldsBox.style.display = "none";

    try {
      canvas.width = video.videoWidth || 400;
      canvas.height = video.videoHeight || 200;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.9);

      const result = await aiDetectProductDetails(dataUrl);

      // Reset highlights
      ['productName','productBrand','productPrice','productCategory','productTax','productBarcode'].forEach(id => highlightField(id,false));

      const infos = [];

      if (result.name) { document.getElementById('productName').value = result.name; highlightField('productName',true); infos.push("<b>Name:</b> " + result.name); }
      if (result.brand) { document.getElementById('productBrand').value = result.brand; highlightField('productBrand',true); infos.push("<b>Brand:</b> " + result.brand); }
      if (result.price) { document.getElementById('productPrice').value = result.price; highlightField('productPrice',true); infos.push("<b>Price:</b> " + result.price); }
      if (result.category) { document.getElementById('productCategory').value = result.category; highlightField('productCategory',true); infos.push("<b>Category:</b> " + result.category); }
      if (result.tax !== undefined) { document.getElementById('productTax').value = result.tax; highlightField('productTax',true); infos.push("<b>Tax %:</b> " + result.tax); }
      if (result.barcode) { document.getElementById('productBarcode').value = result.barcode; highlightField('productBarcode',true); infos.push("<b>Barcode:</b> " + result.barcode); }

      // Highlight missing fields in red
      ['productName','productBrand','productPrice','productCategory','productTax','productBarcode'].forEach(id => {
        if (!document.getElementById(id).value) highlightField(id,false);
      });

      fieldsBox.innerHTML = infos.length ? infos.join("\n") : "<span class='ai-error'>No details detected. You can still add manually.</span>";
      fieldsBox.style.display = "block";

    } catch(err) {
      console.error("AI detection error:", err);
      fieldsBox.innerHTML = "<span class='ai-error'>Detection failed. Manual input still possible.</span>";
      fieldsBox.style.display = "block";
    } finally {
      loader.classList.remove("active");
    }
  });

  window.addEventListener("beforeunload", () => {
    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    stopBarcodeScan();
  });
  console.log("=== Starting AI Detection ===");
console.log("Camera active:", !!cameraStream);
console.log("Video readyState:", video.readyState);

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

console.log("Canvas size:", canvas.width, canvas.height);

const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
console.log("Image Data URL length:", dataUrl.length);

// Test backend
try {
    console.log("Sending POST to backend...");
    const resp = await fetch("http://localhost:5185/gemini-predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            instances: [{
                prompt: "Test request from Bharat POS",
                image: dataUrl
            }]
        })
    });

    console.log("Backend response status:", resp.status);

    const text = await resp.text();
    console.log("Raw backend response:", text);

    // Try parse JSON
    let result = {};
    try {
        result = JSON.parse(text);
    } catch (e) {
        console.error("JSON Parse Error:", e);
    }

    console.log("Final parsed result:", result);

} catch (err) {
    console.error("AI detection failed:", err);
}

})();
</script>

</body>
</html>
